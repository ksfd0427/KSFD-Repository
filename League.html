<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장애인사격종목리그전 점수계산표</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif;
    background: #f0f4f8;
    color: #1a1a1a;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1F4E79, #2E75B6);
    color: #fff;
    text-align: center;
    padding: 28px 20px 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .header h1 { font-size: 1.6rem; letter-spacing: 1px; }
  .header p { font-size: 0.85rem; opacity: 0.8; margin-top: 6px; }

  .controls {
    max-width: 1400px;
    margin: 20px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .controls button:active { transform: scale(.97); }
  .btn-add { background: #2E75B6; color: #fff; }
  .btn-add:hover { background: #1F4E79; }
  .btn-remove { background: #e74c3c; color: #fff; }
  .btn-remove:hover { background: #c0392b; }
  .btn-reset { background: #7f8c8d; color: #fff; }
  .btn-reset:hover { background: #636e72; }
  .btn-sort-region { background: #8e44ad; color: #fff; }
  .btn-sort-region:hover { background: #6c3483; }
  .btn-sort-rank { background: #d35400; color: #fff; }
  .btn-sort-rank:hover { background: #a04000; }
  .btn-random { background: #16a085; color: #fff; }
  .btn-random:hover { background: #0e6655; }
  .btn-export { background: #27ae60; color: #fff; }
  .btn-export:hover { background: #1e8449; }
  .btn-active { outline: 3px solid #FFD700; outline-offset: 2px; }
  .team-count {
    margin-left: auto;
    font-size: 0.9rem;
    color: #555;
    background: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
  }

  .table-wrap {
    max-width: 1400px;
    margin: 16px auto;
    padding: 0 16px 40px;
    overflow-x: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  th, td {
    padding: 10px 8px;
    text-align: center;
    border: 1px solid #d6e4f0;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  thead th {
    background: #2E75B6;
    color: #fff;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  thead th.corner { background: #1F4E79; }

  .team-name-input {
    width: 90px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px 6px;
    text-align: center;
    font-weight: 600;
    font-size: 0.85rem;
    background: #fff8e1;
    transition: border-color .2s;
  }
  .team-name-input:focus { border-color: #2E75B6; outline: none; background: #fff; }

  .score-input {
    width: 70px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px 6px;
    text-align: center;
    font-size: 0.9rem;
    background: #fff8e1;
    transition: border-color .2s;
  }
  .score-input:focus { border-color: #2E75B6; outline: none; background: #fff; }

  td.matrix-cell { font-weight: 600; min-width: 50px; }
  td.win { background: #e8f5e9; color: #2e7d32; }
  td.lose { background: #fce4ec; color: #c62828; }
  td.draw { background: #fff3e0; color: #e65100; }
  td.diag { background: #e0e0e0; color: #999; }
  td.empty-cell { background: #fafafa; }

  td.total-cell {
    background: #e2efda;
    font-weight: 700;
    font-size: 1rem;
    color: #1F4E79;
  }
  th.total-header { background: #1a6b3c; }

  td.num-cell { color: #888; font-size: 0.8rem; }

  .rank-cell { font-weight: 700; }
  .rank-1 { color: #FFD700; font-size: 1.1rem; }
  .rank-2 { color: #C0C0C0; font-size: 1.05rem; }
  .rank-3 { color: #CD7F32; font-size: 1.05rem; }

  .legend {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 16px 20px;
    font-size: 0.8rem;
    color: #888;
  }

  @media (max-width: 600px) {
    .header h1 { font-size: 1.2rem; }
    .controls { gap: 6px; }
    .controls button { padding: 8px 12px; font-size: 0.85rem; }
    th, td { padding: 6px 4px; font-size: 0.8rem; }
    .team-name-input { width: 65px; }
    .score-input { width: 55px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>장애인사격종목리그전 점수계산표</h1>
  <p>팀을 자유롭게 추가·삭제하고, 기록만 입력하면 승패와 순위가 자동 계산됩니다</p>
</div>

<div class="controls">
  <button class="btn-add" onclick="addTeam()">+ 팀 추가</button>
  <button class="btn-remove" onclick="removeTeam()">- 마지막 팀 삭제</button>
  <button class="btn-reset" onclick="resetAll()">초기화</button>
  <button class="btn-sort-region btn-active" id="btnSortRegion" onclick="setSortMode('region')">행정시도순</button>
  <button class="btn-sort-rank" id="btnSortRank" onclick="setSortMode('rank')">순위순</button>
  <button class="btn-random" onclick="randomizeScores()">점수 무작위</button>
  <button class="btn-export" onclick="exportCSV()">CSV 내보내기</button>
  <span class="team-count" id="teamCount">현재 0팀</span>
</div>

<div class="table-wrap">
  <table id="scoreTable">
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="legend">
  ※ 1 = 승 &nbsp;|&nbsp; 0 = 패 &nbsp;&nbsp;&nbsp; 노란 셀(팀명·기록)만 입력하면 자동 계산됩니다.
</div>

<script>
// 한국 행정시도 공식 순서 (17개 광역시·도 + 주요 시·군)
const ADMIN_REGIONS = [
  { code: 1, name: '서울' },
  { code: 2, name: '부산' },
  { code: 3, name: '대구' },
  { code: 4, name: '인천' },
  { code: 5, name: '광주' },
  { code: 6, name: '대전' },
  { code: 7, name: '울산' },
  { code: 8, name: '세종' },
  { code: 9, name: '경기' },
  { code: 10, name: '강원' },
  { code: 11, name: '충북' },
  { code: 12, name: '충남' },
  { code: 13, name: '전북' },
  { code: 14, name: '전남' },
  { code: 15, name: '경북' },
  { code: 16, name: '경남' },
  { code: 17, name: '제주' }
];

const state = {
  teams: [],
  sortMode: 'region' // 'region' | 'rank'
};

function addTeam(name, score, regionIdx) {
  const idx = state.teams.length;
  const label = name || (idx < 26 ? String.fromCharCode(65 + idx) + '팀' : (idx + 1) + '팀');
  state.teams.push({
    name: label,
    score: score ?? '',
    regionIdx: regionIdx ?? idx // 행정시도 순서 인덱스
  });
  render();
}

function removeTeam() {
  if (state.teams.length === 0) return;
  state.teams.pop();
  render();
}

function resetAll() {
  if (state.teams.length === 0) return;
  if (!confirm('모든 데이터를 초기화하시겠습니까?')) return;
  state.teams = [];
  render();
}

function setSortMode(mode) {
  state.sortMode = mode;
  document.getElementById('btnSortRegion').classList.toggle('btn-active', mode === 'region');
  document.getElementById('btnSortRank').classList.toggle('btn-active', mode === 'rank');
  render();
}

function randomizeScores() {
  const n = state.teams.length;
  if (n === 0) return;

  // 행정시도 목록을 셔플하여 현재 팀 수만큼 뽑기
  const shuffled = [...ADMIN_REGIONS].sort(() => Math.random() - 0.5);
  // 팀 수가 17개 초과일 경우 추가 이름 생성
  const pool = [];
  for (let i = 0; i < n; i++) {
    if (i < shuffled.length) {
      pool.push(shuffled[i]);
    } else {
      pool.push({ code: 100 + i, name: `팀${i + 1}` });
    }
  }
  // 행정시도 코드 순으로 정렬하여 regionIdx 부여
  pool.sort((a, b) => a.code - b.code);

  // 중복 없는 점수 생성
  const usedScores = new Set();
  for (let i = 0; i < n; i++) {
    let s;
    do { s = Math.floor(Math.random() * 751) + 1000; } while (usedScores.has(s));
    usedScores.add(s);
    state.teams[i].name = pool[i].name;
    state.teams[i].regionIdx = i;
    state.teams[i].score = s;
  }
  render();
}

function saveInputs() {
  const tbody = document.getElementById('tableBody');
  const rows = tbody.querySelectorAll('tr');
  rows.forEach((row) => {
    const nameInput = row.querySelector('.team-name-input');
    const scoreInput = row.querySelector('.score-input');
    if (!nameInput) return;
    const idx = parseInt(nameInput.dataset.idx);
    if (idx >= state.teams.length) return;
    state.teams[idx].name = nameInput.value;
    if (scoreInput) {
      const v = scoreInput.value.trim();
      state.teams[idx].score = v === '' ? '' : parseFloat(v);
    }
  });
}

function compute() {
  const n = state.teams.length;
  const matrix = Array.from({ length: n }, () => Array(n).fill(null));
  const totals = Array(n).fill(0);

  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const a = state.teams[i].score;
      const b = state.teams[j].score;
      if (a === '' || b === '' || isNaN(a) || isNaN(b)) {
        matrix[i][j] = null;
        continue;
      }
      if (a > b) { matrix[i][j] = 1; totals[i] += 1; }
      else { matrix[i][j] = 0; }
    }
  }

  const ranks = Array(n).fill(1);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      if (i !== j && totals[j] > totals[i]) ranks[i]++;
    }
  }

  return { matrix, totals, ranks };
}

function getSortedIndices(totals) {
  const n = state.teams.length;
  const indices = Array.from({ length: n }, (_, i) => i);

  if (state.sortMode === 'rank') {
    const hasAnyScore = state.teams.some(t => t.score !== '' && !isNaN(t.score));
    if (hasAnyScore) {
      indices.sort((a, b) => {
        if (totals[b] !== totals[a]) return totals[b] - totals[a];
        return state.teams[a].regionIdx - state.teams[b].regionIdx;
      });
    }
  } else {
    // 행정시도 순서
    indices.sort((a, b) => state.teams[a].regionIdx - state.teams[b].regionIdx);
  }

  return indices;
}

function render() {
  saveInputsIfNeeded();
  const n = state.teams.length;
  const { matrix, totals, ranks } = compute();
  const hasAnyScore = state.teams.some(t => t.score !== '' && !isNaN(t.score));
  const sortedIndices = getSortedIndices(totals);

  document.getElementById('teamCount').textContent = `현재 ${n}팀`;

  // 헤더: 번호, 순위, 팀명, 승점합계, 기록, [매트릭스 열들]
  let headHtml = '<tr>';
  headHtml += '<th class="corner">번호</th>';
  headHtml += '<th class="corner">순위</th>';
  headHtml += '<th class="corner">팀명</th>';
  headHtml += '<th class="total-header">승점합계</th>';
  headHtml += '<th class="corner">기록</th>';
  for (let col = 0; col < n; col++) {
    const j = sortedIndices[col];
    headHtml += `<th>${esc(state.teams[j].name)}</th>`;
  }
  headHtml += '</tr>';
  document.getElementById('tableHead').innerHTML = headHtml;

  // 바디
  let bodyHtml = '';
  for (let row = 0; row < n; row++) {
    const i = sortedIndices[row];
    bodyHtml += '<tr>';

    // 번호 (행정시도 순서)
    bodyHtml += `<td class="num-cell">${state.teams[i].regionIdx + 1}</td>`;

    // 순위
    const r = ranks[i];
    let rankClass = 'rank-cell';
    let rankLabel = r;
    if (hasAnyScore) {
      if (r === 1) { rankClass += ' rank-1'; rankLabel = '🥇 1'; }
      else if (r === 2) { rankClass += ' rank-2'; rankLabel = '🥈 2'; }
      else if (r === 3) { rankClass += ' rank-3'; rankLabel = '🥉 3'; }
    } else {
      rankLabel = '-';
    }
    bodyHtml += `<td class="${rankClass}">${rankLabel}</td>`;

    // 팀명
    bodyHtml += `<td><input class="team-name-input" value="${esc(state.teams[i].name)}" data-idx="${i}" onchange="onNameChange(this)" /></td>`;

    // 승점합계 (팀명과 기록 사이)
    const totalDisplay = hasAnyScore ? totals[i] : '';
    bodyHtml += `<td class="total-cell">${totalDisplay}</td>`;

    // 기록
    const sv = state.teams[i].score === '' ? '' : state.teams[i].score;
    bodyHtml += `<td><input class="score-input" type="number" step="any" value="${sv}" data-idx="${i}" oninput="onScoreChange(this)" /></td>`;

    // 매트릭스
    for (let col = 0; col < n; col++) {
      const j = sortedIndices[col];
      if (i === j) {
        bodyHtml += '<td class="matrix-cell diag">-</td>';
      } else if (matrix[i][j] === null) {
        bodyHtml += '<td class="matrix-cell empty-cell"></td>';
      } else if (matrix[i][j] === 1) {
        bodyHtml += '<td class="matrix-cell win">1</td>';
      } else {
        bodyHtml += '<td class="matrix-cell lose">0</td>';
      }
    }

    bodyHtml += '</tr>';
  }
  document.getElementById('tableBody').innerHTML = bodyHtml;
}

let needsSave = false;
function saveInputsIfNeeded() {
  if (needsSave) { saveInputs(); needsSave = false; }
}

function onNameChange(el) {
  const idx = parseInt(el.dataset.idx);
  state.teams[idx].name = el.value;
  render();
}

function onScoreChange(el) {
  const idx = parseInt(el.dataset.idx);
  const v = el.value.trim();
  state.teams[idx].score = v === '' ? '' : parseFloat(v);
  needsSave = false;
  render();
  const input = document.querySelector(`.score-input[data-idx="${idx}"]`);
  if (input) { input.focus(); input.selectionStart = input.value.length; }
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function exportCSV() {
  if (state.teams.length === 0) { alert('팀이 없습니다.'); return; }
  const { matrix, totals, ranks } = compute();
  const n = state.teams.length;
  const sortedIndices = getSortedIndices(totals);

  let csv = '\uFEFF';
  csv += '번호,순위,팀명,승점합계,기록,';
  csv += sortedIndices.map(j => state.teams[j].name).join(',');
  csv += '\n';

  for (let row = 0; row < n; row++) {
    const i = sortedIndices[row];
    csv += `${state.teams[i].regionIdx + 1},${ranks[i]},${state.teams[i].name},${totals[i]},${state.teams[i].score},`;
    const cells = [];
    for (let col = 0; col < n; col++) {
      const j = sortedIndices[col];
      if (i === j) cells.push('-');
      else if (matrix[i][j] === null) cells.push('');
      else cells.push(matrix[i][j]);
    }
    csv += cells.join(',');
    csv += '\n';
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '장애인사격종목리그전_점수계산표.csv';
  link.click();
}

// 초기 데이터: 17개 행정시도
ADMIN_REGIONS.forEach((region, idx) => {
  const score = Math.floor(Math.random() * 751) + 1000;
  state.teams.push({ name: region.name, score, regionIdx: idx });
});
render();
</script>
</body>
</html>
