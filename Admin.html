          })()}

          {/* 사대 배정 */}
          {detailTab==="lanes"&&(()=>{
            const RANGES=["10M","25M","50M","산탄총"];
            const rangeEvents=events.filter(e=>{const c=evToCategory(e.code);return RANGES.includes(c);}).sort((a,b)=>a.sort_order-b.sort_order);
            const evCountMap={};
            if(evPData&&evPData.allEntries){
              const _mSet=new Set((evPData.allMembers||[]).map(m=>m.id));
              evPData.allEntries.filter(e=>_mSet.has(e.member_id)).forEach(e=>{evCountMap[e.event_code]=(evCountMap[e.event_code]||0)+1;});
            }
            // 혼성팀: team_entries에서 멤버수/팀인원 = 팀 수
            if(evPData&&evPData.allTeamEntries){
              const _mSet=new Set((evPData.allMembers||[]).map(m=>m.id));
              const tmc={};
              evPData.allTeamEntries.filter(t=>_mSet.has(t.member_id)).forEach(t=>{tmc[t.event_code]=(tmc[t.event_code]||0)+1;});
              Object.keys(tmc).forEach(ec=>{const ev=events.find(e=>e.code===ec);if(ev&&(ev.type==="mixed"||ev.type==="team")){evCountMap[ec]=(evCountMap[ec]||0)+Math.floor(tmc[ec]/(ev?.team_size||2));}});
            }
            const rangeClr={"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"};
            const evColors=["#3b82f6","#ef4444","#10b981","#f59e0b","#8b5cf6","#ec4899","#06b6d4","#84cc16","#f97316","#6366f1","#14b8a6","#e11d48","#a855f7","#0ea5e9","#d946ef","#eab308","#22d3ee","#4ade80","#fb923c","#818cf8"];
            const getEvColor=(code)=>{const idx=rangeEvents.findIndex(e=>e.code===code);return evColors[idx%evColors.length];};

            const dayAssign=laneAssign[laneDay]||{};
            const broken=new Set(laneBroken[laneRange]||[]);
            const curAssigned=Object.keys(dayAssign).filter(k=>{
              const a=dayAssign[k],p=evKeyParse(k);
              return a&&evToCategory(p.evCode)===laneRange&&a.relay===laneRelay;
            }).map(k=>{const p=evKeyParse(k);const ev=events.find(e=>e.code===p.evCode);return ev?{...ev,_key:k}:null;}).filter(Boolean);

            const laneOwner=(n)=>{
              if(broken.has(n)) return "__broken__";
              for(const k of Object.keys(dayAssign)){
                const a=dayAssign[k],p=evKeyParse(k);
                if(a&&evToCategory(p.evCode)===laneRange&&a.relay===laneRelay&&a.lanes.includes(n)) return p.evCode;
              }
              return null;
            };
            const removeLaneFrom=(da,n)=>{
              for(const k of Object.keys(da)){
                if(!da[k]||!da[k].lanes||!da[k].lanes.includes(n)) continue;
                const p=evKeyParse(k);
                if(evToCategory(p.evCode)===laneRange&&da[k].relay===laneRelay){
                  da[k]={...da[k],lanes:da[k].lanes.filter(x=>x!==n)};
                }
              }
            };
            const setDayAssign=(newDa)=>{setLaneAssign(p=>({...p,[laneDay]:newDa}));};

            // 종목별 전체 배정 사대 수 (모든 일차·모든 조)
            const getTotalAssigned=(evCode)=>{
              let total=0;
              Object.keys(laneAssign).forEach(dayKey=>{
                const da=laneAssign[dayKey]||{};
                Object.keys(da).forEach(k=>{
                  const p=evKeyParse(k),a=da[k];
                  if(p.evCode===evCode&&a&&a.lanes) total+=a.lanes.length;
                });
              });
              return total;
            };
            // 산탄총용: 특정 릴레이만 배정 사대 수
            const getRelayAssigned=(evCode,relay)=>{
              let total=0;
              Object.keys(laneAssign).forEach(dayKey=>{
                const da=laneAssign[dayKey]||{};
                Object.keys(da).forEach(k=>{
                  const p=evKeyParse(k),a=da[k];
                  if(p.evCode===evCode&&a&&a.relay===relay&&a.lanes) total+=a.lanes.length;
                });
              });
              return total;
            };
            // 종목별 한도 체크: 산탄총은 릴레이별 독립, 일반은 전체 합산
            const getAssignLimit=(evCode)=>{
              if(isShotgunEv(evCode)) return getRelayAssigned(evCode,laneRelay);
              return getTotalAssigned(evCode);
            };

            const toggleLane=(n)=>{
              if(laneMarkBroken){
                const owner=laneOwner(n);
                const nb={...laneBroken};const set=new Set(nb[laneRange]||[]);
                if(owner==="__broken__"){set.delete(n);}
                else{
                  if(owner){const da={...dayAssign};removeLaneFrom(da,n);setDayAssign(da);}
                  set.add(n);
                }
                nb[laneRange]=[...set].sort((a,b)=>a-b);setLaneBroken(nb);
                return;
              }
              if(!laneSelEv) return;
              const selEv=events.find(e=>e.code===laneSelEv);
              const isMixed=selEv&&selEv.type==="mixed";
              const maxLane=laneConfig[laneRange];

              if(isMixed){
                // 혼성팀: 클릭 사대 + 다음 사대 (n, n+1) 쌍 배정
                const n2=n+1;
                if(n2>maxLane){flash("혼성팀은 인접 2사대가 필요합니다. 마지막 사대("+maxLane+"번)에서는 시작할 수 없습니다.","error");return;}
                const owner1=laneOwner(n), owner2=laneOwner(n2);
                if(owner1===laneSelEv&&owner2===laneSelEv) return; // 이미 배정됨
                // 팀 수 초과 체크 (evCountMap=팀 수, 사대=팀×2)
                const maxTeams=evCountMap[laneSelEv]||0;
                const checkLanes=isShotgunEv(laneSelEv)?getRelayAssigned(laneSelEv,laneRelay):getTotalAssigned(laneSelEv);
                if(maxTeams>0&&Math.floor(checkLanes/2)>=maxTeams){flash(laneSelEv+" "+(isShotgunEv(laneSelEv)?laneRelay+"일차":"전체 일차 합산")+" "+maxTeams+"팀 배정 완료","error");return;}
                const da={...dayAssign};
                const ek=evKeyMake(laneSelEv,laneRelay);
                if(!da[ek]) da[ek]={relay:laneRelay,lanes:[]};
                const nb={...laneBroken};
                [n,n2].forEach(ln=>{
                  const o=laneOwner(ln);
                  if(o==="__broken__"){nb[laneRange]=(nb[laneRange]||[]).filter(x=>x!==ln);}
                  if(o&&o!=="__broken__"&&o!==laneSelEv) removeLaneFrom(da,ln);
                });
                const curSet=new Set(da[ek].lanes);curSet.add(n);curSet.add(n2);
                da[ek]={relay:laneRelay,lanes:[...curSet].sort((a,b)=>a-b)};
                setDayAssign(da);setLaneBroken(nb);
              } else {
                // 개인전: 기존 로직
                const owner=laneOwner(n);
                if(owner===laneSelEv) return;
                const maxCnt=evCountMap[laneSelEv]||0;
                if(maxCnt>0&&getAssignLimit(laneSelEv)>=maxCnt){flash(laneSelEv+" "+(isShotgunEv(laneSelEv)?laneRelay+"일차":"전체 일차 합산")+" "+maxCnt+"명 배정 완료","error");return;}
                const da={...dayAssign};
                const ek=evKeyMake(laneSelEv,laneRelay);
                if(!da[ek]) da[ek]={relay:laneRelay,lanes:[]};
                if(owner==="__broken__"){const nb={...laneBroken};nb[laneRange]=(nb[laneRange]||[]).filter(x=>x!==n);setLaneBroken(nb);}
                if(owner&&owner!=="__broken__") removeLaneFrom(da,n);
                da[ek]={relay:laneRelay,lanes:[...da[ek].lanes,n].sort((a,b)=>a-b)};
                setDayAssign(da);
              }
            };
            const clearLane=(n)=>{
              const da={...dayAssign};removeLaneFrom(da,n);setDayAssign(da);
            };
            const commitClearDrag=()=>{
              if(!laneClearDrag||laneClearDrag.start===null||laneClearDrag.hover===null){setLaneClearDrag(null);return;}
              const lo=Math.min(laneClearDrag.start,laneClearDrag.hover),hi=Math.max(laneClearDrag.start,laneClearDrag.hover);
              const da={...dayAssign};
              for(let n=lo;n<=hi;n++){removeLaneFrom(da,n);}
              setDayAssign(da);setLaneClearDrag(null);
            };
            const commitDrag=()=>{
              if(laneDragStart===null||laneDragHover===null){setLaneDragStart(null);setLaneDragHover(null);return;}
              let lo=Math.min(laneDragStart,laneDragHover),hi=Math.max(laneDragStart,laneDragHover);
              if(laneMarkBroken){
                const nb={...laneBroken};const set=new Set(nb[laneRange]||[]);
                const da={...dayAssign};
                for(let n=lo;n<=hi;n++){const o=laneOwner(n);if(o&&o!=="__broken__")removeLaneFrom(da,n);set.add(n);}
                nb[laneRange]=[...set].sort((a,b)=>a-b);setLaneBroken(nb);setDayAssign(da);
                setLaneDragStart(null);setLaneDragHover(null);return;
              }
              if(!laneSelEv){setLaneDragStart(null);setLaneDragHover(null);return;}
              const selEvMixed=events.find(e=>e.code===laneSelEv)?.type==="mixed";
              const maxLane=laneConfig[laneRange];
              // 혼성팀 단일 클릭: 클릭 사대 + 다음 사대 쌍 배정
              if(selEvMixed&&lo===hi){
                hi=lo+1;
                if(hi>maxLane){flash("혼성팀은 인접 2사대가 필요합니다. 마지막 사대에서는 시작할 수 없습니다.","error");setLaneDragStart(null);setLaneDragHover(null);return;}
              }
              // 혼성팀 드래그: 짝수 사대 단위로 맞춤 (홀수면 마지막 1개 제외)
              if(selEvMixed&&(hi-lo+1)%2!==0) hi=hi-1;
              const da={...dayAssign};
              const ek=evKeyMake(laneSelEv,laneRelay);
              if(!da[ek]) da[ek]={relay:laneRelay,lanes:[]};
              const cur=new Set(da[ek].lanes||[]);
              const nb={...laneBroken};const bSet=new Set(nb[laneRange]||[]);
              const maxCnt=evCountMap[laneSelEv]||0;
              const maxLanes=selEvMixed?maxCnt*2:maxCnt;
              let otherAssigned=0;
              if(maxLanes>0&&!isShotgunEv(laneSelEv)){
                Object.keys(laneAssign).forEach(dayKey=>{
                  const dd=Number(dayKey)===laneDay?da:(laneAssign[dayKey]||{});
                  Object.keys(dd).forEach(k=>{
                    const p=evKeyParse(k),a=dd[k];
                    if(p.evCode===laneSelEv&&k!==ek&&a&&a.lanes) otherAssigned+=a.lanes.length;
                  });
                });
              }
              const remaining=maxLanes>0?maxLanes-otherAssigned:Infinity;
              for(let n=lo;n<=hi;n++){
                if(maxCnt>0&&cur.size>=remaining) break;
                const o=laneOwner(n);
                if(o==="__broken__") bSet.delete(n);
                if(o&&o!=="__broken__"&&o!==laneSelEv) removeLaneFrom(da,n);
                if(o!==laneSelEv) cur.add(n);
              }
              da[ek]={relay:laneRelay,lanes:[...cur].sort((a,b)=>a-b)};
              nb[laneRange]=[...bSet].sort((a,b)=>a-b);
              setDayAssign(da);setLaneBroken(nb);setLaneDragStart(null);setLaneDragHover(null);
              if(maxLanes>0&&cur.size>=remaining) flash(laneSelEv+" "+maxCnt+(selEvMixed?"팀":"명")+" 배정 완료 (인원 도달)");
            };
            const selectEv=(code)=>{
              if(laneSelEv===code){setLaneSelEv(null);setLaneMarkBroken(false);return;}
              setLaneSelEv(code);setLaneMarkBroken(false);
            };
            const autoAssign=(evCode)=>{
              const cnt=evCountMap[evCode]||0;if(!cnt) return;
              const selEv=events.find(e=>e.code===evCode);
              const isMixed=selEv&&selEv.type==="mixed";
              const isSG=isShotgunEv(evCode);
              // 다른 일차에 이미 배정된 수 차감 (산탄총은 차감 안 함)
              let otherDayLanes=0;
              if(!isSG){
                Object.keys(laneAssign).forEach(dayKey=>{
                  if(Number(dayKey)===laneDay) return;
                  const dd=laneAssign[dayKey]||{};
                  Object.keys(dd).forEach(k=>{
                    const p=evKeyParse(k),a=dd[k];
                    if(p.evCode===evCode&&a&&a.lanes) otherDayLanes+=a.lanes.length;
                  });
                });
              }
              const totalNeeded=isMixed?cnt*2:cnt; // 혼성팀: 팀당 2사대
              const availCnt=totalNeeded-otherDayLanes;
              if(availCnt<=0){flash(evCode+" 는 다른 일차에 이미 전원 배정 완료","error");return;}
              const maxLane=laneConfig[laneRange];
              const brokenSet=new Set(laneBroken[laneRange]||[]);
              // 이 종목 기존 배정 제거 (현재 일차 · 산탄총은 현재 릴레이만)
              const da={};
              Object.keys(dayAssign).forEach(k=>{
                const p=evKeyParse(k);
                if(p.evCode!==evCode) da[k]=dayAssign[k];
                else if(isSG&&dayAssign[k].relay!==laneRelay) da[k]=dayAssign[k]; // 산탄총: 다른 릴레이 유지
              });
              let remaining=availCnt, relay=isSG?laneRelay:1;
              const maxRelayLoop=isSG?laneRelay:10; // 산탄총은 현재 릴레이만
              while(remaining>0&&relay<=maxRelayLoop){
                const usedByOthers=new Set(brokenSet);
                Object.keys(da).forEach(k=>{
                  const a=da[k],p=evKeyParse(k);
                  if(a&&evToCategory(p.evCode)===laneRange&&a.relay===relay)(a.lanes||[]).forEach(n=>usedByOthers.add(n));
                });
                const avail=[];
                for(let i=1;i<=maxLane;i++){if(!usedByOthers.has(i))avail.push(i);}
                if(avail.length===0){relay++;continue;}
                if(isMixed){
                  // 혼성팀: 인접 쌍만 취득
                  const pairs=[];
                  for(let i=0;i<avail.length-1;i++){
                    if(avail[i]+1===avail[i+1]){pairs.push([avail[i],avail[i+1]]);i++;} // skip next
                  }
                  const take=pairs.slice(0,Math.ceil(remaining/2));
                  const lanes=take.flat();
                  if(lanes.length===0){relay++;continue;}
                  da[evKeyMake(evCode,relay)]={relay,lanes};
                  remaining-=lanes.length;
                } else {
                  const take=avail.slice(0,remaining);
                  da[evKeyMake(evCode,relay)]={relay,lanes:take};
                  remaining-=take.length;
                }
                relay++;
              }
              setLaneAssign(p=>({...p,[laneDay]:da}));
              const assignedTeams=isMixed?Math.floor((availCnt-remaining)/2):availCnt-remaining;
              const unit=isMixed?"팀":"명";
              const otherTeams=isMixed?Math.floor(otherDayLanes/2):otherDayLanes;
              flash(evCode+" 자동 배정: "+assignedTeams+unit+(otherTeams>0?" (다른 일차 "+otherTeams+unit+" 제외)":""));
              setLaneSelEv(evCode);
            };
            const clearRange=()=>{
              if(!confirm(laneDay+"일차 "+laneRange+" "+laneRelay+"조 초기화?")) return;
              const da={...dayAssign};
              curAssigned.forEach(ev=>{delete da[ev._key];});
              setDayAssign(da);
            };
            const isInDragRange=(n)=>{
              if(laneDragStart===null||laneDragHover===null) return false;
              return n>=Math.min(laneDragStart,laneDragHover)&&n<=Math.max(laneDragStart,laneDragHover);
            };
            const isInClearRange=(n)=>{
              if(!laneClearDrag||laneClearDrag.start===null||laneClearDrag.hover===null) return false;
              return n>=Math.min(laneClearDrag.start,laneClearDrag.hover)&&n<=Math.max(laneClearDrag.start,laneClearDrag.hover);
            };
            const commitMoveDrag=()=>{
              if(!laneMoveDrag||laneMoveDrag.start===null||laneMoveDrag.hover===null||laneMoveDrag.start===laneMoveDrag.hover){setLaneMoveDrag(null);return;}
              const fromN=laneMoveDrag.start,toN=laneMoveDrag.hover;
              const fromOwner=laneOwner(fromN),toOwner=laneOwner(toN);
              if(!fromOwner||fromOwner==="__broken__"){setLaneMoveDrag(null);return;}
              const da={...dayAssign};
              // from 슬롯에서 제거 (같은 카테고리+릴레이만)
              for(const k of Object.keys(da)){
                const p=evKeyParse(k);
                if(da[k]&&da[k].lanes&&da[k].lanes.includes(fromN)&&evToCategory(p.evCode)===laneRange&&da[k].relay===laneRelay)
                  da[k]={...da[k],lanes:da[k].lanes.filter(x=>x!==fromN)};
              }
              // to 슬롯에서 제거 (스왑 시, 같은 카테고리+릴레이만)
              let toEvKey=null;
              if(toOwner&&toOwner!=="__broken__"){
                for(const k of Object.keys(da)){
                  const p=evKeyParse(k);
                  if(da[k]&&da[k].lanes&&da[k].lanes.includes(toN)&&evToCategory(p.evCode)===laneRange&&da[k].relay===laneRelay){
                    toEvKey=k;
                    da[k]={...da[k],lanes:da[k].lanes.filter(x=>x!==toN)};
                  }
                }
              }
              // from 종목을 to 위치에 배정 (같은 카테고리+릴레이)
              for(const k of Object.keys(da)){
                const p=evKeyParse(k);
                if(p.evCode===fromOwner&&evToCategory(p.evCode)===laneRange&&da[k].relay===laneRelay){
                  da[k]={...da[k],lanes:[...da[k].lanes,toN].sort((a,b)=>a-b)};break;
                }
              }
              // 스왑: to 종목을 from 위치에 배정
              if(toEvKey&&toOwner!==fromOwner){
                da[toEvKey]={...da[toEvKey],lanes:[...da[toEvKey].lanes,fromN].sort((a,b)=>a-b)};
              }
              setDayAssign(da);setLaneMoveDrag(null);
            };
            const fmtRanges=(lanes)=>{
              if(!lanes||!lanes.length) return "";
              const ranges=[];let rs=lanes[0],re=lanes[0];
              for(let i=1;i<lanes.length;i++){if(lanes[i]===re+1){re=lanes[i];}else{ranges.push(rs===re?""+rs:rs+"-"+re);rs=lanes[i];re=lanes[i];}}
              ranges.push(rs===re?""+rs:rs+"-"+re);return ranges.join(", ");
            };
            const usedRelays=new Set();
            Object.keys(dayAssign).forEach(k=>{const a=dayAssign[k];if(a&&a.relay)usedRelays.add(a.relay);});
            const maxRelay=Math.max(laneRelay,...usedRelays,1);
            // 종목별 전체 배정 합산 (모든 일차)
            const evTotalAssigned={};
            Object.keys(laneAssign).forEach(dayKey=>{
              const da=laneAssign[dayKey]||{};
              Object.keys(da).forEach(k=>{
                const p=evKeyParse(k),a=da[k];
                if(a&&a.lanes){evTotalAssigned[p.evCode]=(evTotalAssigned[p.evCode]||0)+a.lanes.length;}
              });
            });
            // 현재 일차에서만 배정된 수 (UI 표시용)
            const evCurDayAssigned={};
            Object.keys(dayAssign).forEach(k=>{
              const p=evKeyParse(k),a=dayAssign[k];
              if(a&&a.lanes){evCurDayAssigned[p.evCode]=(evCurDayAssigned[p.evCode]||0)+a.lanes.length;}
            });
            const curDayEvts=(()=>{
              return rangeEvents.filter(e=>evToCategory(e.code)===laneRange);
            })();

            return <div>
              {/* 상단 컨트롤 - 스크롤 시 고정 */}
              <div style={{position:"sticky",top:-24,zIndex:20,background:C.bg,marginLeft:-24,marginRight:-24,marginTop:-24,padding:"24px 24px 0",borderBottom:"1px solid "+C.border+"44"}}>
              {/* 사격장 설정 */}
              <div style={{display:"flex",gap:12,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:13,fontWeight:700,color:"#ddd"}}>사격장 사대 수:</span>
                {RANGES.map(r=>(
                  <div key={r} style={{display:"flex",alignItems:"center",gap:4}}>
                    <span style={{fontSize:12,fontWeight:700,color:rangeClr[r]}}>{r}</span>
                    <input type="number" min={1} max={100} value={laneConfig[r]}
                      onChange={e=>{const v=parseInt(e.target.value)||1;setLaneConfig(p=>({...p,[r]:Math.max(1,Math.min(100,v))}));}}
                      style={{width:48,background:C.card,border:"1px solid "+C.border,borderRadius:4,color:"#fff",fontSize:12,padding:"3px 6px",textAlign:"center"}}/>
                  </div>
                ))}
              </div>
              {/* 일차 + 사격장 + 조 */}
              <div style={{display:"flex",gap:4,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>

                {schedData.map(d=>(

                    style={{padding:"4px 12px",borderRadius:5,fontSize:11,fontWeight:700,cursor:"pointer",
                      border:"2px solid "+(laneDay===d.day?C.gold:C.border),

                    {d.day}
                  </button>

                {RANGES.map(r=>(

                    style={{padding:"4px 12px",borderRadius:5,fontSize:11,fontWeight:700,cursor:"pointer",
                      border:"2px solid "+(laneRange===r?rangeClr[r]:C.border),
                      background:laneRange===r?rangeClr[r]+"22":"transparent",color:laneRange===r?rangeClr[r]:C.dim}}>
                    {r}
                  </button>

                <span style={{fontSize:12,fontWeight:700,color:C.dim,marginLeft:10,marginRight:2}}>{laneRange==="산탄총"?"산탄총 일차:":"조:"}</span>
                {(laneRange==="산탄총"?[1,2,3]:Array.from({length:maxRelay+1},(_,i)=>i+1)).map(r=>(
                  <button key={r} onClick={()=>{setLaneRelay(r);}}
                    style={{padding:"4px 10px",borderRadius:5,fontSize:11,fontWeight:700,cursor:"pointer",
                      border:"1px solid "+(laneRelay===r?C.gold:C.border),
                      background:laneRelay===r?C.gold+"22":"transparent",color:laneRelay===r?C.gold:C.dim}}>
                    {laneRange==="산탄총"?r+"일차":r+"조"}
                  </button>
                ))}
              </div>
              {/* 도구 */}
              <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
                <button onClick={()=>{setLaneMarkBroken(!laneMarkBroken);setLaneSelEv(null);}}
                  style={{padding:"4px 10px",borderRadius:5,fontSize:10,fontWeight:700,cursor:"pointer",
                    border:"2px solid "+(laneMarkBroken?"#ef4444":C.border),
                    background:laneMarkBroken?"#ef444422":"transparent",color:laneMarkBroken?"#ef4444":C.dim}}>
                  🔧 고장 표시 {laneMarkBroken?"ON":"OFF"}
                </button>
                <div style={{flex:1}}/>
                <button onClick={clearRange} style={{...S.sm(C.red),fontSize:10}}>🗑 초기화</button>
              </div>
              </div>{/* sticky 끝 */}

              <div style={{display:"flex",gap:16,flexDirection:"row",flexWrap:"nowrap",marginTop:12}}>
                {/* 좌측: 종목 - 스크롤 시 고정 */}
                <div style={{width:230,flexShrink:0,maxHeight:"calc(100vh - 280px)",overflowY:"auto",position:"sticky",top:130,alignSelf:"flex-start"}}>
                  <div style={{fontSize:12,fontWeight:700,color:C.gold,marginBottom:8}}>{laneDay}일차 · {laneRange} · {laneRange==="산탄총"?laneRelay+"일차":laneRelay+"조"}</div>
                  {curDayEvts.length===0?(
                    <div style={{padding:"12px 10px",fontSize:11,color:C.dimmer,fontStyle:"italic",border:"1px dashed "+C.border,borderRadius:6,textAlign:"center"}}>해당 거리에 종목이 없습니다</div>
                  ):(
                    <div style={{display:"flex",flexDirection:"column",gap:3}}>
                      {curDayEvts.map(ev=>{
                        const cnt=evCountMap[ev.code]||0;
                        const totalAssigned=evTotalAssigned[ev.code]||0;
                        // 현재 릴레이에서 이 종목 배정 확인

                        const a=dayAssign[ek];

                        const isSel=laneSelEv===ev.code;
                        // 이 종목이 다른 릴레이에 배정되어 있는 경우 표시
                        const evRelays=Object.keys(dayAssign).filter(k=>{const p=evKeyParse(k);return p.evCode===ev.code&&dayAssign[k].lanes.length>0;}).map(k=>dayAssign[k].relay);
                        const nRelays=evRelays.length;
                        return <div key={ev.code}

                          style={{padding:"7px 10px",borderRadius:8,cursor:"pointer",

                          <div style={{display:"flex",alignItems:"center",gap:6}}>

                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3,flexWrap:"wrap"}}>
                            {(()=>{const isMx=ev.type==="mixed";const isSG=isShotgunEv(ev.code);const unit=isMx?"팀":"명";
                            if(isSG){
                              // 산탄총: 일차별 독립 카운팅
                              return <>{[1,2,3].map(r=>{
                                const rAssigned=getRelayAssigned(ev.code,r);
                                const disp=isMx?Math.floor(rAssigned/2):rAssigned;
                                const done=disp>=cnt&&cnt>0;
                                const isCur=laneRelay===r;
                                return <span key={r} style={{fontSize:9,padding:"1px 4px",borderRadius:3,
                                  color:done?"#4ade80":disp>0?"#fbbf24":"#666",fontWeight:isCur?700:400,
                                  background:isCur?"#ffffff11":"transparent",

                              })}</>;
                            }
                            const displayAssigned=isMx?Math.floor(totalAssigned/2):totalAssigned;return <>

                            <span style={{fontSize:10,color:displayAssigned>=cnt&&cnt>0?"#4ade80":displayAssigned>0?"#fbbf24":"#666"}}>{displayAssigned}/{cnt}</span>
                            {(()=>{const curDay=evCurDayAssigned[ev.code]||0;const otherDay=totalAssigned-curDay;const otherDisp=isMx?Math.floor(otherDay/2):otherDay;return otherDisp>0?<span style={{fontSize:8,color:"#f59e0b",background:"#f59e0b22",padding:"0 3px",borderRadius:2}} title={"다른 일차 "+otherDisp+unit+" 배정됨"}>타{otherDisp}</span>:null;})()}
                            </>;})()}
                            {(()=>{const isSG=isShotgunEv(ev.code);if(isSG)return null;return nRelays>0?<span style={{fontSize:9,padding:"0 4px",borderRadius:3,background:C.border+"66",color:C.gold}}>{evRelays.sort((a,b)=>a-b).map(r=>relayLabel(ev.code,r)).join("+")}</span>:null;})()}
                            {(()=>{const isSG=isShotgunEv(ev.code);const checkVal=isSG?getRelayAssigned(ev.code,laneRelay):totalAssigned;const isMx=ev.type==="mixed";const displayCheck=isMx?Math.floor(checkVal/2):checkVal;
                            return cnt>0&&displayCheck<cnt?<button onClick={e=>{e.stopPropagation();if(!laneSelEv||laneSelEv!==ev.code)setLaneSelEv(ev.code);autoAssign(ev.code);}} title="자동 배정"
                              style={{marginLeft:"auto",fontSize:9,background:getEvColor(ev.code)+"33",border:"none",color:getEvColor(ev.code),borderRadius:3,padding:"1px 6px",cursor:"pointer",fontWeight:700}}>AUTO</button>:null;})()}
                          </div>
                        </div>;
                      })}
                    </div>
                  )}
                </div>

                {/* 우측: 사대 리스트 */}
                <div style={{flex:1,minWidth:0,maxWidth:420}}>
                  <div style={{marginBottom:8}}>
                    {laneMarkBroken&&<span style={{fontSize:11,color:"#ef4444",fontWeight:700}}>🔧 고장 표시 모드 — 사대 클릭/드래그로 고장 지정/해제 · 📱 터치 드래그 활성</span>}
                    {!laneMarkBroken&&laneSelEv&&<span style={{fontSize:11,color:getEvColor(laneSelEv),fontWeight:600}}>🎯 {laneSelEv} {laneRelay}조 배정 중 — 빈 사대 드래그 배정 · 배정 사대 드래그로 이동/스왑 · ✕ 삭제</span>}
                    {!laneMarkBroken&&!laneSelEv&&<span style={{fontSize:11,color:C.dim}}>배정 사대를 드래그하여 이동/스왑 가능 · 종목 선택 후 빈 사대 클릭/드래그로 배정</span>}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:3,userSelect:"none",
                      touchAction:(laneSelEv||laneMarkBroken||laneMoveDrag)?'none':'auto'}}
                    onPointerDown={e=>{
                      const clearEl=e.target.closest&&e.target.closest('[data-laneclear]');
                      const laneEl=clearEl||( e.target.closest&&e.target.closest('[data-lane]'));
                      if(!laneEl)return;
                      const n=parseInt(clearEl?clearEl.dataset.laneclear:laneEl.dataset.lane);
                      if(isNaN(n))return;
                      e.preventDefault();
                      if(clearEl){
                        setLaneClearDrag({start:n,hover:n});
                      } else {
                        const ow=laneOwner(n);const ib=ow==="__broken__";const he=ow&&!ib;

                          // 종목 미선택 + 배정된 슬롯 → 이동/스왑 드래그

                        else if(laneSelEv&&he&&ow===laneSelEv){
                          // 자기 종목 슬롯 → 이동/스왑 드래그
                          setLaneMoveDrag({start:n,hover:n});

                        else toggleLane(n);
                      }
                    }}
                    onPointerMove={e=>{

                      const el=document.elementFromPoint(e.clientX,e.clientY);

                      const laneEl=clearEl||(el.closest&&el.closest('[data-lane]'));

                    onPointerLeave={()=>{

                    {Array.from({length:laneConfig[laneRange]},(_,i)=>i+1).map(n=>{

                      const inDrag=isInDragRange(n)&&(laneSelEv||laneMarkBroken);

                      const isMoveSrc=laneMoveDrag&&laneMoveDrag.start===n;

                      const evObj=hasEv?events.find(e=>e.code===owner):null;
                      return <div key={n} style={{display:"flex",alignItems:"stretch",gap:0}}>

          {/* 불참 이력 */}

                <div style={{fontSize:36,marginBottom:12}}>📋</div>

              :<div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                  {["일시","종목","이름","소속","구분","사유"].map(h=><th key={h} style={S.th}>{h}</th>)}
                </tr></thead><tbody>
                  {[...absentHistory].reverse().map((h,i)=>{

                      <td style={{...S.td,fontWeight:600}}>{h.name}</td>

                    </tr>;

              </div>}
            {absentHistory.length>0&&<div style={{marginTop:12,display:"flex",gap:8}}>

                absentHistory.forEach(h=>{csv+=`${h.timestamp},${h.evCode},${h.name},${h.subOrg||h.orgName||""},${h.action},${h.reason||""}\n`;});
                const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
                const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="불참이력_"+(selectedT?.name||"")+".csv"; a.click();
              }} style={{...S.btn(C.blue,"#fff"),fontSize:11,padding:"5px 12px"}}>📥 CSV 내보내기</button>
              <button onClick={()=>{if(confirm("전체 불참 이력을 삭제하시겠습니까?")){setAbsentHistory([]);dbSave("absent_history",[]);flash("이력 삭제 완료");}}} style={{...S.btn(C.red,"#fff"),fontSize:11,padding:"5px 12px"}}>🗑 전체 삭제</button>
            </div>}
          </div>}
        </div>
      </div>
      {/* 종목 편집 모달 */}
      {editEv&&(<div style={S.modal} onClick={()=>setEditEv(null)}><div style={S.mbox} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:16,fontWeight:700,color:C.gold,marginBottom:16}}>{editEv==="new"?"🎯 종목 추가":"✏️ 종목 수정: "+editEv.code}</div>
        {[
          {k:"code",l:"종목 코드",ph:"R1"},
          {k:"name",l:"종목명",ph:"R1 공기소총 입사 남자 SH1"},
          {k:"category",l:"카테고리",t:"select",opts:[["소총","소총"],["소총(SH2)","소총(SH2)"],["권총","권총"],["산탄총","산탄총"],["청각","청각"]]},
          {k:"type",l:"유형",t:"select",opts:[["individual","개인전"],["mixed","혼성팀"]]},
          {k:"gender",l:"성별",t:"select",opts:[["남","남성"],["여","여성"],["혼","혼성"]]},
          {k:"distance",l:"사격장 거리",t:"select",opts:[["10M","10M"],["25M","25M"],["50M","50M"],["산탄총","산탄총"]]},

            <label style={{fontSize:11,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>{f.l}</label>
            {f.t==="select"?<select style={S.input} value={editEvVal[f.k]||""} onChange={e=>setEditEvVal({...editEvVal,[f.k]:e.target.value})}>{f.opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>

          <span style={{fontSize:10,color:C.dim}}>(리그전 대회 시 이 종목 리그전 등록 허용)</span>

        <div style={{display:"flex",gap:8,marginTop:16}}><button style={S.btn(C.gold,C.bg)} onClick={saveEvent}>저장</button><button style={S.btn(C.border,"#8899aa")} onClick={()=>setEditEv(null)}>취소</button></div>
      </div></div>)}

            <button style={{...S.btn(C.green,"#fff"),fontSize:12,padding:"6px 14px"}} onClick={()=>downloadAppExcel(detailApp,appMembers,appEntries,appTeamEntries,appFirearms)}>📥 엑셀</button>

            <div style={{fontSize:14,fontWeight:700,color:"#e8dcc8"}}>{item.value}</div>
          </div>)}

          <div style={{overflow:"auto",borderRadius:6}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>

        {Object.keys(teamGrouped).length>0&&<div style={{marginBottom:20}}>
          <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:8,borderBottom:"2px solid "+C.blue,paddingBottom:4}}>👥 단체전 · 혼성팀 ({Object.keys(teamGrouped).length}팀)</div>
          <div style={{overflow:"auto",borderRadius:6}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
              {["종목코드","구분","팀번호","구성선수","연합","비고"].map(h=><th key={h} style={dTh}>{h}</th>)}
            </tr></thead><tbody>
              {Object.values(teamGrouped).map((g,i)=>{
                const names=g.members.map(t=>{const m=appMembers.find(mm=>mm.id===t.member_id);return m?.name||"?";});

                  <td style={{...dTd,textAlign:"center"}}>{g.num}</td>
                  <td style={dTd}>{names.join(", ")}</td>

                  <td style={{...dTd,fontSize:11}}>{g.unionMemo||"-"}</td>
                </tr>;
              })}
            </tbody></table>
          </div>
        </div>}

        {/* 6. 총기 등록 */}
        {appFirearms.length>0&&<div style={{marginBottom:20}}>
          <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:8,borderBottom:"2px solid #e67e22",paddingBottom:4}}>🔫 총기 등록 ({appFirearms.length}정)</div>
          <div style={{overflow:"auto",borderRadius:6}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
              {["번호","선수명","총종","제조사","모델명","총기번호","허가증번호"].map(h=><th key={h} style={dTh}>{h}</th>)}
            </tr></thead><tbody>
              {appFirearms.map((f,i)=>{const m=appMembers.find(mm=>mm.id===f.member_id);return <tr key={f.id} style={{background:i%2===0?"transparent":"#0d152044"}}>
                <td style={{...dTd,textAlign:"center"}}>{i+1}</td>
                <td style={{...dTd,fontWeight:600}}>{m?.name||"?"}</td>

          </div>

        const players=appMembers.filter(m=>m.role==="선수");

              const activeEvCodes=new Set();
              Object.values(editIndEntries).forEach(codes=>codes.forEach(c=>activeEvCodes.add(c)));
              // 단체전 슬롯 헬퍼
              const TeamSlotRow=({teamKey,count,eligible})=>{
                const comp=editTeamComps[teamKey]||{memberIds:[],isUnion:false,unionMemo:"",teamType:"team"};
                const slots=Array.from({length:count},(_,si)=>comp.memberIds[si]||null);
                const usedIds=slots.filter(Boolean);
                const filled=usedIds.length;
                return <div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {slots.map((mid,si)=>{
                      const player=mid?editMembers.find(mm=>mm.id===mid):null;
                      return <div key={si} style={{position:"relative",minWidth:56,flexBasis:"calc(25% - 3px)",flexGrow:1}}>
                        {player?<div style={{borderRadius:6,padding:"3px 9px",border:"1px solid "+C.gold,background:C.gold,display:"flex",alignItems:"center",justifyContent:"center",gap:4,fontSize:12,fontWeight:600,lineHeight:"20px"}}>
                          <span style={{color:"#1a2744",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{player.name}</span>
                          <button onClick={()=>{const n=[...slots];n[si]=null;setEditTeamComps(prev=>({...prev,[teamKey]:{...comp,memberIds:n.filter(Boolean),teamType:"team"}}));}} style={{background:"none",border:"none",color:"#1a274488",fontSize:12,cursor:"pointer",padding:0,flexShrink:0}}>✕</button>
                        </div>
                        :<select style={{...eSelect,fontSize:11,padding:"3px 6px"}} value="" onChange={e=>{if(e.target.value){const n=[...slots];n[si]=parseInt(e.target.value);setEditTeamComps(prev=>({...prev,[teamKey]:{...comp,memberIds:n.filter(Boolean),teamType:"team"}}));}}}>
                          <option value="">선수{si+1}</option>
                          {eligible.filter(p=>!usedIds.includes(p.id)).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>}
                      </div>;
                    })}
                  </div>
                  <div style={{fontSize:10,color:filled>=3?"#4aba6a":"#556677",marginTop:3}}>{filled}/{count}명 {filled>=3?"✓":"(최소 3명)"}</div>
                  <label style={{display:"flex",alignItems:"center",gap:5,marginTop:5,cursor:"pointer"}}>
                    <input type="checkbox" checked={comp.isUnion} onChange={e=>setEditTeamComps(prev=>({...prev,[teamKey]:{...comp,isUnion:e.target.checked,teamType:"team"}}))} style={{accentColor:C.gold,width:14,height:14}}/>
                    <span style={{fontSize:11,color:"#8899aa"}}>타 단체 연합구성</span>
                  </label>
                </div>;
              };
              // 혼성팀 슬롯 헬퍼
              const PairSlotRow=({pairKey,malePlayers:mp,femalePlayers:fp,otherSlots})=>{
                const comp=editTeamComps[pairKey]||{memberIds:[],isUnion:false,unionMemo:"",teamType:"mixed"};
                const slots=[comp.memberIds[0]||null,comp.memberIds[1]||null];
                const other=otherSlots||[null,null];
                const filled=slots.filter(Boolean).length;
                const gLabels=["남","여"];
                const gPools=[mp,fp];
                return <div>
                  <div style={{display:"flex",gap:6,maxWidth:320}}>
                    {[0,1].map(idx=>{
                      const mid=slots[idx];
                      const player=mid?editMembers.find(mm=>mm.id===mid):null;
                      const usedThis=slots.filter(Boolean);
                      const usedOther=other.filter(Boolean);
                      const avail=gPools[idx].filter(p=>!usedThis.includes(p.id)&&!usedOther.includes(p.id));
                      return <div key={idx} style={{flex:1}}>
                        <div style={{fontSize:10,color:"#556677",marginBottom:2,textAlign:"center"}}>{gLabels[idx]}</div>
                        {player?<div style={{height:36,borderRadius:5,border:"1px solid #c9a84c44",background:"#c9a84c15",display:"flex",alignItems:"center",justifyContent:"center",gap:4,padding:"0 8px"}}>
                          <span style={{fontSize:13,color:"#e8dcc8",fontWeight:600}}>{player.name}</span>
                          <button onClick={()=>{const n=[...slots];n[idx]=null;setEditTeamComps(prev=>({...prev,[pairKey]:{...comp,memberIds:n.filter(Boolean),teamType:"mixed"}}));}} style={{background:"none",border:"none",color:"#aa4444",fontSize:12,cursor:"pointer",padding:0}}>✕</button>
                        </div>
                        :<select style={{...eSelect,height:36,fontSize:12}} value="" onChange={e=>{if(e.target.value){const n=[...slots];n[idx]=parseInt(e.target.value);setEditTeamComps(prev=>({...prev,[pairKey]:{...comp,memberIds:n.filter(Boolean),teamType:"mixed"}}));}}}>
                          <option value="">{gLabels[idx]} 선수</option>
                          {avail.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>}
                      </div>;
                    })}
                  </div>
                  <label style={{display:"flex",alignItems:"center",gap:5,marginTop:5,cursor:"pointer"}}>
                    <input type="checkbox" checked={comp.isUnion} onChange={e=>setEditTeamComps(prev=>({...prev,[pairKey]:{...comp,isUnion:e.target.checked,teamType:"mixed"}}))} style={{accentColor:C.gold,width:14,height:14}}/>
                    <span style={{fontSize:11,color:"#8899aa"}}>타 단체 연합구성</span>
                  </label>
                </div>;
              };

              const cats=[...new Set(indEvents.map(e=>e.category))];
              return <div style={{maxWidth:900,margin:"0 auto"}}>
                <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:4}}>개인전 종목 / 선수 선택</div>
                <p style={{fontSize:12,color:C.dim,marginBottom:12}}>개인전에 1명이상 등록된 종목은 단체전 구성이 활성화됩니다.</p>
                {indEvents.length===0&&<div style={{color:C.dim,fontSize:13,padding:20,textAlign:"center"}}>등록된 개인전 종목이 없습니다</div>}
                {cats.map(cat=>{
                  const catEvs=indEvents.filter(e=>e.category===cat);
                  return <div key={cat} style={formGroup}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:8,borderBottom:"1px solid #1e2f4a"}}>
                      <span style={{fontSize:16,fontWeight:700,color:C.gold}}>{cat}</span>
                    </div>
                    {catEvs.map(ev=>{
                      // Entry.html과 동일: 해당 카테고리+성별 매칭 선수만 표시
                      const eligible=players.filter(p=>(p._events||[]).includes(ev.category)&&(ev.gender==="혼"||ev.gender===p.gender));
                      const selected=Object.entries(editIndEntries).filter(([mid,codes])=>codes.includes(ev.code)).map(([mid])=>parseInt(mid));
                      const hasEntries=selected.length>0;
                      const teamKey="team-"+ev.code+"_1";
                      return <div key={ev.code} style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:6,padding:"8px 4px",borderBottom:"1px solid #1e2f4a22"}}>
                        {/* 좌: 개인전 */}
                        <div style={{flex:"1 1 200px",minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                            <span style={{fontSize:13,fontWeight:700,color:"#e8dcc8"}}>{ev.code}</span>
                            <span style={{fontSize:12,color:"#8899aa"}}>{ev.name.replace(ev.code+" ","")}</span>
                            {selected.length>0&&<span style={{fontSize:11,color:"#4aba6a",marginLeft:"auto"}}>{selected.length}명</span>}
                          </div>
                          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                            {eligible.map(p=>{
                              const sel=selected.includes(p.id);
                              return <button key={p.id} onClick={()=>editToggleEvent(p.id,ev.code)} style={chipBtn(sel)}>{p.name}</button>;
                            })}
                            {eligible.length===0&&<span style={{fontSize:12,color:C.dim}}>해당 선수 없음</span>}
                          </div>
                        </div>
                        {/* 우: 단체전 (개인전 1명 이상일 때 활성) */}
                        <div style={{flex:"0 0 auto",minWidth:240,maxWidth:320,opacity:hasEntries?1:0.3,pointerEvents:hasEntries?"auto":"none"}}>
                          <div style={{fontSize:11,fontWeight:700,color:"#556677",marginBottom:2}}>단체전</div>
                          <TeamSlotRow teamKey={teamKey} count={4} eligible={eligible.filter(p=>selected.includes(p.id))}/>
                        </div>
                      </div>;
                    })}
                  </div>;
                })}

                {/* 혼성팀 종목 */}
                {mixedEvents.length>0&&<div style={{...formGroup,marginTop:16}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,paddingBottom:10,borderBottom:"1px solid #1e2f4a"}}>
                    <span style={{fontSize:20}}>👫</span>
                    <span style={{fontSize:16,fontWeight:700,color:C.gold}}>혼성팀 종목</span>
                    <span style={{fontSize:12,color:"#6b7d94"}}>남1 + 여1 구성 · 최대 2팀</span>
                  </div>
                  {mixedEvents.map(me=>{
                    const catPlayers=players.filter(p=>(p._events||[]).includes(me.category));
                    const malePlayers=catPlayers.filter(p=>p.gender==="남");
                    const femalePlayers=catPlayers.filter(p=>p.gender==="여"||p.gender==="녀");
                    return <div key={me.code} style={{marginBottom:16,padding:"8px 4px",borderBottom:"1px solid #1e2f4a22"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                        <span style={{fontSize:13,fontWeight:700,color:"#e8dcc8"}}>{me.code}</span>
                        <span style={{fontSize:13,color:"#8899aa"}}>{me.name.replace(me.code+" ","")}</span>
                      </div>
                      {[1,2].map(teamNum=>{
                        const pk="pair-"+me.code+"-"+teamNum;
                        const otherPk="pair-"+me.code+"-"+(teamNum===1?2:1);
                        const otherComp=editTeamComps[otherPk]||{memberIds:[]};
                        const filled=(editTeamComps[pk]||{memberIds:[]}).memberIds.length;
                        return <div key={teamNum} style={{marginBottom:10,marginLeft:8}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                            <span style={{fontSize:12,fontWeight:700,color:C.gold}}>팀 {teamNum}</span>
                            <span style={{fontSize:11,color:filled>=2?"#4aba6a":"#556677"}}>{filled}/2명 {filled>=2?"✓":""}</span>
                          </div>
                          <PairSlotRow pairKey={pk} malePlayers={malePlayers} femalePlayers={femalePlayers} otherSlots={otherComp.memberIds}/>
                        </div>;
                      })}
                    </div>;
                  })}
                </div>}
              </div>;
            })()}

            {/* ── 리그전 탭 ── */}
            {editAppMode==="league"&&editIsLeague&&(()=>{
              // 개인전에 등록된 종목 중 리그전 가능 종목만 대상
              const registeredEvCodes=new Set();
              Object.values(editIndEntries).forEach(codes=>codes.forEach(c=>registeredEvCodes.add(c)));
              const _evLgMap=(()=>{try{return JSON.parse(localStorage.getItem("ksfd_ev_league")||"{}");}catch(e){return {};}})();
              // DB league_eligible 우선, localStorage 폴백
              const dbLgCodes=new Set(events.filter(e=>e.league_eligible).map(e=>e.code));
              const leagueTargetEvs=indEvents.filter(ev=>registeredEvCodes.has(ev.code)&&(dbLgCodes.has(ev.code)||!!_evLgMap[selectedT?.id+"_"+ev.code]));
              const CAT_ORD=["소총","소총(SH2)","권총","산탄총","청각"];
              const catClr={"소총":"#3b82f6","소총(SH2)":"#f59e0b","권총":"#8b5cf6","산탄총":"#10b981","청각":"#ec4899"};
              const catGrp={};
              leagueTargetEvs.forEach(ev=>{const cat=CAT_ORD.includes(ev.category)?ev.category:(ev.category||"기타");if(!catGrp[cat])catGrp[cat]=[];catGrp[cat].push(ev);});
              const catKeys=[...CAT_ORD.filter(c=>catGrp[c]),...Object.keys(catGrp).filter(c=>!CAT_ORD.includes(c))];
              const filledCount=Object.entries(editTeamComps).filter(([k,c])=>k.startsWith("league-")&&c.memberIds&&c.memberIds.length===2).length;

              return <div style={{maxWidth:800,margin:"0 auto"}}>
                <div style={{fontSize:16,fontWeight:700,color:"#f59e0b",marginBottom:4}}>🏆 리그전 등록</div>
                <p style={{fontSize:12,color:C.dim,marginBottom:14,lineHeight:1.6}}>
                  개인전에 등록된 종목마다 <b style={{color:"#f59e0b"}}>2인 1팀</b>을 구성합니다. 성별 제한 없음 · 시도별 1팀
                </p>
                <div style={{fontSize:11,color:C.dim,marginBottom:12}}>등록 현황: <b style={{color:"#f59e0b"}}>{filledCount}</b> / {leagueTargetEvs.length} 종목</div>
                {leagueTargetEvs.length===0&&<div style={{textAlign:"center",padding:40,color:C.dim}}>
                  <div style={{fontSize:32,marginBottom:8}}>🏆</div>개인전에 등록된 종목이 없습니다.<br/>종목별 등록 탭에서 먼저 등록하세요.
                </div>}
                {catKeys.map(cat=>{
                  const evs=catGrp[cat];
                  const cc=catClr[cat]||C.dim;
                  return <div key={cat} style={formGroup}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:8,borderBottom:"1px solid #1e2f4a"}}>
                      <span style={{width:8,height:8,borderRadius:4,background:cc}}/>
                      <span style={{fontSize:16,fontWeight:700,color:cc}}>{cat}</span>
                      <span style={{fontSize:11,color:C.dim}}>{evs.length}종목</span>
                    </div>
                    {evs.map(ev=>{
                      const lgKey="league-"+ev.code;
                      const comp=editTeamComps[lgKey]||{memberIds:[],isUnion:false,unionMemo:"",teamType:"league"};
                      const slots=[comp.memberIds[0]||null,comp.memberIds[1]||null];
                      const registered=Object.entries(editIndEntries).filter(([mid,codes])=>codes.includes(ev.code)).map(([mid])=>parseInt(mid));
                      const eligible=players.filter(p=>registered.includes(p.id));
                      const usedIds=slots.filter(Boolean);
                      const isFilled=usedIds.length===2;
                      return <div key={ev.code} style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:6,padding:"8px 4px",borderBottom:"1px solid #1e2f4a22",background:isFilled?"#f59e0b08":"transparent"}}>
                        {/* 종목 정보 */}
                        <div style={{flex:"1 1 160px",minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                            <span style={{fontSize:13,fontWeight:700,color:cc}}>{ev.code}</span>
                            <span style={{fontSize:12,color:"#8899aa"}}>{ev.name.replace(ev.code+" ","")}</span>
                            {isFilled&&<span style={{fontSize:10,color:"#f59e0b",marginLeft:"auto"}}>✓ 완료</span>}
                          </div>
                        </div>
                        {/* 2인 슬롯 */}
                        <div style={{flex:"0 0 auto",minWidth:260,maxWidth:340}}>
                          <div style={{display:"flex",gap:6}}>
                            {[0,1].map(idx=>{
                              const mid=slots[idx];
                              const player=mid?editMembers.find(mm=>mm.id===mid):null;
                              return <div key={idx} style={{flex:1}}>
                                {player?<div style={{borderRadius:6,padding:"4px 10px",border:"1px solid #f59e0b",background:"#f59e0b",display:"flex",alignItems:"center",justifyContent:"center",gap:4,fontSize:12,fontWeight:600,lineHeight:"22px"}}>
                                  <span style={{color:"#000",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{player.name}</span>
                                  <button onClick={()=>{const n=[...slots];n[idx]=null;setEditTeamComps(prev=>({...prev,[lgKey]:{...comp,memberIds:n.filter(Boolean),teamType:"league"}}));}} style={{background:"none",border:"none",color:"#00000066",fontSize:12,cursor:"pointer",padding:0,flexShrink:0}}>✕</button>
                                </div>
                                :<select style={{...eSelect,fontSize:11,padding:"4px 6px"}} value="" onChange={e=>{if(e.target.value){const n=[...slots];n[idx]=parseInt(e.target.value);setEditTeamComps(prev=>({...prev,[lgKey]:{...comp,memberIds:n.filter(Boolean),teamType:"league"}}));}}}>
                                  <option value="">선수{idx+1}</option>
                                  {eligible.filter(p=>!usedIds.includes(p.id)).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>}
                              </div>;
                            })}
                          </div>
                          <label style={{display:"flex",alignItems:"center",gap:5,marginTop:5,cursor:"pointer"}}>
                            <input type="checkbox" checked={comp.isUnion} onChange={e=>setEditTeamComps(prev=>({...prev,[lgKey]:{...comp,isUnion:e.target.checked,teamType:"league"}}))} style={{accentColor:"#f59e0b",width:14,height:14}}/>
                            <span style={{fontSize:11,color:"#8899aa"}}>타시도 연합</span>
                          </label>
                          {comp.isUnion&&<input placeholder="연합 선수 시도/이름" value={comp.unionMemo||""} onChange={e=>setEditTeamComps(prev=>({...prev,[lgKey]:{...comp,unionMemo:e.target.value,teamType:"league"}}))} style={{...eInput,fontSize:11,padding:"4px 8px",marginTop:4}}/>}
                        </div>
                      </div>;
                    })}
                  </div>;
                })}
              </div>;
            })()}

            {/* ── 탭3: 총기 등록 (Entry.html 스타일: 선수별 카드) ── */}
            {editAppMode==="firearms"&&<div style={{maxWidth:750,margin:"0 auto"}}>
              <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:14}}>선수별 총기 등록</div>
              {players.length===0&&<div style={{color:C.dim,padding:20,textAlign:"center"}}>등록된 선수가 없습니다</div>}
              {players.map(p=>{
                const guns=editFirearms[p.id]||[];
                const pEvents=(p._events||[]).join(", ");
                return <div key={p.id} style={formGroup}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingBottom:8,borderBottom:"1px solid #1e2f4a"}}>
                    <span style={{fontSize:16,fontWeight:700,color:"#e8dcc8"}}>{p.name}</span>
                    <span style={{fontSize:11,color:p.gender==="남"?"#4488cc":"#cc6688",padding:"1px 6px",background:"#1a274466",borderRadius:4}}>{p.gender}</span>
                    {pEvents&&<span style={{fontSize:11,color:"#8899aa"}}>{pEvents}</span>}
                    <span style={{fontSize:12,color:C.gold,marginLeft:"auto"}}>{guns.length}정</span>
                  </div>
                  {guns.map((g,gi)=><div key={gi} style={{position:"relative",marginBottom:10,padding:"10px 12px",background:"#0d152088",borderRadius:8,border:"1px solid #1e2f4a"}}>
                    <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
                      <span style={{fontSize:13,fontWeight:700,color:C.gold}}>총기 {gi+1}</span>
                      <button onClick={()=>editRemoveFirearm(p.id,gi)} style={{marginLeft:"auto",background:"none",border:"none",color:"#aa4444",fontSize:13,cursor:"pointer"}}>삭제</button>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>총종</span>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                          {GUN_TYPES.map(gt=><button key={gt} onClick={()=>editUpdateFirearm(p.id,gi,"gun_type",gt)} style={chipBtn(g.gun_type===gt)}>{gt}</button>)}
                        </div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>제조사</span>
                        <input style={{...eInput,flex:1}} value={g.manufacturer} onChange={e=>editUpdateFirearm(p.id,gi,"manufacturer",e.target.value)} placeholder="제조사"/>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>모델명</span>
                        <input style={{...eInput,flex:1}} value={g.model} onChange={e=>editUpdateFirearm(p.id,gi,"model",e.target.value)} placeholder="모델명"/>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>총기번호</span>
                        <input style={{...eInput,flex:1}} value={g.serial_number} onChange={e=>editUpdateFirearm(p.id,gi,"serial_number",e.target.value)} placeholder="총기번호"/>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>허가증번호</span>
                        <input style={{...eInput,flex:1}} value={g.permit_number} onChange={e=>editUpdateFirearm(p.id,gi,"permit_number",e.target.value)} placeholder="허가증번호"/>
                      </div>
                    </div>
                  </div>)}
                  <button onClick={()=>editAddFirearm(p.id)} style={{width:"100%",padding:"8px",borderRadius:6,border:"1px dashed #2a3a5c",background:"transparent",color:"#6b7d94",fontSize:12,cursor:"pointer"}}>+ 총기 추가</button>
                </div>;
              })}
            </div>}

            </div>
          </div>
        </div>;
      })()}
    </div>
  </>);
}

// ═══ 기록 관리자 ═══
function RecordsPanel({ sb, flash, onBack, setDbBusy }) {
  const [menu, setMenu]=useState(null); // null=홈, "entry"=대회기록등록
  const [tournaments, setTournaments]=useState([]);
  const [selT, setSelT]=useState(null);
  const [events, setEvents]=useState([]);
  const [selEv, setSelEv]=useState(null);
  const [results, setResults]=useState([]);
  const [dirty, setDirty]=useState(false);

  // 신기록 관리 state
  const [brEvCode, setBrEvCode]=useState(null);
  const [brType, setBrType]=useState("prelim");
  const [brData, setBrData]=useState({}); // {korea:{...},national:{...},paralympic:{...},world:{...}}
  const [brDirty, setBrDirty]=useState(false);
  const [brViewAll, setBrViewAll]=useState(false);
  const [brAllData, setBrAllData]=useState([]);
  const [brPrint, setBrPrint]=useState(false);
  const BR_CATS=[
    {key:"korea",label:"🇰🇷 한국 신기록",color:"#dc2626"},
    {key:"national",label:"🏟 전국체전 대회 신기록",color:"#2563eb"},
    {key:"paralympic",label:"♿ 패럴림픽 신기록",color:"#7c3aed"},
    {key:"world",label:"🌍 세계 신기록",color:"#059669"},
  ];
  const BR_TYPE_LABEL={prelim:"본선",final:"결선",team:"단체"};
  const BR_CAT_SHORT={korea:"KR",national:"GR",paralympic:"PR",world:"WR"};
  const BR_EV_COLORS=["#e8f0fe","#fef3e2","#e6f4ea","#fce8e8","#f3e8fd","#e2f0f0","#fef9e7","#f0e8f8","#e8eff8","#fceee8","#eef8e8","#f8e8ee","#e8f8f4","#e8e8f8","#fef0e8","#f4f4e8","#e8f4f0","#f8f0e8"];

  const renderBrTable=(forPrint)=>{
    const ORDER_EVS=[...DEFAULT_EVENTS,...DB_REC_EVENTS];
    const sorted=[...brAllData].sort((a,b)=>{
      const ai=ORDER_EVS.findIndex(e=>e.code===a.event_code);
      const bi=ORDER_EVS.findIndex(e=>e.code===b.event_code);
      if(ai!==bi) return (ai===-1?999:ai)-(bi===-1?999:bi);
      const to={prelim:0,final:1,team:2};
      if(to[a.result_type]!==to[b.result_type]) return to[a.result_type]-to[b.result_type];
      const co={korea:0,national:1,paralympic:2,world:3};
      return co[a.record_category]-co[b.record_category];
    });
    // 종목별 색상 매핑
    const evColorMap={};
    let ci=0;
    sorted.forEach(r=>{if(!evColorMap[r.event_code]){evColorMap[r.event_code]=BR_EV_COLORS[ci%BR_EV_COLORS.length];ci++;}});
    const bdr="1px solid #333";
    const thS={padding:"6px 8px",fontSize:forPrint?8:10,fontWeight:700,color:"#000",background:"#d0d0d0",border:bdr,textAlign:"center",whiteSpace:"nowrap"};
    const tdS={padding:"5px 8px",fontSize:forPrint?8:11,color:"#000",border:bdr,whiteSpace:"nowrap"};
    return <div style={{overflow:"auto",borderRadius:forPrint?0:8}}>
      <table style={{width:"100%",borderCollapse:"collapse",border:bdr}}>
        <thead><tr>
          {["종목명","구분","라운드","분류","선수명","기록","수립 대회","수립일"].map(h=>
            <th key={h} style={thS}>{h}</th>
          )}
        </tr></thead>
        <tbody>
          {sorted.map((r,i)=>{
            const ev=DEFAULT_EVENTS.find(e=>e.code===r.event_code);
            const isTeam=r.result_type==="team";
            const bg=evColorMap[r.event_code]||"#fff";
            return <tr key={r.id||i} style={{background:bg}}>
              <td style={{...tdS,fontWeight:600}}>{ev?.name||r.event_code}</td>
              <td style={{...tdS,textAlign:"center"}}>{isTeam?"단체":"개인"}</td>
              <td style={{...tdS,textAlign:"center"}}>{BR_TYPE_LABEL[r.result_type]}</td>
              <td style={{...tdS,textAlign:"center",fontWeight:700}}>{BR_CAT_SHORT[r.record_category]||r.record_category}</td>
              <td style={tdS}>{r.holder_name||"—"}</td>
              <td style={{...tdS,fontWeight:700}}>{r.record_value||"—"}</td>
              <td style={{...tdS,fontSize:forPrint?7:10}}>{r.tournament_name||"—"}</td>
              <td style={{...tdS,fontSize:forPrint?7:10}}>{r.record_date||"—"}</td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>;
  };

  useEffect(()=>{
    if(!sb) return;
    sb.from("tournaments").select("*").in("status",[3,4]).order("start_date",{ascending:false}).then(({data})=>setTournaments(data||[]));
  },[sb]);

  const loadEvents=async(t)=>{
    setSelT(t); setSelEv(null); setResults([]); setDirty(false);
    setDbBusy(v=>v+1);
    try{
      const{data}=await sb.from("tournament_events").select("*").eq("tournament_id",t.id).order("sort_order");
      setEvents(data||[]);
    }finally{setDbBusy(v=>v-1);}
  };
  const loadResults=async(evCode)=>{
    setSelEv(evCode); setDirty(false);
    setDbBusy(v=>v+1);
    try{
      const{data}=await sb.from("competition_results").select("*").eq("tournament_id",selT.id).eq("event_code",evCode).eq("result_type","prelim").order("rank",{ascending:true,nullsFirst:false});
      setResults((data||[]).map(r=>({...r,_sub_org:r.sub_org||""})));
    }finally{setDbBusy(v=>v-1);}
  };

  const addRow=()=>{
    const newRank=results.filter(r=>!r._deleted).length+1;
    setResults([...results,{_new:true, id:"new_"+Date.now(), tournament_id:selT.id, event_code:selEv, result_type:"prelim", rank:newRank, bib:"", name:"", region:"", _sub_org:"", is_team:false, s1:"",s2:"",s3:"",s4:"",s5:"",s6:"",s7:"",s8:"",s9:"",s10:"",s11:"",s12:"", total:"", x_count:"", remarks:""}]);
    setDirty(true);
  };
  const updateRow=(idx,field,val)=>{
    const nr=[...results]; nr[idx]={...nr[idx],[field]:val,_dirty:true}; setResults(nr); setDirty(true);
  };
  const removeRow=(idx)=>{
    const r=results[idx];
    if(r._new){setResults(results.filter((_,i)=>i!==idx));}
    else{setResults(results.map((rr,i)=>i===idx?{...rr,_deleted:true}:rr));}
    setDirty(true);
  };

  const saveAll=async()=>{
    setDbBusy(v=>v+1);
    try{
      const toDelete=results.filter(r=>r._deleted&&!r._new);
      const toInsert=results.filter(r=>r._new&&!r._deleted);
      const toUpdate=results.filter(r=>r._dirty&&!r._new&&!r._deleted);
      for(const r of toDelete){await sb.from("competition_results").delete().eq("id",r.id);}
      for(const r of toInsert){
        const{_new,_dirty,_sub_org,id,...row}=r; row.sub_org=_sub_org||"";
        await sb.from("competition_results").insert(row);
      }
      for(const r of toUpdate){
        const{_new,_dirty,_deleted,_sub_org,created_at,...row}=r; row.sub_org=_sub_org||"";
        await sb.from("competition_results").update(row).eq("id",r.id);
      }
      flash("저장 완료 (" + (toInsert.length+toUpdate.length) + "건 저장, " + toDelete.length + "건 삭제)");
      loadResults(selEv);
    }catch(e){flash(e.message,"error");}
    finally{setDbBusy(v=>v-1);}
  };

  const exportCSV=()=>{
    const visible=results.filter(r=>!r._deleted);
    let csv="\uFEFF순위,배번,이름,시도,세부소속,S1,S2,S3,S4,S5,S6,합계,X카운트,비고\n";
    visible.forEach(r=>{csv+=`${r.rank||""},${r.bib||""},${r.name||""},${r.region||""},${r._sub_org||r.sub_org||""},${r.s1||""},${r.s2||""},${r.s3||""},${r.s4||""},${r.s5||""},${r.s6||""},${r.total||""},${r.x_count||""},${r.remarks||""}\n`;});
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`${selT.name}_${selEv}_기록.csv`; a.click();
  };

  const importExcel=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data); const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
    const colMap={"순위":"rank","배번":"bib","이름":"name","시도":"region","소속":"region","세부소속":"_sub_org","S1":"s1","S2":"s2","S3":"s3","S4":"s4","S5":"s5","S6":"s6","합계":"total","X카운트":"x_count","비고":"remarks"};
    const mapped=rows.map((r,i)=>{
      const row={_new:true, id:"imp_"+Date.now()+"_"+i, tournament_id:selT.id, event_code:selEv, result_type:"prelim"};
      Object.entries(r).forEach(([k,v])=>{const mk=colMap[k.trim()]; if(mk) row[mk]=String(v);});
      if(!row.rank) row.rank=i+1;
      if(!row.name) return null;
      return row;
    }).filter(Boolean);
    if(mapped.length===0){flash("유효한 데이터가 없습니다.","error"); return;}
    setResults([...results.filter(r=>!r._deleted), ...mapped]);
    setDirty(true);
    flash(mapped.length+"건 불러오기 완료");
    e.target.value="";
  };

  const FIELDS=[
    {k:"rank",l:"순위",w:50,t:"number"},
    {k:"bib",l:"배번",w:60},
    {k:"name",l:"이름",w:80},
    {k:"region",l:"시도",w:65},
    {k:"_sub_org",l:"세부소속",w:85},
    {k:"s1",l:"S1",w:60},{k:"s2",l:"S2",w:60},{k:"s3",l:"S3",w:60},
    {k:"s4",l:"S4",w:60},{k:"s5",l:"S5",w:60},{k:"s6",l:"S6",w:60},
    {k:"total",l:"합계",w:70},
    {k:"x_count",l:"X카운트",w:65},
    {k:"remarks",l:"비고",w:90},
  ];

  // 신기록 로드
  const loadBestRecords=async(evCode,type)=>{
    setBrViewAll(false); setBrPrint(false);
    setBrEvCode(evCode); setBrType(type||"prelim"); setBrDirty(false);
    const{data}=await sb.from("best_records").select("*").eq("event_code",evCode).eq("result_type",type||"prelim");
    const map={};
    BR_CATS.forEach(c=>{map[c.key]={event_code:evCode,result_type:type||"prelim",record_category:c.key,record_value:"",holder_name:"",holder_region:"",record_date:"",tournament_name:"",remarks:""};});
    (data||[]).forEach(r=>{map[r.record_category]={...r};});
    setBrData(map);
  };
  const brUpdate=(cat,field,val)=>{
    setBrData({...brData,[cat]:{...brData[cat],[field]:val,_dirty:true}});
    setBrDirty(true);
  };
  // 🛡️ best_records 행 정제: DATE/빈문자열 → null 로, supabase 에 안전한 형식으로
  const brCleanRow=(row)=>{
    const out={...row};
    // record_date 는 DATE — 빈 문자열은 null 로
    if(out.record_date===""||out.record_date===undefined) out.record_date=null;
    // 기타 텍스트 필드: undefined → "" (null 은 허용)
    ["record_value","holder_name","holder_region","tournament_name","remarks"].forEach(k=>{
      if(out[k]===undefined) out[k]="";
    });
    return out;
  };
  // 🔧 SERIAL id 시퀀스 불일치로 upsert 가 pkey 충돌을 내는 문제 방지용 —
  //    SELECT 로 기존 행 확인 → 있으면 UPDATE, 없으면 INSERT (id 는 건드리지 않음)
  const brSaveRow=async(evCode,type,catKey,rowIn)=>{
    const{data:existing,error:selErr}=await sb.from("best_records")
      .select("id").eq("event_code",evCode).eq("result_type",type).eq("record_category",catKey).maybeSingle();
    if(selErr) return {error:selErr};
    const row=brCleanRow({...rowIn,event_code:evCode,result_type:type,record_category:catKey});
    // id/created_at 은 절대 전송하지 않음 (시퀀스 충돌 및 덮어쓰기 방지)
    delete row.id; delete row.created_at;
    if(existing&&existing.id){
      const{error}=await sb.from("best_records").update(row).eq("id",existing.id);
      return{error,id:existing.id};
    }
    // INSERT — SERIAL 시퀀스가 max(id) 보다 뒤처져 있으면 pkey 충돌 발생.
    // Postgres 는 INSERT 실패 시에도 nextval 가 전진하므로 일정 횟수 재시도하면 자연 복구된다.
    let lastErr=null, insId=null;
    for(let attempt=0; attempt<50; attempt++){
      const{data:ins,error}=await sb.from("best_records").insert(row).select("id").single();
      if(!error){ insId=ins?.id; lastErr=null; break; }
      lastErr=error;
      // pkey (id) 충돌만 재시도, 다른 에러는 바로 중단
      const msg=String(error.message||"");
      if(!/best_records_pkey|duplicate key.*id/i.test(msg)) break;
    }
    return{error:lastErr,id:insId};
  };
  const brSave=async()=>{
    try{
      let saved=0, failed=[];
      for(const cat of BR_CATS){
        const r=brData[cat.key];
        if(!r||!r._dirty) continue;
        const{_dirty,_saved,id,created_at,...row0}=r;
        if(!row0.record_value&&!row0.holder_name) continue; // 빈 카드 skip
        const{error}=await brSaveRow(brEvCode,brType,cat.key,row0);
        if(error){ failed.push(cat.label+": "+error.message); console.error(error); }
        else { saved++; }
      }
      if(failed.length>0){
        flash("저장 실패 "+failed.length+"건 — "+failed[0],"error");
      } else {
        flash(saved+"건 저장 완료");
      }
      loadBestRecords(brEvCode,brType);
    }catch(e){flash("저장 실패: "+e.message,"error");}
  };
  // 개별 카드 저장
  const brSaveOne=async(catKey)=>{
    try{
      const r=brData[catKey];
      if(!r) return;
      const{_dirty,_saved,id,created_at,...row0}=r;
      if(!row0.record_value&&!row0.holder_name){ flash("기록 또는 보유자를 입력하세요","error"); return; }
      const{error}=await brSaveRow(brEvCode,brType,catKey,row0);
      if(error){ console.error(error); flash("저장 실패: "+error.message,"error"); return; }
      setBrData(prev=>({...prev,[catKey]:{...prev[catKey],_dirty:false,_saved:true}}));
      setTimeout(()=>setBrData(prev=>({...prev,[catKey]:{...prev[catKey],_saved:false}})),2000);
      flash(BR_CATS.find(c=>c.key===catKey)?.label+" 저장 완료");
      // reload to get id
      const{data:fresh}=await sb.from("best_records").select("*").eq("event_code",brEvCode).eq("result_type",brType).eq("record_category",catKey).maybeSingle();
      if(fresh) setBrData(prev=>({...prev,[catKey]:{...fresh,_saved:true}}));
    }catch(e){flash("저장 실패: "+e.message,"error");}
  };
  // 전체 신기록 로드
  const loadAllBestRecords=async()=>{
    setBrViewAll(true); setBrEvCode(null); setBrPrint(false);
    const{data}=await sb.from("best_records").select("*").order("event_code").order("result_type").order("record_category");
    setBrAllData(data||[]);
  };
  const inp={background:"#0d1520",border:"1px solid #2a3a5c",borderRadius:4,color:"#e8dcc8",padding:"4px 6px",fontSize:12,width:"100%",boxSizing:"border-box"};

  const MENUS=[
    {key:"entry",icon:"📝",label:"대회 기록 등록"},
    {key:"records_new",icon:"🏅",label:"신기록 관리"},
    {key:"records_db",icon:"🗃",label:"기록 DB 조회",disabled:true},
  ];

  const sideItem=(m)=>({
    padding:"11px 16px",cursor:m.disabled?"default":"pointer",
    borderBottom:"1px solid "+C.border+"44",
    background:menu===m.key?C.gold+"15":"transparent",
    borderLeft:menu===m.key?"3px solid "+C.gold:"3px solid transparent",
    opacity:m.disabled?0.4:1,
    display:"flex",alignItems:"center",gap:8,
  });

  return (
    <div style={{height:"100vh",display:"flex",background:C.bg,color:"#e8dcc8",fontFamily:"'Noto Sans KR',sans-serif"}}>
      {/* 좌측 사이드바 */}
      <div style={{width:220,minWidth:220,background:C.sidebar,borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"14px 16px",borderBottom:"1px solid "+C.border}}>
          <button onClick={onBack} style={{background:"transparent",border:"none",color:C.dim,fontSize:12,cursor:"pointer",padding:0,marginBottom:8}}>← 메인</button>
          <div style={{fontSize:15,fontWeight:800,color:C.gold}}>📊 기록 관리자</div>
        </div>
        {/* 메뉴 */}
        <div style={{flex:1,overflow:"auto"}}>
          {MENUS.map(m=>(
            <div key={m.key} style={sideItem(m)} onClick={()=>{if(!m.disabled){setMenu(m.key);setSelT(null);setSelEv(null);setResults([]);setBrEvCode(null);setBrData({});setBrDirty(false);setBrViewAll(false);setBrPrint(false);}}}>
              <span style={{fontSize:16}}>{m.icon}</span>
              <span style={{fontSize:13,fontWeight:menu===m.key?700:400,color:menu===m.key?C.gold:"#c8d4e4"}}>{m.label}</span>
              {m.disabled&&<span style={{fontSize:9,color:C.dimmer,marginLeft:"auto"}}>준비중</span>}
            </div>
          ))}
        </div>
      </div>

      {/* 메인 영역 */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>
        {/* 홈 */}
        {!menu&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:C.dimmer}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:56,marginBottom:16}}>📊</div>
            <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>기록 관리자</div>
            <div style={{fontSize:13,lineHeight:1.8}}>좌측 메뉴에서 작업을 선택하세요.</div>
          </div>
        </div>}

        {/* 대회 기록 등록 */}
        {menu==="entry"&&<>
          {/* 대회 선택 서브사이드바 */}
          <div style={{width:220,minWidth:220,background:"#0b1018",borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid "+C.border}}>
              <div style={{fontSize:13,fontWeight:700,color:"#e8dcc8"}}>📝 대회 기록 등록</div>
              <div style={{fontSize:10,color:C.dim,marginTop:3}}>종료/진행 대회 ({tournaments.length})</div>
            </div>
            <div style={{flex:1,overflow:"auto"}}>
              {tournaments.map(t=>(
                <div key={t.id} onClick={()=>loadEvents(t)} style={{
                  padding:"10px 14px",cursor:"pointer",borderBottom:"1px solid "+C.border+"33",
                  background:selT?.id===t.id?C.gold+"15":"transparent",
                  borderLeft:selT?.id===t.id?"3px solid "+C.gold:"3px solid transparent",
                }}>
                  <div style={{fontSize:12,fontWeight:selT?.id===t.id?700:400,color:selT?.id===t.id?C.gold:"#c8d4e4",lineHeight:1.4}}>{t.name}</div>
                  <div style={{fontSize:10,color:C.dim,marginTop:2}}>📅 {t.start_date} · {t.status===3?"진행중":"종료"}</div>
                </div>
              ))}
              {tournaments.length===0&&<div style={{padding:20,textAlign:"center",color:C.dimmer,fontSize:11}}>조회 가능한 대회가 없습니다</div>}
            </div>
          </div>

          {/* 종목 선택 + 기록 편집 */}
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {!selT&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:C.dimmer}}>
              <div style={{textAlign:"center"}}><div style={{fontSize:40,marginBottom:10}}>🏆</div><div style={{fontSize:14}}>대회를 선택하세요</div></div>
            </div>}
            {selT&&<>
              {/* 종목 탭 */}
              <div style={{padding:"10px 20px",borderBottom:"1px solid "+C.border,background:C.sidebar,display:"flex",flexWrap:"wrap",gap:4,alignItems:"center"}}>
                <span style={{fontSize:13,fontWeight:700,color:C.gold,marginRight:8}}>{selT.name}</span>
                {events.filter(e=>e.type==="individual").map(ev=>(
                  <button key={ev.code} onClick={()=>loadResults(ev.code)} style={{
                    padding:"5px 10px",borderRadius:5,fontSize:11,fontWeight:selEv===ev.code?700:400,cursor:"pointer",
                    border:"1px solid "+(selEv===ev.code?C.gold:C.border),
                    background:selEv===ev.code?C.gold+"22":"transparent",
                    color:selEv===ev.code?C.gold:C.dim,
                  }}>{ev.code}</button>
                ))}
              </div>
              {/* 컨텐츠 */}
              <div style={{flex:1,overflow:"auto",padding:20}}>
                {!selEv&&<div style={{textAlign:"center",padding:60,color:C.dimmer}}><div style={{fontSize:36,marginBottom:8}}>🎯</div>종목을 선택하세요</div>}
                {selEv&&<div>
                  {/* 툴바 */}
                  <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
                    <span style={{fontSize:14,fontWeight:700,color:"#fff"}}>{events.find(e=>e.code===selEv)?.name}</span>
                    <span style={{fontSize:12,color:C.dim}}>({results.filter(r=>!r._deleted).length}명)</span>
                    <div style={{flex:1}}/>
                    <button onClick={addRow} style={{...S.btn(C.gold,C.bg),fontSize:11,padding:"5px 12px"}}>+ 행 추가</button>
                    <label style={{...S.btn(C.blue,"#fff"),fontSize:11,padding:"5px 12px",cursor:"pointer"}}>

            {!brEvCode&&<div style={{textAlign:"center",padding:60,color:C.dimmer}}>

              <div style={{fontSize:12,marginTop:6}}>각 종목별 본선·결선·단체전 신기록을 관리합니다.</div>

                <span style={{fontSize:12,color:C.dim,marginLeft:8}}>— {BR_TYPE_LABEL[brType]} 기록</span>
              </div>
              {/* 4분류 카드 */}
              {BR_CATS.map(cat=>{
                const r=brData[cat.key]||{};

                    <div style={{flex:1}}/>

                    :<button onClick={()=>brSaveOne(cat.key)} style={{
                      padding:"5px 14px",borderRadius:5,cursor:"pointer",fontSize:11,fontWeight:700,
                      background:r._dirty?"#ff6b35":"transparent",
                      color:r._dirty?"#fff":cat.color,
                      border:r._dirty?"none":"1px solid "+cat.color,
                    }}>{r._dirty?"💾 저장":"💾 저장"}</button>}
                  </div>

                    {/* 기록 */}
                    <div>
                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>기록 (점수)</label>
                      <input value={r.record_value||""} onChange={e=>brUpdate(cat.key,"record_value",e.target.value)}
                        placeholder="예: 634.5" style={{...inp,fontSize:13,fontWeight:700,color:cat.color}}/>
                    </div>
                    {/* 보유자 */}
                    <div>
                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>보유자</label>
                      <input value={r.holder_name||""} onChange={e=>brUpdate(cat.key,"holder_name",e.target.value)}
                        placeholder="홍길동" style={inp}/>
                    </div>
                    {/* 수립일 */}
                    <div>
                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>수립일</label>
                      <input type="date" value={r.record_date||""} onChange={e=>brUpdate(cat.key,"record_date",e.target.value)} style={inp}/>
                    </div>
                    {/* 수립 대회 */}
                    <div>
                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>수립 대회</label>
                      <input value={r.tournament_name||""} onChange={e=>brUpdate(cat.key,"tournament_name",e.target.value)}

                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>비고</label>

                        placeholder="메모" style={inp}/>

              {/* 저장/종합보기 */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}>
                <button onClick={loadAllBestRecords} style={{...S.btn(C.border,"#c8d4e4"),fontSize:11,padding:"6px 14px"}}>📑 전체 종합 보기</button>
                {brDirty&&<button onClick={brSave} style={{...S.btn("#ff6b35","#fff"),fontSize:13,padding:"8px 24px",fontWeight:700}}>💾 전체 저장</button>}
              </div>
            </div>}
          </div>}

          {/* 본문: 종합 보기 */}
          {brViewAll&&<div style={{flex:1,overflow:"auto",padding:20}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
              <span style={{fontSize:16,fontWeight:800,color:"#fff"}}>📑 신기록 종합 현황</span>
              <span style={{fontSize:12,color:C.dim}}>({brAllData.length}건 등록)</span>
              <div style={{flex:1}}/>

              {brAllData.length>0&&<button onClick={()=>setBrPrint(true)} style={{...S.btn("#334155","#e8dcc8"),fontSize:11,padding:"5px 12px"}}>🖨 인쇄</button>}
            </div>

          {brPrint&&<div className="print-overlay">
