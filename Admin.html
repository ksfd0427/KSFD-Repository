        </div>
      </div>
    </div>}
    {/* ── 단체번호 드롭다운 오버레이 ── */}
    {teamDropdown&&<div style={{position:"fixed",inset:0,zIndex:10001}} onClick={()=>setTeamDropdown(null)}>
      {(()=>{
        const ddHeight=280;
        const spaceBelow=teamDropdown.rect.vpHeight-teamDropdown.rect.top;
        const flipUp=spaceBelow<ddHeight&&teamDropdown.rect.bottom>ddHeight;
        const posStyle=flipUp
          ?{position:"fixed",bottom:teamDropdown.rect.vpHeight-teamDropdown.rect.bottom,left:teamDropdown.rect.left}
          :{position:"fixed",top:teamDropdown.rect.top,left:teamDropdown.rect.left};
        return <div style={{...posStyle,background:"#1a2332",border:"1px solid #3a506b",borderRadius:8,padding:6,minWidth:180,maxHeight:300,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,.7)",animation:"fadeIn .15s ease"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:10,color:"#6b7d94",fontWeight:700,padding:"4px 8px",borderBottom:"1px solid #2a3a5c",marginBottom:4}}>단체번호 배정 (최대 4명/단체)</div>
        {(()=>{
          const evCode=teamDropdown.evCode;
          const ov=(orgNumOverrides[evCode])||{};
          const ep=evPData||{allMembers:[],allEntries:[],allTeamEntries:[],appMap:{}};
          const memberMap2={}; ep.allMembers.forEach(m=>{memberMap2[m.id]=m;});
          const memberAppMap2={}; ep.allMembers.forEach(m=>{memberAppMap2[m.id]=ep.appMap[m.application_id];});
          const selEvObj2=events.find(e=>e.code===evCode);
          const isMixed2=selEvObj2&&selEvObj2.type==="mixed";
          // 단체전 참가자: team_entries에서 event_code=현재종목 AND team_type='team' (개인전) 또는 mixed
          const regionOrd=["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
          const memberToTeamNum2={};
          if(isMixed2){
            const grp=groupMixedTeams(ep.allTeamEntries.filter(t=>t.event_code===evCode),memberMap2,memberAppMap2);
            grp.forEach((p,i)=>{
              const num=ov[String(p.memberId)]!==undefined?ov[String(p.memberId)]:i+1;
              if(p._team) p._team.forEach(m=>{memberToTeamNum2[m.memberId]=num;});
              else memberToTeamNum2[p.memberId]=num;
            });
          } else {
            const evTE=ep.allTeamEntries.filter(t=>t.event_code===evCode&&t.team_type==="team"&&memberMap2[t.member_id]);
            const teamByApp2={};
            evTE.forEach(te=>{
              const app=memberAppMap2[te.member_id];
              const k=(te.application_id||"?")+"_"+(te.team_number||1);
              if(!teamByApp2[k]) teamByApp2[k]={appId:te.application_id,teamNumber:te.team_number||1,regionName:app?.region_name||"-",members:new Set()};
              teamByApp2[k].members.add(te.member_id);
            });
            const tl2=Object.values(teamByApp2);
            tl2.sort((a,b)=>{const ai=regionOrd.indexOf(a.regionName),bi=regionOrd.indexOf(b.regionName);return(ai===-1?99:ai)-(bi===-1?99:bi)||(a.teamNumber-b.teamNumber);});
            tl2.forEach((t,i)=>{t.members.forEach(mid=>{memberToTeamNum2[mid]=i+1;});});
          }
          // effective 단체번호 (override 우선)
          const getNum=(mid)=>{
            if(ov[String(mid)]!==undefined) return ov[String(mid)];
            return memberToTeamNum2[mid]||null;
          };
          // 현재 종목 전체 참가자
          const entries2=ep.allEntries.filter(e=>e.event_code===evCode).map(e=>e.member_id);
          const allMids=isMixed2?Object.keys(memberToTeamNum2).map(Number):entries2;
          // 카운트
          const counts={};
          allMids.forEach(mid=>{const n=getNum(mid);if(n)counts[n]=(counts[n]||0)+1;});
          const curMid=String(teamDropdown.memberId);
          const curNum=getNum(Number(curMid))||teamDropdown.currentNum;
          const maxN=Math.max(...Object.keys(counts).map(Number),0);
          const options=[];
          for(let n=1;n<=maxN;n++){
            const cnt=counts[n]||0;
            const cntExcluding=n===curNum?cnt-1:cnt;
            options.push({num:n,count:cnt,full:cntExcluding>=4,isCurrent:n===curNum});
          }
          const newNum=maxN+1;
          const newTC=getTeamColor(newNum);
          return <div>
            {/* 해당 없음 (단체 해제) */}
            <div onClick={()=>changeOrgNum(teamDropdown.memberId,null)}

                background:curNum===null?"#33445522":"transparent",color:"#6b7d94",fontSize:11,marginBottom:4,
                border:curNum===null?"1px solid #334455":"1px solid transparent",fontWeight:curNum===null?700:400}}>
              <span style={{display:"inline-block",width:10,height:10,borderRadius:3,border:"1px dashed #556",flexShrink:0}}/>
              해당 없음 {curNum===null?"✓":""}
            </div>
            <div style={{borderTop:"1px solid #2a3a5c",marginBottom:4}}/>
            {options.map(o=>{const tc=getTeamColor(o.num);return <div key={o.num}
              onClick={()=>{if(!o.full||o.isCurrent) changeOrgNum(teamDropdown.memberId,o.num);}}
              style={{padding:"6px 10px",borderRadius:5,cursor:o.full&&!o.isCurrent?"not-allowed":"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",
                background:o.isCurrent?tc+"22":"transparent",color:o.full&&!o.isCurrent?"#555":"#c8d6e5",
                opacity:o.full&&!o.isCurrent?0.5:1,fontSize:12,marginBottom:2,
                ...(o.isCurrent?{border:"1px solid "+tc+"77"}:{border:"1px solid transparent"})}}>
              <span style={{display:"flex",alignItems:"center",gap:6,fontWeight:o.isCurrent?700:400}}>
                <span style={{display:"inline-block",width:10,height:10,borderRadius:3,background:tc,flexShrink:0}}/>
                단체{o.num} {o.isCurrent?"✓":""}
              </span>
              <span style={{fontSize:10,color:o.full&&!o.isCurrent?"#ef4444":"#6b7d94"}}>{o.count}/4{o.full&&!o.isCurrent?" (만석)":""}</span>
            </div>;})}
            <div onClick={()=>changeOrgNum(teamDropdown.memberId,newNum)}
              style={{padding:"6px 10px",borderRadius:5,cursor:"pointer",display:"flex",alignItems:"center",gap:6,
                color:newTC,fontSize:12,marginTop:4,borderTop:"1px solid #2a3a5c",paddingTop:8}}>
              <span style={{display:"inline-block",width:10,height:10,borderRadius:3,background:newTC,flexShrink:0}}/>
              <span>＋ 새 단체 추가 (단체{newNum})</span>
            </div>
          </div>;
        })()}

      })()}

    {/* ── 혼성팀 팀 배정 드롭다운 오버레이 ── */}
    {mixedTeamDD&&<div style={{position:"fixed",inset:0,zIndex:10001}} onClick={()=>setMixedTeamDD(null)}>
      {(()=>{
        const ddHeight=280;
        const spaceBelow=mixedTeamDD.rect.vpHeight-mixedTeamDD.rect.top;
        const flipUp=spaceBelow<ddHeight&&mixedTeamDD.rect.bottom>ddHeight;
        const posStyle=flipUp
          ?{position:"fixed",bottom:mixedTeamDD.rect.vpHeight-mixedTeamDD.rect.bottom,left:mixedTeamDD.rect.left}
          :{position:"fixed",top:mixedTeamDD.rect.top,left:mixedTeamDD.rect.left};
        return <div style={{...posStyle,background:"#1a2332",border:"1px solid #3a506b",borderRadius:8,padding:6,minWidth:200,maxHeight:340,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,.7)",animation:"fadeIn .15s ease"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:10,color:"#6b7d94",fontWeight:700,padding:"4px 8px",borderBottom:"1px solid #2a3a5c",marginBottom:4}}>단체 배정 (최대 2명/단체)</div>
        {(()=>{
          const evCode=mixedTeamDD.evCode;
          const mixedOv=(mixedTeamOverrides[evCode])||{};
          const ep=evPData||{allMembers:[],allEntries:[],allTeamEntries:[],appMap:{}};
          const memberMap2={}; ep.allMembers.forEach(m=>{memberMap2[m.id]=m;});
          const memberAppMap2={}; ep.allMembers.forEach(m=>{memberAppMap2[m.id]=ep.appMap[m.application_id];});
          // team_entries에서 해당 종목의 모든 참가자
          const teamEntries2=ep.allTeamEntries.filter(t=>t.event_code===evCode);
          // 기본 팀번호 매핑
          const defaultTM2={};const gk2n={};let gs2=0;
          teamEntries2.forEach(t=>{const gk=t.application_id+"_"+(t.team_number||1);if(gk2n[gk]===undefined){gs2++;gk2n[gk]=gs2;}defaultTM2[t.member_id]=gk2n[gk];});
          // 각 참가자의 현재 팀번호
          const allMids2=[];const seen2=new Set();
          teamEntries2.forEach(t=>{if(seen2.has(t.member_id))return;seen2.add(t.member_id);if(memberMap2[t.member_id])allMids2.push(t.member_id);});
          const getNum2=(mid)=>{const ov=mixedOv[String(mid)];return ov!==undefined?ov:(defaultTM2[mid]||null);};
          // 카운트
          const counts={};
          allMids2.forEach(mid=>{const n=getNum2(mid);if(n)counts[n]=(counts[n]||0)+1;});
          const curMid=mixedTeamDD.memberId;
          const curNum=getNum2(curMid);
          const maxN=Math.max(...Object.keys(counts).map(Number),0);
          const options=[];
          for(let n=1;n<=maxN;n++){
            const cnt=counts[n]||0;
            const cntExcluding=n===curNum?cnt-1:cnt;
            // 같은 팀 멤버 이름 표시
            const teamMates=allMids2.filter(mid=>mid!==curMid&&getNum2(mid)===n).map(mid=>memberMap2[mid]?.name||"?");

          const newTC=getTeamColor(newNum);

            <div style={{borderTop:"1px solid #2a3a5c",marginBottom:4}}/>
            {options.map(o=>{const tc=getTeamColor(o.num);return <div key={o.num}
              onClick={()=>{if(!o.full||o.isCurrent) changeMixedTeam(curMid,o.num);}}
              style={{padding:"6px 10px",borderRadius:5,cursor:o.full&&!o.isCurrent?"not-allowed":"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",
                background:o.isCurrent?tc+"22":"transparent",color:o.full&&!o.isCurrent?"#555":"#c8d6e5",
                opacity:o.full&&!o.isCurrent?0.5:1,fontSize:12,marginBottom:2,
                ...(o.isCurrent?{border:"1px solid "+tc+"77"}:{border:"1px solid transparent"})}}>
              <span style={{display:"flex",alignItems:"center",gap:6,fontWeight:o.isCurrent?700:400}}>
                <span style={{display:"inline-block",width:10,height:10,borderRadius:3,background:tc,flexShrink:0}}/>
                단체{o.num} {o.isCurrent?"✓":""}
                {o.teamMates.length>0&&<span style={{fontSize:9,color:"#6b7d94",fontWeight:400}}>({o.teamMates.join(", ")})</span>}
              </span>
              <span style={{fontSize:10,color:o.full&&!o.isCurrent?"#ef4444":"#6b7d94"}}>{o.count}/2{o.full&&!o.isCurrent?" (만석)":""}</span>
            </div>;})}
            <div onClick={()=>changeMixedTeam(curMid,newNum)}
              style={{padding:"6px 10px",borderRadius:5,cursor:"pointer",display:"flex",alignItems:"center",gap:6,

              {/* ── 메달 산정 모달 ── */}
              {showMedalModal&&evPData&&(()=>{
                const{allMembers:mM,allEntries:mE,allTeamEntries:mTE,appMap:mAM}=evPData;
                const memberMap3={};mM.forEach(m=>{memberMap3[m.id]=m;});
                const memberAppMap3={};mM.forEach(m=>{memberAppMap3[m.id]=mAM[m.application_id];});
                const CAT_ORD=["소총","소총(SH2)","권총","산탄총","청각"];
                const catColorMap3={"소총":"#3b82f6","소총(SH2)":"#f59e0b","권총":"#8b5cf6","산탄총":"#10b981","청각":"#ec4899","기타":"#6b7d94"};

                // ── 스타트리스트에서 종목별 고유 참가자 추출 헬퍼 ──
                // 실제 인쇄되는 스타트리스트 기준, name으로 중복 제거
                const getSlPlayers=(evCode)=>{
                  const slKeys=Object.keys(startLists).filter(k=>k===evCode||k.startsWith(evCode+"_"));
                  if(slKeys.length===0) return null; // 스타트리스트 없음
                  const nameMap={}; // name → player object (처음 만난 것만)
                  slKeys.forEach(k=>(startLists[k]||[]).forEach(p=>{
                    if(p.absent) return;

                  }));
                  return Object.values(nameMap);
                };
                // 스타트리스트 없을 때 entries 폴백 (name dedup)
                const getEntryPlayers=(evCode)=>{
                  const nameMap={};
                  mE.filter(e=>e.event_code===evCode).forEach(e=>{
                    const m=memberMap3[e.member_id]; if(!m) return;
                    const nm=(m.name||"").trim();
                    if(nm&&!nameMap[nm]){
                      const app=memberAppMap3[e.member_id];
                      nameMap[nm]={memberId:m.id,name:m.name,subOrg:m.sub_org,orgName:app?.org_name||"-",regionName:app?.region_name||"-"};
                    }

                  return Object.values(nameMap);
                };
                // 스타트리스트 내 단체전 표시된 선수 → 팀 구성 추출

                  const slKeys=Object.keys(startLists).filter(k=>k===evCode||k.startsWith(evCode+"_"));
                  // 스타트리스트에서 _orgNum(단체번호)이 배정된 선수들을 팀별로 그룹
                  const teamMap={}; // teamNum → Set(name)
                  const teamDetail={}; // teamNum → [player, ...]
                  slKeys.forEach(k=>(startLists[k]||[]).forEach(p=>{
                    if(p.absent) return;
                    const tn=p._orgNum||p._inTeam;
                    if(!tn) return;
                    const nm=(p.name||"").trim(); if(!nm) return;
                    if(!teamMap[tn])teamMap[tn]=new Set();
                    if(!teamDetail[tn])teamDetail[tn]=[];
                    if(!teamMap[tn].has(nm)){teamMap[tn].add(nm);teamDetail[tn].push(p);}
                  }));
                  return{teamMap,teamDetail,teamCount:Object.keys(teamMap).length};
                };
                // DB team_entries 기반 팀 구성 (name dedup)
                const getDbTeams=(evCode,teamType)=>{
                  const tes=mTE.filter(t=>t.event_code===evCode&&(teamType?t.team_type===teamType:true)&&memberMap3[t.member_id]);
                  const teamMap={};
                  tes.forEach(t=>{
                    const k=t.application_id+"_"+(t.team_number||1);
                    const m=memberMap3[t.member_id];
                    const nm=(m?.name||"").trim();
                    if(!nm) return;
                    if(!teamMap[k])teamMap[k]={teamNumber:t.team_number||1,appId:t.application_id,names:new Set(),members:[]};
                    if(!teamMap[k].names.has(nm)){teamMap[k].names.add(nm);teamMap[k].members.push(t.member_id);}
                  });
                  return Object.values(teamMap);
                };

                // ── 메달 계산 ──
                const medalRows=[];
                events.forEach(ev=>{
                  const cat=CAT_ORD.includes(ev.category)?ev.category:(ev.category||"기타");
                  const cc=catColorMap3[cat]||"#6b7d94";

                  if(ev.type==="individual"){
                    // (A) 개인전: 스타트리스트 → entries 폴백
                    const slP=getSlPlayers(ev.code);
                    const indCount=slP?slP.length:getEntryPlayers(ev.code).length;
                    const indPlaces=Math.min(indCount,3);
                    if(indPlaces>0){
                      medalRows.push({evCode:ev.code,evName:ev.name,category:cat,color:cc,subType:"개인전",
                        participants:indCount,teams:null,teamSize:null,places:indPlaces,perPlace:1,
                        gold:indPlaces>=1?1:0,silver:indPlaces>=2?1:0,bronze:indPlaces>=3?1:0});
                    }
                    // (B) 단체전: 스타트리스트 내 _orgNum 우선 → DB team_entries 폴백
                    const slT=getSlTeams(ev.code);
                    let teamCount=0,maxSize=0,teamSizes=[];
                    if(slT.teamCount>0){
                      teamCount=slT.teamCount;

                    } else {
                      const dbT=getDbTeams(ev.code,"team");

                      if(teamCount>0){teamSizes=dbT.map(t=>t.names.size);maxSize=Math.max(...teamSizes);}

                      const perPlace=(maxSize>=4&&teamCount>=3)?4:Math.min(maxSize,4);
                      const tPlaces=Math.min(teamCount,3);
                      medalRows.push({evCode:ev.code,evName:ev.name,category:cat,color:cc,subType:"단체전",
                        participants:null,teams:teamCount,teamSize:maxSize,places:tPlaces,perPlace,
                        gold:tPlaces>=1?perPlace:0,silver:tPlaces>=2?perPlace:0,bronze:tPlaces>=3?perPlace:0});
                    }
                  } else if(ev.type==="team"){
                    // 순수 단체전 (PT1 등)
                    const dbT2=getDbTeams(ev.code,null);
                    const teamCount2=dbT2.length;
                    if(teamCount2>0){
                      const teamSizes2=dbT2.map(t=>t.names.size);
                      const maxSize2=Math.max(...teamSizes2);
                      const perPlace2=(maxSize2>=4&&teamCount2>=3)?4:Math.min(maxSize2,4);
                      const tPlaces2=Math.min(teamCount2,3);
                      medalRows.push({evCode:ev.code,evName:ev.name,category:cat,color:cc,subType:"단체전",
                        participants:null,teams:teamCount2,teamSize:maxSize2,places:tPlaces2,perPlace:perPlace2,
                        gold:tPlaces2>=1?perPlace2:0,silver:tPlaces2>=2?perPlace2:0,bronze:tPlaces2>=3?perPlace2:0});
                    }
                  } else if(ev.type==="mixed"){
                    // 혼성팀: 스타트리스트에서 _mixedTeamNum 기준 팀 수
                    const slKeys=Object.keys(startLists).filter(k=>k===ev.code||k.startsWith(ev.code+"_"));
                    let teamCount3=0;
                    if(slKeys.length>0){
                      const teamNums=new Set();
                      slKeys.forEach(k=>(startLists[k]||[]).forEach(p=>{
                        if(!p.absent&&(p._mixedTeamNum||p._orgNum)) teamNums.add(p._mixedTeamNum||p._orgNum);
                      }));
                      teamCount3=teamNums.size;
                    }
                    if(teamCount3===0){
                      const dbT3=getDbTeams(ev.code,null);
                      teamCount3=dbT3.length;
                    }
                    if(teamCount3>0){
                      const mxPlaces=Math.min(teamCount3,3);
                      medalRows.push({evCode:ev.code,evName:ev.name,category:cat,color:cc,subType:"혼성팀",
                        participants:null,teams:teamCount3,teamSize:2,places:mxPlaces,perPlace:2,
                        gold:mxPlaces>=1?2:0,silver:mxPlaces>=2?2:0,bronze:mxPlaces>=3?2:0});
                    }
                  }
                });

                // 카테고리 그룹
                const catGrpMedal={};
                medalRows.forEach(r=>{if(!catGrpMedal[r.category])catGrpMedal[r.category]=[];catGrpMedal[r.category].push(r);});
                const catKeys3=[...CAT_ORD.filter(c=>catGrpMedal[c]),...Object.keys(catGrpMedal).filter(c=>!CAT_ORD.includes(c))];

                // 총합
                const totalGold=medalRows.reduce((s,r)=>s+r.gold,0);
                const totalSilver=medalRows.reduce((s,r)=>s+r.silver,0);
                const totalBronze=medalRows.reduce((s,r)=>s+r.bronze,0);
                const totalAll=totalGold+totalSilver+totalBronze;

                // ── Excel 다운로드 함수 ──
                const downloadMedalExcel=async()=>{
                  const tName=selectedT?.name||"대회";
                  const wb=new ExcelJS.Workbook();wb.creator="KSFD 대회관리시스템";wb.created=new Date();
                  const borderThin={top:{style:"thin",color:{argb:"FFD0D0D0"}},bottom:{style:"thin",color:{argb:"FFD0D0D0"}},left:{style:"thin",color:{argb:"FFD0D0D0"}},right:{style:"thin",color:{argb:"FFD0D0D0"}}};
                  const borderMed={top:{style:"medium",color:{argb:"FF333333"}},bottom:{style:"medium",color:{argb:"FF333333"}},left:{style:"medium",color:{argb:"FF333333"}},right:{style:"medium",color:{argb:"FF333333"}}};
                  const fillHdr={type:"pattern",pattern:"solid",fgColor:{argb:"FF1E3A5F"}};
                  const fillStripe={type:"pattern",pattern:"solid",fgColor:{argb:"FFF8FAFB"}};
                  const fillTitle={type:"pattern",pattern:"solid",fgColor:{argb:"FF0A1929"}};
                  const fillGold={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFCEB"}};
                  const fillSilver={type:"pattern",pattern:"solid",fgColor:{argb:"FFF5F5F5"}};
                  const fillBronze={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFF0E6"}};
                  const fillCatHdr={type:"pattern",pattern:"solid",fgColor:{argb:"FFEEF4FF"}};
                  const fillTotal={type:"pattern",pattern:"solid",fgColor:{argb:"FF0C2D4A"}};
                  const fontHdr={bold:true,size:10,color:{argb:"FFFFFFFF"},name:"맑은 고딕"};
                  const fontBody={size:10,name:"맑은 고딕"};
                  const fontBold={bold:true,size:10,name:"맑은 고딕"};
                  const fontTitle={bold:true,size:14,color:{argb:"FFFFFFFF"},name:"맑은 고딕"};
                  const fontGrand={bold:true,size:11,color:{argb:"FFFFFFFF"},name:"맑은 고딕"};
                  const fontCat={bold:true,size:11,name:"맑은 고딕"};
                  const alignC={horizontal:"center",vertical:"middle"};
                  const alignR={horizontal:"right",vertical:"middle"};
                  const alignL={horizontal:"left",vertical:"middle"};
                  const numFmt="#,##0";

                  const ws=wb.addWorksheet("메달 산정",{properties:{defaultRowHeight:20}});
                  ws.columns=[{width:5},{width:12},{width:36},{width:10},{width:10},{width:10},{width:10},{width:10},{width:10},{width:10},{width:10}];
                  // 제목
                  ws.mergeCells("A1:K1");
                  const r1=ws.getRow(1);r1.height=38;
                  const c1=ws.getCell("A1");c1.value="🏅 "+tName+" 메달 소요 산정";c1.font={...fontTitle,size:16};c1.fill=fillTitle;c1.alignment=alignC;c1.border=borderMed;
                  // 요약

                  c2.font={bold:true,size:11,color:{argb:"FFB8860B"},name:"맑은 고딕"};c2.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFBE6"}};c2.alignment=alignC;c2.border=borderThin;
                  ws.getRow(3).height=6;
                  // 헤더
                  const hdr=["#","종목코드","종목명","유형","참가","팀수","🥇 금","🥈 은","🥉 동","소계","비고"];

                    // 카테고리 헤더
                    ws.mergeCells(ri,1,ri,5);
                    const catRow=ws.getRow(ri);catRow.height=22;
                    const catCell=catRow.getCell(1);catCell.value="■ "+cat;catCell.font=fontCat;catCell.fill=fillCatHdr;catCell.alignment=alignL;catCell.border=borderThin;
                    for(let ci=2;ci<=5;ci++){catRow.getCell(ci).fill=fillCatHdr;catRow.getCell(ci).border=borderThin;}
                    catRow.getCell(6).value=rows.length+"종목";catRow.getCell(6).font={...fontBody,color:{argb:"FF888888"}};catRow.getCell(6).fill=fillCatHdr;catRow.getCell(6).alignment=alignC;catRow.getCell(6).border=borderThin;
                    const catMedalCells=[[7,catG,fillGold],[8,catS,fillSilver],[9,catB,fillBronze]];

                    catRow.getCell(10).value=catG+catS+catB;catRow.getCell(10).font=fontBold;catRow.getCell(10).fill=fillCatHdr;catRow.getCell(10).alignment=alignC;catRow.getCell(10).border=borderThin;catRow.getCell(10).numFmt=numFmt;
                    catRow.getCell(11).fill=fillCatHdr;catRow.getCell(11).border=borderThin;
                    ri++;
                    // 데이터 행
                    rows.forEach((r,idx)=>{

                      const sf=isStripe?fillStripe:null;
                      const note=r.subType==="개인전"?(r.participants+"명 참가"):r.subType==="단체전"?(r.teams+"팀 (최대"+r.teamSize+"인)"):(r.teams+"팀 (2인1조)");
                      const vals=[idx+1,r.evCode,r.evName,r.subType,r.participants||"",r.teams||"",r.gold,r.silver,r.bronze,r.gold+r.silver+r.bronze,note];
                      vals.forEach((v,ci)=>{
                        const cell=row.getCell(ci+1);cell.value=v;
                        cell.font=ci===1?{...fontBold,color:{argb:"FF1E3A5F"}}:ci>=6&&ci<=9?fontBold:fontBody;
                        cell.alignment=ci<=2||ci===10?alignL:alignC;
                        if(ci===6)cell.fill=fillGold; else if(ci===7)cell.fill=fillSilver; else if(ci===8)cell.fill=fillBronze; else if(sf)cell.fill=sf;
                        cell.border=borderThin;
                        if(ci>=4&&ci<=9&&typeof v==="number")cell.numFmt=numFmt;

                  ws.mergeCells(ri,1,ri,6);
                  const tLabel=tRow.getCell(1);tLabel.value="합   계";tLabel.font=fontGrand;tLabel.fill=fillTotal;tLabel.alignment=alignC;tLabel.border=borderMed;

                      <button onClick={()=>{

                        const rows=medalRows.map(r=>{
                          const note=r.subType==="개인전"?r.participants+"명":r.subType==="단체전"?r.teams+"팀("+r.teamSize+"인)":r.teams+"팀(2인)";

            const evCountMap={};{const _seen=new Set();allEntries.filter(e=>!!memberMap[e.member_id]).forEach(e=>{const k=e.member_id+"_"+e.event_code;if(_seen.has(k))return;_seen.add(k);evCountMap[e.event_code]=(evCountMap[e.event_code]||0)+1;});}
            {const _seen=new Set();const tmc={};allTeamEntries.filter(t=>!!memberMap[t.member_id]).forEach(t=>{const k=t.member_id+"_"+t.event_code+"_"+t.slot_order;if(_seen.has(k))return;_seen.add(k);tmc[t.event_code]=(tmc[t.event_code]||0)+1;});Object.keys(tmc).forEach(ec=>{const ev=events.find(e=>e.code===ec);if(ev&&(ev.type==="mixed"||ev.type==="team")){evCountMap[ec]=(evCountMap[ec]||0)+Math.floor(tmc[ec]/(ev?.team_size||2));}});}

            // ── 세션 추출 (사대배정 기반) ──
            const sessions=[];
            Object.keys(laneAssign).forEach(dayKey=>{
              const da=laneAssign[dayKey]||{};
              Object.keys(da).forEach(k=>{
                const a=da[k],p=evKeyParse(k);
                if(a&&a.lanes&&a.lanes.length>0){
                  const sessionKey=p.evCode+"_"+a.relay;
                  if(!sessions.find(s=>s.key===sessionKey)){
                    const ev=events.find(e=>e.code===p.evCode);
                    sessions.push({key:sessionKey,evCode:p.evCode,relay:a.relay,laneDay:Number(dayKey),laneCount:a.lanes.length,evName:ev?.name||p.evCode,category:evToCategory(p.evCode)});
                  }
                }
              });
            });
            // ── 사대배정 없지만 참가자가 있는 종목도 추가 ──
            const sessionEvCodes=new Set(sessions.map(s=>s.evCode));
            events.forEach(ev=>{
              if(!sessionEvCodes.has(ev.code)&&(evCountMap[ev.code]||0)>0){
                sessions.push({key:ev.code,evCode:ev.code,relay:0,laneDay:0,laneCount:0,evName:ev.name||ev.code,category:evToCategory(ev.code),virtual:true});
              }
            });
            sessions.sort((a,b)=>a.evCode.localeCompare(b.evCode)||(a.relay-b.relay));

            // ── 현재 선택된 세션 ──
            const selSession=selectedEvCode?sessions.find(s=>s.key===selectedEvCode):null;
            // selEvCode: 세션에서 파생하거나, selectedEvCode 자체가 종목코드일 수 있음
            const selEvCode=selSession?.evCode||(selectedEvCode&&events.find(e=>e.code===selectedEvCode)?selectedEvCode:null);
            const selRelay=selSession?.relay||1;

            // ── 해당 종목 참가자 ──
            const selEvObj=selEvCode?events.find(e=>e.code===selEvCode):null;
            const selIsMixed=selEvObj&&selEvObj.type==="mixed";
            let participants=[];
            if(selIsMixed){
              // ── 혼성팀: 개인 단위로 나열, mixedTeamOverrides로 팀 배정 ──
              const teamEntries=allTeamEntries.filter(t=>t.event_code===selEvCode);
              const mixedOv=(selEvCode&&mixedTeamOverrides[selEvCode])||{};
              // 기본 팀번호: team_entries의 (application_id, team_number) 그룹 → 순차 번호
              const defaultTeamMap={}; // memberId → defaultTeamNum
              const groupKey2Num={};let gSeq=0;
              teamEntries.forEach(t=>{
                const gk=t.application_id+"_"+(t.team_number||1);
                if(groupKey2Num[gk]===undefined){gSeq++;groupKey2Num[gk]=gSeq;}
                defaultTeamMap[t.member_id]=groupKey2Num[gk];
              });
              const individuals=[];
              const seen=new Set();
              teamEntries.forEach(t=>{
                if(seen.has(t.member_id)) return; seen.add(t.member_id);
                const m=memberMap[t.member_id]; const app=memberAppMap[t.member_id];
                if(!m) return;
                const ov=mixedOv[String(t.member_id)];
                const teamNum=ov!==undefined?ov:(defaultTeamMap[t.member_id]||1);
                individuals.push({memberId:m.id,name:m.name,subOrg:m.sub_org,orgName:app?.org_name||"-",regionName:app?.region_name||"-",
                  appId:t.application_id,_mixedTeamNum:teamNum,slotOrder:t.slot_order||0});
              });
              participants=individuals;
            } else {
              const entries=selEvCode?allEntries.filter(e=>e.event_code===selEvCode):[];
              participants=entries.map(e=>{
                const m=memberMap[e.member_id]; const app=memberAppMap[e.member_id];
                return m?{memberId:m.id,name:m.name,subOrg:m.sub_org,orgName:app?.org_name||"-",regionName:app?.region_name||"-"}:null;
              }).filter(Boolean);
            }
            // 참가 인원/팀 수 (UI 표시용)
            const mixedTeamSet=selIsMixed?new Set(participants.filter(p=>p._mixedTeamNum).map(p=>p._mixedTeamNum)):new Set();
            const participantCount=selIsMixed?mixedTeamSet.size+"팀 "+participants.length+"명":participants.length+"명";
            const regionOrder=["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
            const sorted=[...participants].sort((a,b)=>{
              if(selIsMixed) return (a._mixedTeamNum||999)-(b._mixedTeamNum||999)||(a.slotOrder||0)-(b.slotOrder||0);
              const ai=regionOrder.indexOf(a.regionName),bi=regionOrder.indexOf(b.regionName);return (ai===-1?99:ai)-(bi===-1?99:bi);
            });
            // orgNumMap: team_entries에서 event_code=현재종목 + team_type='team'인 행으로 단체전 참가자 조회
            const orgNumMap={};
            const evOverrides=(selEvCode&&orgNumOverrides[selEvCode])||{};
            let flatParticipants=sorted;

            // ── team_entries 기반 단체번호 매핑 (참가현황 + 스타트리스트 공통) ──
            const memberToTeamNum={};
            if(!selIsMixed){
              const evTeamEntries=allTeamEntries.filter(t=>
                t.event_code===selEvCode && t.team_type==="team" && memberMap[t.member_id]
              );
              const teamByApp={};
              evTeamEntries.forEach(te=>{
                const app=memberAppMap[te.member_id];
                const k=(te.application_id||"?")+"_"+(te.team_number||1);
                if(!teamByApp[k]) teamByApp[k]={appId:te.application_id,teamNumber:te.team_number||1,orgName:app?.org_name||"-",regionName:app?.region_name||"-",members:new Set()};
                teamByApp[k].members.add(te.member_id);
              });
              const teamList=Object.values(teamByApp);
              teamList.sort((a,b)=>{const ai=regionOrder.indexOf(a.regionName),bi=regionOrder.indexOf(b.regionName);return (ai===-1?99:ai)-(bi===-1?99:bi)||(a.teamNumber-b.teamNumber);});
              teamList.forEach((t,i)=>{t.members.forEach(mid=>{memberToTeamNum[mid]=i+1;});});
            }

            // ── 단체번호 헬퍼 (memberId만으로 조회 — 참가현황·스타트리스트 공통 유일 소스) ──
            const getTeamNumById=(memberId)=>{
              if(selIsMixed) return null;
              const ov=evOverrides[String(memberId)];
              if(ov!==undefined) return ov;
              return memberToTeamNum[memberId]||null;
            };
            // ── name+subOrg → 현재 memberId 매핑 (스타트리스트 stale ID 해결용) ──
            const nameOrgToCurrentMid={};
            sorted.forEach(p=>{nameOrgToCurrentMid[p.name+"||"+(p.subOrg||"")]=p.memberId;});
            const resolveCurrentMemberId=(p)=>nameOrgToCurrentMid[p.name+"||"+(p.subOrg||"")]||p.memberId;

            if(selIsMixed){
              sorted.forEach(p=>{p._orgNum=p._mixedTeamNum;p._inTeam=!!p._mixedTeamNum;});
              flatParticipants=sorted;
            } else {
              // sorted에 단체전 참가 정보 반영
              sorted.forEach(p=>{
                const tn=getTeamNumById(p.memberId);
                if(tn!==null){p._orgNum=tn;p._inTeam=true;}
                else{p._orgNum=null;p._inTeam=false;}
              });
              sorted.filter(p=>p._inTeam).forEach(p=>{if(!orgNumMap[p.orgName])orgNumMap[p.orgName]=p._orgNum;});
            }

            // ── 단체번호 헬퍼 (참가현황·스타트리스트 공통 — stale memberId 자동 해결) ──
            const getEffectiveOrgNum=(p)=>{
              if(selIsMixed) return p._mixedTeamNum||null;
              let result=getTeamNumById(p.memberId);
              if(result===null){
                // stale memberId fallback: name+subOrg으로 현재 memberId 찾아서 재시도
                const curMid=nameOrgToCurrentMid[p.name+"||"+(p.subOrg||"")];
                if(curMid&&curMid!==p.memberId) result=getTeamNumById(curMid);
              }
              return result;
            };
            // 현재 종목의 모든 단체번호와 인원수 계산 (혼성팀: 팀번호별 인원)
            const getMixedTeamCounts=()=>{
              const counts={};
              sorted.forEach(p=>{const tn=p._mixedTeamNum;if(tn)counts[tn]=(counts[tn]||0)+1;});
              return counts;
            };
            const getTeamCounts=()=>{
              if(selIsMixed) return getMixedTeamCounts();
              const counts={};
              const allP=flatParticipants;
              allP.forEach(p=>{
                const num=getEffectiveOrgNum(p);
                if(num) counts[num]=(counts[num]||0)+1;
              });
              return counts;
            };
            const teamCounts=selEvCode?getTeamCounts():{};
            const maxTeamNum=Object.keys(teamCounts).length>0?Math.max(...Object.keys(teamCounts).map(Number)):0;
            // ── 혼성팀 팀 뱃지 렌더 ──
            const renderMixedTeamBadge=(p,extraStyle)=>{
              const mid=p.memberId;
              const curNum=p._mixedTeamNum||null;
              const openDd=(e)=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();setMixedTeamDD(dd=>dd&&dd.memberId===mid?null:{memberId:mid,evCode:selEvCode,rect:{top:r.bottom,left:r.left,bottom:r.top,vpHeight:window.innerHeight},currentNum:curNum});};
              if(!curNum) return <span onClick={openDd}
                style={{fontSize:10,color:"#556",padding:"2px 8px",borderRadius:4,border:"1px dashed #334",cursor:"pointer",userSelect:"none",...(extraStyle||{})}}>
                미배정 ▾
              </span>;
              const tc=getTeamColor(curNum);
              return <span onClick={openDd}
                style={{...S.badge(tc),fontWeight:700,cursor:"pointer",userSelect:"none",position:"relative",color:"#fff",textShadow:"0 1px 2px rgba(0,0,0,.5)",...(extraStyle||{})}}>
                단체{curNum} ▾
              </span>;
            };
            // 드롭다운 렌더 (개인전 단체번호용)
            const renderTeamBadge=(p,orgNum,extraStyle)=>{
              const mid=p.memberId;
              const openDd=(e)=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();setTeamDropdown(td=>td&&td.memberId===mid?null:{memberId:mid,evCode:selEvCode,rect:{top:r.bottom,left:r.left,bottom:r.top,vpHeight:window.innerHeight},currentNum:orgNum||null});};
              if(!orgNum && orgNum!==0) return <span onClick={openDd}
                style={{fontSize:10,color:"#556",padding:"2px 8px",borderRadius:4,border:"1px dashed #334",cursor:"pointer",userSelect:"none",...(extraStyle||{})}}>
                해당없음 ▾
              </span>;
              const tc=getTeamColor(orgNum);
              return <span onClick={openDd}
                style={{...S.badge(tc),fontWeight:700,cursor:"pointer",userSelect:"none",position:"relative",color:"#fff",textShadow:"0 1px 2px rgba(0,0,0,.5)",...(extraStyle||{})}}>
                단체{orgNum} ▾
              </span>;
            };

            // ── 같은 종목의 모든 세션 (릴레이 순) ──
            const sibSessions=selEvCode?sessions.filter(s=>s.evCode===selEvCode).sort((a,b)=>a.relay-b.relay):[];
            const curStartList=selectedEvCode?startLists[selectedEvCode]||null:null;

            // ── 사대 정보 조회 (선택된 세션의 릴레이) ──
            const getSessionLanes=(sKey)=>{
              const s=sessions.find(x=>x.key===sKey);if(!s) return [];
              const lanes=[];
              Object.keys(laneAssign).forEach(dayKey=>{
                const da=laneAssign[dayKey]||{};
                Object.keys(da).forEach(k=>{
                  const a=da[k],p=evKeyParse(k);
                  if(p.evCode===s.evCode&&a&&a.relay===s.relay&&a.lanes) a.lanes.forEach(ln=>lanes.push(ln));
                });
              });
              return lanes.sort((a,b)=>a-b);
            };

            // ── 종목 날짜/시간 조회 ──
            const getEvSchedInfo=(evCode)=>{
              let dayNum=null, time=null;
              schedData.forEach(d=>{d.rows.forEach(r=>{if(r.type==="prelim"&&r.event_code===evCode){dayNum=d.day;if(r.time)time=r.time;}});});
              const startDate=selectedT?.start_date;
              let dateStr="X월 X일";
              if(dayNum&&startDate){const dt=new Date(startDate);dt.setDate(dt.getDate()+dayNum-1);dateStr=(dt.getMonth()+1)+"월 "+dt.getDate()+"일";}
              return {dayNum, dateStr, time:time||(evToCategory(evCode)==="25M"?"00:00 / 00:00":"00:00-00:00")};
            };

            // ── 조 배정 관련 (세션 수 = 조 수) ──
            const totalRelays=sibSessions.length;
            const evRelayMap=selEvCode?(relayAssign[selEvCode]||{}):{};

            // ── 세션 단위 스타트리스트 생성 (전체 릴레이 한번에) ──
            const generateSessionStartLists=()=>{
              if(!selEvCode||sibSessions.length===0) return;
              // 해당 종목의 이전 고아 세션 키 정리 (조 수 변경 시 남은 잔여 데이터 제거)
              const validKeys=new Set(sibSessions.map(ss=>ss.key));
              const orphanKeys=Object.keys(startLists).filter(k=>k.startsWith(selEvCode+"_")&&!validKeys.has(k));
              // ── 산탄총: 전 참가자가 모든 일차(릴레이)에 동일하게 참가 ──
              if(isShotgunEv(selEvCode)){
                const shuffled=buildStartList(sorted,orgNumMap);
                const newSL={...startLists};
                orphanKeys.forEach(k=>{delete newSL[k];});
                sibSessions.forEach(ss=>{
                  const lanes=getSessionLanes(ss.key);
                  newSL[ss.key]=shuffled.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));
                });
                setStartLists(newSL);
                setSlSavedKeys(prev=>{const next=new Set(prev);sibSessions.forEach(ss=>next.delete(ss.key));return next;});
                flash(selEvCode+" 산탄총 스타트리스트 생성 완료 ("+shuffled.length+"명 × "+sibSessions.length+"일차)");
                dbSave("startlists",newSL);
                const savedKeys=sibSessions.map(ss=>ss.key);
                syncStartlistSessions(newSL,savedKeys);
                setSlSavedKeys(prev=>{const next=new Set(prev);savedKeys.forEach(k=>next.add(k));return next;});
                return;
              }
              const hasRelayMap=totalRelays>1&&Object.keys(evRelayMap).length>0;
              // 조 배정이 있으면 조별 분배, 없으면 기존 방식 (순차 분할)
              if(hasRelayMap){
                // ── 조 배정 기반 분배 ──
                const newSL={...startLists};
                orphanKeys.forEach(k=>{delete newSL[k];});
                let totalGenerated=0;
                sibSessions.forEach(ss=>{
                  const lanes=getSessionLanes(ss.key);
                  const relayNum=ss.relay;
                  // 해당 조에 배정된 참가자만 필터
                  let relayParticipants;
                  if(selIsMixed){
                    relayParticipants=sorted.filter(p=>{const ra=evRelayMap[String(p.memberId)];return ra===relayNum;});
                  } else {
                    relayParticipants=sorted.filter(p=>{const ra=evRelayMap[String(p.memberId)];return ra===relayNum;});
                  }
                  if(relayParticipants.length===0){newSL[ss.key]=[];return;}
                  const relayOrgMap={};relayParticipants.forEach(p=>{if(!relayOrgMap[p.orgName])relayOrgMap[p.orgName]=getEffectiveOrgNum(p);});
                  if(selIsMixed){
                    // 혼성팀: 팀번호별 그룹 → 팀 단위로 셔플 → 개인 행
                    const teamGroups={};
                    relayParticipants.forEach(p=>{const tn=p._mixedTeamNum||0;if(!teamGroups[tn])teamGroups[tn]=[];teamGroups[tn].push(p);});
                    const teamProxies=Object.entries(teamGroups).filter(([tn])=>Number(tn)>0).map(([tn,members])=>({
                      ...members[0],_team:members,_orgNum:Number(tn),_mixedTeamNum:Number(tn)
                    }));
                    const shuffled=buildStartList(teamProxies,relayOrgMap);
                    const rows=[];
                    shuffled.forEach((tp,ti)=>{
                      const tn=tp._mixedTeamNum;
                      const team=tp._team||[tp];
                      const lane1=lanes[ti*2]?ss.relay+"-"+lanes[ti*2]:null;
                      const lane2=lanes[ti*2+1]?ss.relay+"-"+lanes[ti*2+1]:null;
                      team.forEach((m,mi)=>{
                        rows.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,
                          lane:mi===0?lane1:lane2,absent:false,remark:"",_teamIdx:ti,_orgNum:tn,_mixedTeamNum:tn});
                      });
                    });
                    newSL[ss.key]=rows;
                    totalGenerated+=rows.length;
                  } else {
                    const shuffled=buildStartList(relayParticipants,relayOrgMap);
                    newSL[ss.key]=shuffled.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));
                    // 사대보다 인원이 많으면 남은 인원도 추가 (lane=null)
                    if(shuffled.length>lanes.length){
                      const extra=shuffled.slice(lanes.length).map(p=>({...p,lane:null,absent:false,remark:""}));
                      newSL[ss.key]=[...newSL[ss.key].slice(0,lanes.length),...extra];
                    }
                    totalGenerated+=shuffled.length;
                  }
                });
                setStartLists(newSL);
                setSlSavedKeys(prev=>{const next=new Set(prev);sibSessions.forEach(ss=>next.delete(ss.key));return next;});
                flash(selEvCode+" 조 배정 기반 스타트리스트 생성 완료 ("+totalGenerated+"명 → "+sibSessions.length+"개 세션)");
                dbSave("startlists",newSL);
                const savedKeys=sibSessions.map(ss=>ss.key);
                syncStartlistSessions(newSL,savedKeys);
                setSlSavedKeys(prev=>{const next=new Set(prev);savedKeys.forEach(k=>next.add(k));return next;});
                return;
              }
              // ── 기존 방식: 순차 분할 ──
              if(selIsMixed){
                // 혼성팀: 팀번호별 그룹 → 팀 단위 셔플 → 개인 행으로 펼침
                const teamGroups={};
                sorted.forEach(p=>{const tn=p._mixedTeamNum||0;if(!teamGroups[tn])teamGroups[tn]=[];teamGroups[tn].push(p);});
                const teamProxies=Object.entries(teamGroups).filter(([tn])=>Number(tn)>0).map(([tn,members])=>({
                  ...members[0],_team:members,_orgNum:Number(tn),_mixedTeamNum:Number(tn)
                }));
                const shuffledTeams=buildStartList(teamProxies,orgNumMap);
                let offset=0;
                const newSL={...startLists};
                orphanKeys.forEach(k=>{delete newSL[k];});
                sibSessions.forEach(ss=>{
                  const lanes=getSessionLanes(ss.key);
                  const teamSlots=Math.floor(lanes.length/2);
                  const chunk=shuffledTeams.slice(offset,offset+teamSlots);
                  const rows=[];
                  chunk.forEach((teamProxy,ti)=>{
                    const team=teamProxy._team||[teamProxy];
                    const lane1=lanes[ti*2]?ss.relay+"-"+lanes[ti*2]:null;
                    const lane2=lanes[ti*2+1]?ss.relay+"-"+lanes[ti*2+1]:null;
                    const tn=teamProxy._mixedTeamNum||(offset+ti+1);
                    team.forEach((m,mi)=>{
                      rows.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,
                        lane:mi===0?lane1:lane2,absent:false,remark:"",_teamIdx:ti,_orgNum:tn,_mixedTeamNum:tn});
                    });
                  });
                  newSL[ss.key]=rows;
                  offset+=teamSlots;
                });
                // 남은 팀
                if(offset<shuffledTeams.length&&sibSessions.length>0){
                  const lastKey=sibSessions[sibSessions.length-1].key;
                  const remaining=[];
                  shuffledTeams.slice(offset).forEach(tp=>{
                    const tn=tp._mixedTeamNum||0;
                    (tp._team||[tp]).forEach(m=>{
                      remaining.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,lane:null,absent:false,remark:"",_orgNum:tn,_mixedTeamNum:tn});
                    });
                  });
                  newSL[lastKey]=[...newSL[lastKey],...remaining];
                }
                setStartLists(newSL);
                setSlSavedKeys(prev=>{const next=new Set(prev);sibSessions.forEach(ss=>next.delete(ss.key));return next;});
                const totalMembers=shuffledTeams.reduce((s,t)=>(t._team?s+t._team.length:s+1),0);
                flash(selEvCode+" 혼성팀 스타트리스트 생성 완료 ("+shuffledTeams.length+"팀 "+totalMembers+"명 → "+sibSessions.length+"개 세션)");
                // DB 자동 저장
                dbSave("startlists",newSL);
                const savedKeys=sibSessions.map(ss=>ss.key);
                syncStartlistSessions(newSL,savedKeys);
                setSlSavedKeys(prev=>{const next=new Set(prev);savedKeys.forEach(k=>next.add(k));return next;});
              } else {
                const shuffled=buildStartList(sorted,orgNumMap);
                let offset=0;
                const newSL={...startLists};
                orphanKeys.forEach(k=>{delete newSL[k];});

                  const lanes=getSessionLanes(ss.key);
                  const count=lanes.length;
                  const chunk=shuffled.slice(offset,offset+count);
                  newSL[ss.key]=chunk.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));
                  offset+=count;
                });
                // 남은 인원 (사대보다 참가자가 많은 경우) → 마지막 세션에 추가
                if(offset<shuffled.length&&sibSessions.length>0){
                  const lastKey=sibSessions[sibSessions.length-1].key;
                  const remaining=shuffled.slice(offset).map(p=>({...p,lane:null,absent:false,remark:""}));
                  newSL[lastKey]=[...newSL[lastKey],...remaining];
                }
                setStartLists(newSL);
                setSlSavedKeys(prev=>{const next=new Set(prev);sibSessions.forEach(ss=>next.delete(ss.key));return next;});

                setSlSavedKeys(prev=>{const next=new Set(prev);savedKeys.forEach(k=>next.add(k));return next;});

            // ── 스타트리스트 테이블 ──
            const renderStartTable=(list)=>{

                  {isDragging

                    : <>✏️ 편집모드 — 행을 드래그하여 순서를 변경하세요 (사대번호 고정, 인물정보만 이동)</>
                  }
                </div>}
                <div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                  {["#","사대","이름","소속","단체번호","비고",""].map((h,hi)=><th key={h+hi} style={{...S.th,...(hi<=1&&slEditMode?{background:"#0a1220",borderRight:hi===1?"2px solid #334466":"none"}:{})}}>{h}</th>)}
                </tr></thead><tbody>
                  {list.map((p,i)=>{
                    const isAbsent=p.absent;
                    if(!isAbsent) seq++;

                      onDragOver:e=>{if(isDragging&&!isAbsent){e.preventDefault();e.dataTransfer.dropEffect="move";setSlDragOver(i);}},

                      {/* 드롭 위치 인디케이터: 위쪽 */}

                      <tr data-slrow={i} {...dragProps}

                        <td style={S.td}>{p.remark||""}</td>

                            ? (!isAbsent&&<span style={{fontSize:13,cursor:"grab",userSelect:"none",color:"#667788"}}>☰</span>)

            const catClr=(c)=>({"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"}[c]||C.dim);

            // ── 모든 세션 스타트리스트 일괄 생성 ──
            const generateAllStartLists=()=>{
              const evCodeSet=new Set(sessions.map(s=>s.evCode));
              const newSL={...startLists};
              let totalPlayers=0, totalSessions=0;
              evCodeSet.forEach(evCode=>{
                const evSessions=sessions.filter(s=>s.evCode===evCode).sort((a,b)=>a.relay-b.relay);
                const evObj=events.find(e=>e.code===evCode);
                const isMx=evObj&&evObj.type==="mixed";
                let evParticipants=[];
                if(isMx){
                  // 혼성팀: 개인 단위 + mixedTeamOverrides
                  const mixedOv=(mixedTeamOverrides[evCode])||{};
                  const defaultTMAll={};const gk2nAll={};let gsAll=0;
                  allTeamEntries.filter(t=>t.event_code===evCode).forEach(t=>{
                    const gk=t.application_id+"_"+(t.team_number||1);
                    if(gk2nAll[gk]===undefined){gsAll++;gk2nAll[gk]=gsAll;}
                    defaultTMAll[t.member_id]=gk2nAll[gk];
                  });
                  const seen=new Set();
                  allTeamEntries.filter(t=>t.event_code===evCode).forEach(t=>{
                    if(seen.has(t.member_id))return;seen.add(t.member_id);
                    const m=memberMap[t.member_id];const app=memberAppMap[t.member_id];
                    if(!m) return;
                    const ov=mixedOv[String(t.member_id)];
                    const teamNum=ov!==undefined?ov:(defaultTMAll[t.member_id]||1);
                    evParticipants.push({memberId:m.id,name:m.name,subOrg:m.sub_org,orgName:app?.org_name||"-",regionName:app?.region_name||"-",_mixedTeamNum:teamNum});
                  });
                } else {
                  const evEntries=allEntries.filter(e=>e.event_code===evCode);
                  evParticipants=evEntries.map(e=>{const m=memberMap[e.member_id];const app=memberAppMap[e.member_id];return m?{memberId:m.id,name:m.name,subOrg:m.sub_org,orgName:app?.org_name||"-",regionName:app?.region_name||"-"}:null;}).filter(Boolean);
                }
                if(evParticipants.length===0) return;
                const evSorted=[...evParticipants].sort((a,b)=>{
                  if(isMx) return (a._mixedTeamNum||999)-(b._mixedTeamNum||999);
                  const ai=regionOrder.indexOf(a.regionName),bi=regionOrder.indexOf(b.regionName);return (ai===-1?99:ai)-(bi===-1?99:bi);
                });
                // team_entries 기반 단체번호 (참가자 목록과 동일 로직)
                const evTE=allTeamEntries.filter(t=>t.event_code===evCode&&t.team_type==="team"&&memberMap[t.member_id]);
                const teamByAppSL={};
                evTE.forEach(te=>{
                  const app=memberAppMap[te.member_id];
                  const k=(te.application_id||"?")+"_"+(te.team_number||1);
                  if(!teamByAppSL[k]) teamByAppSL[k]={regionName:app?.region_name||"-",teamNumber:te.team_number||1,members:new Set()};
                  teamByAppSL[k].members.add(te.member_id);
                });
                const teamListSL=Object.values(teamByAppSL);
                teamListSL.sort((a,b)=>{const ai=regionOrder.indexOf(a.regionName),bi=regionOrder.indexOf(b.regionName);return(ai===-1?99:ai)-(bi===-1?99:bi)||(a.teamNumber-b.teamNumber);});
                const memberToTeamNumSL={};
                teamListSL.forEach((t,i)=>{t.members.forEach(mid=>{memberToTeamNumSL[mid]=i+1;});});
                // fallback: team_entries에 없는 참가자는 orgName 기반 번호
                const evOrgOrder=[]; evSorted.forEach(p=>{if(!evOrgOrder.includes(p.orgName))evOrgOrder.push(p.orgName);});
                const evOrgNumMap={}; evOrgOrder.forEach((org,i)=>{evOrgNumMap[org]=i+1;});
                if(!isMx) evSorted.forEach(p=>{const ov2=(orgNumOverrides[evCode]||{})[String(p.memberId)];if(ov2!==undefined)p._orgNum=ov2;else if(memberToTeamNumSL[p.memberId])p._orgNum=memberToTeamNumSL[p.memberId];else if(!p._orgNum)p._orgNum=evOrgNumMap[p.orgName];});
                // 혼성팀: 팀번호별 그룹 → 팀 프록시
                const buildMixedProxies=(pList)=>{
                  const tg={};pList.forEach(p=>{const tn=p._mixedTeamNum||0;if(tn>0){if(!tg[tn])tg[tn]=[];tg[tn].push(p);}});
                  return Object.entries(tg).map(([tn,members])=>({...members[0],_team:members,_orgNum:Number(tn),_mixedTeamNum:Number(tn)}));
                };
                // ── 조 배정 확인 ──
                const evRA=relayAssign[evCode]||{};
                const hasRA=evSessions.length>1&&Object.keys(evRA).length>0;
                if(hasRA){
                  evSessions.forEach(ss=>{
                    const lanes=getSessionLanes(ss.key);
                    const relayNum=ss.relay;
                    const relayP=evSorted.filter(p=>{const ra=evRA[String(p.memberId)];return ra===relayNum;});
                    if(relayP.length===0){newSL[ss.key]=[];totalSessions++;return;}
                    const rOrgMap={};relayP.forEach(p=>{if(!rOrgMap[p.orgName])rOrgMap[p.orgName]=p._orgNum||evOrgNumMap[p.orgName]||1;});
                    if(isMx){
                      const proxies=buildMixedProxies(relayP);
                      const shuffled=buildStartList(proxies,rOrgMap);
                      const rows=[];
                      shuffled.forEach((tp,ti)=>{const tn=tp._mixedTeamNum||1;const team=tp._team||[tp];const ln1=lanes[ti*2]?ss.relay+"-"+lanes[ti*2]:null;const ln2=lanes[ti*2+1]?ss.relay+"-"+lanes[ti*2+1]:null;team.forEach((m,mi)=>{rows.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,lane:mi===0?ln1:ln2,absent:false,remark:"",_teamIdx:ti,_orgNum:tn,_mixedTeamNum:tn});});});
                      newSL[ss.key]=rows;totalPlayers+=rows.length;
                    } else {
                      const shuffled=buildStartList(relayP,rOrgMap);
                      newSL[ss.key]=shuffled.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));
                      if(shuffled.length>lanes.length){const extra=shuffled.slice(lanes.length).map(p=>({...p,lane:null,absent:false,remark:""}));newSL[ss.key]=[...newSL[ss.key].slice(0,lanes.length),...extra];}
                      totalPlayers+=shuffled.length;
                    }
                    totalSessions++;
                  });

            const evCountMap={};
            if(evPData&&evPData.allEntries){
              const _mSet=new Set((evPData.allMembers||[]).map(m=>m.id));

            const updSched=(fn)=>{const nd=JSON.parse(JSON.stringify(schedData));fn(nd);setSchedData(nd);};
            const addRow=(dayIdx,overrides={})=>updSched(nd=>{nd[dayIdx].rows.push(newSchedRow(overrides));});
            const removeRow=(dayIdx,rowIdx)=>updSched(nd=>{
              const removed=nd[dayIdx].rows.splice(rowIdx,1)[0];

            });
            const updateRow=(dayIdx,rowIdx,key,val)=>updSched(nd=>{nd[dayIdx].rows[rowIdx][key]=val;});
            const moveRow=(dayIdx,rowIdx,dir)=>updSched(nd=>{
              const rows=nd[dayIdx].rows;const ni=rowIdx+dir;
              if(ni<0||ni>=rows.length) return;
              [rows[rowIdx],rows[ni]]=[rows[ni],rows[rowIdx]];
            });
            // 행 드래그앤드롭 리오더
            const dropRow=(fromDayIdx,fromRowIdx,toDayIdx,toRowIdx)=>{
              updSched(nd=>{
                if(fromDayIdx===toDayIdx){
                  const rows=nd[fromDayIdx].rows;
                  const [moved]=rows.splice(fromRowIdx,1);
                  const insertAt=toRowIdx>fromRowIdx?toRowIdx-1:toRowIdx;
                  rows.splice(insertAt,0,moved);
                } else {
                  const [moved]=nd[fromDayIdx].rows.splice(fromRowIdx,1);
                  nd[toDayIdx].rows.splice(toRowIdx,0,moved);
                }
              });
              setSchedRowDrag(null); setSchedRowOver(null);
            };
            const addPETAuto=(nd,dayIdx,eventCode,relay)=>{
              if(dayIdx<=0) return;
              const prev=nd[dayIdx-1];
              const petKey=eventCode+"_"+relay;
              if(prev.rows.some(r=>r.event_code===eventCode&&r.type==="pet"&&r.relay==String(relay))) return;
              prev.rows.push(newSchedRow({category:evToCategory(eventCode),content:"공식 훈련 ("+eventCode+" "+schedLabel(eventCode,relay)+")",event_code:eventCode,type:"pet",relay:String(relay)}));
            };
            const removePETAuto=(nd,dayIdx,eventCode,relay)=>{
              if(dayIdx<=0) return;
              nd[dayIdx-1].rows=nd[dayIdx-1].rows.filter(r=>!(r.event_code===eventCode&&r.type==="pet"&&r.relay==String(relay)));
            };
            const assignSlot=(dayIdx,rowIdx,slotKey)=>updSched(nd=>{
              const[evCode,relayStr]=slotKey.split("_");
              const relay=relayStr||"1";
              // 같은 종목의 다른 조가 다른 일차에 있는지 확인
              let otherDayIdx=null;
              nd.forEach((d,di)=>{if(di!==dayIdx) d.rows.forEach(r=>{if(r.event_code===evCode&&r.type==="prelim"){otherDayIdx=di;}});});
              if(otherDayIdx!==null&&!isShotgunEv(evCode)){flash(evCode+" "+relay+"조: 같은 종목의 모든 조는 동일 일차에 배치해야 합니다 (현재 "+(otherDayIdx+1)+"일차에 배치됨)","error");return;}
              const row=nd[dayIdx].rows[rowIdx];
              if(row.event_code&&row.type==="prelim") removePETAuto(nd,dayIdx,row.event_code,row.relay||"1");
              const ev=events.find(e=>e.code===evCode);
              row.event_code=evCode;row.type="prelim";row.relay=relay;
              row.category=evToCategory(evCode);const evNm=ev?ev.name:"";row.content=(evNm.startsWith(evCode)?evNm:evCode+" "+evNm)+" "+schedLabel(evCode,relay);
              addPETAuto(nd,dayIdx,evCode,relay);
            });
            const clearEv=(dayIdx,rowIdx)=>updSched(nd=>{
              const row=nd[dayIdx].rows[rowIdx];
              if(row.event_code&&row.type==="prelim") removePETAuto(nd,dayIdx,row.event_code,row.relay||"1");
              row.event_code="";row.type="custom";row.content="";row.category="";row.relay="";
            });
            const catClr=(c)=>({"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"}[c]||C.dim);
            const evClr=(code)=>catClr(evToCategory(code));
            // 구분 rowSpan 계산
            const calcSpans=(rows)=>{
              const spans=new Array(rows.length).fill(1);const sk=new Set();
              for(let i=0;i<rows.length;i++){
                if(sk.has(i)||!rows[i].category) continue;
                let cnt=1;
                while(i+cnt<rows.length&&rows[i+cnt].category===rows[i].category){sk.add(i+cnt);cnt++;}
                spans[i]=cnt;
              }
              return {spans,sk};
            };
            const fmtTime=(v,is25M)=>{
              const d=v.replace(/[^0-9]/g,"");
              const sep=is25M?" / ":"-";
              if(d.length<=2) return d;
              if(d.length<=4) return d.slice(0,2)+":"+d.slice(2);
              if(d.length<=6) return d.slice(0,2)+":"+d.slice(2,4)+sep+d.slice(4);
              return d.slice(0,2)+":"+d.slice(2,4)+sep+d.slice(4,6)+":"+d.slice(6,8);
            };
            const is25MRow=(row)=>{
              if(row.category==="25M") return true;
              if(row.event_code) return evToCategory(row.event_code)==="25M";
              return false;
            };
            const cSt={padding:"10px 6px",borderBottom:"1px solid "+C.border,fontSize:12,verticalAlign:"middle"};
            const iSt={background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:"#fff",fontSize:11,padding:"6px 5px",width:"100%",boxSizing:"border-box"};
            // 25M 종목의 relay 수 구하기
            const get25MRelayCount=(evCode)=>{
              const keys=Object.keys(startLists).filter(k=>k.startsWith(evCode+"_")&&/\d+$/.test(k)&&startLists[k]&&startLists[k].length>0);
              return Math.max(keys.length,1);
            };

            // 사대배정에서 종목+조 슬롯 자동 생성
            const laneSlots=[];
            Object.keys(laneAssign).forEach(dayKey=>{
              const da=laneAssign[dayKey];

                const a=da[k],p=evKeyParse(k);

                  if(!laneSlots.find(s=>s.key===slotKey)){
                    laneSlots.push({key:slotKey,evCode:p.evCode,relay:a.relay,laneDay:Number(dayKey),laneCount:a.lanes.length});
                  }
                }
              });
            });
            laneSlots.sort((a,b)=>a.evCode.localeCompare(b.evCode)||(a.relay-b.relay));

            // 25M 종목: relay 기반 슬롯 → 완사/급사 슬롯 변환
            const schedSlots=[];
            const processed25M=new Set();
            laneSlots.forEach(slot=>{
              if(is25MEv(slot.evCode)){

                  processed25M.add(slot.evCode);
                  const allRelays=laneSlots.filter(s=>s.evCode===slot.evCode);
                  const totalLanes=allRelays.reduce((s,r)=>s+r.laneCount,0);
                  const rCount=allRelays.length;
                  const allReady=allRelays.every(r=>startLists[r.key]&&startLists[r.key].length>0);
                  const rKeys=allRelays.map(r=>r.key);
                  schedSlots.push({key:slot.evCode+"_완사",evCode:slot.evCode,relay:"완사",laneDay:slot.laneDay,laneCount:totalLanes,is25M:true,relayCount:rCount,_allReady:allReady,_relayKeys:rKeys});
                  schedSlots.push({key:slot.evCode+"_급사",evCode:slot.evCode,relay:"급사",laneDay:slot.laneDay,laneCount:totalLanes,is25M:true,relayCount:rCount,_allReady:allReady,_relayKeys:rKeys});

                                          return <div key={slot.key} onClick={()=>{assignSlot(dayIdx,ri,slot.key);setSchedDropdown(null);}}

                                            <span style={{width:7,height:7,borderRadius:4,background:evClr(slot.evCode),flexShrink:0}}/>
                                            <span style={{fontWeight:700,color:evClr(slot.evCode),minWidth:30}}>{slot.evCode}</span>

                                            <span style={{color:C.dim,fontSize:10,flex:1}}>{ev?ev.name.replace(slot.evCode+" ",""):""}</span>

                                addPETAuto(nd,dayIdx,evCode,relay);});setSchedDrag(null);
                          }}}
                          onClick={()=>{
                            if(schedRowDrag){dropRow(schedRowDrag.dayIdx,schedRowDrag.rowIdx,dayIdx,day.rows.length);return;}
                            if(schedDrag){
                              const[evCode,relayStr]=schedDrag.split("_");const relay=relayStr||"1";
                              let conflict=false;
                              schedData.forEach((d,di)=>{if(di!==dayIdx) d.rows.forEach(r=>{if(r.event_code===evCode&&r.type==="prelim") conflict=true;});});
                              if(conflict&&!isShotgunEv(evCode)){flash(evCode+" "+relay+"조: 같은 종목의 모든 조는 동일 일차에 배치해야 합니다","error");setSchedDrag(null);return;}
                              updSched(nd=>{const ev=events.find(x=>x.code===evCode);
                                nd[dayIdx].rows.push(newSchedRow({event_code:evCode,type:"prelim",relay:relay,category:evToCategory(evCode),content:((ev&&ev.name.startsWith(evCode))?ev.name:evCode+" "+(ev?ev.name:""))+" "+schedLabel(evCode,relay)}));
                                addPETAuto(nd,dayIdx,evCode,relay);});setSchedDrag(null);

                          <td colSpan={7} style={{padding:4,textAlign:"center"}}>
