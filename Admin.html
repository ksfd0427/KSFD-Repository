                        {player?<div style={{height:36,borderRadius:5,border:"1px solid #c9a84c44",background:"#c9a84c15",display:"flex",alignItems:"center",justifyContent:"center",gap:4,padding:"0 8px"}}>
                          <span style={{fontSize:13,color:"#e8dcc8",fontWeight:600}}>{player.name}</span>
                          <button onClick={()=>{const n=[...slots];n[idx]=null;setEditTeamComps(prev=>({...prev,[pairKey]:{...comp,memberIds:n.filter(Boolean),teamType:"mixed"}}));}} style={{background:"none",border:"none",color:"#aa4444",fontSize:12,cursor:"pointer",padding:0}}>✕</button>
                        </div>
                        :<select style={{...eSelect,height:36,fontSize:12}} value="" onChange={e=>{if(e.target.value){const n=[...slots];n[idx]=parseInt(e.target.value);setEditTeamComps(prev=>({...prev,[pairKey]:{...comp,memberIds:n.filter(Boolean),teamType:"mixed"}}));}}}>
                          <option value="">{gLabels[idx]} 선수</option>
                          {avail.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>}
                      </div>;
                    })}
                  </div>
                  <label style={{display:"flex",alignItems:"center",gap:5,marginTop:5,cursor:"pointer"}}>
                    <input type="checkbox" checked={comp.isUnion} onChange={e=>setEditTeamComps(prev=>({...prev,[pairKey]:{...comp,isUnion:e.target.checked,teamType:"mixed"}}))} style={{accentColor:C.gold,width:14,height:14}}/>
                    <span style={{fontSize:11,color:"#8899aa"}}>타 단체 연합구성</span>
                  </label>
                </div>;
              };

              const cats=[...new Set(indEvents.map(e=>e.category))];
              return <div style={{maxWidth:900,margin:"0 auto"}}>
                <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:4}}>개인전 종목 / 선수 선택</div>
                <p style={{fontSize:12,color:C.dim,marginBottom:12}}>개인전에 1명이상 등록된 종목은 단체전 구성이 활성화됩니다.</p>
                {indEvents.length===0&&<div style={{color:C.dim,fontSize:13,padding:20,textAlign:"center"}}>등록된 개인전 종목이 없습니다</div>}
                {cats.map(cat=>{
                  const catEvs=indEvents.filter(e=>e.category===cat);
                  return <div key={cat} style={formGroup}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:8,borderBottom:"1px solid #1e2f4a"}}>
                      <span style={{fontSize:16,fontWeight:700,color:C.gold}}>{cat}</span>
                    </div>
                    {catEvs.map(ev=>{
                      // Entry.html과 동일: 해당 카테고리+성별 매칭 선수만 표시
                      const eligible=players.filter(p=>(p._events||[]).includes(ev.category)&&(ev.gender==="혼"||ev.gender===p.gender));
                      const selected=Object.entries(editIndEntries).filter(([mid,codes])=>codes.includes(ev.code)).map(([mid])=>parseInt(mid));
                      const hasEntries=selected.length>0;
                      const teamKey="team-"+ev.code+"_1";
                      return <div key={ev.code} style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:6,padding:"8px 4px",borderBottom:"1px solid #1e2f4a22"}}>
                        {/* 좌: 개인전 */}
                        <div style={{flex:"1 1 200px",minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                            <span style={{fontSize:13,fontWeight:700,color:"#e8dcc8"}}>{ev.code}</span>
                            <span style={{fontSize:12,color:"#8899aa"}}>{ev.name.replace(ev.code+" ","")}</span>
                            {selected.length>0&&<span style={{fontSize:11,color:"#4aba6a",marginLeft:"auto"}}>{selected.length}명</span>}
                          </div>
                          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                            {eligible.map(p=>{
                              const sel=selected.includes(p.id);
                              return <button key={p.id} onClick={()=>editToggleEvent(p.id,ev.code)} style={chipBtn(sel)}>{p.name}</button>;
                            })}
                            {eligible.length===0&&<span style={{fontSize:12,color:C.dim}}>해당 선수 없음</span>}
                          </div>
                        </div>
                        {/* 우: 단체전 (개인전 1명 이상일 때 활성) */}
                        <div style={{flex:"0 0 auto",minWidth:240,maxWidth:320,opacity:hasEntries?1:0.3,pointerEvents:hasEntries?"auto":"none"}}>
                          <div style={{fontSize:11,fontWeight:700,color:"#556677",marginBottom:2}}>단체전</div>
                          <TeamSlotRow teamKey={teamKey} count={4} eligible={eligible.filter(p=>selected.includes(p.id))}/>
                        </div>
                      </div>;
                    })}
                  </div>;
                })}

                {/* 혼성팀 종목 */}
                {mixedEvents.length>0&&<div style={{...formGroup,marginTop:16}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,paddingBottom:10,borderBottom:"1px solid #1e2f4a"}}>
                    <span style={{fontSize:20}}>👫</span>
                    <span style={{fontSize:16,fontWeight:700,color:C.gold}}>혼성팀 종목</span>
                    <span style={{fontSize:12,color:"#6b7d94"}}>남1 + 여1 구성 · 최대 2팀</span>
                  </div>
                  {mixedEvents.map(me=>{
                    const catPlayers=players.filter(p=>(p._events||[]).includes(me.category));
                    const malePlayers=catPlayers.filter(p=>p.gender==="남");
                    const femalePlayers=catPlayers.filter(p=>p.gender==="여"||p.gender==="녀");
                    return <div key={me.code} style={{marginBottom:16,padding:"8px 4px",borderBottom:"1px solid #1e2f4a22"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                        <span style={{fontSize:13,fontWeight:700,color:"#e8dcc8"}}>{me.code}</span>
                        <span style={{fontSize:13,color:"#8899aa"}}>{me.name.replace(me.code+" ","")}</span>
                      </div>
                      {[1,2].map(teamNum=>{
                        const pk="pair-"+me.code+"-"+teamNum;
                        const otherPk="pair-"+me.code+"-"+(teamNum===1?2:1);
                        const otherComp=editTeamComps[otherPk]||{memberIds:[]};
                        const filled=(editTeamComps[pk]||{memberIds:[]}).memberIds.length;
                        return <div key={teamNum} style={{marginBottom:10,marginLeft:8}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                            <span style={{fontSize:12,fontWeight:700,color:C.gold}}>팀 {teamNum}</span>
                            <span style={{fontSize:11,color:filled>=2?"#4aba6a":"#556677"}}>{filled}/2명 {filled>=2?"✓":""}</span>
                          </div>
                          <PairSlotRow pairKey={pk} malePlayers={malePlayers} femalePlayers={femalePlayers} otherSlots={otherComp.memberIds}/>
                        </div>;
                      })}
                    </div>;
                  })}
                </div>}
              </div>;
            })()}

            {/* ── 탭3: 총기 등록 (Entry.html 스타일: 선수별 카드) ── */}
            {editAppMode==="firearms"&&<div style={{maxWidth:750,margin:"0 auto"}}>
              <div style={{fontSize:14,fontWeight:700,color:"#fff",marginBottom:14}}>선수별 총기 등록</div>
              {players.length===0&&<div style={{color:C.dim,padding:20,textAlign:"center"}}>등록된 선수가 없습니다</div>}
              {players.map(p=>{
                const guns=editFirearms[p.id]||[];
                const pEvents=(p._events||[]).join(", ");
                return <div key={p.id} style={formGroup}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingBottom:8,borderBottom:"1px solid #1e2f4a"}}>
                    <span style={{fontSize:16,fontWeight:700,color:"#e8dcc8"}}>{p.name}</span>
                    <span style={{fontSize:11,color:p.gender==="남"?"#4488cc":"#cc6688",padding:"1px 6px",background:"#1a274466",borderRadius:4}}>{p.gender}</span>
                    {pEvents&&<span style={{fontSize:11,color:"#8899aa"}}>{pEvents}</span>}
                    <span style={{fontSize:12,color:C.gold,marginLeft:"auto"}}>{guns.length}정</span>
                  </div>
                  {guns.map((g,gi)=><div key={gi} style={{position:"relative",marginBottom:10,padding:"10px 12px",background:"#0d152088",borderRadius:8,border:"1px solid #1e2f4a"}}>
                    <div style={{display:"flex",alignItems:"center",marginBottom:8}}>
                      <span style={{fontSize:13,fontWeight:700,color:C.gold}}>총기 {gi+1}</span>
                      <button onClick={()=>editRemoveFirearm(p.id,gi)} style={{marginLeft:"auto",background:"none",border:"none",color:"#aa4444",fontSize:13,cursor:"pointer"}}>삭제</button>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",gap:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>총종</span>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                          {GUN_TYPES.map(gt=><button key={gt} onClick={()=>editUpdateFirearm(p.id,gi,"gun_type",gt)} style={chipBtn(g.gun_type===gt)}>{gt}</button>)}
                        </div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>제조사</span>
                        <input style={{...eInput,flex:1}} value={g.manufacturer} onChange={e=>editUpdateFirearm(p.id,gi,"manufacturer",e.target.value)} placeholder="제조사"/>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>모델명</span>
                        <input style={{...eInput,flex:1}} value={g.model} onChange={e=>editUpdateFirearm(p.id,gi,"model",e.target.value)} placeholder="모델명"/>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>총기번호</span>
                        <input style={{...eInput,flex:1}} value={g.serial_number} onChange={e=>editUpdateFirearm(p.id,gi,"serial_number",e.target.value)} placeholder="총기번호"/>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:13,fontWeight:600,color:"#6b7d94",width:80,flexShrink:0}}>허가증번호</span>
                        <input style={{...eInput,flex:1}} value={g.permit_number} onChange={e=>editUpdateFirearm(p.id,gi,"permit_number",e.target.value)} placeholder="허가증번호"/>
                      </div>
                    </div>
                  </div>)}
                  <button onClick={()=>editAddFirearm(p.id)} style={{width:"100%",padding:"8px",borderRadius:6,border:"1px dashed #2a3a5c",background:"transparent",color:"#6b7d94",fontSize:12,cursor:"pointer"}}>+ 총기 추가</button>
                </div>;
              })}
            </div>}

            </div>
          </div>
        </div>;
      })()}
    </div>
  </>);
}

// ═══ 기록 관리자 ═══
function RecordsPanel({ sb, flash, onBack, setDbBusy }) {
  const [menu, setMenu]=useState(null); // null=홈, "entry"=대회기록등록
  const [tournaments, setTournaments]=useState([]);
  const [selT, setSelT]=useState(null);
  const [events, setEvents]=useState([]);
  const [selEv, setSelEv]=useState(null);
  const [results, setResults]=useState([]);
  const [dirty, setDirty]=useState(false);

  // 신기록 관리 state
  const [brEvCode, setBrEvCode]=useState(null);
  const [brType, setBrType]=useState("prelim");
  const [brData, setBrData]=useState({}); // {korea:{...},national:{...},paralympic:{...},world:{...}}
  const [brDirty, setBrDirty]=useState(false);
  const [brViewAll, setBrViewAll]=useState(false);
  const [brAllData, setBrAllData]=useState([]);
  const [brPrint, setBrPrint]=useState(false);
  const BR_CATS=[
    {key:"korea",label:"🇰🇷 한국 신기록",color:"#dc2626"},
    {key:"national",label:"🏟 전국체전 대회 신기록",color:"#2563eb"},
    {key:"paralympic",label:"♿ 패럴림픽 신기록",color:"#7c3aed"},
    {key:"world",label:"🌍 세계 신기록",color:"#059669"},
  ];
  const BR_TYPE_LABEL={prelim:"본선",final:"결선",team:"단체"};
  const BR_CAT_SHORT={korea:"KR",national:"GR",paralympic:"PR",world:"WR"};
  const BR_EV_COLORS=["#e8f0fe","#fef3e2","#e6f4ea","#fce8e8","#f3e8fd","#e2f0f0","#fef9e7","#f0e8f8","#e8eff8","#fceee8","#eef8e8","#f8e8ee","#e8f8f4","#e8e8f8","#fef0e8","#f4f4e8","#e8f4f0","#f8f0e8"];

  const renderBrTable=(forPrint)=>{
    const sorted=[...brAllData].sort((a,b)=>{
      const ai=DEFAULT_EVENTS.findIndex(e=>e.code===a.event_code);
      const bi=DEFAULT_EVENTS.findIndex(e=>e.code===b.event_code);
      if(ai!==bi) return (ai===-1?999:ai)-(bi===-1?999:bi);
      const to={prelim:0,final:1,team:2};
      if(to[a.result_type]!==to[b.result_type]) return to[a.result_type]-to[b.result_type];
      const co={korea:0,national:1,paralympic:2,world:3};
      return co[a.record_category]-co[b.record_category];
    });
    // 종목별 색상 매핑
    const evColorMap={};
    let ci=0;
    sorted.forEach(r=>{if(!evColorMap[r.event_code]){evColorMap[r.event_code]=BR_EV_COLORS[ci%BR_EV_COLORS.length];ci++;}});
    const bdr="1px solid #333";
    const thS={padding:"6px 8px",fontSize:forPrint?8:10,fontWeight:700,color:"#000",background:"#d0d0d0",border:bdr,textAlign:"center",whiteSpace:"nowrap"};
    const tdS={padding:"5px 8px",fontSize:forPrint?8:11,color:"#000",border:bdr,whiteSpace:"nowrap"};
    return <div style={{overflow:"auto",borderRadius:forPrint?0:8}}>
      <table style={{width:"100%",borderCollapse:"collapse",border:bdr}}>
        <thead><tr>
          {["종목명","구분","라운드","분류","선수명","기록","수립 대회","수립일"].map(h=>
            <th key={h} style={thS}>{h}</th>
          )}
        </tr></thead>
        <tbody>
          {sorted.map((r,i)=>{
            const ev=DEFAULT_EVENTS.find(e=>e.code===r.event_code);
            const isTeam=r.result_type==="team";
            const bg=evColorMap[r.event_code]||"#fff";
            return <tr key={r.id||i} style={{background:bg}}>
              <td style={{...tdS,fontWeight:600}}>{ev?.name||r.event_code}</td>
              <td style={{...tdS,textAlign:"center"}}>{isTeam?"단체":"개인"}</td>
              <td style={{...tdS,textAlign:"center"}}>{BR_TYPE_LABEL[r.result_type]}</td>
              <td style={{...tdS,textAlign:"center",fontWeight:700}}>{BR_CAT_SHORT[r.record_category]||r.record_category}</td>
              <td style={tdS}>{r.holder_name||"—"}</td>
              <td style={{...tdS,fontWeight:700}}>{r.record_value||"—"}</td>
              <td style={{...tdS,fontSize:forPrint?7:10}}>{r.tournament_name||"—"}</td>
              <td style={{...tdS,fontSize:forPrint?7:10}}>{r.record_date||"—"}</td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>;
  };

  useEffect(()=>{
    if(!sb) return;
    sb.from("tournaments").select("*").in("status",[3,4]).order("start_date",{ascending:false}).then(({data})=>setTournaments(data||[]));
  },[sb]);

  const loadEvents=async(t)=>{
    setSelT(t); setSelEv(null); setResults([]); setDirty(false);
    setDbBusy(v=>v+1);
    try{
      const{data}=await sb.from("tournament_events").select("*").eq("tournament_id",t.id).order("sort_order");
      setEvents(data||[]);
    }finally{setDbBusy(v=>v-1);}
  };
  const loadResults=async(evCode)=>{
    setSelEv(evCode); setDirty(false);
    setDbBusy(v=>v+1);
    try{
      const{data}=await sb.from("competition_results").select("*").eq("tournament_id",selT.id).eq("event_code",evCode).eq("result_type","prelim").order("rank",{ascending:true,nullsFirst:false});
      setResults((data||[]).map(r=>({...r,_sub_org:r.sub_org||""})));
    }finally{setDbBusy(v=>v-1);}
  };

  const addRow=()=>{
    const newRank=results.filter(r=>!r._deleted).length+1;
    setResults([...results,{_new:true, id:"new_"+Date.now(), tournament_id:selT.id, event_code:selEv, result_type:"prelim", rank:newRank, bib:"", name:"", region:"", _sub_org:"", is_team:false, s1:"",s2:"",s3:"",s4:"",s5:"",s6:"",s7:"",s8:"",s9:"",s10:"",s11:"",s12:"", total:"", x_count:"", remarks:""}]);
    setDirty(true);
  };
  const updateRow=(idx,field,val)=>{
    const nr=[...results]; nr[idx]={...nr[idx],[field]:val,_dirty:true}; setResults(nr); setDirty(true);
  };
  const removeRow=(idx)=>{
    const r=results[idx];
    if(r._new){setResults(results.filter((_,i)=>i!==idx));}
    else{setResults(results.map((rr,i)=>i===idx?{...rr,_deleted:true}:rr));}
    setDirty(true);
  };

  const saveAll=async()=>{
    setDbBusy(v=>v+1);
    try{
      const toDelete=results.filter(r=>r._deleted&&!r._new);
      const toInsert=results.filter(r=>r._new&&!r._deleted);
      const toUpdate=results.filter(r=>r._dirty&&!r._new&&!r._deleted);
      for(const r of toDelete){await sb.from("competition_results").delete().eq("id",r.id);}
      for(const r of toInsert){
        const{_new,_dirty,_sub_org,id,...row}=r; row.sub_org=_sub_org||"";
        await sb.from("competition_results").insert(row);
      }
      for(const r of toUpdate){
        const{_new,_dirty,_deleted,_sub_org,created_at,...row}=r; row.sub_org=_sub_org||"";
        await sb.from("competition_results").update(row).eq("id",r.id);
      }
      flash("저장 완료 (" + (toInsert.length+toUpdate.length) + "건 저장, " + toDelete.length + "건 삭제)");
      loadResults(selEv);
    }catch(e){flash(e.message,"error");}
    finally{setDbBusy(v=>v-1);}
  };

  const exportCSV=()=>{
    const visible=results.filter(r=>!r._deleted);
    let csv="\uFEFF순위,배번,이름,시도,세부소속,S1,S2,S3,S4,S5,S6,합계,X카운트,비고\n";
    visible.forEach(r=>{csv+=`${r.rank||""},${r.bib||""},${r.name||""},${r.region||""},${r._sub_org||r.sub_org||""},${r.s1||""},${r.s2||""},${r.s3||""},${r.s4||""},${r.s5||""},${r.s6||""},${r.total||""},${r.x_count||""},${r.remarks||""}\n`;});
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`${selT.name}_${selEv}_기록.csv`; a.click();
  };

  const importExcel=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data); const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
    const colMap={"순위":"rank","배번":"bib","이름":"name","시도":"region","소속":"region","세부소속":"_sub_org","S1":"s1","S2":"s2","S3":"s3","S4":"s4","S5":"s5","S6":"s6","합계":"total","X카운트":"x_count","비고":"remarks"};
    const mapped=rows.map((r,i)=>{
      const row={_new:true, id:"imp_"+Date.now()+"_"+i, tournament_id:selT.id, event_code:selEv, result_type:"prelim"};
      Object.entries(r).forEach(([k,v])=>{const mk=colMap[k.trim()]; if(mk) row[mk]=String(v);});
      if(!row.rank) row.rank=i+1;
      if(!row.name) return null;
      return row;
    }).filter(Boolean);
    if(mapped.length===0){flash("유효한 데이터가 없습니다.","error"); return;}
    setResults([...results.filter(r=>!r._deleted), ...mapped]);
    setDirty(true);
    flash(mapped.length+"건 불러오기 완료");
    e.target.value="";
  };

  const FIELDS=[
    {k:"rank",l:"순위",w:50,t:"number"},
    {k:"bib",l:"배번",w:60},
    {k:"name",l:"이름",w:80},
    {k:"region",l:"시도",w:65},
    {k:"_sub_org",l:"세부소속",w:85},
    {k:"s1",l:"S1",w:60},{k:"s2",l:"S2",w:60},{k:"s3",l:"S3",w:60},
    {k:"s4",l:"S4",w:60},{k:"s5",l:"S5",w:60},{k:"s6",l:"S6",w:60},
    {k:"total",l:"합계",w:70},
    {k:"x_count",l:"X카운트",w:65},
    {k:"remarks",l:"비고",w:90},
  ];

  // 신기록 로드
  const loadBestRecords=async(evCode,type)=>{
    setBrViewAll(false); setBrPrint(false);
    setBrEvCode(evCode); setBrType(type||"prelim"); setBrDirty(false);
    const{data}=await sb.from("best_records").select("*").eq("event_code",evCode).eq("result_type",type||"prelim");
    const map={};
    BR_CATS.forEach(c=>{map[c.key]={event_code:evCode,result_type:type||"prelim",record_category:c.key,record_value:"",holder_name:"",holder_region:"",record_date:"",tournament_name:"",remarks:""};});
    (data||[]).forEach(r=>{map[r.record_category]={...r};});
    setBrData(map);
  };
  const brUpdate=(cat,field,val)=>{
    setBrData({...brData,[cat]:{...brData[cat],[field]:val,_dirty:true}});
    setBrDirty(true);
  };
  const brSave=async()=>{
    try{
      let saved=0;
      for(const cat of BR_CATS){
        const r=brData[cat.key];
        if(!r||!r._dirty) continue;
        const{_dirty,id,created_at,...row}=r;
        row.event_code=brEvCode; row.result_type=brType; row.record_category=cat.key;
        if(id){
          await sb.from("best_records").update(row).eq("id",id);
        } else if(row.record_value||row.holder_name){
          await sb.from("best_records").upsert(row,{onConflict:"event_code,result_type,record_category"});
        }
        saved++;
      }
      flash(saved+"건 저장 완료");
      loadBestRecords(brEvCode,brType);
    }catch(e){flash("저장 실패: "+e.message,"error");}
  };
  // 개별 카드 저장
  const brSaveOne=async(catKey)=>{
    try{
      const r=brData[catKey];
      if(!r) return;
      const{_dirty,_saved,id,created_at,...row}=r;
      row.event_code=brEvCode; row.result_type=brType; row.record_category=catKey;
      if(id){
        await sb.from("best_records").update(row).eq("id",id);
      } else if(row.record_value||row.holder_name){
        await sb.from("best_records").upsert(row,{onConflict:"event_code,result_type,record_category"});
      } else { flash("기록 또는 보유자를 입력하세요","error"); return; }
      setBrData(prev=>({...prev,[catKey]:{...prev[catKey],_dirty:false,_saved:true}}));
      setTimeout(()=>setBrData(prev=>({...prev,[catKey]:{...prev[catKey],_saved:false}})),2000);
      flash(BR_CATS.find(c=>c.key===catKey)?.label+" 저장 완료");
      // reload to get id
      const{data:fresh}=await sb.from("best_records").select("*").eq("event_code",brEvCode).eq("result_type",brType).eq("record_category",catKey).single();
      if(fresh) setBrData(prev=>({...prev,[catKey]:{...fresh,_saved:true}}));
    }catch(e){flash("저장 실패: "+e.message,"error");}
  };
  // 전체 신기록 로드
  const loadAllBestRecords=async()=>{
    setBrViewAll(true); setBrEvCode(null); setBrPrint(false);
    const{data}=await sb.from("best_records").select("*").order("event_code").order("result_type").order("record_category");
    setBrAllData(data||[]);
  };
  const inp={background:"#0d1520",border:"1px solid #2a3a5c",borderRadius:4,color:"#e8dcc8",padding:"4px 6px",fontSize:12,width:"100%",boxSizing:"border-box"};

  const MENUS=[
    {key:"entry",icon:"📝",label:"대회 기록 등록"},
    {key:"records_new",icon:"🏅",label:"신기록 관리"},
    {key:"records_db",icon:"🗃",label:"기록 DB 조회",disabled:true},
  ];

  const sideItem=(m)=>({
    padding:"11px 16px",cursor:m.disabled?"default":"pointer",
    borderBottom:"1px solid "+C.border+"44",
    background:menu===m.key?C.gold+"15":"transparent",
    borderLeft:menu===m.key?"3px solid "+C.gold:"3px solid transparent",
    opacity:m.disabled?0.4:1,
    display:"flex",alignItems:"center",gap:8,
  });

  return (
    <div style={{height:"100vh",display:"flex",background:C.bg,color:"#e8dcc8",fontFamily:"'Noto Sans KR',sans-serif"}}>
      {/* 좌측 사이드바 */}
      <div style={{width:220,minWidth:220,background:C.sidebar,borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"14px 16px",borderBottom:"1px solid "+C.border}}>
          <button onClick={onBack} style={{background:"transparent",border:"none",color:C.dim,fontSize:12,cursor:"pointer",padding:0,marginBottom:8}}>← 메인</button>
          <div style={{fontSize:15,fontWeight:800,color:C.gold}}>📊 기록 관리자</div>
        </div>
        {/* 메뉴 */}
        <div style={{flex:1,overflow:"auto"}}>
          {MENUS.map(m=>(
            <div key={m.key} style={sideItem(m)} onClick={()=>{if(!m.disabled){setMenu(m.key);setSelT(null);setSelEv(null);setResults([]);setBrEvCode(null);setBrData({});setBrDirty(false);setBrViewAll(false);setBrPrint(false);}}}>
              <span style={{fontSize:16}}>{m.icon}</span>
              <span style={{fontSize:13,fontWeight:menu===m.key?700:400,color:menu===m.key?C.gold:"#c8d4e4"}}>{m.label}</span>
              {m.disabled&&<span style={{fontSize:9,color:C.dimmer,marginLeft:"auto"}}>준비중</span>}
            </div>
          ))}
        </div>
      </div>

      {/* 메인 영역 */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>
        {/* 홈 */}
        {!menu&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:C.dimmer}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:56,marginBottom:16}}>📊</div>
            <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>기록 관리자</div>
            <div style={{fontSize:13,lineHeight:1.8}}>좌측 메뉴에서 작업을 선택하세요.</div>
          </div>
        </div>}

        {/* 대회 기록 등록 */}
        {menu==="entry"&&<>
          {/* 대회 선택 서브사이드바 */}
          <div style={{width:220,minWidth:220,background:"#0b1018",borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid "+C.border}}>
              <div style={{fontSize:13,fontWeight:700,color:"#e8dcc8"}}>📝 대회 기록 등록</div>
              <div style={{fontSize:10,color:C.dim,marginTop:3}}>종료/진행 대회 ({tournaments.length})</div>
            </div>
            <div style={{flex:1,overflow:"auto"}}>
              {tournaments.map(t=>(
                <div key={t.id} onClick={()=>loadEvents(t)} style={{
                  padding:"10px 14px",cursor:"pointer",borderBottom:"1px solid "+C.border+"33",
                  background:selT?.id===t.id?C.gold+"15":"transparent",
                  borderLeft:selT?.id===t.id?"3px solid "+C.gold:"3px solid transparent",
                }}>
                  <div style={{fontSize:12,fontWeight:selT?.id===t.id?700:400,color:selT?.id===t.id?C.gold:"#c8d4e4",lineHeight:1.4}}>{t.name}</div>
                  <div style={{fontSize:10,color:C.dim,marginTop:2}}>📅 {t.start_date} · {t.status===3?"진행중":"종료"}</div>
                </div>
              ))}
              {tournaments.length===0&&<div style={{padding:20,textAlign:"center",color:C.dimmer,fontSize:11}}>조회 가능한 대회가 없습니다</div>}
            </div>
          </div>

          {/* 종목 선택 + 기록 편집 */}
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {!selT&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:C.dimmer}}>
              <div style={{textAlign:"center"}}><div style={{fontSize:40,marginBottom:10}}>🏆</div><div style={{fontSize:14}}>대회를 선택하세요</div></div>
            </div>}
            {selT&&<>
              {/* 종목 탭 */}
              <div style={{padding:"10px 20px",borderBottom:"1px solid "+C.border,background:C.sidebar,display:"flex",flexWrap:"wrap",gap:4,alignItems:"center"}}>
                <span style={{fontSize:13,fontWeight:700,color:C.gold,marginRight:8}}>{selT.name}</span>
                {events.filter(e=>e.type==="individual").map(ev=>(
                  <button key={ev.code} onClick={()=>loadResults(ev.code)} style={{
                    padding:"5px 10px",borderRadius:5,fontSize:11,fontWeight:selEv===ev.code?700:400,cursor:"pointer",
                    border:"1px solid "+(selEv===ev.code?C.gold:C.border),
                    background:selEv===ev.code?C.gold+"22":"transparent",
                    color:selEv===ev.code?C.gold:C.dim,
                  }}>{ev.code}</button>
                ))}
              </div>
              {/* 컨텐츠 */}
              <div style={{flex:1,overflow:"auto",padding:20}}>
                {!selEv&&<div style={{textAlign:"center",padding:60,color:C.dimmer}}><div style={{fontSize:36,marginBottom:8}}>🎯</div>종목을 선택하세요</div>}
                {selEv&&<div>
                  {/* 툴바 */}
                  <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
                    <span style={{fontSize:14,fontWeight:700,color:"#fff"}}>{events.find(e=>e.code===selEv)?.name}</span>
                    <span style={{fontSize:12,color:C.dim}}>({results.filter(r=>!r._deleted).length}명)</span>
                    <div style={{flex:1}}/>
                    <button onClick={addRow} style={{...S.btn(C.gold,C.bg),fontSize:11,padding:"5px 12px"}}>+ 행 추가</button>
                    <label style={{...S.btn(C.blue,"#fff"),fontSize:11,padding:"5px 12px",cursor:"pointer"}}>
                      📥 엑셀 불러오기<input type="file" accept=".xlsx,.xls,.csv" onChange={importExcel} style={{display:"none"}}/>
                    </label>
                    <button onClick={exportCSV} style={{...S.btn(C.green,"#fff"),fontSize:11,padding:"5px 12px"}}>📤 CSV 내보내기</button>
                    <button onClick={saveAll} style={{...S.btn(dirty?"#ff6b35":C.gold,dirty?"#fff":C.bg),fontSize:12,padding:"6px 16px",fontWeight:700}}>💾 저장{dirty?" *":""}</button>
                  </div>
                  {/* 테이블 */}
                  <div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border}}>
                    <table style={{width:"100%",borderCollapse:"collapse",minWidth:900}}>
                      <thead><tr>
                        {FIELDS.map(f=><th key={f.k} style={{...S.th,fontSize:10,padding:"6px 4px",minWidth:f.w,width:f.w}}>{f.l}</th>)}
                        <th style={{...S.th,fontSize:10,padding:"6px 4px",width:40}}>삭제</th>
                      </tr></thead>
                      <tbody>
                        {results.filter(r=>!r._deleted).map((r,i)=>{
                          const origIdx=results.indexOf(r);
                          return(<tr key={r.id} style={{background:r._new?"#1a3a2a22":i%2===0?"transparent":"#0d152044"}}>
                            {FIELDS.map(f=><td key={f.k} style={{padding:"2px 3px",borderBottom:"1px solid "+C.border+"44"}}>
                              <input type={f.t||"text"} value={r[f.k]??""} onChange={e=>updateRow(origIdx,f.k,e.target.value)} style={{...inp,width:f.w-8}}/>
                            </td>)}
                            <td style={{padding:"2px 3px",borderBottom:"1px solid "+C.border+"44",textAlign:"center"}}>
                              <button onClick={()=>removeRow(origIdx)} style={{background:"transparent",border:"none",color:C.red,cursor:"pointer",fontSize:14}}>✕</button>
                            </td>
                          </tr>);
                        })}
                        {results.filter(r=>!r._deleted).length===0&&<tr><td colSpan={FIELDS.length+1} style={{padding:30,textAlign:"center",color:C.dimmer,fontSize:13}}>기록 데이터가 없습니다. 행을 추가하거나 엑셀을 불러오세요.</td></tr>}
                      </tbody>
                    </table>
                  </div>
                  {/* 엑셀 양식 안내 */}
                  <div style={{marginTop:16,padding:14,background:C.sidebar,borderRadius:8,border:"1px solid "+C.border}}>
                    <div style={{fontSize:12,fontWeight:700,color:C.gold,marginBottom:6}}>📋 엑셀 양식 안내</div>
                    <div style={{fontSize:11,color:C.dim,lineHeight:1.8}}>
                      첫 번째 행(헤더): <span style={{color:"#e8dcc8",fontWeight:600}}>순위, 배번, 이름, 소속, S1, S2, S3, S4, S5, S6, 합계, X카운트, 비고</span><br/>
                      • 시리즈 점수: 공기소총 소수점(예: 104.5), 권총 정수(예: 95)<br/>
                      • X카운트: 이너텐 또는 X카운트 수치<br/>
                      • CSV 내보내기로 양식을 확인한 후 동일 형태로 작성하세요.
                    </div>
                  </div>
                </div>}
              </div>
            </>}
          </div>
        </>}

        {/* 신기록 관리 */}
        {menu==="records_new"&&<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {/* 상단: 종목 선택 + 본선/결선/단체 탭 */}
          <div style={{padding:"12px 20px",borderBottom:"1px solid "+C.border,background:C.sidebar}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <span style={{fontSize:14,fontWeight:700,color:C.gold}}>🏅 신기록 관리</span>
              <div style={{flex:1}}/>
              <button onClick={()=>{setBrViewAll(false);setBrPrint(false);setBrEvCode(null);setBrData({});}} style={{
                ...S.btn(brViewAll?"transparent":C.gold+"33",brViewAll?C.dim:C.gold),fontSize:11,padding:"5px 12px",
                border:"1px solid "+(brViewAll?C.border:C.gold)
              }}>종목별 편집</button>
              <button onClick={loadAllBestRecords} style={{
                ...S.btn(brViewAll?C.gold+"33":"transparent",brViewAll?C.gold:C.dim),fontSize:11,padding:"5px 12px",
                border:"1px solid "+(brViewAll?C.gold:C.border)
              }}>📑 종합 보기</button>
            </div>
            {/* 종목별 모드일 때만 종목 버튼 */}
            {!brViewAll&&<>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>
              {DEFAULT_EVENTS.filter(e=>e.type==="individual").map(ev=>(
                <button key={ev.code} onClick={()=>{setBrEvCode(ev.code);loadBestRecords(ev.code,brType);}} style={{
                  padding:"5px 10px",borderRadius:5,fontSize:11,fontWeight:brEvCode===ev.code?700:400,cursor:"pointer",
                  border:"1px solid "+(brEvCode===ev.code?C.gold:C.border),
                  background:brEvCode===ev.code?C.gold+"22":"transparent",
                  color:brEvCode===ev.code?C.gold:C.dim,
                }}>{ev.code}</button>
              ))}
            </div>
            {/* 본선/결선/단체전 탭 */}
            {brEvCode&&<div style={{display:"flex",gap:0,borderBottom:"2px solid "+C.border}}>
              {[["prelim","📋 본선"],["final","🏆 결선"],["team","👥 단체전"]].map(([k,l])=>(
                <button key={k} onClick={()=>{setBrType(k);loadBestRecords(brEvCode,k);}} style={{
                  padding:"7px 18px",fontSize:12,fontWeight:brType===k?700:400,cursor:"pointer",
                  background:"transparent",border:"none",color:brType===k?C.gold:C.dim,
                  borderBottom:brType===k?"2px solid "+C.gold:"2px solid transparent",marginBottom:-2
                }}>{l}</button>
              ))}
            </div>}
            </>}
          </div>
          {/* 본문: 종목별 편집 */}
          {!brViewAll&&<div style={{flex:1,overflow:"auto",padding:20}}>
            {!brEvCode&&<div style={{textAlign:"center",padding:60,color:C.dimmer}}>
              <div style={{fontSize:48,marginBottom:12}}>🏅</div>
              <div style={{fontSize:15,fontWeight:600}}>종목을 선택하세요</div>
              <div style={{fontSize:12,marginTop:6}}>각 종목별 본선·결선·단체전 신기록을 관리합니다.</div>
            </div>}
            {brEvCode&&<div>
              <div style={{marginBottom:16}}>
                <span style={{fontSize:15,fontWeight:700,color:"#fff"}}>{DEFAULT_EVENTS.find(e=>e.code===brEvCode)?.name}</span>
                <span style={{fontSize:12,color:C.dim,marginLeft:8}}>— {BR_TYPE_LABEL[brType]} 기록</span>
              </div>
              {/* 4분류 카드 */}
              {BR_CATS.map(cat=>{
                const r=brData[cat.key]||{};
                const hasVal=!!(r.record_value||r.holder_name);
                return <div key={cat.key} style={{
                  marginBottom:16,background:C.card,border:"1px solid "+C.border,borderRadius:10,
                  borderLeft:"4px solid "+cat.color,overflow:"hidden"
                }}>
                  <div style={{padding:"10px 16px",background:cat.color+"12",borderBottom:"1px solid "+C.border,display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:14,fontWeight:700,color:cat.color}}>{cat.label}</span>
                    {hasVal&&<span style={{fontSize:10,background:cat.color+"22",color:cat.color,padding:"2px 8px",borderRadius:10,fontWeight:600}}>등록됨</span>}
                    <div style={{flex:1}}/>
                    {r._saved?<span style={{fontSize:11,color:C.green,fontWeight:600}}>✅ 저장됨</span>
                    :<button onClick={()=>brSaveOne(cat.key)} style={{
                      padding:"5px 14px",borderRadius:5,cursor:"pointer",fontSize:11,fontWeight:700,
                      background:r._dirty?"#ff6b35":"transparent",
                      color:r._dirty?"#fff":cat.color,
                      border:r._dirty?"none":"1px solid "+cat.color,
                    }}>{r._dirty?"💾 저장":"💾 저장"}</button>}
                  </div>
                  <div style={{padding:16,display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 16px"}}>
                    {/* 기록 */}
                    <div>
                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>기록 (점수)</label>
                      <input value={r.record_value||""} onChange={e=>brUpdate(cat.key,"record_value",e.target.value)}
                        placeholder="예: 634.5" style={{...inp,fontSize:13,fontWeight:700,color:cat.color}}/>
                    </div>
                    {/* 보유자 */}
                    <div>
                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>보유자</label>
                      <input value={r.holder_name||""} onChange={e=>brUpdate(cat.key,"holder_name",e.target.value)}
                        placeholder="홍길동" style={inp}/>
                    </div>
                    {/* 수립일 */}
                    <div>
                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>수립일</label>
                      <input type="date" value={r.record_date||""} onChange={e=>brUpdate(cat.key,"record_date",e.target.value)} style={inp}/>
                    </div>
                    {/* 수립 대회 */}
                    <div>
                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>수립 대회</label>
                      <input value={r.tournament_name||""} onChange={e=>brUpdate(cat.key,"tournament_name",e.target.value)}
                        placeholder="2025 전국장애인체육대회" style={inp}/>
                    </div>
                    {/* 비고 */}
                    <div style={{gridColumn:"span 2"}}>
                      <label style={{fontSize:10,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>비고</label>
                      <input value={r.remarks||""} onChange={e=>brUpdate(cat.key,"remarks",e.target.value)}
                        placeholder="메모" style={inp}/>
                    </div>
                  </div>
                </div>;
              })}
              {/* 저장/종합보기 */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}>
                <button onClick={loadAllBestRecords} style={{...S.btn(C.border,"#c8d4e4"),fontSize:11,padding:"6px 14px"}}>📑 전체 종합 보기</button>
                {brDirty&&<button onClick={brSave} style={{...S.btn("#ff6b35","#fff"),fontSize:13,padding:"8px 24px",fontWeight:700}}>💾 전체 저장</button>}
              </div>
            </div>}
          </div>}

          {/* 본문: 종합 보기 */}
          {brViewAll&&<div style={{flex:1,overflow:"auto",padding:20}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
              <span style={{fontSize:16,fontWeight:800,color:"#fff"}}>📑 신기록 종합 현황</span>
              <span style={{fontSize:12,color:C.dim}}>({brAllData.length}건 등록)</span>
              <div style={{flex:1}}/>
              <button onClick={loadAllBestRecords} style={{...S.btn(C.blue,"#fff"),fontSize:11,padding:"5px 12px"}}>🔄 새로고침</button>
              {brAllData.length>0&&<button onClick={()=>setBrPrint(true)} style={{...S.btn("#334155","#e8dcc8"),fontSize:11,padding:"5px 12px"}}>🖨 인쇄</button>}
            </div>
            {brAllData.length===0?<div style={{textAlign:"center",padding:60,color:C.dimmer}}>
              <div style={{fontSize:48,marginBottom:12}}>📭</div>
              <div style={{fontSize:14}}>등록된 신기록이 없습니다.</div>
              <div style={{fontSize:12,marginTop:6}}>종목별 편집에서 신기록을 등록하세요.</div>
            </div>
            :renderBrTable(false)}
          </div>}
          {/* 인쇄 미리보기 */}
          {brPrint&&<div className="print-overlay">
            <div className="print-page" style={{padding:"10mm 8mm 15mm"}}>
              <div className="print-page-header"><span>대한장애인사격연맹</span><span>대회운영관리시스템</span></div>
              <h2>신기록 종합 현황</h2>
              <div className="meta"><span>출력일: {new Date().toLocaleDateString("ko-KR")}</span><span>{brAllData.length}건</span></div>
              {renderBrTable(true)}
            </div>
            <div className="print-bar">
              <button style={{background:"#475569",color:"#fff"}} onClick={()=>setBrPrint(false)}>← 돌아가기</button>
              <button style={{background:"#2563eb",color:"#fff"}} onClick={()=>window.print()}>🖨️ 인쇄하기</button>
            </div>
          </div>}
        </div>}
      </div>
    </div>
  );
}

// ═══ DB 관리자 ═══
function DbPanel({ sb, flash, onBack, setDbBusy }) {
  const [tab, setTab]=useState("tables");
  const [tbl, setTbl]=useState("tournaments");
  const [data, setData]=useState([]);
  const [cnt, setCnt]=useState(0);
  const [ld, setLd]=useState(false);
  const [sql, setSql]=useState("");
  const [sqlR, setSqlR]=useState(null);
  const [sqlE, setSqlE]=useState("");
  const [sqlRun, setSqlRun]=useState(false);
  const [editRow, setEditRow]=useState(null);
  const [editVal, setEditVal]=useState({});
  const [schemaStep, setSchemaStep]=useState(0);

  const load=useCallback(async(t)=>{
    if(!sb)return; setLd(true);
    try{const{data:d,error:e,count:c}=await sb.from(t).select("*",{count:"exact"}).order("id").limit(500); if(e)throw new Error(e.message||"로드실패"); setData(d||[]); setCnt(c||0);}
    catch(e){setData([]); setCnt(0); flash(t+" 로드 실패: "+e.message,"error");}
    setLd(false);
  },[sb]);
  useEffect(()=>{if(tab==="tables")load(tbl);},[tbl,tab,load]);

  const del=async(id)=>{if(!confirm("ID "+id+" 삭제?"))return; try{const{error:e}=await sb.from(tbl).delete().eq("id",id); if(e)throw new Error(e.message); flash("삭제 완료"); load(tbl);}catch(e){flash("삭제 실패: "+e.message,"error");}};
  const save=async()=>{try{const u={...editVal}; delete u.id; delete u.created_at; delete u.updated_at; const{error:e}=await sb.from(tbl).update(u).eq("id",editRow.id); if(e)throw new Error(e.message); flash("수정 완료"); setEditRow(null); load(tbl);}catch(e){flash("수정 실패: "+e.message,"error");}};

  const runSQL=async(q)=>{
    if(!q.trim())return; setSqlRun(true); setSqlE(""); setSqlR(null);
    try{const r=await fetch(SB_URL+"/rest/v1/rpc/exec_sql",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},body:JSON.stringify({query:q.trim()})}); if(!r.ok){const e=await r.json(); throw new Error(e.message||e.error||r.statusText);} setSqlR(await r.json()); flash("SQL 실행 완료");}
    catch(e){setSqlE("실패: "+e.message+"\n\n💡 exec_sql 함수가 필요합니다. 스키마 관리 탭을 확인하세요.");}
    setSqlRun(false);
  };

  const resetSchema=async()=>{
    if(!confirm("⚠️ 모든 테이블과 데이터가 삭제됩니다."))return; if(!confirm("🔴 최종 확인: 되돌릴 수 없습니다."))return;
    setSchemaStep(1); await runSQL(DROP_SQL); setSchemaStep(2); await runSQL(SCHEMA_SQL); setSchemaStep(3); flash("스키마 초기화 완료!"); load(tbl); setTimeout(()=>setSchemaStep(0),3000);
  };

  const cols=data.length>0?Object.keys(data[0]):[];
  const fmt=(v,c)=>{if(v==null)return<span style={{color:C.dimmer}}>NULL</span>; if(typeof v==="boolean")return<span style={S.badge(v?C.green:C.red)}>{String(v)}</span>; if(c==="status"&&typeof v==="string")return<span style={S.badge(APP_STATUS_COLORS[v]||C.dim)}>{v}</span>; if(c==="status"&&typeof v==="number")return<span style={S.badge(STATUS_COLORS[v]||C.dim)}>{STATUS_MAP[v]||v}</span>; return String(v);};

  return (
    <div style={{display:"flex",height:"100vh"}}>
      <div style={{width:220,minWidth:220,background:C.sidebar,borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",padding:"16px 0"}}>
        <div style={{padding:"8px 20px 16px",borderBottom:"1px solid "+C.border,marginBottom:8}}>
          <button onClick={onBack} style={{...S.btn("transparent","#6b7d94"),padding:"4px 0",fontSize:12}}>← 메인으로</button>
          <div style={{fontSize:15,fontWeight:800,color:C.gold,marginTop:8}}>🗄 DB 관리자</div>
        </div>
        <button style={S.sideBtn(tab==="tables")} onClick={()=>setTab("tables")}>📊 테이블 열람</button>
        <button style={S.sideBtn(tab==="sql")} onClick={()=>setTab("sql")}>⌨️ SQL 편집기</button>
        <button style={S.sideBtn(tab==="schema")} onClick={()=>setTab("schema")}>🔧 스키마 관리</button>
        <div style={{flex:1}}/><div style={{padding:"12px 20px",fontSize:10,color:C.dimmer,borderTop:"1px solid "+C.border}}>{SB_URL.replace("https://","").split(".")[0]}</div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"12px 24px",borderBottom:"1px solid "+C.border,background:C.sidebar,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          {tab==="tables"&&<><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{TABLES.map(t=><button key={t.key} style={{padding:"6px 12px",fontSize:11,fontWeight:600,border:"1px solid",borderColor:tbl===t.key?C.gold:C.border,borderRadius:6,cursor:"pointer",background:tbl===t.key?C.gold+"22":"transparent",color:tbl===t.key?C.gold:C.dim}} onClick={()=>setTbl(t.key)}>{t.label}</button>)}</div><div style={{fontSize:11,color:C.dim}}>{ld?"로딩중...":cnt+"건"}</div></>}
          {tab==="sql"&&<div style={{fontSize:14,fontWeight:700,color:C.gold}}>⌨️ SQL 편집기</div>}
          {tab==="schema"&&<div style={{fontSize:14,fontWeight:700,color:C.gold}}>🔧 스키마 관리</div>}
        </div>
        <div style={{flex:1,overflow:"auto",padding:24}}>
          {tab==="tables"&&(data.length===0&&!ld?<div style={{textAlign:"center",padding:60,color:C.dimmer}}><div style={{fontSize:40,marginBottom:12}}>📭</div>데이터 없음</div>:(
            <div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border,animation:"fadeIn .2s"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>{cols.map(c=><th key={c} style={S.th}>{c}</th>)}<th style={{...S.th,textAlign:"center",width:100}}>관리</th></tr></thead>
              <tbody>{data.map((r,i)=><tr key={r.id||i} style={{background:i%2===0?"transparent":"#0d152044"}}>{cols.map(c=><td key={c} style={S.td} title={String(r[c]??"")}>{fmt(r[c],c)}</td>)}<td style={{...S.td,textAlign:"center",whiteSpace:"nowrap"}}><button style={S.sm(C.blue)} onClick={()=>{setEditRow(r);setEditVal({...r});}}>수정</button><button style={S.sm(C.red)} onClick={()=>del(r.id)}>삭제</button></td></tr>)}</tbody></table>
            </div>
          ))}
          {tab==="sql"&&<div style={{animation:"fadeIn .2s"}}>
            <textarea style={S.sql} value={sql} onChange={e=>setSql(e.target.value)} placeholder="SQL 쿼리를 입력하세요..."/>
            <div style={{display:"flex",gap:8,marginTop:12}}><button style={S.btn(C.gold,C.bg)} onClick={()=>runSQL(sql)} disabled={sqlRun}>{sqlRun?"⏳ 실행중...":"▶ 실행"}</button><button style={S.btn(C.border,"#8899aa")} onClick={()=>{setSql("");setSqlR(null);setSqlE("");}}>지우기</button></div>
            {sqlE&&<pre style={{marginTop:16,padding:16,background:"#1a0a0a",border:"1px solid #cc333344",borderRadius:8,fontSize:12,color:"#cc8888",whiteSpace:"pre-wrap",lineHeight:1.6}}>{sqlE}</pre>}
            {sqlR&&<pre style={{marginTop:16,padding:16,background:"#0a1a0a",border:"1px solid #2a7d4f44",borderRadius:8,fontSize:12,color:"#88cc88",whiteSpace:"pre-wrap",maxHeight:400,overflow:"auto"}}>{JSON.stringify(sqlR,null,2)}</pre>}
          </div>}
          {tab==="schema"&&<div style={{animation:"fadeIn .2s",maxWidth:700}}>
            {/* 백업 */}
            <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:24,marginBottom:24}}>
              <div style={{fontSize:16,fontWeight:700,color:C.gold,marginBottom:8}}>💾 DB 백업</div>
              <div style={{fontSize:12,color:"#6b7d94",marginBottom:16,lineHeight:1.8}}>현재 DB의 모든 테이블 데이터를 JSON 파일로 내려받습니다.<br/>스키마 초기화 전에 반드시 백업하세요.</div>
              <button style={S.btn(C.blue,"#fff")} onClick={async()=>{
                setDbBusy(v=>v+1);
                try{
                  flash("백업 시작...");
                  const tableOrder=["tournaments","tournament_events","applications","members","individual_entries","team_entries","firearms","application_logs","competition_results","best_records"];
                  const backup={_meta:{created:new Date().toISOString(),tables:tableOrder},data:{}};
                  for(const t of tableOrder){
                    const{data:d,error:e}=await sb.from(t).select("*").order("id").limit(10000);
                    if(e){backup.data[t]={error:e.message};}
                    else{backup.data[t]=d||[];}
                  }
                  const json=JSON.stringify(backup,null,2);
                  const blob=new Blob([json],{type:"application/json"});
                  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
                  const ts=new Date().toISOString().slice(0,10).replace(/-/g,"");
                  a.download=`ksfd_backup_${ts}.json`; a.click();
                  const total=tableOrder.reduce((s,t)=>s+(Array.isArray(backup.data[t])?backup.data[t].length:0),0);
                  flash("백업 완료 ("+total+"건)");
                }catch(e){flash("백업 실패: "+e.message,"error");}
                finally{setDbBusy(v=>v-1);}
              }}>📥 백업 다운로드</button>
            </div>
            {/* 복원 */}
            <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:24,marginBottom:24}}>
              <div style={{fontSize:16,fontWeight:700,color:C.gold,marginBottom:8}}>📤 DB 복원</div>
              <div style={{fontSize:12,color:"#6b7d94",marginBottom:16,lineHeight:1.8}}>백업 JSON 파일로 DB를 완전히 대체합니다.<br/><span style={{color:C.red}}>⚠️ 기존 데이터가 모두 삭제되고 백업본으로 교체됩니다.</span></div>
              <label style={{...S.btn(C.green,"#fff"),cursor:"pointer",display:"inline-block"}}>
                📂 백업 파일로 복원
                <input type="file" accept=".json" style={{display:"none"}} onChange={async(ev)=>{
                  const file=ev.target.files[0]; if(!file)return;
                  setDbBusy(v=>v+1);
                  try{
                    const text=await file.text();
                    const backup=JSON.parse(text);
                    if(!backup._meta||!backup.data){throw new Error("유효한 백업 파일이 아닙니다.");}
                    if(!confirm(`백업 파일: ${backup._meta.created}\n테이블 ${backup._meta.tables.length}개\n\n⚠️ 기존 데이터를 모두 삭제하고 백업본으로 교체합니다.\n진행하시겠습니까?`))return;
                    flash("복원 시작... 기존 데이터 삭제 중");
                    const order=backup._meta.tables||Object.keys(backup.data);
                    const reverseOrder=[...order].reverse();
                    // 1) FK 역순으로 기존 데이터 전부 삭제
                    for(const t of reverseOrder){
                      const{error:e}=await sb.from(t).delete().gte("id",0);
                      if(e) console.warn(t+" 삭제 실패:",e.message);
                    }
                    // 2) FK 순서대로 백업 데이터 삽입
                    flash("데이터 삽입 중...");
                    let total=0; let errors=[];
                    for(const t of order){
                      const rows=backup.data[t];
                      if(!Array.isArray(rows)||rows.length===0) continue;
                      for(let i=0;i<rows.length;i+=100){
                        const batch=rows.slice(i,i+100);
                        const{error:e}=await sb.from(t).insert(batch);
                        if(e) errors.push(t+": "+e.message);
                        else total+=batch.length;
                      }
                    }
                    if(errors.length>0) flash("복원 완료 ("+total+"건), 일부 오류:\n"+errors.join("\n"),"error");
                    else flash("복원 완료! ("+total+"건, 기존 데이터 대체됨)");
                    load(tbl);
                  }catch(e){flash("복원 실패: "+e.message,"error");}
                  finally{setDbBusy(v=>v-1);}
                  ev.target.value="";
                }}/>
              </label>
            </div>
            {/* 스키마 초기화 */}
            <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:24,marginBottom:24}}>
              <div style={{fontSize:16,fontWeight:700,color:C.gold,marginBottom:8}}>⚡ 스키마 초기화</div>
              <div style={{fontSize:12,color:"#6b7d94",marginBottom:16,lineHeight:1.8}}>기존 테이블 삭제 → 최신 스키마 재생성 + 샘플 데이터<br/><span style={{color:C.red}}>⚠️ 모든 기존 데이터가 삭제됩니다. 위의 백업을 먼저 수행하세요.</span></div>
              {schemaStep>0&&<div style={{marginBottom:12,padding:12,background:C.bg,borderRadius:8,fontSize:12}}>
                <div style={{color:schemaStep>=1?C.green:C.dimmer}}>{schemaStep===1?"⏳":"✅"} 1단계: 기존 테이블 삭제</div>
                <div style={{color:schemaStep>=2?(schemaStep>2?C.green:C.gold):C.dimmer}}>{schemaStep===2?"⏳":schemaStep>2?"✅":"⬜"} 2단계: 스키마 재생성</div>
                {schemaStep===3&&<div style={{color:C.green,marginTop:8,fontWeight:700}}>🎉 완료!</div>}
              </div>}
              <button style={S.btn(C.red,"#fff")} onClick={resetSchema}>🗑 스키마 초기화 실행</button>
            </div>
            <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:24,marginBottom:24}}>
              <div style={{fontSize:16,fontWeight:700,color:C.gold,marginBottom:8}}>📋 exec_sql 함수 설치</div>
              <div style={{fontSize:12,color:"#6b7d94",marginBottom:16,lineHeight:1.8}}>SQL 편집기 사용을 위해 Supabase SQL Editor에서 <strong>한 번만</strong> 실행:</div>
              <pre style={{padding:16,background:"#080d14",border:"1px solid "+C.border,borderRadius:8,fontSize:12,color:"#a8c8e8",lineHeight:1.6,overflow:"auto",whiteSpace:"pre-wrap"}}>{`CREATE OR REPLACE FUNCTION exec_sql(query TEXT)
RETURNS JSONB AS $$
BEGIN
  EXECUTE query;
  RETURN jsonb_build_object('ok', true);
EXCEPTION
  WHEN OTHERS THEN
    RETURN jsonb_build_object('ok', false, 'error', SQLERRM);
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;`}</pre>
              <button style={{...S.btn(C.border,"#8899aa"),marginTop:12}} onClick={()=>{navigator.clipboard.writeText("CREATE OR REPLACE FUNCTION exec_sql(query TEXT)\nRETURNS JSONB AS $$\nBEGIN\n  EXECUTE query;\n  RETURN jsonb_build_object('ok', true);\nEXCEPTION\n  WHEN OTHERS THEN\n    RETURN jsonb_build_object('ok', false, 'error', SQLERRM);\nEND;\n$$ LANGUAGE plpgsql SECURITY DEFINER;"); flash("클립보드에 복사됨");}}>📋 복사</button>
            </div>
            <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:24}}>
              <div style={{fontSize:16,fontWeight:700,color:C.gold,marginBottom:12}}>📖 현재 스키마</div>
              <details><summary style={{fontSize:12,color:"#6b7d94",cursor:"pointer",marginBottom:8}}>DROP SQL</summary><pre style={{padding:12,background:"#080d14",borderRadius:8,fontSize:11,color:"#cc8888",overflow:"auto",maxHeight:200}}>{DROP_SQL}</pre></details>
              <details style={{marginTop:12}}><summary style={{fontSize:12,color:"#6b7d94",cursor:"pointer",marginBottom:8}}>CREATE SQL</summary><pre style={{padding:12,background:"#080d14",borderRadius:8,fontSize:11,color:"#88cc88",overflow:"auto",maxHeight:400}}>{SCHEMA_SQL}</pre></details>
            </div>
          </div>}
        </div>
      </div>
      {editRow&&<div style={S.modal} onClick={()=>setEditRow(null)}><div style={S.mbox} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:15,fontWeight:700,color:C.gold,marginBottom:16}}>✏️ {tbl} #{editRow.id}</div>
        {Object.keys(editRow).filter(k=>!["id","created_at","updated_at"].includes(k)).map(c=><div key={c} style={{marginBottom:10}}><label style={{fontSize:11,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>{c}</label><input style={S.input} value={editVal[c]??""} onChange={e=>setEditVal({...editVal,[c]:e.target.value||null})}/></div>)}
        <div style={{display:"flex",gap:8,marginTop:16}}><button style={S.btn(C.gold,C.bg)} onClick={save}>저장</button><button style={S.btn(C.border,"#8899aa")} onClick={()=>setEditRow(null)}>취소</button></div>
      </div></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
