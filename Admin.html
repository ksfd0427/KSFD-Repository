              const mid=p.memberId;
              if(!orgNum && orgNum!==0) return <span
                onClick={(e)=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();setTeamDropdown(td=>td&&td.memberId===mid?null:{memberId:mid,evCode:selEvCode,rect:{top:r.bottom+window.scrollY,left:r.left+window.scrollX},currentNum:null});}}
                style={{fontSize:10,color:"#556",padding:"2px 8px",borderRadius:4,border:"1px dashed #334",cursor:"pointer",userSelect:"none",...(extraStyle||{})}}>
                해당없음 ▾
              </span>;
              const tc=getTeamColor(orgNum);
              return <span
                onClick={(e)=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();setTeamDropdown(td=>td&&td.memberId===mid?null:{memberId:mid,evCode:selEvCode,rect:{top:r.bottom+window.scrollY,left:r.left+window.scrollX},currentNum:orgNum});}}
                style={{...S.badge(tc),fontWeight:700,cursor:"pointer",userSelect:"none",position:"relative",color:"#fff",textShadow:"0 1px 2px rgba(0,0,0,.5)",...(extraStyle||{})}}>
                단체{orgNum} ▾
              </span>;
            };

            // ── 같은 종목의 모든 세션 (릴레이 순) ──
            const sibSessions=selEvCode?sessions.filter(s=>s.evCode===selEvCode).sort((a,b)=>a.relay-b.relay):[];
            const curStartList=selectedEvCode?startLists[selectedEvCode]||null:null;

            // ── 사대 정보 조회 (선택된 세션의 릴레이) ──
            const getSessionLanes=(sKey)=>{
              const s=sessions.find(x=>x.key===sKey);if(!s) return [];
              const lanes=[];
              Object.keys(laneAssign).forEach(dayKey=>{
                const da=laneAssign[dayKey]||{};
                Object.keys(da).forEach(k=>{
                  const a=da[k],p=evKeyParse(k);
                  if(p.evCode===s.evCode&&a&&a.relay===s.relay&&a.lanes) a.lanes.forEach(ln=>lanes.push(ln));
                });
              });
              return lanes.sort((a,b)=>a-b);
            };

            // ── 종목 날짜/시간 조회 ──
            const getEvSchedInfo=(evCode)=>{
              let dayNum=null, time=null;
              schedData.forEach(d=>{d.rows.forEach(r=>{if(r.type==="prelim"&&r.event_code===evCode){dayNum=d.day;if(r.time)time=r.time;}});});
              const startDate=selectedT?.start_date;
              let dateStr="X월 X일";
              if(dayNum&&startDate){const dt=new Date(startDate);dt.setDate(dt.getDate()+dayNum-1);dateStr=(dt.getMonth()+1)+"월 "+dt.getDate()+"일";}
              return {dayNum, dateStr, time:time||"00:00-00:00"};
            };

            // ── 조 배정 관련 (세션 수 = 조 수) ──
            const totalRelays=sibSessions.length;
            const evRelayMap=selEvCode?(relayAssign[selEvCode]||{}):{};

            // ── 세션 단위 스타트리스트 생성 (전체 릴레이 한번에) ──
            const generateSessionStartLists=()=>{
              if(!selEvCode||sibSessions.length===0) return;
              const hasRelayMap=totalRelays>1&&Object.keys(evRelayMap).length>0;
              // 조 배정이 있으면 조별 분배, 없으면 기존 방식 (순차 분할)
              if(hasRelayMap){
                // ── 조 배정 기반 분배 ──
                const newSL={...startLists};
                let totalGenerated=0;
                sibSessions.forEach(ss=>{
                  const lanes=getSessionLanes(ss.key);
                  const relayNum=ss.relay;
                  // 해당 조에 배정된 참가자만 필터
                  let relayParticipants;
                  if(selIsMixed){
                    relayParticipants=sorted.filter(p=>{const ra=evRelayMap[String(p.memberId)];return ra===relayNum;});
                    relayParticipants.forEach((p,i)=>{if(!p._orgNum) p._orgNum=getEffectiveOrgNum(p);});
                  } else {
                    relayParticipants=sorted.filter(p=>{const ra=evRelayMap[String(p.memberId)];return ra===relayNum;});
                  }
                  if(relayParticipants.length===0){newSL[ss.key]=[];return;}
                  const relayOrgMap={};relayParticipants.forEach(p=>{if(!relayOrgMap[p.orgName])relayOrgMap[p.orgName]=getEffectiveOrgNum(p);});
                  const shuffled=buildStartList(relayParticipants,relayOrgMap);
                  if(selIsMixed){
                    const rows=[];
                    shuffled.forEach((tp,ti)=>{
                      const tn=tp._orgNum||getEffectiveOrgNum(tp);
                      const team=tp._team||[tp];
                      const lane1=lanes[ti*2]?ss.relay+"-"+lanes[ti*2]:null;
                      const lane2=lanes[ti*2+1]?ss.relay+"-"+lanes[ti*2+1]:null;
                      team.forEach((m,mi)=>{
                        rows.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,
                          lane:mi===0?lane1:lane2,absent:false,remark:"",_teamIdx:ti,_orgNum:tn});
                      });
                    });
                    newSL[ss.key]=rows;
                    totalGenerated+=shuffled.reduce((s,t)=>(t._team?s+t._team.length:s+1),0);
                  } else {
                    newSL[ss.key]=shuffled.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));
                    // 사대보다 인원이 많으면 남은 인원도 추가 (lane=null)
                    if(shuffled.length>lanes.length){
                      const extra=shuffled.slice(lanes.length).map(p=>({...p,lane:null,absent:false,remark:""}));
                      newSL[ss.key]=[...newSL[ss.key].slice(0,lanes.length),...extra];
                    }
                    totalGenerated+=shuffled.length;
                  }
                });
                setStartLists(newSL);
                setSlSavedKeys(prev=>{const next=new Set(prev);sibSessions.forEach(ss=>next.delete(ss.key));return next;});
                flash(selEvCode+" 조 배정 기반 스타트리스트 생성 완료 ("+totalGenerated+"명 → "+sibSessions.length+"개 세션)");
                dbSave("startlists",newSL);
                const savedKeys=sibSessions.map(ss=>ss.key);
                syncStartlistSessions(newSL,savedKeys);
                setSlSavedKeys(prev=>{const next=new Set(prev);savedKeys.forEach(k=>next.add(k));return next;});
                return;
              }
              // ── 기존 방식: 순차 분할 ──
              if(selIsMixed){
                // 혼성팀: 팀 단위 셔플 → 개인 행으로 펼침
                const shuffledTeams=buildStartList(sorted,orgNumMap);
                let offset=0;
                const newSL={...startLists};
                sibSessions.forEach(ss=>{
                  const lanes=getSessionLanes(ss.key);
                  const teamSlots=Math.floor(lanes.length/2);
                  const chunk=shuffledTeams.slice(offset,offset+teamSlots);
                  const rows=[];
                  chunk.forEach((teamProxy,ti)=>{
                    const team=teamProxy._team||[teamProxy];
                    const lane1=lanes[ti*2]?ss.relay+"-"+lanes[ti*2]:null;
                    const lane2=lanes[ti*2+1]?ss.relay+"-"+lanes[ti*2+1]:null;
                    const tn=teamProxy._orgNum||(offset+ti+1);
                    team.forEach((m,mi)=>{
                      rows.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,
                        lane:mi===0?lane1:lane2,absent:false,remark:"",_teamIdx:ti,_orgNum:tn});
                    });
                  });
                  newSL[ss.key]=rows;
                  offset+=teamSlots;
                });
                // 남은 팀
                if(offset<shuffledTeams.length&&sibSessions.length>0){
                  const lastKey=sibSessions[sibSessions.length-1].key;
                  const remaining=[];
                  shuffledTeams.slice(offset).forEach(tp=>{
                    const tn=tp._orgNum||0;
                    (tp._team||[tp]).forEach(m=>{
                      remaining.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,lane:null,absent:false,remark:"",_orgNum:tn});
                    });
                  });
                  newSL[lastKey]=[...newSL[lastKey],...remaining];
                }
                setStartLists(newSL);
                setSlSavedKeys(prev=>{const next=new Set(prev);sibSessions.forEach(ss=>next.delete(ss.key));return next;});
                const totalMembers=shuffledTeams.reduce((s,t)=>(t._team?s+t._team.length:s+1),0);
                flash(selEvCode+" 혼성팀 스타트리스트 생성 완료 ("+shuffledTeams.length+"팀 "+totalMembers+"명 → "+sibSessions.length+"개 세션)");
                // DB 자동 저장
                dbSave("startlists",newSL);
                const savedKeys=sibSessions.map(ss=>ss.key);
                syncStartlistSessions(newSL,savedKeys);
                setSlSavedKeys(prev=>{const next=new Set(prev);savedKeys.forEach(k=>next.add(k));return next;});
              } else {
                const shuffled=buildStartList(sorted,orgNumMap);
                let offset=0;
                const newSL={...startLists};
                sibSessions.forEach(ss=>{
                  const lanes=getSessionLanes(ss.key);
                  const count=lanes.length;
                  const chunk=shuffled.slice(offset,offset+count);
                  newSL[ss.key]=chunk.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));
                  offset+=count;
                });
                // 남은 인원 (사대보다 참가자가 많은 경우) → 마지막 세션에 추가
                if(offset<shuffled.length&&sibSessions.length>0){
                  const lastKey=sibSessions[sibSessions.length-1].key;
                  const remaining=shuffled.slice(offset).map(p=>({...p,lane:null,absent:false,remark:""}));
                  newSL[lastKey]=[...newSL[lastKey],...remaining];
                }
                setStartLists(newSL);
                setSlSavedKeys(prev=>{const next=new Set(prev);sibSessions.forEach(ss=>next.delete(ss.key));return next;});
                flash(selEvCode+" 전체 세션 스타트리스트 생성 완료 ("+shuffled.length+"명 → "+sibSessions.length+"개 세션)");
                // DB 자동 저장
                dbSave("startlists",newSL);
                const savedKeys=sibSessions.map(ss=>ss.key);
                syncStartlistSessions(newSL,savedKeys);
                setSlSavedKeys(prev=>{const next=new Set(prev);savedKeys.forEach(k=>next.add(k));return next;});
              }
            };

            // ── 불참 처리 ──
            const toggleAbsent=(idx)=>{
              const p=curStartList[idx];
              if(p.absent){
                // 복원: 바로 처리
                const updated=[...curStartList];
                updated[idx]={...updated[idx],absent:false};
                const newSL={...startLists,[selectedEvCode]:updated};
                setStartLists(newSL);
                setSlSavedKeys(prev=>{const next=new Set(prev);next.add(selectedEvCode);return next;});
                // 이력에 복원 기록
                const hist=[...absentHistory,{name:p.name,memberId:p.memberId,evCode:selectedEvCode,sessionKey:selectedEvCode,
                  action:"복원",reason:"",timestamp:new Date().toISOString(),subOrg:p.subOrg||"",orgName:p.orgName||""}];
                setAbsentHistory(hist); dbSave("absent_history",hist);
                // DB 동기화
                dbSave("startlists",newSL);
                syncStartlistSessions(newSL,[selectedEvCode]);
              } else {
                // 불참: 모달 표시
                setAbsentModal({idx,name:p.name,memberId:p.memberId,evCode:selectedEvCode,subOrg:p.subOrg||"",orgName:p.orgName||""});
                setAbsentReason("");
              }
            };

            // ── 드래그 교환 ──
            const swapRows=(fromIdx,toIdx)=>{
              if(fromIdx===toIdx) return;
              const updated=[...curStartList];
              const fromData={name:updated[fromIdx].name,memberId:updated[fromIdx].memberId,subOrg:updated[fromIdx].subOrg,orgName:updated[fromIdx].orgName,regionName:updated[fromIdx].regionName,remark:updated[fromIdx].remark,absent:updated[fromIdx].absent};
              const toData={name:updated[toIdx].name,memberId:updated[toIdx].memberId,subOrg:updated[toIdx].subOrg,orgName:updated[toIdx].orgName,regionName:updated[toIdx].regionName,remark:updated[toIdx].remark,absent:updated[toIdx].absent};
              updated[fromIdx]={...updated[fromIdx],...toData};
              updated[toIdx]={...updated[toIdx],...fromData};
              setStartLists({...startLists,[selectedEvCode]:updated});
              setSlSavedKeys(prev=>{const next=new Set(prev);next.delete(selectedEvCode);return next;});
              setSlDrag(null);
            };

            // ── 복사/CSV ──
            const copyBtn=(list,label)=>(<button style={{...S.btn(C.blue,"#fff"),fontSize:11,padding:"5px 12px"}} onClick={()=>{
              const evName=selSession?.evName||selectedEvCode;
              const si=getEvSchedInfo(selEvCode);
              const header="#\t사대\t이름\t소속\t단체번호\t비고";
              const active=list.filter(p=>!p.absent);
              const rows=active.map((p,i)=>`${i+1}\t${p.lane||"-"}\t${p.name}\t${p.subOrg||"-"}\t단체${getEffectiveOrgNum(p)}\t${p.remark||""}`);
              navigator.clipboard.writeText(evName+" "+selRelay+"조 "+label+" ("+si.dateStr+" "+si.time+")\n"+header+"\n"+rows.join("\n")).then(()=>flash("클립보드에 복사됨"));
            }}>📋 복사</button>);
            const csvBtn=(list,suffix)=>(<button style={{...S.btn(C.green,"#fff"),fontSize:11,padding:"5px 12px"}} onClick={()=>{
              let csv="\uFEFF#,사대,이름,소속,단체번호,비고\n";
              const active=list.filter(p=>!p.absent);
              active.forEach((p,i)=>{csv+=`${i+1},${p.lane||"-"},${p.name},${p.subOrg||"-"},단체${getEffectiveOrgNum(p)},${p.remark||""}\n`;});
              const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
              const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${selectedEvCode}_${suffix}.csv`; a.click();
            }}>📥 CSV</button>);

            // ── 참가 리스트 테이블 ──
            const getParticipantRelay=(p)=>{const v=evRelayMap[String(p.memberId)];return v||null;};
            const setParticipantRelay=(memberId,relayNum)=>{
              const newRA={...relayAssign};
              if(!newRA[selEvCode]) newRA[selEvCode]={};
              newRA[selEvCode]={...newRA[selEvCode],[String(memberId)]:relayNum};
              setRelayAssign(newRA);
            };
            // 자동 조 배분 (사대 수 비율 기반)
            const autoDistributeRelays=()=>{
              if(totalRelays<2){flash("조가 2개 이상이어야 자동 배분 가능합니다","error");return;}
              const pList=selIsMixed?sorted:sorted;
              const ids=pList.map(p=>String(p.memberId));
              // 각 조의 사대 수 가져오기
              const relayLaneCounts=sibSessions.map(ss=>({relay:ss.relay,lanes:getSessionLanes(ss.key).length}));
              const totalLanes=relayLaneCounts.reduce((s,r)=>s+r.lanes,0);
              // 비율에 따라 인원 배분 수 계산
              const quotas=relayLaneCounts.map((r,ri)=>{
                if(ri===relayLaneCounts.length-1) return ids.length-relayLaneCounts.slice(0,ri).reduce((s,x)=>s+Math.round(ids.length*x.lanes/totalLanes),0);
                return Math.round(ids.length*r.lanes/totalLanes);
              });
              // 참가자를 무작위로 섞기
              const shuffled=[...ids];
              for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
              // 배분
              const newRA={...relayAssign};
              if(!newRA[selEvCode]) newRA[selEvCode]={};
              const evMap={};
              let offset=0;
              relayLaneCounts.forEach((r,ri)=>{
                const q=quotas[ri];
                for(let j=0;j<q&&offset<shuffled.length;j++){
                  evMap[shuffled[offset]]=r.relay;
                  offset++;
                }
              });
              newRA[selEvCode]=evMap;
              setRelayAssign(newRA);
              const info=relayLaneCounts.map((r,ri)=>r.relay+"조:"+quotas[ri]+"명("+r.lanes+"사대)").join(" · ");
              flash("자동 조 배분 완료 — "+info);
            };
            // 조 미배정 경고 확인
            const hasUnassignedRelay=()=>{
              if(totalRelays<2) return false;
              const pList=selIsMixed?flatParticipants:sorted;
              return pList.some(p=>!getParticipantRelay(p));
            };
            const renderListTable=(list)=>(<div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                {(selIsMixed?["#","팀","이름","소속","단체번호"]:["#","이름","소속","단체번호"]).concat(totalRelays>1?["조 배정"]:[]).map(h=><th key={h} style={S.th}>{h}</th>)}
              </tr></thead><tbody>
                {list.map((p,i)=>{
                  const isNewTeam=selIsMixed&&(i===0||p._teamIdx!==list[i-1]?._teamIdx);
                  const pRelay=getParticipantRelay(p);
                  return <tr key={(p.memberId||i)+"-"+i} style={{background:i%2===0?"transparent":"#0d152044",borderTop:isNewTeam&&i>0?"2px solid "+C.border:"none"}}>
                    <td style={{...S.td,color:C.dim}}>{i+1}</td>
                    {selIsMixed&&<td style={{...S.td,color:C.gold,fontWeight:700,fontSize:10}}>{isNewTeam?"팀"+(p._teamIdx+1):""}</td>}
                    <td style={{...S.td,fontWeight:600}}>{p.name}</td>
                    <td style={S.td}>{p.subOrg||"-"}</td>
                    <td style={S.td}>{renderTeamBadge(p,getEffectiveOrgNum(p))}</td>
                    {totalRelays>1&&<td style={{...S.td,padding:"2px 4px"}}>
                      <select value={pRelay||""} onChange={e=>{const v=e.target.value?Number(e.target.value):null;setParticipantRelay(p.memberId,v);}}
                        style={{padding:"3px 6px",fontSize:11,borderRadius:4,border:"1px solid "+C.border,background:pRelay?getTeamColor(pRelay)+"33":C.card,color:pRelay?"#fff":"#888",cursor:"pointer",fontWeight:pRelay?600:400,minWidth:56}}>
                        <option value="">미배정</option>
                        {Array.from({length:totalRelays},(_,ri)=><option key={ri+1} value={ri+1}>{ri+1}조</option>)}
                      </select>
                    </td>}
                  </tr>;
                })}
              </tbody></table>
            </div>);

            // ── 스타트리스트 테이블 ──
            const renderStartTable=(list)=>{
              let seq=0;
              return <div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border,touchAction:slDrag?'none':'auto'}}
                onPointerDown={e=>{
                  const tr=e.target.closest&&e.target.closest('[data-slrow]');
                  if(!tr)return;const idx=parseInt(tr.dataset.slrow);
                  if(isNaN(idx)||list[idx]?.absent)return;
                  e.preventDefault();setSlDrag({evCode:selectedEvCode,fromIdx:idx});
                }}
                onPointerUp={e=>{
                  if(!slDrag||slDrag.evCode!==selectedEvCode){setSlDrag(null);return;}
                  const el=document.elementFromPoint(e.clientX,e.clientY);
                  const tr=el&&el.closest&&el.closest('[data-slrow]');
                  if(tr){const toIdx=parseInt(tr.dataset.slrow);
                    if(!isNaN(toIdx)&&!list[toIdx]?.absent&&toIdx!==slDrag.fromIdx){swapRows(slDrag.fromIdx,toIdx);return;}}
                  setSlDrag(null);
                }}
                onPointerLeave={()=>setSlDrag(null)}
                onPointerCancel={()=>setSlDrag(null)}>
                <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                  {["#","사대","이름","소속","단체번호","비고",""].map(h=><th key={h} style={S.th}>{h}</th>)}
                </tr></thead><tbody>
                  {list.map((p,i)=>{
                    const isAbsent=p.absent;
                    if(!isAbsent) seq++;
                    const isDragFrom=slDrag&&slDrag.evCode===selectedEvCode&&slDrag.fromIdx===i;
                    return <tr key={p.memberId+"-"+i} data-slrow={i}
                      style={{background:isAbsent?"#ef444411":isDragFrom?"#3b82f622":i%2===0?"transparent":"#0d152044",
                        opacity:isAbsent?0.5:1,cursor:isAbsent?"default":"grab",transition:"background .1s"}}>
                      <td style={{...S.td,color:isAbsent?"#ef4444":C.dim,textDecoration:isAbsent?"line-through":"none"}}>{isAbsent?"—":seq}</td>
                      <td style={{...S.td,fontWeight:700,color:p.lane?"#ddd":"#555",textAlign:"center"}}>{p.lane||"-"}</td>
                      <td style={{...S.td,fontWeight:600,textDecoration:isAbsent?"line-through":"none"}}>{p.name}</td>
                      <td style={S.td}>{p.subOrg||"-"}</td>
                      <td style={S.td}>{renderTeamBadge(p,p._orgNum||getEffectiveOrgNum(p))}</td>
                      <td style={S.td}>{p.remark||""}</td>
                      <td style={{...S.td,padding:"2px 4px"}} className="no-print">
                        <button onClick={()=>toggleAbsent(i)} title={isAbsent?"참가 복원":"불참 처리"}
                          style={{fontSize:9,padding:"2px 6px",borderRadius:4,cursor:"pointer",fontWeight:700,border:"1px solid",
                            background:isAbsent?"#10b98122":"#ef444422",color:isAbsent?"#10b981":"#ef4444",
                            borderColor:isAbsent?"#10b981":"#ef4444"}}>
                          {isAbsent?"복원":"불참"}
                        </button>
                      </td>
                    </tr>;
                  })}
                </tbody></table>
              </div>;
            };

            const catClr=(c)=>({"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"}[c]||C.dim);

            // ── 모든 세션 스타트리스트 일괄 생성 ──
            const generateAllStartLists=()=>{
              const evCodeSet=new Set(sessions.map(s=>s.evCode));
              const newSL={...startLists};
              let totalPlayers=0, totalSessions=0;
              evCodeSet.forEach(evCode=>{
                const evSessions=sessions.filter(s=>s.evCode===evCode).sort((a,b)=>a.relay-b.relay);
                const evObj=events.find(e=>e.code===evCode);
                const isMx=evObj&&evObj.type==="mixed";
                let evParticipants=[];
                if(isMx){
                  evParticipants=groupMixedTeams(allTeamEntries.filter(t=>t.event_code===evCode),memberMap,memberAppMap);
                } else {
                  const evEntries=allEntries.filter(e=>e.event_code===evCode);
                  evParticipants=evEntries.map(e=>{const m=memberMap[e.member_id];const app=memberAppMap[e.member_id];return m?{memberId:m.id,name:m.name,subOrg:m.sub_org,orgName:app?.org_name||"-",regionName:app?.region_name||"-"}:null;}).filter(Boolean);
                }
                if(evParticipants.length===0) return;
                const evSorted=[...evParticipants].sort((a,b)=>{const ai=regionOrder.indexOf(a.regionName),bi=regionOrder.indexOf(b.regionName);return (ai===-1?99:ai)-(bi===-1?99:bi);});
                if(isMx) evSorted.forEach((p,i)=>{const ov2=(orgNumOverrides[evCode]||{})[String(p.memberId)];p._orgNum=ov2||i+1;if(p._team)p._team.forEach(m=>{m._orgNum=p._orgNum;});});
                const evOrgOrder=[]; evSorted.forEach(p=>{if(!evOrgOrder.includes(p.orgName))evOrgOrder.push(p.orgName);});
                const evOrgNumMap={}; evOrgOrder.forEach((org,i)=>{evOrgNumMap[org]=i+1;});
                if(!isMx) evSorted.forEach(p=>{const ov2=(orgNumOverrides[evCode]||{})[String(p.memberId)];if(ov2!==undefined)p._orgNum=ov2;else if(!p._orgNum)p._orgNum=evOrgNumMap[p.orgName];});
                // ── 조 배정 확인 ──
                const evRA=relayAssign[evCode]||{};
                const hasRA=evSessions.length>1&&Object.keys(evRA).length>0;
                if(hasRA){
                  // 조 배정 기반: 세션별로 해당 조 참가자만 필터 → 독립 셔플
                  evSessions.forEach(ss=>{
                    const lanes=getSessionLanes(ss.key);
                    const relayNum=ss.relay;
                    const relayP=evSorted.filter(p=>{const ra=evRA[String(p.memberId)];return ra===relayNum;});
                    if(relayP.length===0){newSL[ss.key]=[];totalSessions++;return;}
                    const rOrgMap={};relayP.forEach(p=>{if(!rOrgMap[p.orgName])rOrgMap[p.orgName]=p._orgNum||evOrgNumMap[p.orgName]||1;});
                    const shuffled=buildStartList(relayP,rOrgMap);
                    if(isMx){
                      const rows=[];
                      shuffled.forEach((tp,ti)=>{const tn=tp._orgNum||1;const team=tp._team||[tp];const ln1=lanes[ti*2]?ss.relay+"-"+lanes[ti*2]:null;const ln2=lanes[ti*2+1]?ss.relay+"-"+lanes[ti*2+1]:null;team.forEach((m,mi)=>{rows.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,lane:mi===0?ln1:ln2,absent:false,remark:"",_teamIdx:ti,_orgNum:tn});});});
                      newSL[ss.key]=rows;
                      totalPlayers+=shuffled.reduce((s,t)=>(t._team?s+t._team.length:s+1),0);
                    } else {
                      newSL[ss.key]=shuffled.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));
                      if(shuffled.length>lanes.length){const extra=shuffled.slice(lanes.length).map(p=>({...p,lane:null,absent:false,remark:""}));newSL[ss.key]=[...newSL[ss.key].slice(0,lanes.length),...extra];}
                      totalPlayers+=shuffled.length;
                    }
                    totalSessions++;
                  });
                } else {
                  // 기존 순차 분할 방식
                  const shuffled=buildStartList(evSorted,evOrgNumMap);
                  let offset=0;
                  if(isMx){
                    evSessions.forEach(ss=>{
                      const lanes=getSessionLanes(ss.key);const teamSlots=Math.floor(lanes.length/2);
                      const chunk=shuffled.slice(offset,offset+teamSlots);const rows=[];
                      chunk.forEach((tp,ti)=>{const tn=tp._orgNum||(offset+ti+1);(tp._team||[tp]).forEach((m,mi)=>{rows.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,lane:lanes[ti*2+mi]?ss.relay+"-"+lanes[ti*2+mi]:null,absent:false,remark:"",_teamIdx:ti,_orgNum:tn});});});
                      newSL[ss.key]=rows;offset+=teamSlots;totalSessions++;
                    });
                    if(offset<shuffled.length&&evSessions.length>0){const lk=evSessions[evSessions.length-1].key;const rem=[];shuffled.slice(offset).forEach(tp=>{const tn=tp._orgNum||0;(tp._team||[tp]).forEach(m=>{rem.push({memberId:m.memberId,name:m.name,subOrg:m.subOrg,orgName:m.orgName,regionName:m.regionName,lane:null,absent:false,remark:"",_orgNum:tn});});});newSL[lk]=[...newSL[lk],...rem];}
                    totalPlayers+=shuffled.reduce((s,t)=>(t._team?s+t._team.length:s+1),0);
                  } else {
                    evSessions.forEach(ss=>{const lanes=getSessionLanes(ss.key);const count=lanes.length;const chunk=shuffled.slice(offset,offset+count);newSL[ss.key]=chunk.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));offset+=count;totalSessions++;});
                    if(offset<shuffled.length&&evSessions.length>0){const lk=evSessions[evSessions.length-1].key;newSL[lk]=[...newSL[lk],...shuffled.slice(offset).map(p=>({...p,lane:null,absent:false,remark:""}))];};
                    totalPlayers+=shuffled.length;
                  }
                }
              });
              setStartLists(newSL);
              setSlSavedKeys(prev=>{const next=new Set(prev);sessions.forEach(s=>next.delete(s.key));return next;});
              flash("전체 스타트리스트 생성 완료: "+totalPlayers+"명 → "+totalSessions+"개 세션");
              // DB 자동 저장
              dbSave("startlists",newSL);
              const allKeys=Object.keys(newSL).filter(k=>newSL[k]&&newSL[k].length>0);
              syncStartlistSessions(newSL,allKeys);
              setSlSavedKeys(new Set(allKeys));
            };

            // 세션 상태: 0=미생성, 1=생성(미저장), 2=저장완료
            const getSessionStatus=(sKey)=>{
              const hasSL=!!startLists[sKey]&&startLists[sKey].length>0;
              if(!hasSL) return 0;
              return slSavedKeys.has(sKey)?2:1;
            };

            return (<div>
              {/* ── 세션 팔레트 ── */}
              {sessions.length===0?(
                <div style={{textAlign:"center",padding:60,color:C.dimmer}}>
                  <div style={{fontSize:40,marginBottom:12}}>🎯</div>
                  <div style={{fontSize:14}}>참가자가 등록된 종목이 없습니다</div>
                  <div style={{fontSize:12,marginTop:6,color:C.dim}}>참가신청 탭에서 신청 현황을 확인하세요</div>
                </div>
              ):(
                <>
                  <div style={{marginBottom:16,padding:12,background:C.card,borderRadius:10,border:"1px solid "+C.border}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                      <div style={{fontSize:11,fontWeight:700,color:C.gold}}>📋 종목 팔레트</div>
                      <div style={{fontSize:9,color:C.dim}}>
                        <span style={{color:"#ef4444"}}>●</span>미생성 <span style={{color:"#fbbf24"}}>●</span>생성 <span style={{color:"#4ade80"}}>●</span>완료 <span style={{color:"#888"}}>○</span>사대미배정
                      </div>
                      <div style={{flex:1}}/>
                      {sessions.some(s=>!s.virtual)&&<>
                        <button style={{...S.btn(C.blue,C.bg),fontSize:10,padding:"4px 10px"}} onClick={generateAllStartLists}>🔀 전체 생성</button>
                        <button style={{...S.btn(C.gold,C.bg),fontSize:10,padding:"4px 10px"}} onClick={()=>{generateAllStartLists();flash("전체 생성+저장 완료");}}>⚡ 생성+저장</button>
                      </>}
                    </div>
                    {/* ── 카테고리 드롭다운 그룹 ── */}
                    {(()=>{
                      // 종목을 evCode 그룹 → 카테고리 그룹으로
                      const evGroups=[];
                      sessions.forEach(s=>{
                        let g=evGroups.find(x=>x.evCode===s.evCode);
                        if(!g){const ev=events.find(e=>e.code===s.evCode);g={evCode:s.evCode,evName:s.evName,category:ev?.category||s.category||"기타",relays:[]};evGroups.push(g);}
                        g.relays.push(s);
                      });
                      evGroups.forEach(g=>g.relays.sort((a,b)=>a.relay-b.relay));
                      // 카테고리별 그룹
                      const CAT_ORDER=["소총","소총(SH2)","권총","산탄총","청각"];
                      const catGroups={};
                      evGroups.forEach(g=>{const cat=CAT_ORDER.includes(g.category)?g.category:"기타";if(!catGroups[cat])catGroups[cat]=[];catGroups[cat].push(g);});
                      const catKeys=[...CAT_ORDER.filter(c=>catGroups[c]),...Object.keys(catGroups).filter(c=>!CAT_ORDER.includes(c))];
                      const catColorMap={"소총":"#3b82f6","소총(SH2)":"#f59e0b","권총":"#8b5cf6","산탄총":"#10b981","청각":"#ec4899","기타":"#6b7d94"};
                      return <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                        {catKeys.map(cat=>{
                          const catEvs=catGroups[cat];
                          const cc=catColorMap[cat]||C.dim;
                          const isOpen=openPaletteCat===cat;
                          const selInCat=selEvCode&&catEvs.some(g=>g.evCode===selEvCode);
                          // 카테고리 상태: 모든 세션 저장완료=2, 하나라도 미생성=0, 나머지=1
                          const allSessions=catEvs.flatMap(g=>g.relays);
                          const realSessions=allSessions.filter(s=>!s.virtual);
                          const statuses=realSessions.map(s=>getSessionStatus(s.key));
                          const catStatus=statuses.length===0?-1:statuses.every(s=>s===2)?2:statuses.some(s=>s===0)?0:1;
                          const catStatusClr=catStatus===2?"#4ade80":catStatus===1?"#fbbf24":catStatus===0?"#ef4444":"#888";
                          const totalEvCnt=catEvs.reduce((s,g)=>s+(evCountMap[g.evCode]||0),0);
                          return <div key={cat} style={{position:"relative"}}>
                            <button onClick={()=>setOpenPaletteCat(isOpen?null:cat)} style={{
                              padding:"7px 14px",borderRadius:8,fontSize:12,fontWeight:selInCat||isOpen?700:500,cursor:"pointer",
                              border:"2px solid "+(selInCat?cc:isOpen?cc+"88":C.border),
                              background:selInCat?cc+"22":isOpen?cc+"11":"transparent",
                              color:selInCat||isOpen?cc:C.dim,display:"flex",alignItems:"center",gap:6
                            }}>
                              <span style={{width:8,height:8,borderRadius:4,background:catStatusClr,display:"inline-block",boxShadow:"0 0 4px "+catStatusClr+"66"}}/>
                              {cat}
                              <span style={{fontSize:9,opacity:.6}}>({catEvs.length}종목 {totalEvCnt}명)</span>
                              <span style={{fontSize:10,opacity:.5}}>{isOpen?"▲":"▼"}</span>
                            </button>
                            {/* 드롭다운 */}
                            {isOpen&&<>
                              <div onClick={()=>setOpenPaletteCat(null)} style={{position:"fixed",inset:0,zIndex:90}}/>
                              <div style={{position:"absolute",top:"100%",left:0,marginTop:4,zIndex:91,background:C.card,border:"1px solid "+cc+"44",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,.5)",minWidth:280,maxWidth:400,maxHeight:400,overflow:"auto",padding:8}}>
                                {catEvs.map(g=>{
                                  const isEvSel=selEvCode===g.evCode;
                                  const isVirtual=g.relays.length===1&&g.relays[0].virtual;
                                  const cnt=evCountMap[g.evCode]||0;
                                  const ev=events.find(e=>e.code===g.evCode);
                                  const unit=ev?.type==="mixed"?"팀":"명";
                                  return <div key={g.evCode} style={{padding:6,borderRadius:6,marginBottom:2,background:isEvSel?cc+"18":"transparent",border:isEvSel?"1px solid "+cc+"44":"1px solid transparent"}}>
                                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:isVirtual?0:4}}>
                                      <span style={{fontSize:12,fontWeight:700,color:cc}}>{g.evCode}</span>
                                      <span style={{fontSize:10,color:C.dim,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(g.evName||"").replace(g.evCode+" ","")}</span>
                                      <span style={{fontSize:9,color:"#aaa"}}>{cnt}{unit}</span>
                                    </div>
                                    {isVirtual?(
                                      <div onClick={()=>{setSelectedEvCode(g.relays[0].key);setOpenPaletteCat(null);}}
                                        style={{fontSize:10,color:"#888",cursor:"pointer",padding:"2px 8px"}}>○ 사대미배정 — 클릭하여 참가현황 확인</div>
                                    ):(
                                      <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                                        {g.relays.map(r=>{
                                          const isSel=selectedEvCode===r.key;
                                          const st=getSessionStatus(r.key);
                                          const stClr=st===2?"#4ade80":st===1?"#fbbf24":"#ef4444";
                                          return <button key={r.key} onClick={()=>{setSelectedEvCode(isSel?null:r.key);setOpenPaletteCat(null);}} style={{
                                            padding:"4px 10px",borderRadius:5,fontSize:10,fontWeight:isSel?700:400,cursor:"pointer",
                                            background:isSel?cc+"33":C.bg,color:isSel?cc:"#aaa",
                                            border:"1px solid "+(isSel?cc:C.border),display:"flex",alignItems:"center",gap:4
                                          }}>
                                            {r.relay}조 <span style={{opacity:.5}}>({r.laneCount})</span>
                                            <span style={{width:6,height:6,borderRadius:3,background:stClr,display:"inline-block"}}/>
                                          </button>;
                                        })}
                                      </div>
                                    )}
                                  </div>;
                                })}
                              </div>
                            </>}
                          </div>;
                        })}
                      </div>;
                    })()}
                  </div>

                  {/* ── 선택된 세션 상세 ── */}
                  {selSession&&<div>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                      <span style={{fontSize:16,fontWeight:800,color:catClr(selSession.category)}}>{selSession.evName}{selSession.virtual?"":" "+selSession.relay+"조"}</span>
                      <span style={{fontSize:12,color:C.dim}}>{selSession.virtual?"사대 미배정":selSession.laneCount+"사대"} · {participantCount} 참가(종목 전체){sibSessions.filter(s=>!s.virtual).length>1?" · 총 "+sibSessions.reduce((s,ss)=>s+ss.laneCount,0)+"사대":""}</span>
                      {sibSessions.filter(s=>!s.virtual).length>1&&<span style={{fontSize:11,color:C.gold}}>📌 {selEvCode} 총 {sibSessions.filter(s=>!s.virtual).length}개 세션</span>}
                    </div>
                    <div style={{display:"flex",gap:6,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
                      <button style={{...S.btn(C.gold,C.bg),fontSize:11,padding:"5px 10px"}} onClick={()=>{
                        // 테스트 데이터 생성 (기존 함수 재활용)
                        const lastNames=["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","류","전"];
                        const firstNames=["민준","서준","도윤","예준","시우","하준","주원","지호","지후","준서","수아","서윤","지우","하은","서연","민서","하윤","유진","윤서","지은"];
                        const regions=["서울","부산","대구","인천","광주","대전","울산","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
                        const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
                        const keepEntries=allEntries.filter(e=>e.event_code!==selEvCode);
                        const usedMemIds=new Set(keepEntries.map(e=>e.member_id));
                        const keepMembers=allMembers.filter(m=>usedMemIds.has(m.id));
                        const keepAppMap={...appMap};
                        const nOrgs=8+Math.floor(Math.random()*9);
                        const selRegions=[...regions].sort(()=>Math.random()-0.5).slice(0,nOrgs);
                        const newMembers=[],newEntries=[],newTeamEntries=[];
                        const maxId=allMembers.reduce((mx,m)=>{const n=parseInt(String(m.id).replace(/\D/g,""))||0;return Math.max(mx,n);},0);
                        let mId=maxId+1, appId=Object.keys(keepAppMap).length+1;
                        if(selIsMixed){
                          // 혼성팀: 단체당 남녀 1명씩 = 1팀
                          selRegions.forEach(region=>{
                            const org=region+"장애인체육회";
                            let aId=Object.keys(keepAppMap).find(k=>keepAppMap[k].org_name===org);
                            if(!aId){aId="test-app-"+appId++;keepAppMap[aId]={id:aId,org_name:org,region_name:region};}
                            const mid1="test-m-"+mId++, mid2="test-m-"+mId++;
                            newMembers.push({id:mid1,application_id:aId,name:pick(lastNames)+pick(firstNames),sub_org:region+"일반",gender:"남"});
                            newMembers.push({id:mid2,application_id:aId,name:pick(lastNames)+pick(firstNames),sub_org:region+"일반",gender:"여"});
                            newTeamEntries.push({member_id:mid1,event_code:selEvCode,application_id:aId,team_number:1,slot_order:0,team_type:"mixed"});
                            newTeamEntries.push({member_id:mid2,event_code:selEvCode,application_id:aId,team_number:1,slot_order:1,team_type:"mixed"});
                          });
                          setEvPData({allMembers:[...keepMembers,...newMembers],allEntries:keepEntries,allTeamEntries:[...allTeamEntries,...newTeamEntries],appMap:keepAppMap});
                          flash(selEvCode+" 혼성팀 테스트 데이터 생성: "+selRegions.length+"팀 "+(selRegions.length*2)+"명");
                        } else {
                          selRegions.forEach(region=>{
                            const org=region+"장애인체육회";
                            let aId=Object.keys(keepAppMap).find(k=>keepAppMap[k].org_name===org);
                            if(!aId){aId="test-app-"+appId++;keepAppMap[aId]={id:aId,org_name:org,region_name:region};}
                            const nPpl=3+Math.floor(Math.random()*2);
                            for(let j=0;j<nPpl;j++){
                              const mid="test-m-"+mId++;
                              newMembers.push({id:mid,application_id:aId,name:pick(lastNames)+pick(firstNames),sub_org:region+"일반",gender:Math.random()>0.5?"남":"여"});
                              newEntries.push({member_id:mid,event_code:selEvCode,application_id:aId});
                            }
                          });
                          setEvPData({allMembers:[...keepMembers,...newMembers],allEntries:[...keepEntries,...newEntries],allTeamEntries,appMap:keepAppMap});
                          flash(selEvCode+" 테스트 데이터 생성: "+newMembers.length+"명");
                        }
                      }}>🧪 테스트 데이터</button>
                      {participants.length>0&&<button style={{...S.btn(C.red,C.bg),fontSize:11,padding:"5px 10px"}} onClick={()=>{
                        const keepEntries=allEntries.filter(e=>e.event_code!==selEvCode);
                        const keepTeamEntries=allTeamEntries.filter(t=>t.event_code!==selEvCode);
                        const usedMemIds=new Set([...keepEntries.map(e=>e.member_id),...keepTeamEntries.map(t=>t.member_id)]);
                        const keepMembers=allMembers.filter(m=>usedMemIds.has(m.id));
                        setEvPData({allMembers:keepMembers,allEntries:keepEntries,allTeamEntries:keepTeamEntries,appMap});
                        sibSessions.forEach(ss=>{const sl={...startLists};delete sl[ss.key];setStartLists(sl);});
                        flash(selEvCode+" 데이터 초기화 완료");
                      }}>🗑 초기화</button>}
                      <button style={{...S.btn(C.blue,C.bg),fontSize:11,padding:"5px 10px"}} onClick={()=>{loadEvParticipants();}}>📥 참가신청 반영</button>
                      <span style={{fontSize:11,color:C.dim}}>{participantCount} 참가</span>
                    </div>

                    {/* 탭: 참가현황 / 스타트리스트 */}
                    {participants.length>0&&<div>
                      <div style={{display:"flex",gap:0,marginBottom:12,borderBottom:"2px solid "+C.border}}>
                        {[["list","📋 참가 현황"],["start","🔀 스타트리스트"]].map(([k,l])=>(
                          <button key={k} onClick={()=>setEvpView(k)} style={{
                            padding:"8px 20px",fontSize:13,fontWeight:evpView===k?700:400,cursor:"pointer",
                            background:"transparent",border:"none",color:evpView===k?C.gold:C.dim,
                            borderBottom:evpView===k?"2px solid "+C.gold:"2px solid transparent",marginBottom:-2
                          }}>{l}</button>
                        ))}
                      </div>

                      {evpView==="list"&&<div>
                        <div style={{display:"flex",gap:6,marginBottom:10,alignItems:"center",flexWrap:"wrap"}}>
                          <span style={{fontSize:12,color:C.dim}}>시도 기준 정렬 · {participantCount} (종목 전체)</span>
                          {totalRelays>1&&<>
                            <button style={{...S.btn("#8b5cf6",C.bg),fontSize:11,padding:"5px 12px"}} onClick={autoDistributeRelays}>🔀 자동 조 배분</button>
                            <span style={{fontSize:10,color:C.dim}}>
                              {(()=>{
                                const counts={};(selIsMixed?flatParticipants:sorted).forEach(p=>{const r=getParticipantRelay(p);const k=r||0;counts[k]=(counts[k]||0)+1;});
                                const parts=sibSessions.map(ss=>{const c=counts[ss.relay]||0;const lanes=getSessionLanes(ss.key).length;return ss.relay+"조:"+c+"명/"+lanes+"사대";});
                                if(counts[0]) parts.push("미배정:"+counts[0]+"명");
                                return parts.join(" · ");
                              })()}
                            </span>
                          </>}

              Object.keys(tmc).forEach(ec=>{const ev=events.find(e=>e.code===ec);if(ev&&(ev.type==="mixed"||ev.type==="team")){evCountMap[ec]=(evCountMap[ec]||0)+Math.floor(tmc[ec]/(ev?.team_size||2));}});
            }

            const updSched=(fn)=>{const nd=JSON.parse(JSON.stringify(schedData));fn(nd);setSchedData(nd);};
            const addRow=(dayIdx,overrides={})=>updSched(nd=>{nd[dayIdx].rows.push(newSchedRow(overrides));});
            const removeRow=(dayIdx,rowIdx)=>updSched(nd=>{
              const removed=nd[dayIdx].rows.splice(rowIdx,1)[0];
              if(removed.event_code&&removed.type==="prelim"){
                removePETAuto(nd,dayIdx,removed.event_code,removed.relay||"1");
              }
            });
            const updateRow=(dayIdx,rowIdx,key,val)=>updSched(nd=>{nd[dayIdx].rows[rowIdx][key]=val;});
            const moveRow=(dayIdx,rowIdx,dir)=>updSched(nd=>{
              const rows=nd[dayIdx].rows;const ni=rowIdx+dir;
              if(ni<0||ni>=rows.length) return;
              [rows[rowIdx],rows[ni]]=[rows[ni],rows[rowIdx]];
            });
            // 행 드래그앤드롭 리오더
            const dropRow=(fromDayIdx,fromRowIdx,toDayIdx,toRowIdx)=>{
              updSched(nd=>{
                if(fromDayIdx===toDayIdx){
                  const rows=nd[fromDayIdx].rows;
                  const [moved]=rows.splice(fromRowIdx,1);
                  const insertAt=toRowIdx>fromRowIdx?toRowIdx-1:toRowIdx;
                  rows.splice(insertAt,0,moved);
                } else {
                  const [moved]=nd[fromDayIdx].rows.splice(fromRowIdx,1);
                  nd[toDayIdx].rows.splice(toRowIdx,0,moved);
                }
              });
              setSchedRowDrag(null); setSchedRowOver(null);
            };
            const addPETAuto=(nd,dayIdx,eventCode,relay)=>{
              if(dayIdx<=0) return;
              const prev=nd[dayIdx-1];
              const petKey=eventCode+"_"+relay;
              if(prev.rows.some(r=>r.event_code===eventCode&&r.type==="pet"&&r.relay==String(relay))) return;
              prev.rows.push(newSchedRow({category:evToCategory(eventCode),content:"공식 훈련 ("+eventCode+" "+relay+"조)",event_code:eventCode,type:"pet",relay:String(relay)}));
            };
            const removePETAuto=(nd,dayIdx,eventCode,relay)=>{
              if(dayIdx<=0) return;
              nd[dayIdx-1].rows=nd[dayIdx-1].rows.filter(r=>!(r.event_code===eventCode&&r.type==="pet"&&r.relay==String(relay)));
            };
            const assignSlot=(dayIdx,rowIdx,slotKey)=>updSched(nd=>{
              const[evCode,relayStr]=slotKey.split("_");
              const relay=relayStr||"1";
              // 같은 종목의 다른 조가 다른 일차에 있는지 확인
              let otherDayIdx=null;
              nd.forEach((d,di)=>{if(di!==dayIdx) d.rows.forEach(r=>{if(r.event_code===evCode&&r.type==="prelim"){otherDayIdx=di;}});});
              if(otherDayIdx!==null){flash(evCode+" "+relay+"조: 같은 종목의 모든 조는 동일 일차에 배치해야 합니다 (현재 "+(otherDayIdx+1)+"일차에 배치됨)","error");return;}
              const row=nd[dayIdx].rows[rowIdx];
              if(row.event_code&&row.type==="prelim") removePETAuto(nd,dayIdx,row.event_code,row.relay||"1");
              const ev=events.find(e=>e.code===evCode);
              row.event_code=evCode;row.type="prelim";row.relay=relay;
              row.category=evToCategory(evCode);row.content=(ev?ev.name:"")+" "+relay+"조";
              addPETAuto(nd,dayIdx,evCode,relay);
            });
            const clearEv=(dayIdx,rowIdx)=>updSched(nd=>{
              const row=nd[dayIdx].rows[rowIdx];
              if(row.event_code&&row.type==="prelim") removePETAuto(nd,dayIdx,row.event_code,row.relay||"1");
              row.event_code="";row.type="custom";row.content="";row.category="";row.relay="";
            });
            const catClr=(c)=>({"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"}[c]||C.dim);
            const evClr=(code)=>catClr(evToCategory(code));
            // 구분 rowSpan 계산
            const calcSpans=(rows)=>{
              const spans=new Array(rows.length).fill(1);const sk=new Set();
              for(let i=0;i<rows.length;i++){
                if(sk.has(i)||!rows[i].category) continue;
                let cnt=1;
                while(i+cnt<rows.length&&rows[i+cnt].category===rows[i].category){sk.add(i+cnt);cnt++;}
                spans[i]=cnt;
              }
              return {spans,sk};
            };
            const fmtTime=(v)=>{
              const d=v.replace(/[^0-9]/g,"");
              if(d.length<=2) return d;
              if(d.length<=4) return d.slice(0,2)+":"+d.slice(2);
              if(d.length<=6) return d.slice(0,2)+":"+d.slice(2,4)+"-"+d.slice(4);
              return d.slice(0,2)+":"+d.slice(2,4)+"-"+d.slice(4,6)+":"+d.slice(6,8);
            };
            const cSt={padding:"10px 6px",borderBottom:"1px solid "+C.border,fontSize:12,verticalAlign:"middle"};
            const iSt={background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:"#fff",fontSize:11,padding:"6px 5px",width:"100%",boxSizing:"border-box"};

            // 사대배정에서 종목+조 슬롯 자동 생성
            const laneSlots=[];
            Object.keys(laneAssign).forEach(dayKey=>{
              const da=laneAssign[dayKey];
              Object.keys(da||{}).forEach(k=>{
                const a=da[k],p=evKeyParse(k);
                if(a&&a.lanes&&a.lanes.length>0){
                  const slotKey=p.evCode+"_"+a.relay;
                  if(!laneSlots.find(s=>s.key===slotKey)){
                    laneSlots.push({key:slotKey,evCode:p.evCode,relay:a.relay,laneDay:Number(dayKey),laneCount:a.lanes.length});
                  }
                }
              });
            });
            laneSlots.sort((a,b)=>a.evCode.localeCompare(b.evCode)||(a.relay-b.relay));
            // 스타트리스트가 저장된 세션만 팔레트에 표시
            const readySlots=laneSlots.filter(slot=>!!startLists[slot.key]&&startLists[slot.key].length>0);
            const notReadySlots=laneSlots.filter(slot=>!startLists[slot.key]||startLists[slot.key].length===0);
            const assignedSlots=new Set();
            schedData.forEach(d=>d.rows.forEach(r=>{if(r.event_code&&r.type==="prelim"&&r.relay)assignedSlots.add(r.event_code+"_"+r.relay);}));
            // 같은 종목의 모든 조를 동일 일차에 배치해야 하는 제약 확인
            const evDayMap={}; // evCode → 배치된 dayIdx
            schedData.forEach((d,di)=>d.rows.forEach(r=>{if(r.event_code&&r.type==="prelim"){evDayMap[r.event_code]=di;}}));

            return <div onClick={e=>{if(schedDropdown&&!e.target.closest('[data-sdd]'))setSchedDropdown(null);}}>
              {/* 종목·조 팔레트 (스타트리스트 저장 완료 세션만 표시) - 스크롤 시 고정 */}
              <div style={{position:"sticky",top:-24,zIndex:20,marginLeft:-24,marginRight:-24,marginTop:-24,padding:"24px 24px 12px",background:C.bg}}>
              <div style={{padding:12,background:C.card,borderRadius:10,border:"1px solid "+C.border}}>
                <div style={{fontSize:11,fontWeight:700,color:C.gold,marginBottom:4}}>📋 종목·조 팔레트 (슬롯 탭 선택 → 시간표 행 탭으로 배치 · 데스크탑: 드래그도 가능)</div>
                <div style={{fontSize:9,color:C.dim,marginBottom:8}}>⚠️ 같은 종목의 1조·2조는 반드시 동일 일차에 배치해야 합니다 (공식 훈련은 조별 별도 생성)</div>
                {readySlots.length===0?(
                  <div style={{fontSize:11,color:C.dimmer,fontStyle:"italic"}}>{laneSlots.length===0?"사대 배정 탭에서 종목별 사대를 먼저 배정하세요":"종목별 현황 탭에서 스타트리스트를 먼저 생성·저장하세요"}</div>
                ):(
                  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                    {readySlots.map(slot=>{
                      const used=assignedSlots.has(slot.key);
                      const ev=events.find(e=>e.code===slot.evCode);
                      const siblingDay=evDayMap[slot.evCode]!==undefined?evDayMap[slot.evCode]+1:null;
                      const isSlotSel=schedDrag===slot.key;
                      return <div key={slot.key} draggable={!used}
                        onDragStart={e=>{if(!used){setSchedDrag(slot.key);e.dataTransfer.effectAllowed="move";}}}
                        onDragEnd={()=>setSchedDrag(null)}
                        onClick={()=>{if(!used)setSchedDrag(prev=>prev===slot.key?null:slot.key);}}
                        title={(ev?.name||slot.evCode)+" "+slot.relay+"조 ("+slot.laneCount+"사대)"+(siblingDay&&!used?" → "+siblingDay+"일차에 배치 필요":"")}
                        style={{padding:"3px 8px",borderRadius:5,fontSize:10,fontWeight:600,cursor:used?"default":"pointer",
                          background:used?"#333":isSlotSel?evClr(slot.evCode)+"44":evClr(slot.evCode)+"22",color:used?"#555":evClr(slot.evCode),
                          border:"2px solid "+(isSlotSel?evClr(slot.evCode):used?"#444":siblingDay&&!used?"#fbbf24":evClr(slot.evCode)+"55"),
                          opacity:used?0.4:1,textDecoration:used?"line-through":"none",
                          boxShadow:isSlotSel?"0 0 8px "+evClr(slot.evCode)+"66":"none"}}>
                        {slot.evCode} {slot.relay}조 <span style={{fontSize:8,opacity:0.7}}>({slot.laneCount})</span>
                        {siblingDay&&!used&&<span style={{fontSize:7,color:"#fbbf24",marginLeft:3}}>→{siblingDay}일</span>}
                      </div>;
                    })}
                  </div>
                )}
                {notReadySlots.length>0&&<div style={{marginTop:8,fontSize:10,color:"#ef4444"}}>
                  ⏳ 스타트리스트 미완료: {notReadySlots.map(s=>s.evCode+" "+s.relay+"조").join(", ")}
                </div>}
                {schedDrag&&<div style={{marginTop:8,padding:"6px 12px",borderRadius:6,background:C.gold+"22",border:"1px solid "+C.gold+"66",fontSize:11,color:C.gold,fontWeight:600}}>
                  ✅ {schedDrag.split("_")[0]} {schedDrag.split("_")[1]||"1"}조 선택됨 — 아래 시간표 행을 탭하여 배치 <button onClick={()=>setSchedDrag(null)} style={{marginLeft:8,fontSize:10,padding:"1px 8px",borderRadius:4,background:C.gold+"33",color:C.gold,border:"1px solid "+C.gold+"66",cursor:"pointer"}}>선택 해제</button>
                </div>}
                {schedRowDrag&&<div style={{marginTop:4,padding:"6px 12px",borderRadius:6,background:"#3b82f622",border:"1px solid #3b82f666",fontSize:11,color:"#60a5fa",fontWeight:600}}>
                  ↕️ 행 이동 중 — 이동할 위치의 행을 탭하세요 <button onClick={()=>{setSchedRowDrag(null);setSchedRowOver(null);}} style={{marginLeft:8,fontSize:10,padding:"1px 8px",borderRadius:4,background:"#3b82f633",color:"#60a5fa",border:"1px solid #3b82f666",cursor:"pointer"}}>취소</button>
                </div>}
              </div>
              </div>{/* sticky 끝 */}

              {/* 일자별 */}
              {schedData.map((day,dayIdx)=>{
                const {spans,sk}=calcSpans(day.rows);
                return <div key={day.day} style={{marginBottom:20,border:"1px solid "+C.border,borderRadius:10,position:"relative"}}>
                  {/* 일차 헤더 - 항상 표시 */}
                  <div style={{display:"flex",alignItems:"center",padding:"10px 16px",background:C.sidebar,borderBottom:"1px solid "+C.border,borderRadius:"10px 10px 0 0"}}>
                    <span style={{fontSize:14,fontWeight:800,color:C.gold}}>{day.day}일차</span>
                    <span style={{fontSize:11,color:C.dim,marginLeft:8}}>({day.rows.length}개 세션)</span>
                    <div style={{flex:1}}/>
                    <button style={{...S.sm(C.gold),fontSize:10,padding:"3px 10px"}} onClick={()=>addRow(dayIdx)}>+ 행 추가</button>
                  </div>
                  {day.rows.length>0&&(
                    <table style={{width:"100%",borderCollapse:"collapse"}}>
                      <thead><tr style={{background:C.sidebar+"88"}}>
                        {["구분","내용","조","시간","인원","비고","진행",""].map((h,hi)=>
                          <th key={hi} style={{...cSt,fontWeight:700,color:C.dim,fontSize:10,padding:"6px 6px",
                            width:hi===0?56:hi===2?40:hi===3?110:hi===4?50:hi===5?60:hi===6?60:hi===7?36:undefined,
                            minWidth:hi===1?120:undefined}}>{h}</th>
                        )}
                      </tr></thead>
                      <tbody>
                        {day.rows.map((row,ri)=>{
                          const isPET=row.type==="pet";
                          const showCat=!sk.has(ri);
                          const isDragSrc=schedRowDrag&&schedRowDrag.dayIdx===dayIdx&&schedRowDrag.rowIdx===ri;
                          const isInsertBefore=schedRowDrag&&schedRowOver&&schedRowOver.dayIdx===dayIdx&&schedRowOver.rowIdx===ri&&!isDragSrc;
                          const isInsertAfterLast=schedRowDrag&&schedRowOver&&schedRowOver.dayIdx===dayIdx&&schedRowOver.rowIdx===day.rows.length&&ri===day.rows.length-1&&!isDragSrc;
                          const rowBg=isPET?"#422006":ri%2===0?"transparent":C.card+"33";
                          const isDropTarget=schedDrag&&!isPET;
                          return <tr key={row.id} style={{
                              background:isDragSrc?"#1e293b44":rowBg,
                              opacity:isDragSrc?0.35:1, transition:"opacity .12s",
                              cursor:isDropTarget?"pointer":undefined,
                              outline:isDropTarget?"1px dashed "+C.gold+"44":"none",
                              boxShadow:isInsertBefore?"inset 0 3px 0 "+C.gold+", 0 -2px 6px "+C.gold+"44"
                                :isInsertAfterLast?"inset 0 -3px 0 "+C.gold+", 0 2px 6px "+C.gold+"44":"none",
                              position:"relative", zIndex:isInsertBefore||isInsertAfterLast?2:undefined
                            }}
                            onDragOver={e=>{
                              if(schedRowDrag){e.preventDefault();e.dataTransfer.dropEffect="move";
                                const rect=e.currentTarget.getBoundingClientRect();const mid=rect.top+rect.height/2;
                                const insertIdx=e.clientY<mid?ri:ri+1;
                                if(!schedRowOver||schedRowOver.dayIdx!==dayIdx||schedRowOver.rowIdx!==insertIdx) setSchedRowOver({dayIdx,rowIdx:insertIdx});}
                              if(schedDrag&&!isPET) e.preventDefault();
                            }}
                            onDrop={e=>{e.preventDefault();
                              if(schedRowDrag){const toIdx=schedRowOver?schedRowOver.rowIdx:ri; dropRow(schedRowDrag.dayIdx,schedRowDrag.rowIdx,dayIdx,toIdx);}
                              if(schedDrag&&!isPET){assignSlot(dayIdx,ri,schedDrag);setSchedDrag(null);}
                            }}
                            onClick={()=>{
                              if(schedDrag&&!isPET){assignSlot(dayIdx,ri,schedDrag);setSchedDrag(null);return;}
                              if(schedRowDrag&&!(schedRowDrag.dayIdx===dayIdx&&schedRowDrag.rowIdx===ri)){
                                dropRow(schedRowDrag.dayIdx,schedRowDrag.rowIdx,dayIdx,ri);return;}
                            }}>
                            {/* 구분 */}
                            {showCat&&<td rowSpan={spans[ri]} style={{...cSt,textAlign:"center",fontWeight:700,fontSize:11,
                              color:catClr(row.category),background:row.category?catClr(row.category)+"11":"transparent",
                              borderRight:"1px solid "+C.border}}>
                              {row.category||(!isPET&&<select value="" onChange={e=>updateRow(dayIdx,ri,"category",e.target.value)}
                                style={{...iSt,width:48,fontSize:9,textAlign:"center",color:C.dim}}>
                                <option value="">-</option>{SCHED_CATS.filter(Boolean).map(c=><option key={c} value={c}>{c}</option>)}
                              </select>)}
                            </td>}
                            {/* 내용 */}
                            <td style={{...cSt,position:"relative"}} data-sdd="1">
                              {isPET?(
                                <span style={{color:"#fbbf24",fontSize:11,fontWeight:600}}>🔸 공식 훈련 ({row.event_code} {row.relay?row.relay+"조":""})</span>
                              ):row.event_code?(
                                <div style={{display:"flex",alignItems:"center",gap:6}}>
                                  <span style={{padding:"1px 6px",borderRadius:4,fontSize:9,fontWeight:700,background:evClr(row.event_code)+"22",color:evClr(row.event_code),whiteSpace:"nowrap"}}>{row.event_code}{row.relay?" "+row.relay+"조":""}</span>
                                  <span style={{fontSize:11,color:"#ddd",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{row.content.replace(row.event_code+" ","")}</span>
                                  <button onClick={()=>clearEv(dayIdx,ri)} style={{fontSize:9,background:"none",border:"none",color:"#666",cursor:"pointer",flexShrink:0}}>✕</button>
                                </div>
                              ):(
                                <div style={{position:"relative"}}>
                                  <div onClick={e=>{e.stopPropagation();setSchedDropdown(schedDropdown&&schedDropdown.dayIdx===dayIdx&&schedDropdown.rowIdx===ri?null:{dayIdx,rowIdx:ri});}}
                                    style={{padding:"6px 10px",borderRadius:4,cursor:"pointer",border:"1px dashed "+C.border,fontSize:12,color:C.dim,
                                      display:"flex",alignItems:"center",gap:6,minHeight:32,
                                      background:schedDropdown&&schedDropdown.dayIdx===dayIdx&&schedDropdown.rowIdx===ri?C.border+"33":"transparent"}}>
                                    <span style={{flex:1}}>{row.content||"클릭하여 종목 선택..."}</span>
                                    <span style={{fontSize:10,color:C.gold}}>▼</span>
                                  </div>
                                  {schedDropdown&&schedDropdown.dayIdx===dayIdx&&schedDropdown.rowIdx===ri&&(
                                    <div data-sdd="1" style={{position:"absolute",top:"100%",left:0,zIndex:100,background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:4,
                                      maxHeight:320,overflowY:"auto",minWidth:300,boxShadow:"0 8px 24px rgba(0,0,0,.6)"}}>
                                      {/* 종목 리스트 (laneSlots 전체) */}
                                      {laneSlots.filter(s=>!assignedSlots.has(s.key)).length>0&&<>
                                        {laneSlots.filter(s=>!assignedSlots.has(s.key)).map(slot=>{
                                          const ev=events.find(e=>e.code===slot.evCode);
                                          const ready=!!startLists[slot.key]&&startLists[slot.key].length>0;
                                          return <div key={slot.key} onClick={()=>{assignSlot(dayIdx,ri,slot.key);setSchedDropdown(null);}}
                                            style={{padding:"8px 10px",fontSize:12,cursor:"pointer",borderRadius:4,display:"flex",gap:8,alignItems:"center"}}
                                            onMouseEnter={e=>e.currentTarget.style.background=C.border+"66"}
                                            onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                                            <span style={{width:7,height:7,borderRadius:4,background:evClr(slot.evCode),flexShrink:0}}/>
                                            <span style={{fontWeight:700,color:evClr(slot.evCode),minWidth:30}}>{slot.evCode}</span>
                                            <span style={{color:C.gold,fontSize:11,fontWeight:600}}>{slot.relay}조</span>
                                            <span style={{color:C.dim,fontSize:10,flex:1}}>{ev?ev.name.replace(slot.evCode+" ",""):""}</span>
                                            {!ready&&<span style={{fontSize:8,color:"#f59e0b",flexShrink:0}}>⚠</span>}
                                          </div>;
                                        })}
                                      </>}
                                      {laneSlots.filter(s=>!assignedSlots.has(s.key)).length===0&&
                                        <div style={{padding:10,fontSize:11,color:C.dim,textAlign:"center"}}>배정 가능 종목 없음</div>}
                                      {/* 직접 입력 (하단) */}
                                      <div style={{padding:"6px 10px",borderTop:"1px solid "+C.border+"44",marginTop:4}}>
                                        <div style={{fontSize:9,color:C.dim,marginBottom:3}}>기타 (개회식, 점심 등):</div>
                                        <input value={row.content} onChange={e=>updateRow(dayIdx,ri,"content",e.target.value)}
                                          placeholder="직접 내용 입력..."
                                          onKeyDown={e=>{if(e.key==="Enter"||e.key==="Escape")setSchedDropdown(null);}}
                                          style={{...iSt,width:"100%",fontSize:11}}/>
                                      </div>
                                    </div>
                                  )}
                                </div>
                              )}
                            </td>
                            {/* 조 */}
                            <td style={cSt}>{!isPET&&(row.event_code&&row.relay?<span style={{fontSize:11,fontWeight:600,color:C.dim,textAlign:"center",display:"block"}}>{row.relay}조</span>:<input value={row.relay} onChange={e=>updateRow(dayIdx,ri,"relay",e.target.value)} placeholder="-" style={{...iSt,width:30,textAlign:"center"}}/>)}</td>
                            {/* 시간 */}
                            <td style={cSt}><input data-time-input={dayIdx+"-"+ri} value={row.time} onChange={e=>updateRow(dayIdx,ri,"time",fmtTime(e.target.value))} onKeyDown={e=>{
                              if(e.key==="Enter"){e.preventDefault();
                                const next=document.querySelector('[data-time-input="'+dayIdx+'-'+(e.shiftKey?ri-1:ri+1)+'"]');
                                if(next) next.focus();}
                            }} placeholder="00:00-00:00" style={{...iSt,width:96}}/></td>
                            {/* 인원 */}
                            <td style={cSt}>{!isPET&&(row.event_code?(
                              <span style={{fontSize:11,color:"#ddd",display:"block",textAlign:"center"}}>{evCountMap[row.event_code]?(evCountMap[row.event_code]+(events.find(e=>e.code===row.event_code)?.type==="mixed"?"팀":"명")):"-"}</span>
                            ):(
                              <input value={row.count} onChange={e=>updateRow(dayIdx,ri,"count",e.target.value)} placeholder="" style={{...iSt,width:44,textAlign:"center"}}/>
                            ))}</td>
                            {/* 비고 */}
                            <td style={cSt}><input value={row.remark} onChange={e=>updateRow(dayIdx,ri,"remark",e.target.value)} placeholder="" style={{...iSt,width:52}}/></td>
                            {/* 진행 상태 */}
                            <td style={{...cSt,textAlign:"center",padding:"2px 4px"}}>
                              {row.event_code&&row.type==="prelim"&&(()=>{
                                const sKey=row.event_code+"_"+row.relay;
                                const st=sessionStatuses[sKey]||"scheduled";
                                const stColors={scheduled:"#6b7280",prelim_done:"#f59e0b",completed:"#10b981"};

          {/* 사대 배정 */}

            const getEvColor=(code)=>{const idx=rangeEvents.findIndex(e=>e.code===code);return evColors[idx%evColors.length];};

            const dayAssign=laneAssign[laneDay]||{};

              const a=dayAssign[k],p=evKeyParse(k);

                // 팀 수 초과 체크 (evCountMap=팀 수, 사대=팀×2)

                const totalLanes=getTotalAssigned(laneSelEv);
                if(maxTeams>0&&Math.floor(totalLanes/2)>=maxTeams){flash(laneSelEv+" 전체 일차 합산 "+maxTeams+"팀 배정 완료","error");return;}
                const da={...dayAssign};
                const ek=evKeyMake(laneSelEv,laneRelay);

                const nb={...laneBroken};
                [n,n2].forEach(ln=>{
                  const o=laneOwner(ln);
                  if(o==="__broken__"){nb[laneRange]=(nb[laneRange]||[]).filter(x=>x!==ln);}
                  if(o&&o!=="__broken__"&&o!==laneSelEv) removeLaneFrom(da,ln);
                });
                const curSet=new Set(da[ek].lanes);curSet.add(n);curSet.add(n2);
                da[ek]={relay:laneRelay,lanes:[...curSet].sort((a,b)=>a-b)};
                setDayAssign(da);setLaneBroken(nb);
              } else {
                // 개인전: 기존 로직
                const owner=laneOwner(n);
                if(owner===laneSelEv) return;
                const maxCnt=evCountMap[laneSelEv]||0;
                if(maxCnt>0&&getTotalAssigned(laneSelEv)>=maxCnt){flash(laneSelEv+" 전체 일차 합산 "+maxCnt+"명 배정 완료","error");return;}
                const da={...dayAssign};
                const ek=evKeyMake(laneSelEv,laneRelay);
                if(!da[ek]) da[ek]={relay:laneRelay,lanes:[]};
                if(owner==="__broken__"){const nb={...laneBroken};nb[laneRange]=(nb[laneRange]||[]).filter(x=>x!==n);setLaneBroken(nb);}
                if(owner&&owner!=="__broken__") removeLaneFrom(da,n);
                da[ek]={relay:laneRelay,lanes:[...da[ek].lanes,n].sort((a,b)=>a-b)};
                setDayAssign(da);
              }
            };
            const clearLane=(n)=>{
              const da={...dayAssign};removeLaneFrom(da,n);setDayAssign(da);
            };
            const commitClearDrag=()=>{
              if(!laneClearDrag||laneClearDrag.start===null||laneClearDrag.hover===null){setLaneClearDrag(null);return;}
              const lo=Math.min(laneClearDrag.start,laneClearDrag.hover),hi=Math.max(laneClearDrag.start,laneClearDrag.hover);
              const da={...dayAssign};
              for(let n=lo;n<=hi;n++){removeLaneFrom(da,n);}
              setDayAssign(da);setLaneClearDrag(null);
            };
            const commitDrag=()=>{
              if(laneDragStart===null||laneDragHover===null){setLaneDragStart(null);setLaneDragHover(null);return;}
              let lo=Math.min(laneDragStart,laneDragHover),hi=Math.max(laneDragStart,laneDragHover);

              if(a&&a.lanes){evCurDayAssigned[p.evCode]=(evCurDayAssigned[p.evCode]||0)+a.lanes.length;}
