CREATE OR REPLACE FUNCTION submit_application(payload JSONB) RETURNS JSONB AS $$
DECLARE app_id INT; member_ids INT[]; member_id INT; member_rec JSONB; entry_rec JSONB; firearm_rec JSONB; team_rec JSONB;
BEGIN INSERT INTO applications (tournament_id, region_code, region_name, org_name) VALUES ((payload->>'tournament_id')::INT, payload->>'region_code', payload->>'region_name', payload->>'org_name') RETURNING id INTO app_id; member_ids := ARRAY[]::INT[];
FOR member_rec IN SELECT * FROM jsonb_array_elements(payload->'members') LOOP INSERT INTO members (application_id, name, gender, dob, role, sub_org, class_type, phone) VALUES (app_id, member_rec->>'name', member_rec->>'gender', (member_rec->>'dob')::DATE, member_rec->>'role', member_rec->>'sub_org', member_rec->>'class_type', member_rec->>'phone') RETURNING id INTO member_id; member_ids := array_append(member_ids, member_id);
IF member_rec ? 'events' THEN FOR entry_rec IN SELECT * FROM jsonb_array_elements(member_rec->'events') LOOP INSERT INTO individual_entries (application_id, member_id, event_code) VALUES (app_id, member_id, entry_rec #>> '{}'); END LOOP; END IF;
IF member_rec ? 'firearms' THEN FOR firearm_rec IN SELECT * FROM jsonb_array_elements(member_rec->'firearms') LOOP INSERT INTO firearms (member_id, gun_type, manufacturer, model, serial_number, permit_number) VALUES (member_id, firearm_rec->>'gun_type', firearm_rec->>'manufacturer', firearm_rec->>'model', firearm_rec->>'serial_number', firearm_rec->>'permit_number'); END LOOP; END IF; END LOOP;
IF payload ? 'teams' THEN FOR team_rec IN SELECT * FROM jsonb_array_elements(payload->'teams') LOOP DECLARE slot_idx INT; slot_arr JSONB; m_idx INT; BEGIN slot_arr := team_rec->'member_indices'; FOR slot_idx IN 0..jsonb_array_length(slot_arr)-1 LOOP m_idx := (slot_arr->slot_idx)::INT; IF m_idx >= 0 AND m_idx < array_length(member_ids, 1) THEN INSERT INTO team_entries (application_id, event_code, team_type, team_number, member_id, slot_order, is_union, union_memo) VALUES (app_id, team_rec->>'event_code', team_rec->>'team_type', COALESCE((team_rec->>'team_number')::INT,1), member_ids[m_idx+1], slot_idx, COALESCE((team_rec->>'is_union')::BOOLEAN,FALSE), team_rec->>'union_memo'); END IF; END LOOP; END; END LOOP; END IF;
INSERT INTO application_logs (application_id, action, detail) VALUES (app_id, 'submit', '참가신청 제출');
RETURN jsonb_build_object('success', true, 'application_id', app_id);
EXCEPTION WHEN OTHERS THEN RETURN jsonb_build_object('success', false, 'error', SQLERRM);
END; $$ LANGUAGE plpgsql SECURITY DEFINER;`;

  const printContentRef=React.useRef(null);
  // ── 인쇄 페이지 자동 맞춤 (zoom) ──
  React.useEffect(()=>{
    if(!resPrintMode) return;
    setPrintZoom(1); setPrintPages(1);
    const timer=setTimeout(()=>{
      const el=printContentRef.current;
      if(!el) return;
      const contentH=el.scrollHeight;
      const contentW=el.offsetWidth;
      if(!contentH||!contentW) return;
      // mm→px 비율 계산: 화면에서 contentW = (210 - 12*2)mm = 186mm
      const pxPerMm=contentW/186;
      // 페이지 가용 높이: 297mm - padding(top 10 + bottom 20) = 267mm (화면 기준)
      const usableH=267*pxPerMm;
      const MIN_ZOOM=0.62; // 가독성 하한
      if(contentH<=usableH){
        // 1페이지 안에 들어감 → 확대하여 꽉 채움
        const z=usableH/contentH;
        setPrintZoom(Math.min(z,1.35)); setPrintPages(1);
      } else {
        // 1페이지 초과 → 축소 시도
        const z1=usableH/contentH;
        if(z1>=MIN_ZOOM){
          setPrintZoom(z1); setPrintPages(1);
        } else {
          // 2페이지로 확장 → 2페이지 꽉 채움
          const z2=(usableH*2)/contentH;
          setPrintZoom(Math.min(z2,1.35)); setPrintPages(2);

  const buildStartList=(participants,orgNumMap)=>{

    if(arr.length<=1) return arr;
    const maxAttempts=500;
    let best=null, bestScore=Infinity;
    for(let attempt=0;attempt<maxAttempts;attempt++){
      const sh=[...arr]; for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}
      let score=0;
      for(let i=1;i<sh.length;i++){
        if(sh[i].subOrg===sh[i-1].subOrg && sh[i].subOrg) score+=3;
        if(sh[i].orgName===sh[i-1].orgName) score+=3;
        if(orgNumMap[sh[i].orgName]===orgNumMap[sh[i-1].orgName]) score+=1;
      }
      if(score<bestScore){bestScore=score;best=sh;}
      if(score===0) break;
    }
    return best||arr;
  };

  // 신기록 대조
  const RES_REC_LABEL={korea:"한국신",national:"대회신",world:"비공식 세계신"};
  const getRecOrder=()=>{
    const order=["world","korea"];
    if((()=>{try{const m=JSON.parse(localStorage.getItem("ksfd_cnr")||"{}");return !!m[selectedT?.id];}catch(e){return false;}})()) order.splice(1,0,"national");
    return order;

  const resCheckRecords=()=>{
    if(!resBestRecs.length&&resData.filter(r=>!r._deleted).length>0){
      flash("등록된 신기록이 없습니다. 신기록 관리에서 먼저 등록하세요.","error"); return;
    }
    const parseScore=(v)=>{
      if(!v) return 0;
      const s=String(v).replace(/[^\d.]/g,"");
      return parseFloat(s)||0;
    };
    const updated=resData.map(r=>{
      if(r._deleted) return r;
      const score=parseScore(r.total);
      if(!score) return r;
      const newMarks=[];
      for(const catKey of getRecOrder()){
        const rec=resBestRecs.find(b=>b.record_category===catKey);
        if(!rec||!rec.record_value) continue;
        const recScore=parseScore(rec.record_value);
        if(!recScore) continue;
        if(score>recScore){
          newMarks.push(RES_REC_LABEL[catKey]+"/종전 "+rec.record_value);
        } else if(score===recScore){
          newMarks.push(RES_REC_LABEL[catKey]+" 타이");
        }
      }
      if(newMarks.length===0) return r;
      // 기존 비고에서 신기록 관련 내용 제거 후 추가
      let oldRemarks=(r.remarks||"").replace(/(비공식 세계신|한국신|대회신)(\/종전\s*[\d.]+|\s*타이)/g,"").replace(/[A-Z]{2}(신\/종전\s*[\d.]+|타이)/g,"").replace(/\s*,\s*,/g,",").replace(/^[,\s]+|[,\s]+$/g,"");
      const markStr=newMarks.join(", ");
      const finalRemarks=oldRemarks?(markStr+", "+oldRemarks):markStr;
      return {...r,remarks:finalRemarks,_dirty:true};
    });
    setResData(updated);
    setResDirty(true);
    const cnt=updated.filter(r=>!r._deleted&&r.remarks&&/(한국신|대회신|세계신|타이)/.test(r.remarks)).length;
    flash(cnt>0?("🏅 "+cnt+"건 신기록 감지! 비고란을 확인하세요."):"신기록 해당자가 없습니다.");
  };
  const resAddRow=()=>{

  const resSaveAll=async()=>{
    setDbBusy(v=>v+1);
    try{
      const toD=resData.filter(r=>r._deleted&&!r._new);
      const toI=resData.filter(r=>r._new&&!r._deleted);

  // 테스트 데이터 생성
  const REGIONS=["서울","경기","인천","부산","대구","광주","대전","울산","세종","강원","충북","충남","전북","전남","경북","경남","제주"];
  const SURNAMES=["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","류","홍"];
  const GIVEN=["민수","지현","영호","수진","현우","미경","태영","은지","성민","하늘","동현","서연","준혁","예진","상훈","유리","재원","소영","우진","나연"];
  const rName=()=>SURNAMES[Math.floor(Math.random()*SURNAMES.length)]+GIVEN[Math.floor(Math.random()*GIVEN.length)];
  const [resTestMenu, setResTestMenu]=useState(false);
  // 공통: 랜덤 점수 생성
  const resGenScores=(row, cfg)=>{
    if(resType==="final"){
      // 결선: 9시리즈, S1-S2는 5발, S3-S9는 2발, 격발별 소수점
      let cumul=0;
      for(let s=1;s<=9;s++){
        const nShots=s<=2?5:2;
        const shots=[];
        for(let j=0;j<nShots;j++){
          const v=parseFloat((Math.random()*2+8.5).toFixed(1)); // 8.5~10.5
          shots.push(v);
          cumul+=v;
        }
        row["s"+s]=shots.map(v=>v.toFixed(1)).join(",");
      }
      row.total=cumul.toFixed(1);
      return;
    }
    let sum=0;
    const isThreePos=!!cfg.seriesLabels; // R7, R8
    const isDecimalRifle=cfg.decimal&&!isThreePos; // 소총(R7,R8 제외)
    const xPerSeries=[];
    for(let s=1;s<=cfg.series;s++){
      let v;
      if(isDecimalRifle){
        // 소총: 소수점 80.5~109.0
        v=(Math.random()*28.5+80.5).toFixed(1);
      } else {
        // 권총+3자세: 정수 80~100
        v=String(Math.floor(Math.random()*21+80));
      }
      row["s"+s]=v; sum+=parseFloat(v);
      if(cfg.xcount){
        const sx=Math.floor(Math.random()*16); // 0~15
        xPerSeries.push(sx);
      }
    }
    row.total=isDecimalRifle?sum.toFixed(1):String(sum);
    if(cfg.xcount){
      if(isThreePos){
        // 3자세: 시리즈별 x카운트 쉼표 구분 저장
        row.x_count=xPerSeries.join(",");
      } else {
        row.x_count=String(xPerSeries.reduce((a,b)=>a+b,0));
      }
    }
  };
  // 모드1: 스타트리스트 기반
  const resGenFromStartList=()=>{
    if(!resEvCode) return;
    // 세션 기반 startLists에서 해당 종목의 전체 리스트 합치기
    let sl=startLists[resEvCode]||null;
    if(!sl){
      const sessionLists=Object.keys(startLists).filter(k=>k===resEvCode||k.startsWith(resEvCode+"_")).sort();
      if(sessionLists.length>0) sl=sessionLists.flatMap(k=>startLists[k]||[]);
    }
    if(!sl||sl.length===0){flash("이 종목의 스타트리스트가 없습니다. 먼저 스타트리스트를 생성해주세요.","error"); setResTestMenu(false); return;}
    const cfg=getEventCfg(resEvCode,getEvFmt(resEvCode));
    const isPrelim=resType==="prelim";
    const isFinal=resType==="final";
    let activePlayers=sl.filter(p=>!p.absent);
    if(isFinal) activePlayers=activePlayers.slice(0,8);
    // 단체 지정 참가자 조회 (team_entries에서)
    const teamMemIds=new Set();
    if(evPData&&evPData.allTeamEntries){
      evPData.allTeamEntries.forEach(te=>{if(te.event_code===resEvCode)teamMemIds.add(te.member_id);});
    }
    // 단체 지정 없으면 같은 소속(orgName) 3명 이상일 때 자동 지정
    let autoTeam=teamMemIds.size===0;
    const rows=activePlayers.map((p,i)=>{
      const row={_new:true,id:"tst_"+Date.now()+"_"+i,tournament_id:selectedT.id,event_code:resEvCode,result_type:resType,
        rank:0,bib:isPrelim?"":String(100+i),name:p.name,region:p.regionName||"",is_team:teamMemIds.has(p.memberId),
        _sub_org:p.subOrg||"",
        s1:"",s2:"",s3:"",s4:"",s5:"",s6:"",s7:"",s8:"",s9:"",s10:"",s11:"",s12:"",total:"",x_count:"",remarks:""};
      resGenScores(row, cfg);
      return row;
    });
    rows.sort((a,b)=>parseFloat(b.total)-parseFloat(a.total));
    rows.forEach((r,i)=>r.rank=i+1);
    if(isPrelim&&autoTeam){
      const byRegion={};
      rows.forEach(r=>{if(!byRegion[r.region]) byRegion[r.region]=[]; byRegion[r.region].push(r);});
      Object.values(byRegion).forEach(members=>{
        if(members.length>=3){
          const tc=Math.min(members.length,Math.random()<0.5?3:4);
          members.slice(0,tc).forEach(m=>m.is_team=true);
        }
      });
    }
    const oldDbRows=resData.filter(r=>!r._new).map(r=>({...r,_deleted:true}));
    setResData([...oldDbRows,...rows]);
    setResDirty(true);
    setResTestMenu(false);
    flash("스타트리스트 기반 "+rows.length+"명 테스트 데이터 생성됨");
  };
  // 모드2: 완전 새로 생성
  const resGenFromScratch=()=>{
    if(!resEvCode) return;
    const cfg=getEventCfg(resEvCode,getEvFmt(resEvCode));
    const isPrelim=resType==="prelim";
    const count=isPrelim?Math.floor(Math.random()*10)+15:8;
    const regionPool=[...REGIONS].sort(()=>Math.random()-0.5).slice(0,Math.ceil(count/3.5));
    const regionCities={"서울":["서울시청","성남시청"],"부산":["부산시청","김해시청"],"대구":["대구시청","경산시청"],"인천":["인천시청","부천시청"],"광주":["광주시청","나주시청"],"대전":["대전시청","세종시청"],"울산":["울산시청","양산시청"],"경기":["용인시청","화성시청"],"강원":["춘천시청","원주시청"],"충북":["청주시청","충주시청"],"충남":["천안시청","아산시청"],"전북":["전주시청","익산시청"],"전남":["목포시청","순천시청"],"경북":["포항시청","구미시청"],"경남":["창원시청","진주시청"],"제주":["제주시청","서귀포시청"]};
    const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
    const genSub=(region)=>Math.random()>0.4?region+"일반":pick(regionCities[region]||[region+"시청"]);
    const rows=[];
    // 소속별 세부소속 고정 (같은 지역 선수는 같은 세부소속)
    const regionSubMap={};
    for(let i=0;i<count;i++){
      const region=regionPool[i%regionPool.length];
      if(!regionSubMap[region]) regionSubMap[region]=genSub(region);
      const row={_new:true,id:"tst_"+Date.now()+"_"+i,tournament_id:selectedT.id,event_code:resEvCode,result_type:resType,
        rank:0,bib:isPrelim?"":String(100+i),name:rName(),region,is_team:false,
        _sub_org:regionSubMap[region],
        s1:"",s2:"",s3:"",s4:"",s5:"",s6:"",s7:"",s8:"",s9:"",s10:"",s11:"",s12:"",total:"",x_count:"",remarks:""};
      resGenScores(row, cfg);
      rows.push(row);
    }
    rows.sort((a,b)=>parseFloat(b.total)-parseFloat(a.total));
    rows.forEach((r,i)=>r.rank=i+1);
    if(isPrelim){
      const byRegion={};
      rows.forEach(r=>{if(!byRegion[r.region]) byRegion[r.region]=[]; byRegion[r.region].push(r);});
      Object.values(byRegion).forEach(members=>{
        if(members.length>=3){
          const tc=Math.min(members.length,Math.random()<0.5?3:4);
          members.slice(0,tc).forEach(m=>m.is_team=true);
        }
      });
    }
    const oldDbRows=resData.filter(r=>!r._new).map(r=>({...r,_deleted:true}));
    setResData([...oldDbRows,...rows]);
    setResDirty(true);
    setResTestMenu(false);
    flash(count+"건 테스트 데이터 새로 생성됨");
  };
  // 모드3: 점수만 재생성 (이름/시도/세부소속/순위 유지)
  const resGenScoresOnly=()=>{
    if(!resEvCode) return;
    const cfg=getEventCfg(resEvCode,getEvFmt(resEvCode));
    const visible=resData.filter(r=>!r._deleted);
    if(visible.length===0){flash("기존 데이터가 없습니다.","error");setResTestMenu(false);return;}
    const updated=resData.map(r=>{
      if(r._deleted) return r;
      const nr={...r};
      // 시리즈 초기화
      for(let i=1;i<=12;i++) nr["s"+i]="";
      nr.total=""; nr.x_count="";
      resGenScores(nr,cfg);
      nr._dirty=true;
      return nr;
    });
    // 총점 기준 재정렬 후 순위 재부여
    const active=updated.filter(r=>!r._deleted);
    active.sort((a,b)=>parseFloat(b.total||0)-parseFloat(a.total||0));
    active.forEach((r,i)=>r.rank=i+1);
    setResData(updated);

  // ── 결선 진출자 생성 (본선 → 결선 상위 최대 8인) ──
  const promoteToFinal=async()=>{
    if(!resEvCode||!selectedT) return;
    const{data:prelimData}=await sb.from("competition_results").select("*").eq("tournament_id",selectedT.id).eq("event_code",resEvCode).eq("result_type","prelim").order("rank");
    if(!prelimData||prelimData.length===0){flash("본선 기록이 없습니다. 먼저 본선 결과를 저장하세요.","error");return;}
    const sorted=[...prelimData].sort((a,b)=>{
      const ta=parseFloat(a.total)||0, tb=parseFloat(b.total)||0;
      if(tb!==ta) return tb-ta;
      const parseXC=(v)=>v?(v.includes(",")?v.split(",").reduce((s,x)=>s+(parseInt(x)||0),0):parseInt(v)||0):0;
      return parseXC(b.x_count)-parseXC(a.x_count);
    });
    const top=sorted.slice(0,Math.min(8,sorted.length));
    await sb.from("competition_results").delete().eq("tournament_id",selectedT.id).eq("event_code",resEvCode).eq("result_type","final");
    const finalRows=top.map((r,i)=>({
      tournament_id:selectedT.id, event_code:resEvCode, result_type:"final",
      rank:i+1, bib:String(i+1), name:r.name, region:r.region, sub_org:r.sub_org||"",
      is_team:false,
      s1:"",s2:"",s3:"",s4:"",s5:"",s6:"",s7:"",s8:"",s9:"",s10:"",s11:"",s12:"",
      total:"", x_count:"", remarks:"본선 "+r.rank+"위 ("+r.total+")"
    }));
    const{error}=await sb.from("competition_results").insert(finalRows);
    if(error){flash("결선 진출자 저장 실패: "+error.message,"error");return;}
    flash("🏆 결선 진출자 "+top.length+"명 생성 완료 → 결선 탭으로 이동");
    loadResults(resEvCode,"final");
  };

  // ── 결선 스타트리스트 생성 (소속 비연속 셔플) ──
  const generateFinalSL=async()=>{
    if(!resEvCode) return;
    const finalists=resData.filter(r=>!r._deleted);
    if(finalists.length===0){flash("결선 진출자가 없습니다.","error");return;}
    // sub_org 조회: DB members → evPData → startLists
    const subOrgMap={};
    try{
      if(sb){const{data:mems}=await sb.from("members").select("name,sub_org");if(mems) mems.forEach(m=>{if(m.sub_org&&m.sub_org.trim())subOrgMap[m.name]=m.sub_org;});}
    }catch(e){}
    if(evPData&&evPData.allMembers) evPData.allMembers.forEach(m=>{if(m.sub_org&&m.sub_org.trim()&&!subOrgMap[m.name])subOrgMap[m.name]=m.sub_org;});
    // startLists에서도 검색
    Object.values(startLists).forEach(sl=>{if(sl)sl.forEach(p=>{if(p.subOrg&&p.name&&!subOrgMap[p.name])subOrgMap[p.name]=p.subOrg;});});
    // 셔플: 같은 region/sub_org 연속 안 되도록
    const arr=finalists.map(r=>{
      const so=r._sub_org||subOrgMap[r.name]||"";
      return {name:r.name, region:r.region, sub_org:so, prelimRank:r.rank, prelimTotal:r.total, remarks:r.remarks||""};
    });
    const maxAttempts=500;
    let best=null, bestScore=Infinity;
    for(let attempt=0;attempt<maxAttempts;attempt++){
      const sh=[...arr];
      for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}
      let score=0;
      for(let i=1;i<sh.length;i++){
        if(sh[i].region&&sh[i].region===sh[i-1].region) score+=3;
        if(sh[i].sub_org&&sh[i].sub_org===sh[i-1].sub_org) score+=3;
      }
      if(score<bestScore){bestScore=score;best=sh;}
      if(score===0) break;
    }
    const result=(best||arr).map((p,i)=>({...p,bib:i+1}));
    setResFinalSL(result);
    flash("결선 스타트리스트 생성: "+result.length+"명 (소속 비연속 배치"+(bestScore===0?" ✓":"·최선")+")");
  };

  // ── 결선 스타트리스트 DB 게시 ──
  const publishFinalSL=async()=>{
    if(!resFinalSL||!resEvCode||!selectedT||!sb) return;
    if(!confirm("결선 스타트리스트를 DB에 게시합니다. 기존 결선 스타트리스트는 덮어씌워집니다.")) return;
    try{
      const sessionKey=resEvCode+"_final";
      await sb.from("tournament_startlists").delete().eq("tournament_id",selectedT.id).eq("session_key",sessionKey);
      const rows=resFinalSL.map((p,i)=>({
        tournament_id:selectedT.id, session_key:sessionKey,
        event_code:resEvCode, relay:0,
        sort_order:i+1, name:p.name||"",
        sub_org:p.sub_org||"", org_name:"",
        region_name:p.region||"",

        remark:p.remarks||""
      }));
      const{error}=await sb.from("tournament_startlists").insert(rows);

      flash("📤 결선 스타트리스트 게시 완료: "+rows.length+"명");
    }catch(e){flash("게시 실패: "+e.message,"error");}

  // 단체전 자동 계산
  const loadTeamResults=async(evCodeOverride)=>{
    const ec=evCodeOverride||resEvCode;
    if(!sb||!selectedT||!ec) return;
    if(evCodeOverride) setResEvCode(evCodeOverride);
    setResType("team"); setResDirty(false); setResData([]);
    // 본선 데이터 가져오기
    const{data:prelim}=await sb.from("competition_results").select("*")
      .eq("tournament_id",selectedT.id).eq("event_code",ec).eq("result_type","prelim")
      .order("rank",{ascending:true});
    if(!prelim||prelim.length===0){setTeamData([]); return;}
    const cfg=getEventCfg(ec,getEvFmt(ec));
    // is_team=true인 선수만 필터 → 소속별 그룹
    const teamPlayers=prelim.filter(r=>r.is_team===true);
    // sub_org: DB 컬럼 우선, 없으면 members에서 조회
    const needSubOrg=teamPlayers.some(r=>!r.sub_org);
    if(needSubOrg){
      const subOrgMap={};
      try{
        const{data:mems}=await sb.from("members").select("name,sub_org");
        if(mems) mems.forEach(m=>{if(m.sub_org&&m.sub_org.trim())subOrgMap[m.name]=m.sub_org;});
      }catch(e){}
      if(evPData&&evPData.allMembers) evPData.allMembers.forEach(m=>{if(m.sub_org&&m.sub_org.trim()&&!subOrgMap[m.name])subOrgMap[m.name]=m.sub_org;});
      teamPlayers.forEach(r=>{if(!r.sub_org)r.sub_org=subOrgMap[r.name]||"";});
    }
    teamPlayers.forEach(r=>{r._sub_org=r.sub_org||"";});
    const groups={};
    teamPlayers.forEach(r=>{
      if(!r.region) return;
      if(!groups[r.region]) groups[r.region]=[];
      groups[r.region].push(r);
    });
    // 3인 이상 팀만
    const teams=Object.entries(groups).filter(([,members])=>members.length>=3).map(([region,members])=>{
      // 총점 기준 정렬 후 상위 3명 합산, 4위는 미반영
      members.sort((a,b)=>parseFloat(b.total||0)-parseFloat(a.total||0));
      const top3=members.slice(0,3);
      const extra=members[3]||null;
      const teamTotal=top3.reduce((s,m)=>s+parseFloat(m.total||0),0);
      const parseXC=(v)=>v?(v.includes(",")?v.split(",").reduce((s,x)=>s+(parseInt(x)||0),0):parseInt(v)||0):0;
      const teamXCount=top3.reduce((s,m)=>s+parseXC(m.x_count),0);
      const lastSeriesSum=top3.reduce((s,m)=>{
        const lastS="s"+cfg.series;
        return s+parseFloat(m[lastS]||0);
      },0);
      return {region,top3,extra,teamTotal,teamXCount,lastSeriesSum,memberCount:members.length};
    });
    // 정렬: 총점 → 동점처리
    teams.sort((a,b)=>{
      const diff=b.teamTotal-a.teamTotal;
      if(Math.abs(diff)>0.01) return diff;
      // 동점: 권총은 X카운트 우선, 소총은 마지막 시리즈
      if(cfg.xcount){
        const xDiff=b.teamXCount-a.teamXCount;
        if(xDiff!==0) return xDiff;
      }
      return b.lastSeriesSum-a.lastSeriesSum;
    });
    teams.forEach((t,i)=>t.rank=i+1);
    // 단체전 신기록 로드 및 대조
    const{data:br}=await sb.from("best_records").select("*").eq("event_code",ec).eq("result_type","team");
    setResBestRecs(br||[]);
    if(br&&br.length>0){
      teams.forEach(t=>{
        const marks=[];
        for(const catKey of getRecOrder()){
          const rec=br.find(b=>b.record_category===catKey);
          if(!rec||!rec.record_value) continue;
          const recScore=parseFloat(String(rec.record_value).replace(/[^\d.]/g,""))||0;
          if(!recScore) continue;
          if(t.teamTotal>recScore) marks.push(RES_REC_LABEL[catKey]+"/종전 "+rec.record_value);
          else if(Math.abs(t.teamTotal-recScore)<0.01) marks.push(RES_REC_LABEL[catKey]+" 타이");
        }
        t._remarks=marks.join(", ");
      });
    }
    setTeamData(teams);
  };
  // 단체전 팀명 결정: 전국대회→시도, 일반→세부소속 일치 시 세부소속, 불일치 시 시도
  const teamDisplayName=(t)=>{
    if(isNatGames()) return t.region;
    const subs=t.top3.map(m=>m._sub_org||m.sub_org||"").filter(Boolean);
    if(subs.length===t.top3.length&&subs.every(s=>s===subs[0])) return subs[0];
    return t.region;
  };
  const resGetFields=(code,type)=>{
    const cfg=getEventCfg(code,getEvFmt(code));
    const base=[{k:"rank",l:"순위",w:50,t:"number"}];
    if(type==="final"){
      // 결선: 개별 격발 열
      base.push({k:"name",l:"이름",w:80},{k:"region",l:"시도",w:65},{k:"_sub_org",l:"세부소속",w:85});
      for(let s=1;s<=9;s++){
        const nShots=s<=2?5:2;
        for(let j=0;j<nShots;j++){
          base.push({k:"s"+s+"_"+j,_s:"s"+s,_si:j,l:s+"-"+"①②③④⑤"[j],w:46,t:"shot"});
        }
      }
      base.push({k:"total",l:"합계",w:65,t:"computed"});
      base.push({k:"remarks",l:"비고",w:80});
      return base;
    }
    base.push({k:"name",l:"이름",w:80},{k:"region",l:"시도",w:65},{k:"_sub_org",l:"세부소속",w:85});
    if(type==="prelim") base.push({k:"is_team",l:"단체",w:40,t:"check"});
    for(let i=0;i<cfg.series;i++) base.push({k:"s"+(i+1),l:cfg.seriesLabels?cfg.seriesLabels[i]:"S"+(i+1),w:cfg.seriesLabels?52:55});
    base.push({k:"total",l:"합계",w:65});
    if(cfg.xcount) base.push({k:"x_count",l:"X카운트",w:60});
    base.push({k:"remarks",l:"비고",w:80});
    return base;
  };
  // 결선: 개별 격발 읽기
  const resShotRead=(r,seriesKey,shotIdx)=>{
    const val=r[seriesKey]||"";
    const parts=String(val).split(",");
    return (parts[shotIdx]||"").trim();
  };
  // 결선: 개별 격발 쓰기 → s1~s9 업데이트 + 합계 자동계산 (단일 setState)
  const resShotWrite=(origIdx,seriesKey,shotIdx,value)=>{
    const nr=[...resData];
    const r={...nr[origIdx]};
    const sNum=parseInt(seriesKey.replace("s",""));
    const nShots=sNum<=2?5:2;
    const parts=String(r[seriesKey]||"").split(",");
    while(parts.length<nShots) parts.push("");
    parts[shotIdx]=value;
    r[seriesKey]=parts.join(",");
    // 합계 자동 계산
    let total=0;
    for(let s=1;s<=9;s++){
      String(r["s"+s]||"").split(",").forEach(v=>{const n=parseFloat(v);if(!isNaN(n))total+=n;});
    }
    r.total=total>0?total.toFixed(1):"";
    r._dirty=true;
    nr[origIdx]=r;
    setResData(nr); setResDirty(true);
  };
  const resExportCSV=()=>{
    const cfg=getEventCfg(resEvCode,getEvFmt(resEvCode));
    const visible=resData.filter(r=>!r._deleted);
    const typeLabel={prelim:"본선",final:"결선",team:"단체전"};
    const isPrelim=resType==="prelim";
    const fields=resGetFields(resEvCode,resType);
    let csv="\uFEFF"+fields.map(f=>f.l).join(",")+"\n";
    visible.forEach(r=>{csv+=fields.map(f=>{
      if(f.t==="check") return r[f.k]?"O":"";
      if(f.t==="shot") return resShotRead(r,f._s,f._si);
      if(f.t==="computed") return r.total||"";
      return r[f.k]??"";
    }).join(",")+"\n";});
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`${selectedT.name}_${resEvCode}_${typeLabel[resType]}.csv`; a.click();
  };
  const resImportExcel=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    try{
      const data=await file.arrayBuffer();
      const wb=XLSX.read(data); const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      const fields=resGetFields(resEvCode,resType);
      const colMap={}; const shotMap={}; fields.forEach(f=>{
        colMap[f.l]=f.k;
        if(f.t==="shot") shotMap[f.l]={s:f._s,si:f._si};
      });
      const mapped=rows.map((r,i)=>{
        const row={_new:true,id:"imp_"+Date.now()+"_"+i,tournament_id:selectedT.id,event_code:resEvCode,result_type:resType,
          s1:"",s2:"",s3:"",s4:"",s5:"",s6:"",s7:"",s8:"",s9:"",s10:"",s11:"",s12:"",total:"",x_count:"",remarks:""};
        // 격발별 → 쉼표 구분 조합
        const shotBuf={};
        Object.entries(r).forEach(([k,v])=>{
          const trimK=k.trim();
          if(shotMap[trimK]){
            const{s,si}=shotMap[trimK];
            if(!shotBuf[s]) shotBuf[s]=[];
            shotBuf[s][si]=String(v);
          } else {
            const mk=colMap[trimK]; if(mk) row[mk]=String(v);
          }
        });
        Object.entries(shotBuf).forEach(([s,arr])=>{row[s]=arr.join(",");});
        // 합계 자동계산 (결선)
        if(resType==="final"){
          let tot=0;
          for(let s=1;s<=9;s++) String(row["s"+s]||"").split(",").forEach(v=>{const n=parseFloat(v);if(!isNaN(n))tot+=n;});
          if(tot>0) row.total=tot.toFixed(1);
        }
        // 단체 컬럼: O, o, TRUE, true, 1 → boolean true
        if(row.is_team!==undefined) row.is_team=["O","o","TRUE","true","1","Y","y"].includes(String(row.is_team).trim());
        else row.is_team=false;
        if(!row.rank) row.rank=i+1;
        if(!row.name) return null;
        return row;
      }).filter(Boolean);

      setResData([...resData.filter(r=>!r._deleted),...mapped]);

  };
  const resInp={background:"#0d1520",border:"1px solid #2a3a5c",borderRadius:4,color:"#e8dcc8",padding:"4px 6px",fontSize:12,width:"100%",boxSizing:"border-box"};

  // ─── 인쇄 미리보기 ───
  const renderPrintPreview=()=>{
    if(!resPrintMode||!resEvCode) return null;

    // 합계+X카운트 합성
    const fmtTotal=(r)=>{

    const renderPrelimFinal=()=>{

        const colWidths=hdr.map(h=>{
          if(h==="소속"||h==="비고") return null;
          if(h==="순위") return "28px";
          if(h==="이름") return "48px";
          if(h==="합계") return cfg.xcount?"74px":"60px";
          return "44px";
        });
        // 3자세 점선 위치: 슬사2(s2), 복사2(s4) 뒤에 점선
        const isDotAfterSeries=(sIdx)=>{
          if(cfg.seriesLabels){
            return sIdx===2||sIdx===4||sIdx===cfg.series;
          }
          return sIdx===cfg.series; // 일반: 마지막 시리즈 뒤
        };
        // 헤더 점선 위치 매핑
        const hdrDotSet=new Set();
        hdrDotSet.add("소속");
        if(cfg.seriesLabels){
          hdrDotSet.add(cfg.seriesLabels[1]); // 슬사2
          hdrDotSet.add(cfg.seriesLabels[3]); // 복사2
          hdrDotSet.add(cfg.seriesLabels[5]); // 입사2
        } else {
          hdrDotSet.add(""+cfg.series); // 마지막 시리즈
        }
        // 3자세: 2단 헤더 (슬사/복사/입사 → 하위에 1,2) + 소계 3열
        const render3PosHeader=()=>{
          const baseCols=["순위","이름","소속"];
          const posGroups=["슬사","복사","입사"];
          const subTotCols=["슬사소계","복사소계","입사소계"];

          return <thead>

              {posGroups.map((g,gi)=><th key={g} colSpan={2} style={{...pTh,borderRight:dotBdr}}>{g}</th>)}
              {subTotCols.map((h,i)=><th key={h} rowSpan={2} style={{...pTh,fontSize:"7pt",lineHeight:1.3,borderRight:i<2?dotBdr:undefined}}>{h.slice(0,2)}<br/>소계</th>)}
              {endCols.map(h=><th key={h} rowSpan={2} style={pTh}>{h}</th>)}
            </tr>
            <tr>
              {posGroups.map((g,gi)=>[
                <th key={g+"1"} style={pTh}>1</th>,

            </tr>
          </thead>;
        };
        // 소계 계산 함수 (3자세: x카운트 포함)
        const calcSubTotal=(r,startS)=>{
          let sum=0;
          for(let si=startS;si<startS+2;si++){
            const v=parseFloat(r["s"+si])||0;
            sum+=v;
          }
          if(!sum) return "";
          // 3자세: 시리즈별 x카운트에서 해당 포지션 합산
          if(r.x_count&&r.x_count.includes(",")){
            const xParts=r.x_count.split(",").map(v=>parseInt(v)||0);
            const xSum=(xParts[startS-1]||0)+(xParts[startS]||0);
            return sum+"-"+xSum+"x";
          }
          return sum;
        };
        // colWidths for 3자세: 소계 3열 추가
        const hdrForWidth=cfg.seriesLabels
          ?["순위","이름","소속","1","2","1","2","1","2","슬사소계","복사소계","입사소계","합계","비고"]
          :hdr;
        const colWidthsFinal=(cfg.seriesLabels?hdrForWidth:hdr).map(h=>{
          if(h==="소속"||h==="비고") return null;
          if(h==="순위") return "28px";
          if(h==="이름") return "48px";
          if(h==="합계") return cfg.xcount?"74px":"60px";
          if(h==="슬사소계"||h==="복사소계"||h==="입사소계") return "48px";
          return "44px";
        });
        return <table style={{tableLayout:"fixed"}}><colgroup>{colWidthsFinal.map((w,i)=>
          <col key={i} style={w?{width:w}:{}}/>
        )}</colgroup>
        {cfg.seriesLabels?render3PosHeader()
          :<thead><tr>{hdr.map(h=><th key={h} style={{...pTh,...(hdrDotSet.has(h)?{borderRight:dotBdr}:{})}}>{h}</th>)}</tr></thead>}
        <tbody>{data.map((r,i)=>{
          const cells=[];
          cells.push(<td key="rank" style={pTdBL}>{r.rank}</td>);
          cells.push(<td key="name" style={pTdB}>{r.name}</td>);
          cells.push(<td key="region" style={{...pTdB,...(r.is_team?{textDecoration:"underline"}:{}),borderRight:dotBdr}}>{isNatGames()?r.region:(r._sub_org||r.sub_org||r.region)}</td>);
          sCols.forEach(s=>cells.push(<td key={"s"+s} style={{...pTdB,...(isDotAfterSeries(s)?{borderRight:dotBdr}:{})}}>{r["s"+s]||""}</td>));
          if(cfg.seriesLabels){
            cells.push(<td key="sub1" style={{...pTdB,fontWeight:600,borderRight:dotBdr}}>{calcSubTotal(r,1)}</td>);
            cells.push(<td key="sub2" style={{...pTdB,fontWeight:600,borderRight:dotBdr}}>{calcSubTotal(r,3)}</td>);
            cells.push(<td key="sub3" style={{...pTdB,fontWeight:600}}>{calcSubTotal(r,5)}</td>);
          }
          cells.push(<td key="total" style={{...pTdB,fontWeight:700,textAlign:"left",paddingLeft:"8px"}}>{fmtTotal(r)}</td>);
          cells.push(<td key="rem" style={pTdBR}>{fmtRemarks(r.remarks)||""}</td>);
          return <tr key={r.id||i}>{cells}</tr>;
        })}</tbody></table>;
    };

    // ═══ 결선 전용 테이블 (9시리즈, 격발별 상세, 누계) ═══
    const renderFinal=()=>{
      const data=resData.filter(r=>!r._deleted);
      if(data.length===0) return <p style={{textAlign:"center",color:"#999",padding:"20mm 0"}}>결선 데이터가 없습니다.</p>;
      const SERIES=9;
      const shotsIn=s=>s<=2?5:2;
      const MAX_ROWS=6; // row0=누계, row1-5=격발
      const F="'JetBrains Mono','Noto Sans KR',monospace";
      const SZ="7.5pt"; // 통일 폰트 크기
      const parseShots=str=>{
        if(!str) return [];
        return String(str).split(",").map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v));
      };
      const calcCumul=r=>{
        const subs=[];let cum=0;
        for(let s=1;s<=SERIES;s++){
          const shots=parseShots(r["s"+s]);
          cum+=shots.reduce((a,b)=>a+b,0);
          subs.push(cum);
        }
        return subs;
      };
      const bdr="1px solid #333";
      const bdrD="1px dashed #aaa";
      // 누계 행 (row0): 볼드, 통일 크기
      const subCell={padding:"1px 2px",textAlign:"center",fontSize:SZ,fontFamily:F,fontWeight:700,lineHeight:1.1,
        borderTop:bdr,borderBottom:"1px solid #555",borderLeft:"none",borderRight:"none"};
      // 격발 행: 통일 크기, 일반 굵기
      const shotCell={padding:"0.5px 1px",textAlign:"center",fontSize:SZ,fontFamily:F,fontWeight:400,lineHeight:1.1,
        borderTop:"none",borderBottom:bdrD,borderLeft:"none",borderRight:"none"};
      const shotLastCell={...shotCell,borderBottom:bdr};
      // 열 너비: 소속=경기도장애인체육회, 비고=비공식 세계신 기준 고정, 나머지 시리즈에 균등배분
      const colW=["22px","38px","62px",...Array(SERIES).fill(null),"38px","48px"];
      return <table style={{tableLayout:"fixed",width:"100%"}}><colgroup>
        {colW.map((w,i)=><col key={i} style={w?{width:w}:{}}/>)}
      </colgroup>
      <thead>
        <tr>
          {["순위","이름","소속"].map((h,i)=>
            <th key={h} style={{...pTh,padding:"2px 2px",fontSize:"7pt",...(i===2?{borderRight:dotBdr}:{})}}>{h}</th>
          )}
          {Array.from({length:SERIES},(_,i)=>
            <th key={"s"+i} style={{...pTh,fontSize:"7pt",padding:"2px 1px",...(i===1?{borderRight:dotBdr}:{})}}>S{i+1}</th>
          )}
          <th style={{...pTh,padding:"2px 2px",fontSize:"7pt"}}>합계</th>
          <th style={{...pTh,padding:"2px 2px",fontSize:"7pt"}}>비고</th>
        </tr>
      </thead>
      <tbody>{data.map((r,pi)=>{
        const subs=calcCumul(r);
        const allShots=[];
        for(let s=1;s<=SERIES;s++) allShots.push(parseShots(r["s"+s]));
        const finalTotal=subs[SERIES-1];
        const rows=[];
        for(let row=0;row<MAX_ROWS;row++){
          const cells=[];
          const isLast=row===MAX_ROWS-1;
          if(row===0){
            // 순위, 이름, 소속 — 상단 정렬
            cells.push(<td key="rank" rowSpan={MAX_ROWS} style={{...subCell,borderLeft:bdr,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{r.rank}</td>);
            cells.push(<td key="name" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",textAlign:"left",paddingLeft:"2px",paddingTop:"2px"}}>{r.name}</td>);
            cells.push(<td key="region" rowSpan={MAX_ROWS} style={{...subCell,fontSize:"6.5pt",verticalAlign:"top",borderRight:dotBdr,textAlign:"left",paddingLeft:"1px",paddingTop:"2px"}}>{isNatGames()?r.region:(r._sub_org||r.sub_org||r.region)}</td>);
          }
          // 시리즈 열 (S1~S9)
          for(let s=0;s<SERIES;s++){
            const shots=allShots[s];
            const maxS=shotsIn(s+1);
            const rightBdr=s===1?{borderRight:dotBdr}:{};
            if(row===0){
              const val=s===SERIES-1?"":((subs[s]||0)>0?subs[s].toFixed(1):"");
              cells.push(<td key={"s"+s} style={{...subCell,...rightBdr}}>{val}</td>);
            } else {
              const shotIdx=row-1;
              const cStyle=isLast?{...shotLastCell,...rightBdr}:{...shotCell,...rightBdr};
              if(shotIdx<maxS&&shots[shotIdx]!==undefined){
                cells.push(<td key={"s"+s} style={cStyle}>{shots[shotIdx].toFixed(1)}</td>);
              } else {
                cells.push(<td key={"s"+s} style={cStyle}></td>);
              }
            }
          }
          if(row===0){
            const total=finalTotal>0?finalTotal.toFixed(1):(r.total||"");
            cells.push(<td key="total" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{total}</td>);
            cells.push(<td key="rem" rowSpan={MAX_ROWS} style={{...subCell,borderRight:bdr,fontSize:"5.5pt",verticalAlign:"top",textAlign:"left",padding:"2px 1px",fontWeight:400,lineHeight:1.1}}>{fmtRemarks(r.remarks)}</td>);
          }
          rows.push(<tr key={pi+"_"+row}>{cells}</tr>);
        }
        return rows;
      }).flat()}</tbody></table>;
    };

    // 단체전 테이블
    const renderTeam=()=>{
      if(teamData.length===0) return <p style={{textAlign:"center",color:"#999",padding:"20mm 0"}}>단체전 데이터가 없습니다.</p>;
      const sCols=Array.from({length:cfg.series},(_,i)=>i+1);
      const sHeaders=cfg.seriesLabels||sCols.map(i=>""+i);
      const hdr=["순위","소속 / 이름",...sHeaders,"합계","비고"];
      const isDotAfterS=(s)=>{
        if(cfg.seriesLabels) return s===2||s===4||s===cfg.series;
        return s===cfg.series;
      };
      const fmtTeamTotal=(t)=>{
        const tv=cfg.decimal?t.teamTotal.toFixed(1):t.teamTotal;
        return cfg.xcount?(tv+" -"+t.teamXCount+"x"):tv;
      };
      const fmtMemberTotal=(m)=>{
        const tv=cfg.decimal?parseFloat(m.total).toFixed(1):m.total;
        return cfg.xcount?(tv+(m.x_count?" -"+m.x_count+"x":"")):tv;
      };
      const teamSeriesSum=(t,sIdx)=>{
        const sum=t.top3.reduce((s,m)=>s+(parseFloat(m["s"+sIdx])||0),0);
        return cfg.decimal?sum.toFixed(1):sum;
      };
      const hdrDotTeam=new Set();
      hdrDotTeam.add("소속 / 이름");
      if(cfg.seriesLabels){ hdrDotTeam.add(cfg.seriesLabels[1]); hdrDotTeam.add(cfg.seriesLabels[3]); hdrDotTeam.add(cfg.seriesLabels[5]); }
      else { hdrDotTeam.add(""+cfg.series); }

      // ★ border shorthand 절대 미사용 — 모든 면 개별 지정
      const F="'JetBrains Mono','Noto Sans KR',monospace";
      const sPad="1px 2px"; // 시리즈 셀 축소 패딩
      const teamCell=(extra={})=>({padding:"2px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,
        borderTop:"2px solid #333",borderBottom:"1px dashed #888",borderLeft:"none",borderRight:"none",...extra});
      const memCell=(extra={})=>({padding:"2px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,
        borderTop:"none",borderBottom:"1px dashed #aaa",borderLeft:"none",borderRight:"none",...extra});
      const memLastCell=(extra={})=>({padding:"2px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,
        borderTop:"none",borderBottom:"1px solid #333",borderLeft:"none",borderRight:"none",...extra});

      return <table style={{tableLayout:"auto",width:"100%"}}><colgroup>
        {hdr.map((h,i)=><col key={i} style={h==="순위"?{width:"24px"}:{}}/>)}
      </colgroup>
      <thead><tr>{hdr.map(h=><th key={h} style={{...pTh,whiteSpace:"nowrap",padding:"3px 3px",...(hdrDotTeam.has(h)?{borderRight:dotBdr}:{})}}>{h}</th>)}</tr></thead>
      <tbody>{teamData.map((t,ti)=>{
        const rows=[];
        // ── 팀 합산 행 ──
        const tc=[];
        tc.push(<td key="rank" style={teamCell({borderLeft:"1px solid #333",fontWeight:800,fontSize:"10pt"})}>{t.rank}</td>);
        tc.push(<td key="reg" style={teamCell({fontWeight:700,fontSize:"9pt",borderRight:dotBdr,whiteSpace:"nowrap"})}>{teamDisplayName(t)}</td>);
        sCols.forEach(s=>tc.push(<td key={"ts"+s} style={teamCell({fontWeight:700,whiteSpace:"nowrap",padding:sPad,...(isDotAfterS(s)?{borderRight:dotBdr}:{})})}>{teamSeriesSum(t,s)}</td>));
        tc.push(<td key="total" style={teamCell({fontWeight:800,fontSize:"10pt",textAlign:"left",paddingLeft:"6px",whiteSpace:"nowrap"})}>{fmtTeamTotal(t)}</td>);
        tc.push(<td key="rem" style={teamCell({borderRight:"1px solid #333",fontSize:"7pt",textAlign:"left",padding:"2px 3px",lineHeight:1.2})}>{fmtRemarks(t._remarks)}</td>);
        rows.push(<tr key={t.region+"_team"} style={{background:"#f0f0f0"}}>{tc}</tr>);
        // ── 개인 행 (top3 + extra) ──
        const allM=[...t.top3];
        if(t.extra) allM.push(t.extra);
        allM.forEach((m,mi)=>{
          const mk=mi===allM.length-1?memLastCell:memCell;
          const mSub=m._sub_org||"";
          const mc=[];
          mc.push(<td key="rank" style={mk({borderLeft:"1px solid #333"})}></td>);
          mc.push(<td key="name" style={mk({paddingLeft:"10px",fontSize:"8pt",textAlign:"left",borderRight:dotBdr,whiteSpace:"nowrap"})}>
            {m.name}{mSub?<span style={{marginLeft:3,fontSize:"7pt"}}>[{mSub}]</span>:null}
          </td>);
          sCols.forEach(s=>mc.push(<td key={"ms"+s} style={mk({whiteSpace:"nowrap",padding:sPad,...(isDotAfterS(s)?{borderRight:dotBdr}:{})})}>{m["s"+s]||""}</td>));
          mc.push(<td key="total" style={mk({fontWeight:600,textAlign:"left",paddingLeft:"6px",whiteSpace:"nowrap"})}>{fmtMemberTotal(m)}</td>);
          mc.push(<td key="rem" style={mk({borderRight:"1px solid #333"})}></td>);
          rows.push(<tr key={t.region+"_m"+mi}>{mc}</tr>);
        });
        return rows;
      }).flat()}</tbody></table>;
    };

    const typeLabel2={prelim:"본선",final:"결선",team:"단체전"};
    // 신기록 값 가져오기
    const getRecVal=(cat)=>{
      const rec=resBestRecs.find(b=>b.record_category===cat);
      return rec?.record_value||"—";
    };
    // 전체 라운드 신기록도 로드 (헤더용: prelim/final/team 무관하게 해당 종목)
    const today=new Date().toLocaleDateString("ko-KR");

    return <div className="print-overlay">
      <div className="print-page" style={{minHeight:printPages>1?(297*printPages)+"mm":"297mm"}}>
        <div ref={printContentRef} style={{zoom:printZoom}}>
        <div className="print-page-header"><span>대한장애인사격연맹</span><span>대회운영관리시스템</span></div>
        {/* ═══ 상단 헤더 ═══ */}
        <div style={{display:"flex",alignItems:"flex-start",marginBottom:"2mm"}}>
          {/* 좌상단: 연맹 로고 */}
          <div style={{width:"30mm",display:"flex",alignItems:"flex-start",justifyContent:"center",flexShrink:0,paddingTop:"1mm"}}>
            {fedLogo?<img src={fedLogo} alt="" style={{maxWidth:"29mm",maxHeight:"24mm",objectFit:"contain"}}/>:null}
          </div>
          {/* 중앙 */}
          <div style={{flex:1,textAlign:"center",padding:"0 3mm"}}>
            <div style={{fontSize:"13pt",fontWeight:800,marginBottom:"0.5mm"}}>{tName}</div>
            <div style={{fontSize:"11pt",fontWeight:700,marginBottom:"0.5mm"}}>기록지</div>
            <div style={{fontSize:"10pt",fontWeight:700,color:"#333",marginBottom:"0.5mm"}}>{evName}</div>
            <div style={{fontSize:"9pt",fontWeight:600,color:"#555",marginBottom:"1mm"}}>{typeLabel2[resType]}</div>
            <div style={{fontSize:"8pt",color:"#555"}}>{tVenue}&nbsp;&nbsp;{tDate}</div>
          </div>
          {/* 우상단: 후원사 로고 */}
          <div style={{width:"30mm",display:"flex",alignItems:"flex-start",justifyContent:"center",flexShrink:0,paddingTop:"1mm"}}>
            {getSponsorLogo(selectedT?.id)?<img src={getSponsorLogo(selectedT.id)} alt="" style={{maxWidth:"29mm",maxHeight:"24mm",objectFit:"contain"}}/>:null}
          </div>
        </div>
        {/* 기록 표시줄 */}
        <div style={{display:"flex",justifyContent:"center",gap:"8mm",marginBottom:"3mm",fontSize:"8pt",color:"#333"}}>
          <span>세계기록: <b>{getRecVal("world")}</b></span>
          <span>한국기록: <b>{getRecVal("korea")}</b></span>
          <span>체전기록: <b>{getRecVal("national")}</b></span>
        </div>
        {/* ═══ 본문 테이블 ═══ */}
        {resType==="team"?renderTeam():resType==="final"?renderFinal():renderPrelimFinal()}
        {/* ═══ 하단 ═══ */}
        <div style={{marginTop:"5mm",display:"flex",alignItems:"flex-end",fontSize:"8pt"}}>
          {/* 좌하단: 최종수정일자 */}
          <div style={{color:"#555"}}>최종수정일자: {today}</div>
          <div style={{flex:1}}/>
          {/* 하단 우측: 기록실장 서명란 */}
          <div style={{display:"flex",alignItems:"flex-end",gap:"3mm"}}>
            <span style={{fontSize:"9pt",fontWeight:600}}>기록실장:</span>
            <div style={{borderBottom:"1px solid #333",width:"35mm",height:"10mm"}}></div>
          </div>
        </div>
        </div>{/* close zoom wrapper */}
      </div>
      <div className="print-bar">
        <button style={{background:"#475569",color:"#fff"}} onClick={()=>setResPrintMode(false)}>← 돌아가기</button>
        <button style={{background:"#2563eb",color:"#fff"}} onClick={()=>window.print()}>🖨️ 인쇄하기</button>
        <span style={{color:"#94a3b8",fontSize:12,alignSelf:"center"}}>배율: {(printZoom*100).toFixed(0)}% ({printPages}p)</span>
      </div>
    </div>;
  };

  // ─── 대회 목록 ───
  const deleteYear=async(year)=>{
    const yearTs=tournaments.filter(t=>t.year===year);
    if(!confirm(year+"년 대회 "+yearTs.length+"건을 모두 삭제하시겠습니까?\n관련 종목/신청/선수 데이터가 함께 삭제됩니다."))return;
    try{
      for(const t of yearTs){const{error}=await sb.from("tournaments").delete().eq("id",t.id); if(error) throw new Error(error.message);}
      flash(year+"년 대회 "+yearTs.length+"건 삭제 완료"); loadT();
    }catch(e){flash("삭제 실패: "+e.message,"error");}
  };
  const addNewYear=()=>{
    const input=prompt("추가할 연도를 입력하세요",""+new Date().getFullYear());
    if(!input) return;
    const yr=parseInt(input);
    if(!yr||yr<2000||yr>2100){flash("올바른 연도를 입력하세요.","error");return;}
    if(tournaments.some(t=>t.year===yr)){flash(yr+"년 대회 묶음이 이미 존재합니다.","error");return;}
    // 빈 연도 묶음: 바로 새 대회 등록 모달 열기
    setEditT("new");setEditTVal({name:"",year:yr,venue:"",start_date:"",end_date:"",reg_start:"",reg_end:"",reg_period:"",status:1,description:"",check_national_record:false});
  };
  // 연도별 그룹핑 (내림차순)
  const [collapsedYears, setCollapsedYears]=useState({});
  const toggleYear=(y)=>setCollapsedYears(p=>({...p,[y]:!p[y]}));
  const yearGroups=React.useMemo(()=>{
    const map={};
    tournaments.forEach(t=>{const y=t.year||0; if(!map[y]) map[y]=[]; map[y].push(t);});
    return Object.keys(map).map(Number).sort((a,b)=>b-a).map(y=>({year:y,items:map[y]}));
  },[tournaments]);

  if(view==="list") return (
    <div style={{display:"flex",height:"100vh"}}>
      <div style={{width:220,minWidth:220,background:C.sidebar,borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",padding:"16px 0"}}>
        <div style={{padding:"8px 20px 16px",borderBottom:"1px solid "+C.border,marginBottom:8}}>
          <button onClick={onBack} style={{...S.btn("transparent","#6b7d94"),padding:"4px 0",fontSize:12}}>← 메인으로</button>
          <div style={{fontSize:15,fontWeight:800,color:C.gold,marginTop:8}}>🏆 대회 운영</div>
        </div>
        <button style={S.sideBtn(listTab==="tournaments")} onClick={()=>setListTab("tournaments")}>📋 대회 목록</button>
        <button style={S.sideBtn(listTab==="fedLogo")} onClick={()=>setListTab("fedLogo")}>🏛 연맹 로고</button>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {listTab==="tournaments"?<>
        <div style={{padding:"12px 24px",borderBottom:"1px solid "+C.border,background:C.sidebar,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontSize:14,fontWeight:700,color:C.gold}}>대회 목록</div>
          <button style={S.btn(C.gold,C.bg)} onClick={addNewYear}>+ 새 연도 추가</button>
        </div>
        <div style={{flex:1,overflow:"auto",padding:24}}>
          {loading?<div style={{textAlign:"center",padding:40,color:C.dim}}>로딩중...</div>:(
            <div style={{display:"flex",flexDirection:"column",gap:20,animation:"fadeIn .3s"}}>
              {yearGroups.length===0 && <div style={{textAlign:"center",padding:60,color:C.dimmer}}>등록된 대회가 없습니다</div>}
              {yearGroups.map(({year,items})=>(
                <div key={year} style={{border:"1px solid "+C.border,borderRadius:12,overflow:"hidden"}}>
                  {/* 연도 헤더 */}
                  <div style={{background:C.sidebar,padding:"10px 20px",display:"flex",alignItems:"center",gap:12,borderBottom:collapsedYears[year]?"none":"1px solid "+C.border,cursor:"pointer"}} onClick={()=>toggleYear(year)}>
                    <span style={{fontSize:13,color:C.dim,transition:"transform .2s",transform:collapsedYears[year]?"rotate(-90deg)":"rotate(0deg)"}}>▼</span>
                    <span style={{fontSize:16,fontWeight:800,color:C.gold}}>{year}년</span>
                    <span style={{fontSize:11,color:C.dim}}>({items.length}개 대회)</span>
                    <div style={{flex:1}}/>

        {[{k:"name",l:"대회명",ph:"2026 전국장애인사격선수권대회"},{k:"year",l:"연도",ph:"2026",t:"number"},{k:"venue",l:"장소",ph:"창원국제사격장"},{k:"start_date",l:"대회 시작일",t:"date"},{k:"end_date",l:"대회 종료일",t:"date"},{k:"reg_start",l:"접수 시작일",t:"date"},{k:"reg_end",l:"접수 마감일",t:"date"},{k:"reg_period",l:"접수기간 표시",ph:"2026.02.01 ~ 03.31"},{k:"status",l:"상태",t:"select",opts:[[1,"접수중"],[2,"접수대기"],[3,"진행중"],[4,"종료"]]},{k:"description",l:"설명"}].map(f=>(

              </label>

        <div style={{display:"flex",gap:8,marginTop:16}}><button style={S.btn(C.gold,C.bg)} onClick={saveT}>저장</button><button style={S.btn(C.border,"#8899aa")} onClick={()=>setEditT(null)}>취소</button></div>
      </div></div>)}

  // ─── 시간표 인쇄 ───
  const renderSchedPrint=()=>{
    if(!schedPrint) return null;
    const tName=selectedT?.name||"";
    const evCountMap={};
    if(evPData&&evPData.allEntries){
      evPData.allEntries.forEach(e=>{evCountMap[e.event_code]=(evCountMap[e.event_code]||0)+1;});
    }
    const catClr=(c)=>({"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"}[c]||"#666");
    const calcSpans=(rows)=>{
      const spans=new Array(rows.length).fill(1);const sk=new Set();
      for(let i=0;i<rows.length;i++){
        if(sk.has(i)||!rows[i].category) continue;
        let cnt=1;
        while(i+cnt<rows.length&&rows[i+cnt].category===rows[i].category){sk.add(i+cnt);cnt++;}
        spans[i]=cnt;
      }
      return {spans,sk};
    };
    const thSt={border:"1px solid #333",padding:"3px 6px",background:"#e8e8e8",fontWeight:700,fontSize:"8pt"};
    const tdSt={border:"1px solid #333",padding:"2px 5px",fontSize:"8.5pt"};
    const startDate=selectedT?.start_date;
    const dayLabel=(dayNum)=>{
      if(!startDate) return dayNum+"일차";
      const d=new Date(startDate);
      d.setDate(d.getDate()+dayNum-1);
      return (d.getMonth()+1)+"월 "+d.getDate()+"일";
    };

    return <div className="print-overlay">
      <div className="print-page">
        <div className="print-page-header"><span>대한장애인사격연맹</span><span>대회운영관리시스템</span></div>
        <div style={{textAlign:"center",marginBottom:"4mm"}}>
          <div style={{fontSize:"14pt",fontWeight:800,marginBottom:"2mm"}}>{tName}</div>
          <div style={{fontSize:"12pt",fontWeight:700}}>대회 일정표</div>
        </div>
        <button className="no-print" onClick={()=>setSchedPrint(false)} style={{position:"fixed",top:20,right:20,zIndex:10000,padding:"8px 20px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>✕ 닫기</button>
        <button className="no-print" onClick={()=>window.print()} style={{position:"fixed",top:20,right:100,zIndex:10000,padding:"8px 20px",background:"#d4a843",color:"#000",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>🖨 인쇄</button>

        {schedData.filter(d=>d.rows.length>0).map((day,dayIdx)=>{
          const {spans,sk}=calcSpans(day.rows);
          const totalRows=day.rows.length;
          return <div key={day.day} style={{marginBottom:"6mm"}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead>
                <tr>
                  <th style={{...thSt,width:"70px"}}>날짜</th>
                  <th style={{...thSt,width:"50px"}}>구분</th>
                  <th style={thSt}>내용</th>
                  <th style={{...thSt,width:"80px"}}>시간</th>
                  <th style={{...thSt,width:"46px"}}>인원</th>
                  <th style={{...thSt,width:"60px"}}>비고</th>
                </tr>
              </thead>
              <tbody>
                {day.rows.map((row,ri)=>{
                  const showCat=!sk.has(ri);
                  const isPET=row.type==="pet";
                  const evName=row.event_code?(events.find(e=>e.code===row.event_code)||{}).name||row.event_code:"";
                  const displayContent=isPET?("공식 훈련 ("+row.event_code+")"):(row.event_code?evName:row.content);
                  const countVal=row.event_code?evCountMap[row.event_code]:row.count;
                  return <tr key={row.id}>
                    {ri===0&&<td rowSpan={totalRows} style={{...tdSt,textAlign:"center",fontWeight:800,fontSize:"9pt",verticalAlign:"middle",background:"#f5f5f5"}}>{dayLabel(day.day)}</td>}
                    {showCat&&<td rowSpan={spans[ri]} style={{...tdSt,textAlign:"center",fontWeight:700,fontSize:"9pt",verticalAlign:"middle"}}>{row.category}</td>}
                    <td style={{...tdSt,textAlign:"left",paddingLeft:"8px"}}>{displayContent}{row.relay?(" "+row.relay+"조"):""}</td>
                    <td style={{...tdSt,textAlign:"center"}}>{row.time}</td>
                    <td style={{...tdSt,textAlign:"center"}}>{countVal?(countVal+(typeof countVal==="number"?"명":"")):""}</td>
                    <td style={{...tdSt,textAlign:"center"}}>{row.remark}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>;
        })}
      </div>
    </div>;
  };

  // ─── 스타트리스트 인쇄 ───
  const renderSlPrint=()=>{
    if(!slPrint) return null;
    const pSessionKey=slPrint;
    // 세션 키 파싱: "R1_1" → evCode="R1", relay=1 / "R1" → evCode="R1", relay=1
    const skParts=pSessionKey.match(/^(.+?)_(\d+)$/);
    const pEvCode=skParts?skParts[1]:pSessionKey;
    const pRelay=skParts?Number(skParts[2]):1;
    const tName=selectedT?.name||"";
    const evObj=events.find(e=>e.code===pEvCode);
    const evName=evObj?.name||pEvCode;
    const list=startLists[pSessionKey];
    if(!list||!list.length) return null;
    let dayNum=null,time=null;
    schedData.forEach(d=>{d.rows.forEach(r=>{if(r.type==="prelim"&&r.event_code===pEvCode){dayNum=d.day;if(r.time)time=r.time;}});});
    const startDate=selectedT?.start_date;
    let dateStr="X월 X일";
    if(dayNum&&startDate){const dt=new Date(startDate);dt.setDate(dt.getDate()+dayNum-1);dateStr=(dt.getMonth()+1)+"월 "+dt.getDate()+"일";}
    const timeStr=time||"00:00-00:00";
    if(!evPData) return null;
    const{allMembers,allEntries,appMap}=evPData;
    const memberAppMap={};allMembers.forEach(m=>{memberAppMap[m.id]=appMap[m.application_id];});
    const regionOrder=["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
    const participants=allEntries.filter(e=>e.event_code===pEvCode).map(e=>{
      const m=allMembers.find(mm=>mm.id===e.member_id);const app=memberAppMap[e.member_id];
      return m?{orgName:app?.org_name||"-",regionName:app?.region_name||"-"}:null;
    }).filter(Boolean);
    const sorted=[...participants].sort((a,b)=>{const ai=regionOrder.indexOf(a.regionName),bi=regionOrder.indexOf(b.regionName);return (ai===-1?99:ai)-(bi===-1?99:bi);});
    const orgOrder=[];sorted.forEach(p=>{if(!orgOrder.includes(p.orgName))orgOrder.push(p.orgName);});
    const orgNumMap={};orgOrder.forEach((org,i)=>{orgNumMap[org]=i+1;});
    const thSt={border:"1px solid #333",padding:"6px 8px",background:"#e8e8e8",fontWeight:700,fontSize:"12pt",textAlign:"center"};
    const tdSt={border:"1px solid #333",padding:"5px 8px",fontSize:"14px"};
    const active=list.filter(p=>!p.absent);
    // 조-사대 정보 (멀티릴레이 지원)
    let pRelays=[];
    Object.keys(laneAssign).forEach(dayKey=>{
      const da=laneAssign[dayKey]||{};
      Object.keys(da).forEach(k=>{
        const p=evKeyParse(k),a=da[k];
        if(p.evCode===pEvCode&&a&&a.lanes&&a.lanes.length>0) pRelays.push(a.relay);
      });
    });
    pRelays=[...new Set(pRelays)].sort((a,b)=>a-b);
    let seqNum=0;
    return <div className="print-overlay" style={{position:"fixed",inset:0,zIndex:9999,background:"#fff",overflow:"auto",color:"#000"}}>
      <button className="no-print" onClick={()=>setSlPrint(null)} style={{position:"fixed",top:20,right:20,zIndex:10000,padding:"8px 20px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>✕ 닫기</button>
      <button className="no-print" onClick={()=>window.print()} style={{position:"fixed",top:20,right:100,zIndex:10000,padding:"8px 20px",background:"#d4a843",color:"#000",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>🖨 인쇄</button>
      <div className="print-page" style={{maxWidth:800,margin:"0 auto",padding:"12mm 10mm 15mm",background:"#fff",color:"#000"}}>
        <div className="print-page-header"><span>대한장애인사격연맹</span><span>대회운영관리시스템</span></div>
        {/* 헤더: 좌=종목+날짜+시간, 우=대회명+스타트리스트 */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6mm"}}>
          <div>
            <div style={{fontSize:"16pt",fontWeight:800,color:"#000",marginBottom:"2mm"}}>{evName} {pRelay}조</div>
            <div style={{fontSize:"13pt",color:"#333"}}>{dateStr}　{timeStr}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:"11pt",color:"#555"}}>{tName}</div>
            <div style={{fontSize:"14pt",fontWeight:800,color:"#000",marginTop:"1mm"}}>스타트리스트</div>
          </div>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",color:"#000"}}>
          <thead><tr>
            <th style={{...thSt,width:"40px"}}>순</th>
            <th style={{...thSt,width:"50px"}}>사대</th>
            <th style={{...thSt,width:"80px"}}>이름</th>
            <th style={thSt}>소속</th>
            <th style={{...thSt,width:"60px"}}>단체</th>
            <th style={{...thSt,width:"70px"}}>비고</th>
          </tr></thead>
          <tbody>
            {list.map((p,i)=>{
              const isAbsent=p.absent;
              if(!isAbsent) seqNum++;
              const seq=isAbsent?null:seqNum;
              return <tr key={i} style={{background:isAbsent?"#f0f0f0":"#fff"}}>
                <td style={{...tdSt,textAlign:"center",color:isAbsent?"#999":"#000"}}>{isAbsent?"—":seq}</td>
                <td style={{...tdSt,textAlign:"center",fontWeight:700,color:"#000"}}>{p.lane||"-"}</td>
                <td style={{...tdSt,fontWeight:600,textDecoration:isAbsent?"line-through":"none",color:isAbsent?"#999":"#000"}}>{p.name}</td>
                <td style={{...tdSt,color:"#000"}}>{p.subOrg||"-"}</td>
                <td style={{...tdSt,textAlign:"center",color:"#000"}}>단체{orgNumMap[p.orgName]||"?"}</td>
                <td style={{...tdSt,color:"#000"}}>{p.remark||""}</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </div>;
  };

  // ─── 대회 상세 ───
  return (<>

    {renderSchedPrint()}

      <div style={{width:220,minWidth:220,background:C.sidebar,borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",padding:"16px 0"}}>

          <button onClick={()=>setView("list")} style={{...S.btn("transparent","#6b7d94"),padding:"4px 0",fontSize:12}}>← 대회 목록</button>
          <div style={{fontSize:13,fontWeight:800,color:C.gold,marginTop:8,lineHeight:1.4}}>{selectedT?.name}</div>
          <div style={{fontSize:11,color:C.dim,marginTop:4}}>{selectedT?.venue}</div>

        <button style={S.sideBtn(detailTab==="events")} onClick={()=>setDetailTab("events")}>🎯 종목 ({events.length})</button>

        <button style={S.sideBtn(detailTab==="evp")} onClick={()=>{setDetailTab("evp");loadEvParticipants();}}>📊 종목별 현황</button>
        <button style={S.sideBtn(detailTab==="schedule")} onClick={()=>{setDetailTab("schedule");loadEvParticipants();}}>📅 시간표</button>
        <button style={S.sideBtn(detailTab==="results")} onClick={()=>{setDetailTab("results");setResEvCode(null);setResData([]);loadEvParticipants();}}>🏅 경기 결과</button>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"12px 24px",borderBottom:"1px solid "+C.border,background:C.sidebar,display:"flex",alignItems:"center",gap:16}}>
          <span style={S.badge(STATUS_COLORS[selectedT?.status])}>{STATUS_MAP[selectedT?.status]}</span>
          {detailTab==="apps"&&<div style={{fontSize:12,color:C.dim}}>전체 {appSummary.total} · <span style={{color:C.gold}}>대기 {appSummary.pending}</span> · <span style={{color:C.green}}>승인 {appSummary.approved}</span> · <span style={{color:C.red}}>반려 {appSummary.rejected}</span></div>}
          {detailTab==="events"&&<><div style={{fontSize:12,color:C.dim}}>개인전 {events.filter(e=>e.type==="individual").length} · 혼성팀 {events.filter(e=>e.type==="mixed").length}</div>

              <div style={{position:"absolute",top:"100%",right:0,marginTop:4,background:"#1e293b",border:"1px solid #475569",borderRadius:6,boxShadow:"0 4px 12px rgba(0,0,0,.4)",zIndex:100,minWidth:260,overflow:"hidden"}}>

                {(()=>{const presets=getEvPresets(); const keys=Object.keys(presets);
                  return keys.length===0

                      <button onClick={()=>loadEvPreset(name)} style={{flex:1,textAlign:"left",padding:"9px 14px",background:"transparent",border:"none",color:"#e2e8f0",fontSize:11,cursor:"pointer",lineHeight:1.4}}
                        onMouseEnter={e=>e.target.style.background="#334155"} onMouseLeave={e=>e.target.style.background="transparent"}>
                        {name}<br/><span style={{fontSize:10,color:"#94a3b8"}}>{presets[name].events.length}개 종목</span>

                    </div>);

                <div style={{borderTop:"1px solid #475569",padding:"4px 0"}}>
                  <button onClick={saveDefaultAsPreset} style={{display:"block",width:"100%",textAlign:"left",padding:"9px 14px",background:"transparent",border:"none",color:"#e2e8f0",fontSize:11,cursor:"pointer",lineHeight:1.4}}
                    onMouseEnter={e=>e.target.style.background="#334155"} onMouseLeave={e=>e.target.style.background="transparent"}>
