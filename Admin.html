CREATE OR REPLACE FUNCTION submit_application(payload JSONB) RETURNS JSONB AS $$
DECLARE app_id INT; member_ids INT[]; member_id INT; member_rec JSONB; entry_rec JSONB; firearm_rec JSONB; team_rec JSONB;
BEGIN INSERT INTO applications (tournament_id, region_code, region_name, org_name) VALUES ((payload->>'tournament_id')::INT, payload->>'region_code', payload->>'region_name', payload->>'org_name') RETURNING id INTO app_id; member_ids := ARRAY[]::INT[];
FOR member_rec IN SELECT * FROM jsonb_array_elements(payload->'members') LOOP INSERT INTO members (application_id, name, gender, dob, role, sub_org, class_type, phone) VALUES (app_id, member_rec->>'name', member_rec->>'gender', (member_rec->>'dob')::DATE, member_rec->>'role', member_rec->>'sub_org', member_rec->>'class_type', member_rec->>'phone') RETURNING id INTO member_id; member_ids := array_append(member_ids, member_id);
IF member_rec ? 'events' THEN FOR entry_rec IN SELECT * FROM jsonb_array_elements(member_rec->'events') LOOP INSERT INTO individual_entries (application_id, member_id, event_code) VALUES (app_id, member_id, entry_rec #>> '{}'); END LOOP; END IF;
IF member_rec ? 'firearms' THEN FOR firearm_rec IN SELECT * FROM jsonb_array_elements(member_rec->'firearms') LOOP INSERT INTO firearms (member_id, gun_type, manufacturer, model, serial_number, permit_number) VALUES (member_id, firearm_rec->>'gun_type', firearm_rec->>'manufacturer', firearm_rec->>'model', firearm_rec->>'serial_number', firearm_rec->>'permit_number'); END LOOP; END IF; END LOOP;
IF payload ? 'teams' THEN FOR team_rec IN SELECT * FROM jsonb_array_elements(payload->'teams') LOOP DECLARE slot_idx INT; slot_arr JSONB; m_idx INT; BEGIN slot_arr := team_rec->'member_indices'; FOR slot_idx IN 0..jsonb_array_length(slot_arr)-1 LOOP m_idx := (slot_arr->slot_idx)::INT; IF m_idx >= 0 AND m_idx < array_length(member_ids, 1) THEN INSERT INTO team_entries (application_id, event_code, team_type, team_number, member_id, slot_order, is_union, union_memo) VALUES (app_id, team_rec->>'event_code', team_rec->>'team_type', COALESCE((team_rec->>'team_number')::INT,1), member_ids[m_idx+1], slot_idx, COALESCE((team_rec->>'is_union')::BOOLEAN,FALSE), team_rec->>'union_memo'); END IF; END LOOP; END; END LOOP; END IF;
INSERT INTO application_logs (application_id, action, detail) VALUES (app_id, 'submit', '참가신청 제출');
RETURN jsonb_build_object('success', true, 'application_id', app_id);
EXCEPTION WHEN OTHERS THEN RETURN jsonb_build_object('success', false, 'error', SQLERRM);
END; $$ LANGUAGE plpgsql SECURITY DEFINER;`;

  React.useEffect(()=>{
    if(!resPrintMode) return;
    setPrintZoom(1); setPrintPages(1);
    const timer=setTimeout(()=>{
      const headerEl=printHeaderRef.current;
      const footerEl=printFooterRef.current;
      const tableEl=printTableRef.current;
      const pageEl=printContentRef.current;
      if(!headerEl||!footerEl||!tableEl||!pageEl) return;
      const pageW=pageEl.offsetWidth;
      if(!pageW) return;
      // mm→px 비율: pageW = (210 - 12*2)mm = 186mm
      const pxPerMm=pageW/186;
      // 페이지 가용 높이: 297mm - padding(top 10 + bottom 20) = 267mm
      const totalUsableH=267*pxPerMm;
      // 헤더/푸터 고정 높이 차감 → 표에 사용 가능한 높이
      const headerH=headerEl.offsetHeight;
      const footerH=footerEl.offsetHeight;
      const tableAvailH=totalUsableH-headerH-footerH;
      const tableH=tableEl.scrollHeight;
      if(!tableH||tableAvailH<=0) return;
      const MIN_ZOOM=0.62;
      const MAX_ZOOM=1.35;
      if(tableH<=tableAvailH){
        // 표가 남은 공간에 들어감 → 확대하여 꽉 채움
        const z=tableAvailH/tableH;
        setPrintZoom(Math.min(z,MAX_ZOOM)); setPrintPages(1);
      } else {
        // 표가 넘침 → 축소 시도
        const z1=tableAvailH/tableH;
        if(z1>=MIN_ZOOM){
          setPrintZoom(z1); setPrintPages(1);
        } else {
          // 2페이지: 가용 = totalUsableH*2 - header - footer
          const twoPageAvail=totalUsableH*2-headerH-footerH;
          const z2=twoPageAvail/tableH;
          setPrintZoom(Math.min(z2,MAX_ZOOM)); setPrintPages(2);
        }
      }
    },200);
    return ()=>clearTimeout(timer);

  const buildStartList=(participants,orgNumMap)=>{
    const arr=[...participants];
    if(arr.length<=1) return arr;
    const maxAttempts=500;
    let best=null, bestScore=Infinity;
    for(let attempt=0;attempt<maxAttempts;attempt++){
      const sh=[...arr]; for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}
      let score=0;
      for(let i=1;i<sh.length;i++){
        if(sh[i].subOrg===sh[i-1].subOrg && sh[i].subOrg) score+=3;
        if(sh[i].orgName===sh[i-1].orgName) score+=3;
        if(sh[i].regionName===sh[i-1].regionName && sh[i].regionName) score+=2; // 같은 시도 연속 기피
        if(orgNumMap[sh[i].orgName]===orgNumMap[sh[i-1].orgName]) score+=1;

      if(score<bestScore){bestScore=score;best=sh;}
      if(score===0) break;
    }
    return best||arr;
  };

  const groupMixedTeams=(teamEntries,memberMap,memberAppMap)=>{
    const members=teamEntries.map(t=>{
      const m=memberMap[t.member_id]; const app=memberAppMap[t.member_id];
      return m?{memberId:m.id,name:m.name,subOrg:m.sub_org,orgName:app?.org_name||"-",regionName:app?.region_name||"-",
        appId:t.application_id,teamNum:t.team_number,slotOrder:t.slot_order||0}:null;
    }).filter(Boolean);
    const groups={};
    members.forEach(m=>{const k=m.appId+"_"+m.teamNum;if(!groups[k])groups[k]=[];groups[k].push(m);});
    const teams=[];const orphans=[];
    Object.values(groups).forEach(g=>{
      g.sort((a,b)=>a.slotOrder-b.slotOrder);
      if(g.length>=2){teams.push(g.slice(0,2));}
      else{orphans.push(g[0]);}
    });
    for(let i=0;i<orphans.length;i+=2){
      if(i+1<orphans.length) teams.push([orphans[i],orphans[i+1]]);
      else teams.push([orphans[i]]);
    }

      const teRows=[];
      Object.entries(editTeamComps).forEach(([k,comp])=>{
        let evCode,teamNum,teamType;
        if(k.startsWith("pair-")){
          // pair-EVCODE-NUM
          const parts=k.replace("pair-","").split("-");
          teamNum=parseInt(parts.pop());
          evCode=parts.join("-");
          teamType="mixed";
        } else if(k.startsWith("team-")){
          // team-EVCODE_NUM
          const inner=k.replace("team-","");
          const idx=inner.lastIndexOf("_");
          evCode=inner.substring(0,idx);
          teamNum=parseInt(inner.substring(idx+1));
          teamType="team";
        } else {

          const idx=k.lastIndexOf("_");
          evCode=k.substring(0,idx);
          teamNum=parseInt(k.substring(idx+1));
          teamType=comp.teamType||"team";

        comp.memberIds.forEach((mid,slot)=>{

  const loadResults=async(evCode,type)=>{

    setDbBusy(v=>v+1);
    try{
      const{data}=await sb.from("competition_results").select("*").eq("tournament_id",selectedT.id).eq("event_code",evCode).eq("result_type",type).order("id",{ascending:true});
      let rows=(data||[]).map(r=>({...r,_sub_org:r.sub_org||""}));
      // 혼성팀: team→sub 그룹 순서 보장 (team rank 기준 정렬, sub는 team 뒤에)
      const ev=events.find(e=>e.code===evCode);
      const cfg=getEventCfg(evCode,getEvFmt(evCode));
      if((cfg.mixed||(ev&&ev.type==="mixed"))&&(type==="prelim"||type==="bronze"||type==="gold")){
        const teams=[], subs=[], others=[];
        let curTeamId=null;
        const teamSubMap=new Map(); // teamId → [sub rows]
        // ID 순서대로 team→sub 그룹 식별
        rows.forEach(r=>{
          if(r.bib==="team"){curTeamId=r.id;teams.push(r);teamSubMap.set(r.id,[]);}
          else if(r.bib==="sub"&&curTeamId){teamSubMap.get(curTeamId).push(r);}
          else others.push(r);
        });
        teams.sort((a,b)=>(a.rank||999)-(b.rank||999));
        const sorted=[];
        teams.forEach(t=>{sorted.push(t);(teamSubMap.get(t.id)||[]).forEach(s=>sorted.push(s));});
        sorted.push(...others);
        rows=sorted;
      }
      setResData(rows);
      const{data:br}=await sb.from("best_records").select("*").eq("event_code",evCode).eq("result_type",type);
      setResBestRecs(br||[]);
    }catch(e){flash(e.message,"error");}
    finally{setDbBusy(v=>v-1);}

  const RES_REC_LABEL={korea:"한국신",national:"대회신",world:"비공식 세계신"};
  const getRecOrder=()=>{
    const order=["world","korea"];
    if((()=>{try{const m=JSON.parse(localStorage.getItem("ksfd_cnr")||"{}");return !!m[selectedT?.id];}catch(e){return false;}})()) order.splice(1,0,"national");
    return order;
  };
  const resCheckRecords=()=>{
    if(!resBestRecs.length&&resData.filter(r=>!r._deleted).length>0){
      flash("등록된 신기록이 없습니다. 신기록 관리에서 먼저 등록하세요.","error"); return;
    }
    const parseScore=(v)=>{
      if(!v) return 0;
      const s=String(v).replace(/[^\d.]/g,"");
      return parseFloat(s)||0;
    };
    const updated=resData.map(r=>{
      if(r._deleted) return r;
      const score=parseScore(r.total);
      if(!score) return r;
      const newMarks=[];
      for(const catKey of getRecOrder()){
        const rec=resBestRecs.find(b=>b.record_category===catKey);
        if(!rec||!rec.record_value) continue;
        const recScore=parseScore(rec.record_value);
        if(!recScore) continue;
        if(score>recScore){
          newMarks.push(RES_REC_LABEL[catKey]+"/종전 "+rec.record_value);
        } else if(score===recScore){
          newMarks.push(RES_REC_LABEL[catKey]+" 타이");
        }
      }
      if(newMarks.length===0) return r;
      // 기존 비고에서 신기록 관련 내용 제거 후 추가
      let oldRemarks=(r.remarks||"").replace(/(비공식 세계신|한국신|대회신)(\/종전\s*[\d.]+|\s*타이)/g,"").replace(/[A-Z]{2}(신\/종전\s*[\d.]+|타이)/g,"").replace(/\s*,\s*,/g,",").replace(/^[,\s]+|[,\s]+$/g,"");
      const markStr=newMarks.join(", ");
      const finalRemarks=oldRemarks?(markStr+", "+oldRemarks):markStr;
      return {...r,remarks:finalRemarks,_dirty:true};
    });
    setResData(updated);
    setResDirty(true);
    const cnt=updated.filter(r=>!r._deleted&&r.remarks&&/(한국신|대회신|세계신|타이)/.test(r.remarks)).length;
    flash(cnt>0?("🏅 "+cnt+"건 신기록 감지! 비고란을 확인하세요."):"신기록 해당자가 없습니다.");
  };
  const resAddRow=()=>{
    const nr=resData.filter(r=>!r._deleted).length+1;
    const cfg=getEventCfg(resEvCode,getEvFmt(resEvCode));
    const ev=events.find(e=>e.code===resEvCode);

  const resRemoveRow=(idx)=>{

    if(r.bib==="team"){
      const toRemove=new Set([idx]);
      let j=idx+1;
      while(j<resData.length&&resData[j].bib==="sub"){toRemove.add(j);j++;}
      if(r._new) setResData(resData.filter((_,i)=>!toRemove.has(i)));
      else setResData(resData.map((rr,i)=>toRemove.has(i)?{...rr,_deleted:true}:rr));
      setResDirty(true);return;
    }
    if(r._new) setResData(resData.filter((_,i)=>i!==idx));

  // ── 결과 확정: 합계 기준 순위 계산 + 재배치 ──
  const resConfirmResults=()=>{

    const parseTotal=(v)=>{if(!v||v==="")return-Infinity;return parseFloat(v)||0;};
    const parseXC=(v)=>{if(!v||v==="")return 0;return parseInt(v)||0;};

    if(isMixed&&(resType==="prelim"||resType==="bronze"||resType==="gold")){
      // 혼성팀: team그룹 추출 → team.total 기준 정렬
      const groups=[];
      let cur=null;
      active.forEach(r=>{
        if(r.bib==="team"){cur={team:r,subs:[]};groups.push(cur);}
        else if(r.bib==="sub"&&cur){cur.subs.push(r);}
      });
      groups.sort((a,b)=>{
        const d=parseTotal(b.team.total)-parseTotal(a.team.total);
        if(d!==0)return d;
        return parseXC(b.team.x_count)-parseXC(a.team.x_count);
      });
      const nr=[];
      const deleted=data.filter(r=>r._deleted);
      groups.forEach((g,i)=>{
        nr.push({...g.team,rank:i+1,_dirty:true});
        g.subs.forEach(s=>nr.push({...s,_dirty:true}));
      });
      nr.push(...deleted);
      setResData(nr);

      // 개인전 / 결선
      const rows=active.filter(r=>r.bib!=="sub");
      rows.sort((a,b)=>{
        const d=parseTotal(b.total)-parseTotal(a.total);
        if(d!==0)return d;
        return parseXC(b.x_count)-parseXC(a.x_count);
      });
      const deleted=data.filter(r=>r._deleted);
      const nr=rows.map((r,i)=>({...r,rank:i+1,_dirty:true}));
      nr.push(...deleted);

  const REGIONS=["서울","경기","인천","부산","대구","광주","대전","울산","세종","강원","충북","충남","전북","전남","경북","경남","제주"];
  const SURNAMES=["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","류","홍"];
  const GIVEN=["민수","지현","영호","수진","현우","미경","태영","은지","성민","하늘","동현","서연","준혁","예진","상훈","유리","재원","소영","우진","나연"];
  const rName=()=>SURNAMES[Math.floor(Math.random()*SURNAMES.length)]+GIVEN[Math.floor(Math.random()*GIVEN.length)];
  const [resTestMenu, setResTestMenu]=useState(false);
  // 공통: 랜덤 점수 생성
  const resGenScores=(row, cfg)=>{
    if(resType==="final"){
      // 결선 개별 행은 resGenFinalElim에서 일괄 처리하므로 여기서는 skip
      return;
    }
    let sum=0;
    const isThreePos=!!cfg.seriesLabels; // R7, R8
    const isDecimalRifle=cfg.decimal&&!isThreePos; // 소총(R7,R8 제외)
    const isMixed=!!cfg.mixed; // 혼성팀 (2인 합산)
    const xPerSeries=[];
    for(let s=1;s<=cfg.series;s++){
      let v;
      if(isDecimalRifle){
        if(isMixed){
          // 혼성팀 소총: 2인 합산 소수점 (161.0~218.0)
          const p1=(Math.random()*28.5+80.5);
          const p2=(Math.random()*28.5+80.5);
          v=(p1+p2).toFixed(1);
        } else {
          // 소총: 소수점 80.5~109.0
          v=(Math.random()*28.5+80.5).toFixed(1);
        }
      } else {
        if(isMixed){
          // 혼성팀 권총: 2인 합산 정수 (160~200)
          const p1=Math.floor(Math.random()*21+80);
          const p2=Math.floor(Math.random()*21+80);
          v=String(p1+p2);
        } else {
          // 권총+3자세: 정수 80~100
          v=String(Math.floor(Math.random()*21+80));
        }
      }
      row["s"+s]=v; sum+=parseFloat(v);
      if(cfg.xcount){
        const sx=isMixed?Math.floor(Math.random()*26):Math.floor(Math.random()*16); // 혼성팀: 0~25
        xPerSeries.push(sx);
      }
    }
    row.total=isDecimalRifle?sum.toFixed(1):String(sum);
    if(cfg.xcount){
      if(isThreePos){
        // 3자세: 시리즈별 x카운트 쉼표 구분 저장
        row.x_count=xPerSeries.join(",");
      } else {
        row.x_count=String(xPerSeries.reduce((a,b)=>a+b,0));
      }
    }
  };
  // ── 결선 탈락식 테스트 데이터 생성 ──
  const resGenFinalElim=(rows,is3Pos)=>{
    const n=rows.length;
    if(is3Pos){
      // 3자세 결선: 8시리즈, S1·S2=3발, S3=2발, S4~S8=1발
      // S3 후 7,8위 탈락(2명), 이후 1명씩 탈락, S8에서 1·2위 확정
      const sims=rows.map(r=>({row:r, cumul:0, eliminated:false, elimAt:0, rank:0}));
      for(let s=1;s<=8;s++){
        const remaining=sims.filter(d=>!d.eliminated);
        if(remaining.length===0) break;
        const nShots=s<=2?3:s===3?2:1;
        remaining.forEach(d=>{
          const shots=[];
          for(let j=0;j<nShots;j++){
            const v=parseFloat((Math.random()*2+8.5).toFixed(1));
            shots.push(v); d.cumul+=v;
          }
          d.cumul=parseFloat(d.cumul.toFixed(1));
          d.row["s"+s]=shots.map(v=>v.toFixed(1)).join(",");
        });
        if(s===3&&remaining.length>6){
          // S3 후 7,8위 동시 탈락
          remaining.sort((a,b)=>a.cumul-b.cumul);
          for(let e=0;e<Math.min(2,remaining.length-6);e++){
            remaining[e].eliminated=true; remaining[e].elimAt=s;
            remaining[e].rank=remaining.length-e; remaining[e].row.total=remaining[e].cumul.toFixed(1);
          }
        } else if(s>=4&&s<=7&&remaining.length>2){
          remaining.sort((a,b)=>a.cumul-b.cumul);
          remaining[0].eliminated=true; remaining[0].elimAt=s;
          remaining[0].rank=remaining.length; remaining[0].row.total=remaining[0].cumul.toFixed(1);
        }
        if(s===8){
          const last=sims.filter(d=>!d.eliminated);
          last.sort((a,b)=>b.cumul-a.cumul);
          if(last.length>=2){ last[0].rank=1; last[0].row.total=last[0].cumul.toFixed(1); last[1].rank=2; last[1].row.total=last[1].cumul.toFixed(1); }
          else if(last.length===1){ last[0].rank=1; last[0].row.total=last[0].cumul.toFixed(1); }
        }
      }
      sims.forEach(d=>{d.row.rank=d.rank;});
      rows.sort((a,b)=>a.rank-b.rank);
    } else {
      // 기존 결선: 9시리즈
      const firstElimSeries=Math.max(3, 11-n);
      const sims=rows.map(r=>({row:r, cumul:0, eliminated:false, elimAt:0, rank:0}));
      for(let s=1;s<=9;s++){
        const remaining=sims.filter(d=>!d.eliminated);
        if(remaining.length===0) break;
        const nShots=s<=2?5:2;
        remaining.forEach(d=>{
          const shots=[];
          for(let j=0;j<nShots;j++){
            const v=parseFloat((Math.random()*2+8.5).toFixed(1));
            shots.push(v); d.cumul+=v;
          }
          d.cumul=parseFloat(d.cumul.toFixed(1));
          d.row["s"+s]=shots.map(v=>v.toFixed(1)).join(",");
        });
        if(s>=firstElimSeries&&s<=8&&remaining.length>2){
          remaining.sort((a,b)=>a.cumul-b.cumul);
          remaining[0].eliminated=true; remaining[0].elimAt=s;
          remaining[0].rank=remaining.length; remaining[0].row.total=remaining[0].cumul.toFixed(1);
        }
        if(s===9){
          const last=sims.filter(d=>!d.eliminated);
          last.sort((a,b)=>b.cumul-a.cumul);

  // ── 결선 진출자 생성 (본선 → 결선 상위 최대 8인) ──
  const promoteToFinal=async()=>{
    if(!resEvCode||!selectedT) return;
    const{data:prelimData}=await sb.from("competition_results").select("*").eq("tournament_id",selectedT.id).eq("event_code",resEvCode).eq("result_type","prelim").order("rank");
    if(!prelimData||prelimData.length===0){flash("본선 기록이 없습니다. 먼저 본선 결과를 저장하세요.","error");return;}
    const sorted=[...prelimData].sort((a,b)=>{
      const ta=parseFloat(a.total)||0, tb=parseFloat(b.total)||0;
      if(tb!==ta) return tb-ta;
      const parseXC=(v)=>v?(v.includes(",")?v.split(",").reduce((s,x)=>s+(parseInt(x)||0),0):parseInt(v)||0):0;
      return parseXC(b.x_count)-parseXC(a.x_count);
    });
    const top=sorted.slice(0,Math.min(8,sorted.length));
    await sb.from("competition_results").delete().eq("tournament_id",selectedT.id).eq("event_code",resEvCode).eq("result_type","final");
    const finalRows=top.map((r,i)=>({
      tournament_id:selectedT.id, event_code:resEvCode, result_type:"final",
      rank:i+1, bib:String(i+1), name:r.name, region:r.region, sub_org:r.sub_org||"",
      is_team:false,
      s1:"",s2:"",s3:"",s4:"",s5:"",s6:"",s7:"",s8:"",s9:"",s10:"",s11:"",s12:"",
      total:"", x_count:"", remarks:"본선 "+r.rank+"위 ("+r.total+")"
    }));
    const{error}=await sb.from("competition_results").insert(finalRows);
    if(error){flash("결선 진출자 저장 실패: "+error.message,"error");return;}
    flash("🏆 결선 진출자 "+top.length+"명 생성 완료 → 결선 탭으로 이동");
    loadResults(resEvCode,"final");
  };

  // ── 결선 스타트리스트 생성 (소속 비연속 셔플) ──
  const generateFinalSL=async()=>{
    if(!resEvCode) return;
    const finalists=resData.filter(r=>!r._deleted);
    if(finalists.length===0){flash("결선 진출자가 없습니다.","error");return;}
    // sub_org 조회: DB members → evPData → startLists
    const subOrgMap={};
    try{
      if(sb){const{data:mems}=await sb.from("members").select("name,sub_org");if(mems) mems.forEach(m=>{if(m.sub_org&&m.sub_org.trim())subOrgMap[m.name]=m.sub_org;});}
    }catch(e){}
    if(evPData&&evPData.allMembers) evPData.allMembers.forEach(m=>{if(m.sub_org&&m.sub_org.trim()&&!subOrgMap[m.name])subOrgMap[m.name]=m.sub_org;});
    // startLists에서도 검색
    Object.values(startLists).forEach(sl=>{if(sl)sl.forEach(p=>{if(p.subOrg&&p.name&&!subOrgMap[p.name])subOrgMap[p.name]=p.subOrg;});});
    // 셔플: 같은 region/sub_org 연속 안 되도록
    const arr=finalists.map(r=>{
      const so=r._sub_org||subOrgMap[r.name]||"";
      return {name:r.name, region:r.region, sub_org:so, prelimRank:r.rank, prelimTotal:r.total, remarks:r.remarks||""};
    });
    const maxAttempts=500;
    let best=null, bestScore=Infinity;
    for(let attempt=0;attempt<maxAttempts;attempt++){
      const sh=[...arr];
      for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}
      let score=0;
      for(let i=1;i<sh.length;i++){
        if(sh[i].region&&sh[i].region===sh[i-1].region) score+=3;
        if(sh[i].sub_org&&sh[i].sub_org===sh[i-1].sub_org) score+=3;
      }
      if(score<bestScore){bestScore=score;best=sh;}
      if(score===0) break;
    }
    const result=(best||arr).map((p,i)=>({...p,bib:i+1}));
    setResFinalSL(result);
    flash("결선 스타트리스트 생성: "+result.length+"명 (소속 비연속 배치"+(bestScore===0?" ✓":"·최선")+")");

        const subs=calcCumul(r);
        const playerLastS=subs.length; // 이 선수의 마지막 시리즈 번호 (1-based)
        const allShots=[];
        for(let s=1;s<=SERIES;s++) allShots.push(parseShots(r["s"+s]));
        const rows=[];
        for(let row=0;row<MAX_ROWS;row++){
          const cells=[];
          const isLast=row===MAX_ROWS-1;
          if(row===0){
            // 순위, 이름, 소속 — 상단 정렬
            cells.push(<td key="rank" rowSpan={MAX_ROWS} style={{...subCell,borderLeft:bdr,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{r.rank}</td>);
            cells.push(<td key="name" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",textAlign:"left",paddingLeft:"2px",paddingTop:"2px"}}>{r.name}</td>);
            cells.push(<td key="region" rowSpan={MAX_ROWS} style={{...subCell,fontSize:"6.5pt",verticalAlign:"top",borderRight:dotBdr,textAlign:"left",paddingLeft:"1px",paddingTop:"2px"}}>{isNatGames()?r.region:(r._sub_org||r.sub_org||r.region)}</td>);
          }
          // 시리즈 열 (S1~S9)
          for(let s=0;s<SERIES;s++){
            const shots=allShots[s];
            const maxS=shotsIn(s+1);
            const rightBdr=s===1?{borderRight:dotBdr}:{};
            if(row===0){
              // 마지막 시리즈 누계 = 합계와 동일 → 숨김, 탈락 이후도 숨김
              const val=(s+1)>=playerLastS?"":((subs[s]||0)>0?subs[s].toFixed(1):"");
              cells.push(<td key={"s"+s} style={{...subCell,...rightBdr}}>{val}</td>);
            } else {
              const shotIdx=row-1;
              const cStyle=isLast?{...shotLastCell,...rightBdr}:{...shotCell,...rightBdr};
              if(shotIdx<maxS&&shots[shotIdx]!==undefined){
                cells.push(<td key={"s"+s} style={cStyle}>{shots[shotIdx].toFixed(1)}</td>);
              } else {
                cells.push(<td key={"s"+s} style={cStyle}></td>);
              }
            }
          }
          if(row===0){
            const total=subs.length>0?subs[subs.length-1].toFixed(1):(r.total||"");
            cells.push(<td key="total" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{total}</td>);
            cells.push(<td key="rem" rowSpan={MAX_ROWS} style={{...subCell,borderRight:bdr,fontSize:"5.5pt",verticalAlign:"top",textAlign:"left",padding:"2px 1px",fontWeight:400,lineHeight:1.1}}>{fmtRemarks(r.remarks)}</td>);
          }
          rows.push(<tr key={pi+"_"+row}>{cells}</tr>);
        }
        return rows;
      }).flat()}</tbody></table>;
    };

    // ═══ 3자세 결선 전용 테이블 (8시리즈: S1·S2=3발, S3=2발표시, S4~S8=1발) ═══
    const renderFinal3Pos=()=>{
      const data=resData.filter(r=>!r._deleted);
      if(data.length===0) return <p style={{textAlign:"center",color:"#999",padding:"20mm 0"}}>결선 데이터가 없습니다.</p>;
      const SERIES=8;
      const shotsIn=s=>s<=2?3:s===3?2:1; // S1,S2=3발, S3=2발(표시), S4~S8=1발
      const MAX_ROWS=4; // row0=누계, row1~3=격발
      const F="'Arial Narrow','Malgun Gothic','맑은 고딕',sans-serif";
      const SZ="7.5pt";
      const parseShots=str=>{
        if(!str) return [];
        return String(str).split(",").map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v));
      };
      const calcCumul=r=>{
        const subs=[];let cum=0;
        for(let s=1;s<=SERIES;s++){
          const shots=parseShots(r["s"+s]);
          if(shots.length===0) break;
          cum+=shots.reduce((a,b)=>a+b,0);
          subs.push(parseFloat(cum.toFixed(1)));
        }
        return subs;
      };
      const bdr="1px solid #333";
      const bdrD="1px dashed #aaa";
      const subCell={padding:"1px 2px",textAlign:"center",fontSize:SZ,fontFamily:F,fontWeight:700,lineHeight:1.1,
        borderTop:bdr,borderBottom:"1px solid #555",borderLeft:"none",borderRight:"none"};
      const shotCell={padding:"0.5px 1px",textAlign:"center",fontSize:SZ,fontFamily:F,fontWeight:400,lineHeight:1.1,
        borderTop:"none",borderBottom:bdrD,borderLeft:"none",borderRight:"none"};
      const shotLastCell={...shotCell,borderBottom:bdr};
      const colW=["22px","38px","62px",...Array(SERIES).fill(null),"38px","48px"];
      return <table style={{tableLayout:"fixed",width:"100%"}}><colgroup>
        {colW.map((w,i)=><col key={i} style={w?{width:w}:{}}/>)}
      </colgroup>
      <thead>
        <tr>
          {["순위","이름","소속"].map((h,i)=>
            <th key={h} style={{...pTh,padding:"2px 2px",fontSize:"7pt",...(i===2?{borderRight:dotBdr}:{})}}>{h}</th>
          )}
          {Array.from({length:SERIES},(_,i)=>
            <th key={"s"+i} style={{...pTh,fontSize:"7pt",padding:"2px 1px",...(i===1?{borderRight:dotBdr}:{})}}>S{i+1}</th>
          )}
          <th style={{...pTh,padding:"2px 2px",fontSize:"7pt"}}>합계</th>
          <th style={{...pTh,padding:"2px 2px",fontSize:"7pt"}}>비고</th>
        </tr>
      </thead>
      <tbody>{data.map((r,pi)=>{
        const subs=calcCumul(r);
        const playerLastS=subs.length;
        const allShots=[];
        for(let s=1;s<=SERIES;s++) allShots.push(parseShots(r["s"+s]));
        const rows=[];
        for(let row=0;row<MAX_ROWS;row++){
          const cells=[];
          const isLast=row===MAX_ROWS-1;
          if(row===0){
            cells.push(<td key="rank" rowSpan={MAX_ROWS} style={{...subCell,borderLeft:bdr,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{r.rank}</td>);
            cells.push(<td key="name" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",textAlign:"left",paddingLeft:"2px",paddingTop:"2px"}}>{r.name}</td>);
            cells.push(<td key="region" rowSpan={MAX_ROWS} style={{...subCell,fontSize:"6.5pt",verticalAlign:"top",borderRight:dotBdr,textAlign:"left",paddingLeft:"1px",paddingTop:"2px"}}>{isNatGames()?r.region:(r._sub_org||r.sub_org||r.region)}</td>);
          }
          for(let s=0;s<SERIES;s++){
            const shots=allShots[s];
            const maxS=shotsIn(s+1);
            const rightBdr=s===1?{borderRight:dotBdr}:{};
            if(row===0){
              const val=(s+1)>=playerLastS?"":((subs[s]||0)>0?subs[s].toFixed(1):"");
              cells.push(<td key={"s"+s} style={{...subCell,...rightBdr}}>{val}</td>);
            } else {
              const shotIdx=row-1;
              const cStyle=isLast?{...shotLastCell,...rightBdr}:{...shotCell,...rightBdr};
              if(shotIdx<maxS&&shots[shotIdx]!==undefined){
                cells.push(<td key={"s"+s} style={cStyle}>{shots[shotIdx].toFixed(1)}</td>);
              } else {
                cells.push(<td key={"s"+s} style={cStyle}></td>);
              }
            }
          }
          if(row===0){
            const total=subs.length>0?subs[subs.length-1].toFixed(1):(r.total||"");
            cells.push(<td key="total" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{total}</td>);
            cells.push(<td key="rem" rowSpan={MAX_ROWS} style={{...subCell,borderRight:bdr,fontSize:"5.5pt",verticalAlign:"top",textAlign:"left",padding:"2px 1px",fontWeight:400,lineHeight:1.1}}>{fmtRemarks(r.remarks)}</td>);
          }
          rows.push(<tr key={pi+"_"+row}>{cells}</tr>);
        }
        return rows;
      }).flat()}</tbody></table>;
    };

    // 단체전 테이블
    const renderTeam=()=>{
      if(teamData.length===0) return <p style={{textAlign:"center",color:"#999",padding:"20mm 0"}}>단체전 데이터가 없습니다.</p>;
      const is3Pos=!!cfg.seriesLabels;
      const sCols=Array.from({length:cfg.series},(_,i)=>i+1);
      const sHeaders=cfg.seriesLabels||sCols.map(i=>""+i);
      const isDotAfterS=(s)=>{
        if(cfg.seriesLabels) return s===2||s===4||s===cfg.series;
        return s===cfg.series;
      };
      const fmtTeamTotal=(t)=>{
        const tv=cfg.decimal?t.teamTotal.toFixed(1):t.teamTotal;
        return cfg.xcount?(tv+" -"+t.teamXCount+"x"):tv;
      };
      const fmtMemberTotal=(m)=>{
        const tv=cfg.decimal?parseFloat(m.total).toFixed(1):m.total;
        return cfg.xcount?(tv+(m.x_count?" -"+(typeof m.x_count==="string"&&m.x_count.includes(",")?m.x_count.split(",").reduce((s,v)=>s+(parseInt(v)||0),0):m.x_count)+"x":"")):tv;
      };
      const teamSeriesSum=(t,sIdx)=>{
        const sum=t.top3.reduce((s,m)=>s+(parseFloat(m["s"+sIdx])||0),0);
        return cfg.decimal?sum.toFixed(1):sum;
      };
      const calcSub=(r,startS)=>{
        const v1=parseFloat(r["s"+startS])||0,v2=parseFloat(r["s"+(startS+1)])||0;
        return v1+v2||"";
      };
      const teamSubTotal=(t,startS)=>{
        const sum=t.top3.reduce((s,m)=>s+(parseFloat(m["s"+startS])||0)+(parseFloat(m["s"+(startS+1)])||0),0);
        return sum||"";
      };

      const F="'Arial Narrow','Malgun Gothic','맑은 고딕',sans-serif";
      const sPad="1px 2px";

      if(is3Pos){
        // ── 3자세 단체전: 3행 레이아웃 ──
        const poses=[{name:"슬사",s1:1,s2:2},{name:"복사",s1:3,s2:4},{name:"입사",s1:5,s2:6}];
        const hdr3=["순위","소속 / 이름","자세","1","2","소계","합계","비고"];
        const colW3=hdr3.map(h=>({순위:"24px","소속 / 이름":"1%",자세:"30px","1":"34px","2":"34px",소계:"44px",합계:"84px",비고:null}[h]));
        return <table style={{tableLayout:"auto",width:"100%"}}><colgroup>
          {colW3.map((w,i)=><col key={i} style={w?{width:w}:{}}/>)}
        </colgroup>
        <thead><tr>
          {hdr3.map(h=><th key={h} style={{...pTh,whiteSpace:"nowrap",padding:"3px 3px",...(h==="소속 / 이름"||h==="2"?{borderRight:dotBdr}:{})}}>{h}</th>)}
        </tr></thead>
        <tbody>{teamData.map((t,ti)=>{
          const rows=[];
          // ── 팀 합산 3행 ──
          poses.forEach((p,pi)=>{
            const isFirst=pi===0, isLast=pi===2;
            const bdrBot=isLast?"1px dashed #888":"1px solid transparent";
            const tdS={padding:isLast?"2px 4px":"1px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,borderBottom:bdrBot,verticalAlign:isFirst?"bottom":isLast?"top":"middle"};
            rows.push(<tr key={(t.teamNum||t.region)+"_t"+pi} style={{background:"#f0f0f0"}}>
              <td style={{...tdS,borderLeft:"1px solid #333",fontWeight:isFirst?800:400,fontSize:isFirst?"10pt":"8.5pt"}}>{isFirst?t.rank:""}</td>
              <td style={{...tdS,textAlign:"left",paddingLeft:"4px",fontWeight:isFirst?700:400,fontSize:isFirst?"9pt":"8.5pt",borderRight:dotBdr,whiteSpace:"nowrap"}}>{isFirst?teamDisplayName(t):""}</td>
              <td style={{...tdS,fontWeight:600,fontSize:"7.5pt",color:"#555"}}>{p.name}</td>
              <td style={{...tdS,fontWeight:700,padding:sPad}}>{teamSeriesSum(t,p.s1)}</td>
              <td style={{...tdS,fontWeight:700,padding:sPad,borderRight:dotBdr}}>{teamSeriesSum(t,p.s2)}</td>
              <td style={{...tdS,fontWeight:700}}>{teamSubTotal(t,p.s1)}</td>
              <td style={{...tdS,fontWeight:isLast?800:400,fontSize:isLast?"10pt":"8.5pt",textAlign:"left",paddingLeft:"6px",whiteSpace:"nowrap"}}>{isLast?fmtTeamTotal(t):""}</td>
              <td style={{...tdS,borderRight:"1px solid #333",fontSize:"7pt",textAlign:"left",padding:"2px 3px"}}>{isLast?(fmtRemarks(t._remarks)||""):""}</td>
            </tr>);
          });
          // ── 개인 행 (top3 + extra) ──
          const allM=[...t.top3];
          if(t.extra) allM.push(t.extra);
          allM.forEach((m,mi)=>{
            const isLastMember=mi===allM.length-1;
            poses.forEach((p,pi)=>{
              const isFirst=pi===0, isLast=pi===2;
              const bdrBot=isLast?(isLastMember?"2px solid #333":"1px dashed #888"):"1px solid transparent";
              const tdS={padding:isLast?"2px 4px":"1px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,borderBottom:bdrBot,verticalAlign:isFirst?"bottom":isLast?"top":"middle"};
              rows.push(<tr key={(t.teamNum||t.region)+"_m"+mi+"_"+pi}>
                <td style={{...tdS,borderLeft:"1px solid #333"}}></td>
                <td style={{...tdS,textAlign:"left",paddingLeft:"10px",fontSize:"8pt",borderRight:dotBdr,whiteSpace:"nowrap"}}>
                  {isFirst?<>{m.name}{(m._sub_org||"")?<span style={{marginLeft:3,fontSize:"7pt"}}>[{m._sub_org}]</span>:null}</>:""}
                </td>
                <td style={{...tdS,fontWeight:600,fontSize:"7.5pt",color:"#555"}}>{p.name}</td>
                <td style={{...tdS,padding:sPad}}>{m["s"+p.s1]||""}</td>
                <td style={{...tdS,padding:sPad,borderRight:dotBdr}}>{m["s"+p.s2]||""}</td>
                <td style={{...tdS,fontWeight:600}}>{calcSub(m,p.s1)}</td>
                <td style={{...tdS,fontWeight:isLast?600:400,textAlign:"left",paddingLeft:"6px",whiteSpace:"nowrap"}}>{isLast?fmtMemberTotal(m):""}</td>
                <td style={{...tdS,borderRight:"1px solid #333"}}></td>
              </tr>);
            });
          });
          return rows;
        }).flat()}</tbody></table>;
      }

      // ── 일반 단체전 (기존 로직) ──
      const hdr=["순위","소속 / 이름",...sHeaders,"합계","비고"];
      const hdrDotTeam=new Set();
      hdrDotTeam.add("소속 / 이름");
      if(cfg.seriesLabels){ hdrDotTeam.add(cfg.seriesLabels[1]); hdrDotTeam.add(cfg.seriesLabels[3]); hdrDotTeam.add(cfg.seriesLabels[5]); }
      else { hdrDotTeam.add(""+cfg.series); }

      // ★ border shorthand 절대 미사용 — 모든 면 개별 지정
      const teamCell=(extra={})=>({padding:"2px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,
        borderTop:"2px solid #333",borderBottom:"1px dashed #888",borderLeft:"none",borderRight:"none",...extra});
      const memCell=(extra={})=>({padding:"2px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,
        borderTop:"none",borderBottom:"1px dashed #aaa",borderLeft:"none",borderRight:"none",...extra});
      const memLastCell=(extra={})=>({padding:"2px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,
        borderTop:"none",borderBottom:"1px solid #333",borderLeft:"none",borderRight:"none",...extra});

      return <table style={{tableLayout:"auto",width:"100%"}}><colgroup>
        {hdr.map((h,i)=><col key={i} style={h==="순위"?{width:"24px"}:{}}/>)}
      </colgroup>
      <thead><tr>{hdr.map(h=><th key={h} style={{...pTh,whiteSpace:"nowrap",padding:"3px 3px",...(hdrDotTeam.has(h)?{borderRight:dotBdr}:{})}}>{h}</th>)}</tr></thead>
      <tbody>{teamData.map((t,ti)=>{
        const rows=[];
        // ── 팀 합산 행 ──
        const tc=[];
        tc.push(<td key="rank" style={teamCell({borderLeft:"1px solid #333",fontWeight:800,fontSize:"10pt"})}>{t.rank}</td>);
        tc.push(<td key="reg" style={teamCell({fontWeight:700,fontSize:"9pt",borderRight:dotBdr,whiteSpace:"nowrap"})}>{teamDisplayName(t)}</td>);
        sCols.forEach(s=>tc.push(<td key={"ts"+s} style={teamCell({fontWeight:700,whiteSpace:"nowrap",padding:sPad,...(isDotAfterS(s)?{borderRight:dotBdr}:{})})}>{teamSeriesSum(t,s)}</td>));
        tc.push(<td key="total" style={teamCell({fontWeight:800,fontSize:"10pt",textAlign:"left",paddingLeft:"6px",whiteSpace:"nowrap"})}>{fmtTeamTotal(t)}</td>);
        tc.push(<td key="rem" style={teamCell({borderRight:"1px solid #333",fontSize:"7pt",textAlign:"left",padding:"2px 3px",lineHeight:1.2})}>{fmtRemarks(t._remarks)}</td>);
        rows.push(<tr key={(t.teamNum||t.region)+"_team"} style={{background:"#f0f0f0"}}>{tc}</tr>);
        // ── 개인 행 (top3 + extra) ──
        const allM=[...t.top3];
        if(t.extra) allM.push(t.extra);
        allM.forEach((m,mi)=>{
          const mk=mi===allM.length-1?memLastCell:memCell;
          const mSub=m._sub_org||"";
          const mc=[];
          mc.push(<td key="rank" style={mk({borderLeft:"1px solid #333"})}></td>);
          mc.push(<td key="name" style={mk({paddingLeft:"10px",fontSize:"8pt",textAlign:"left",borderRight:dotBdr,whiteSpace:"nowrap"})}>
            {m.name}{mSub?<span style={{marginLeft:3,fontSize:"7pt"}}>[{mSub}]</span>:null}
          </td>);
          sCols.forEach(s=>mc.push(<td key={"ms"+s} style={mk({whiteSpace:"nowrap",padding:sPad,...(isDotAfterS(s)?{borderRight:dotBdr}:{})})}>{m["s"+s]||""}</td>));
          mc.push(<td key="total" style={mk({fontWeight:600,textAlign:"left",paddingLeft:"6px",whiteSpace:"nowrap"})}>{fmtMemberTotal(m)}</td>);
          mc.push(<td key="rem" style={mk({borderRight:"1px solid #333"})}></td>);
          rows.push(<tr key={(t.teamNum||t.region)+"_m"+mi}>{mc}</tr>);
        });
        return rows;
      }).flat()}</tbody></table>;
    };

    const typeLabel2={prelim:"본선",final:"결선",team:"단체전",bronze:"3/4위 결정전",gold:"1/2위 결정전"};
    const isMixedEv=cfg.mixed||(events.find(e=>e.code===resEvCode)?.type==="mixed");
    const printTypeLabel=isMixedEv&&resType==="prelim"?"본선":(typeLabel2[resType]||resType);
    // 신기록 값 가져오기
    const getRecVal=(cat)=>{
      const rec=resBestRecs.find(b=>b.record_category===cat);
      return rec?.record_value||"—";
    };
    // 전체 라운드 신기록도 로드 (헤더용: prelim/final/team 무관하게 해당 종목)
    const today=new Date().toLocaleDateString("ko-KR");

    return <div className="print-overlay">
      <div className="print-page" ref={printContentRef} style={{minHeight:printPages>1?(297*printPages)+"mm":"297mm"}}>
        <div className="print-page-header"><span>대한장애인사격연맹</span><span>대회운영관리시스템</span></div>
        {/* ═══ 상단 헤더 (고정 크기) ═══ */}
        <div ref={printHeaderRef}>
        <div style={{display:"flex",alignItems:"flex-start",marginBottom:"2mm"}}>
          {/* 좌상단: 연맹 로고 */}
          <div style={{width:"30mm",display:"flex",alignItems:"flex-start",justifyContent:"center",flexShrink:0,paddingTop:"1mm"}}>
            {fedLogo?<img src={fedLogo} alt="" style={{maxWidth:"29mm",maxHeight:"24mm",objectFit:"contain"}}/>:null}
          </div>
          {/* 중앙 */}
          <div style={{flex:1,textAlign:"center",padding:"0 3mm"}}>
            <div style={{fontSize:"13pt",fontWeight:800,marginBottom:"0.5mm"}}>{tName}</div>
            <div style={{fontSize:"11pt",fontWeight:700,marginBottom:"0.5mm"}}>기록지</div>
            <div style={{fontSize:"10pt",fontWeight:700,color:"#333",marginBottom:"0.5mm"}}>{evName}</div>
            <div style={{fontSize:"9pt",fontWeight:600,color:"#555",marginBottom:"1mm"}}>{printTypeLabel}</div>
            <div style={{fontSize:"8pt",color:"#555"}}>{tVenue}&nbsp;&nbsp;{tDate}</div>
          </div>
          {/* 우상단: 후원사 로고 */}
          <div style={{width:"30mm",display:"flex",alignItems:"flex-start",justifyContent:"center",flexShrink:0,paddingTop:"1mm"}}>
            {getSponsorLogo(selectedT?.id)?<img src={getSponsorLogo(selectedT.id)} alt="" style={{maxWidth:"29mm",maxHeight:"24mm",objectFit:"contain"}}/>:null}
          </div>
        </div>
        {/* 기록 표시줄 */}
        <div style={{display:"flex",justifyContent:"center",gap:"8mm",marginBottom:"3mm",fontSize:"8pt",color:"#333"}}>
          <span>세계기록: <b>{getRecVal("world")}</b></span>
          <span>한국기록: <b>{getRecVal("korea")}</b></span>
          <span>체전기록: <b>{getRecVal("national")}</b></span>
        </div>
        </div>{/* close header ref */}
        {/* ═══ 본문 테이블 (자동 zoom) ═══ */}
        <div ref={printTableRef} style={{zoom:printZoom}}>
        {resType==="team"?renderTeam():resType==="final"?(isFinal3Pos(resEvCode)?renderFinal3Pos():renderFinal()):(resType==="bronze"||resType==="gold"||resType==="prelim")?renderPrelimFinal():renderPrelimFinal()}
        </div>{/* close table zoom wrapper */}
        {/* ═══ 하단 (고정 크기) ═══ */}
        <div ref={printFooterRef} style={{marginTop:"5mm",display:"flex",alignItems:"flex-end",fontSize:"8pt"}}>
          {/* 좌하단: 최종수정일자 */}
          <div style={{color:"#555"}}>최종수정일자: {today}</div>
          <div style={{flex:1}}/>
          {/* 하단 우측: 기록실장 서명란 */}
          <div style={{display:"flex",alignItems:"flex-end",gap:"3mm"}}>
            <span style={{fontSize:"9pt",fontWeight:600}}>기록실장:</span>
            <div style={{borderBottom:"1px solid #333",width:"35mm",height:"10mm"}}></div>
          </div>
        </div>

          <div>
            <label style={{fontSize:11,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>종목 코드</label>
            <input style={S.input} value={editMEVal.code||""} onChange={e=>setEditMEVal({...editMEVal,code:e.target.value.toUpperCase()})} placeholder="R1, P1, PT1 등" disabled={editME!=="new"}/>

            <input style={S.input} value={editMEVal.name||""} onChange={e=>setEditMEVal({...editMEVal,name:e.target.value})} placeholder="R1 공기소총 입사 남자 SH1"/>

          </div>
          <div>
            <label style={{fontSize:11,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>성별</label>
            <select style={S.input} value={editMEVal.gender||"혼"} onChange={e=>setEditMEVal({...editMEVal,gender:e.target.value})}>
              <option value="남">남</option><option value="여">여</option><option value="혼">혼성</option>
            </select>

            <input type="checkbox" id="me_force_mixed" checked={!!editMEVal.force_mixed} onChange={e=>setEditMEVal({...editMEVal,force_mixed:e.target.checked})} disabled={editMEVal.type==="individual"}/>

              updated=masterEvents.map(e=>e.code===editME.code?v:e);

            setEditME(null);

  // ─── 시간표 인쇄 ───
  const renderSchedPrint=()=>{
    if(!schedPrint) return null;
    const tName=selectedT?.name||"";
    const evCountMap={};
    if(evPData&&evPData.allEntries){
      const _mSet=new Set((evPData.allMembers||[]).map(m=>m.id));
      evPData.allEntries.filter(e=>_mSet.has(e.member_id)).forEach(e=>{evCountMap[e.event_code]=(evCountMap[e.event_code]||0)+1;});
    }
    if(evPData&&evPData.allTeamEntries){
      const _mSet=new Set((evPData.allMembers||[]).map(m=>m.id));
      const teMemberCount={};evPData.allTeamEntries.filter(t=>_mSet.has(t.member_id)).forEach(t=>{teMemberCount[t.event_code]=(teMemberCount[t.event_code]||0)+1;});
      Object.keys(teMemberCount).forEach(ec=>{const ev=events.find(e=>e.code===ec);if(ev&&(ev.type==="mixed"||ev.type==="team")){const ts=ev?.team_size||2;evCountMap[ec]=(evCountMap[ec]||0)+Math.floor(teMemberCount[ec]/ts);}});
    }
    const catClr=(c)=>({"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"}[c]||"#666");
    const calcSpans=(rows)=>{
      const spans=new Array(rows.length).fill(1);const sk=new Set();
      for(let i=0;i<rows.length;i++){
        if(sk.has(i)||!rows[i].category) continue;
        let cnt=1;
        while(i+cnt<rows.length&&rows[i+cnt].category===rows[i].category){sk.add(i+cnt);cnt++;}
        spans[i]=cnt;
      }
      return {spans,sk};
    };
    const thSt={border:"1px solid #333",padding:"3px 6px",background:"#e8e8e8",fontWeight:700,fontSize:"8pt"};
    const tdSt={border:"1px solid #333",padding:"2px 5px",fontSize:"8.5pt"};
    const startDate=selectedT?.start_date;
    const dayLabel=(dayNum)=>{
      if(!startDate) return dayNum+"일차";
      const d=new Date(startDate);
      d.setDate(d.getDate()+dayNum-1);
      return (d.getMonth()+1)+"월 "+d.getDate()+"일";
    };

    return <div className="print-overlay">
      <div className="print-page">
        <div className="print-page-header"><span>대한장애인사격연맹</span><span>대회운영관리시스템</span></div>
        <div style={{textAlign:"center",marginBottom:"4mm"}}>
          <div style={{fontSize:"14pt",fontWeight:800,marginBottom:"2mm"}}>{tName}</div>
          <div style={{fontSize:"12pt",fontWeight:700}}>대회 일정표</div>
        </div>
        <button className="no-print" onClick={()=>setSchedPrint(false)} style={{position:"fixed",top:20,right:20,zIndex:10000,padding:"8px 20px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>✕ 닫기</button>
        <button className="no-print" onClick={()=>window.print()} style={{position:"fixed",top:20,right:100,zIndex:10000,padding:"8px 20px",background:"#d4a843",color:"#000",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>🖨 인쇄</button>

        {schedData.filter(d=>d.rows.length>0).map((day,dayIdx)=>{
          const {spans,sk}=calcSpans(day.rows);
          const totalRows=day.rows.length;
          return <div key={day.day} style={{marginBottom:"6mm"}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead>
                <tr>
                  <th style={{...thSt,width:"70px"}}>날짜</th>
                  <th style={{...thSt,width:"50px"}}>구분</th>
                  <th style={thSt}>내용</th>
                  <th style={{...thSt,width:"80px"}}>시간</th>
                  <th style={{...thSt,width:"46px"}}>인원</th>
                  <th style={{...thSt,width:"60px"}}>비고</th>
                </tr>
              </thead>
              <tbody>
                {day.rows.map((row,ri)=>{
                  const showCat=!sk.has(ri);
                  const isPET=row.type==="pet";
                  const evName=row.event_code?(events.find(e=>e.code===row.event_code)||{}).name||row.event_code:"";
                  const displayContent=isPET?("공식 훈련 ("+row.event_code+")"):(row.event_code?evName:row.content);
                  const countVal=row.event_code?evCountMap[row.event_code]:row.count;
                  return <tr key={row.id} style={isPET?{background:"#e8e8e8"}:undefined}>
                    {ri===0&&<td rowSpan={totalRows} style={{...tdSt,textAlign:"center",fontWeight:800,fontSize:"9pt",verticalAlign:"middle",background:"#f5f5f5"}}>{dayLabel(day.day)}</td>}
                    {showCat&&<td rowSpan={spans[ri]} style={{...tdSt,textAlign:"center",fontWeight:700,fontSize:"9pt",verticalAlign:"middle"}}>{row.category}</td>}
                    <td style={{...tdSt,textAlign:"left",paddingLeft:"8px"}}>{displayContent}{row.relay?(" "+row.relay+"조"):""}</td>
                    <td style={{...tdSt,textAlign:"center"}}>{row.time}</td>
                    <td style={{...tdSt,textAlign:"center"}}>{countVal?(countVal+(typeof countVal==="number"?"명":"")):""}</td>
                    <td style={{...tdSt,textAlign:"center"}}>{row.remark}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>;
        })}
      </div>
    </div>;
  };

  // ─── 스타트리스트 인쇄 ───
  const renderSlPrint=()=>{
    if(!slPrint) return null;
    const pSessionKey=slPrint;
    const skParts=pSessionKey.match(/^(.+?)_(\d+)$/);
    const pEvCode=skParts?skParts[1]:pSessionKey;
    const pRelay=skParts?Number(skParts[2]):1;
    const tName=selectedT?.name||"";
    const evObj=events.find(e=>e.code===pEvCode);
    const evName=evObj?.name||pEvCode;
    const list=startLists[pSessionKey];
    if(!list||!list.length) return null;
    let dayNum=null,time=null;
    schedData.forEach(d=>{d.rows.forEach(r=>{if(r.type==="prelim"&&r.event_code===pEvCode){dayNum=d.day;if(r.time)time=r.time;}});});
    const startDate=selectedT?.start_date;
    let dateStr="X월 X일";
    if(dayNum&&startDate){const dt=new Date(startDate);dt.setDate(dt.getDate()+dayNum-1);dateStr=(dt.getMonth()+1)+"월 "+dt.getDate()+"일";}
    const timeStr=time||"00:00-00:00";
    // ── team_entries 기반 단체번호 조회 ──
    const evOvPrint=orgNumOverrides[pEvCode]||{};
    const printTeamNum={};
    if(evPData&&evPData.allTeamEntries){
      const memberMap2={};(evPData.allMembers||[]).forEach(m=>{memberMap2[m.id]=m;});
      const memberAppMap2={};(evPData.allMembers||[]).forEach(m=>{memberAppMap2[m.id]=evPData.appMap[m.application_id];});
      const regionOrd=["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
      const evTE=evPData.allTeamEntries.filter(t=>t.event_code===pEvCode&&t.team_type==="team"&&memberMap2[t.member_id]);
      const teamByApp={};
      evTE.forEach(te=>{
        const app=memberAppMap2[te.member_id];
        const k=(te.application_id||"?")+"_"+(te.team_number||1);
        if(!teamByApp[k]) teamByApp[k]={regionName:app?.region_name||"-",teamNumber:te.team_number||1,members:new Set()};
        teamByApp[k].members.add(te.member_id);
      });
      const tl=Object.values(teamByApp);
      tl.sort((a,b)=>{const ai=regionOrd.indexOf(a.regionName),bi=regionOrd.indexOf(b.regionName);return(ai===-1?99:ai)-(bi===-1?99:bi)||(a.teamNumber-b.teamNumber);});
      tl.forEach((t,i)=>{t.members.forEach(mid=>{printTeamNum[mid]=i+1;});});
    }
    const getPrintTeamNum=(p)=>{
      if(!p.memberId) return null;
      const mid=String(p.memberId);
      if(evOvPrint[mid]!==undefined) return evOvPrint[mid];
      return printTeamNum[p.memberId]||null;
    };
    const thSt={border:"1px solid #333",padding:"5px 6px",background:"#e8e8e8",fontWeight:700,fontSize:"11pt",textAlign:"center"};
    const tdSt={border:"1px solid #333",padding:"4px 6px",fontSize:"13px"};
    let seqNum=0;
    return <div className="print-overlay" style={{position:"fixed",inset:0,zIndex:9999,background:"#fff",overflow:"auto",color:"#000"}}>
      <button className="no-print" onClick={()=>setSlPrint(null)} style={{position:"fixed",top:20,right:20,zIndex:10000,padding:"8px 20px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>✕ 닫기</button>
      <button className="no-print" onClick={()=>window.print()} style={{position:"fixed",top:20,right:100,zIndex:10000,padding:"8px 20px",background:"#d4a843",color:"#000",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>🖨 인쇄</button>
      <div className="print-page" style={{maxWidth:800,margin:"0 auto",padding:"12mm 10mm 15mm",background:"#fff",color:"#000"}}>
        <div className="print-page-header"><span>대한장애인사격연맹</span><span>대회운영관리시스템</span></div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6mm"}}>
          <div>
            <div style={{fontSize:"16pt",fontWeight:800,color:"#000",marginBottom:"2mm"}}>{evName} {pRelay}조</div>
            <div style={{fontSize:"13pt",color:"#333"}}>{dateStr}　{timeStr}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:"11pt",color:"#555"}}>{tName}</div>
            <div style={{fontSize:"14pt",fontWeight:800,color:"#000",marginTop:"1mm"}}>스타트리스트</div>
          </div>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",color:"#000"}}>
          <thead><tr>
            <th style={{...thSt,width:"36px"}}>순</th>
            <th style={{...thSt,width:"48px"}}>사대</th>
            <th style={{...thSt,width:"72px"}}>이름</th>
            <th style={{...thSt}}>소속</th>
            <th style={{...thSt,width:"48px"}}>단체</th>
            <th style={{...thSt,width:"60px"}}>비고</th>
          </tr></thead>
          <tbody>
            {list.filter(p=>!p.absent).map((p,i)=>{
              seqNum++;
              const tn=getPrintTeamNum(p);
              return <tr key={i} style={{background:"#fff"}}>
                <td style={{...tdSt,textAlign:"center"}}>{seqNum}</td>
                <td style={{...tdSt,textAlign:"center",fontWeight:700}}>{p.lane||"-"}</td>
                <td style={{...tdSt,fontWeight:600}}>{p.name}</td>
                <td style={{...tdSt}}>{p.subOrg||"-"}</td>
                <td style={{...tdSt,textAlign:"center",fontWeight:700,fontSize:"12px"}}>{tn?"단체"+tn:""}</td>
                <td style={{...tdSt}}>{p.remark||""}</td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </div>;
  };

  // ─── 대회 상세 ───
  return (<>
    {renderPrintPreview()}
    {renderSchedPrint()}
    {renderSlPrint()}
    {/* 불참 사유 입력 모달 */}
    {absentModal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setAbsentModal(null)}>
      <div style={{background:"#1e293b",border:"1px solid #475569",borderRadius:10,padding:24,minWidth:340,maxWidth:400,boxShadow:"0 8px 32px rgba(0,0,0,.5)"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:15,fontWeight:700,color:"#ef4444",marginBottom:16}}>🚫 불참 처리</div>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:4}}>선수</div>
        <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0",marginBottom:12}}>{absentModal.name} <span style={{fontSize:11,color:"#64748b"}}>({absentModal.evCode})</span></div>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:4}}>불참 사유 <span style={{color:"#ef4444"}}>*</span></div>
        <textarea value={absentReason} onChange={e=>setAbsentReason(e.target.value)} placeholder="사유를 입력하세요 (필수)"
          style={{width:"100%",padding:10,borderRadius:6,border:"1px solid #475569",background:"#0f172a",color:"#e2e8f0",fontSize:13,resize:"vertical",minHeight:60,boxSizing:"border-box"}}
          autoFocus onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();confirmAbsent();}}}/>
        <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end"}}>
          <button onClick={()=>setAbsentModal(null)} style={{padding:"6px 16px",borderRadius:6,border:"1px solid #475569",background:"transparent",color:"#94a3b8",fontSize:12,cursor:"pointer"}}>취소</button>
          <button onClick={confirmAbsent} style={{padding:"6px 16px",borderRadius:6,border:"none",background:"#ef4444",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>불참 확정</button>
        </div>
      </div>
    </div>}
    {/* ── 단체번호 드롭다운 오버레이 ── */}
    {teamDropdown&&<div style={{position:"fixed",inset:0,zIndex:10001}} onClick={()=>setTeamDropdown(null)}>
      <div style={{position:"absolute",top:teamDropdown.rect.top,left:teamDropdown.rect.left,background:"#1a2332",border:"1px solid #3a506b",borderRadius:8,padding:6,minWidth:180,maxHeight:300,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,.7)",animation:"fadeIn .15s ease"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:10,color:"#6b7d94",fontWeight:700,padding:"4px 8px",borderBottom:"1px solid #2a3a5c",marginBottom:4}}>단체번호 배정 (최대 4명/단체)</div>
        {(()=>{
          const evCode=teamDropdown.evCode;
          const ov=(orgNumOverrides[evCode])||{};
          const ep=evPData||{allMembers:[],allEntries:[],allTeamEntries:[],appMap:{}};
          const memberMap2={}; ep.allMembers.forEach(m=>{memberMap2[m.id]=m;});
          const memberAppMap2={}; ep.allMembers.forEach(m=>{memberAppMap2[m.id]=ep.appMap[m.application_id];});
          const selEvObj2=events.find(e=>e.code===evCode);
          const isMixed2=selEvObj2&&selEvObj2.type==="mixed";
          // 단체전 참가자: team_entries에서 event_code=현재종목 AND team_type='team' (개인전) 또는 mixed
          const regionOrd=["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
          const memberToTeamNum2={};
          if(isMixed2){
