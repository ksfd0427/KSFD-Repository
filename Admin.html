CREATE OR REPLACE FUNCTION submit_application(payload JSONB) RETURNS JSONB AS $$
DECLARE app_id INT; member_ids INT[]; member_id INT; member_rec JSONB; entry_rec JSONB; firearm_rec JSONB; team_rec JSONB;
BEGIN INSERT INTO applications (tournament_id, region_code, region_name, org_name) VALUES ((payload->>'tournament_id')::INT, payload->>'region_code', payload->>'region_name', payload->>'org_name') RETURNING id INTO app_id; member_ids := ARRAY[]::INT[];
FOR member_rec IN SELECT * FROM jsonb_array_elements(payload->'members') LOOP INSERT INTO members (application_id, name, gender, dob, role, sub_org, class_type, phone) VALUES (app_id, member_rec->>'name', member_rec->>'gender', (member_rec->>'dob')::DATE, member_rec->>'role', member_rec->>'sub_org', member_rec->>'class_type', member_rec->>'phone') RETURNING id INTO member_id; member_ids := array_append(member_ids, member_id);
IF member_rec ? 'events' THEN FOR entry_rec IN SELECT * FROM jsonb_array_elements(member_rec->'events') LOOP INSERT INTO individual_entries (application_id, member_id, event_code) VALUES (app_id, member_id, entry_rec #>> '{}'); END LOOP; END IF;
IF member_rec ? 'firearms' THEN FOR firearm_rec IN SELECT * FROM jsonb_array_elements(member_rec->'firearms') LOOP INSERT INTO firearms (member_id, gun_type, manufacturer, model, serial_number, permit_number) VALUES (member_id, firearm_rec->>'gun_type', firearm_rec->>'manufacturer', firearm_rec->>'model', firearm_rec->>'serial_number', firearm_rec->>'permit_number'); END LOOP; END IF; END LOOP;
IF payload ? 'teams' THEN FOR team_rec IN SELECT * FROM jsonb_array_elements(payload->'teams') LOOP DECLARE slot_idx INT; slot_arr JSONB; m_idx INT; BEGIN slot_arr := team_rec->'member_indices'; FOR slot_idx IN 0..jsonb_array_length(slot_arr)-1 LOOP m_idx := (slot_arr->slot_idx)::INT; IF m_idx >= 0 AND m_idx < array_length(member_ids, 1) THEN INSERT INTO team_entries (application_id, event_code, team_type, team_number, member_id, slot_order, is_union, union_memo) VALUES (app_id, team_rec->>'event_code', team_rec->>'team_type', COALESCE((team_rec->>'team_number')::INT,1), member_ids[m_idx+1], slot_idx, COALESCE((team_rec->>'is_union')::BOOLEAN,FALSE), team_rec->>'union_memo'); END IF; END LOOP; END; END LOOP; END IF;
INSERT INTO application_logs (application_id, action, detail) VALUES (app_id, 'submit', '참가신청 제출');
RETURN jsonb_build_object('success', true, 'application_id', app_id);
EXCEPTION WHEN OTHERS THEN RETURN jsonb_build_object('success', false, 'error', SQLERRM);
END; $$ LANGUAGE plpgsql SECURITY DEFINER;`;

function App() {
  const [sb, setSb] = useState(null);
  const [mode, setMode] = useState("landing");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState("");
  const flash = useCallback((m,t="success")=>{if(t==="error"){setError(m);setTimeout(()=>setError(""),4000);}else{setSuccess(m);setTimeout(()=>setSuccess(""),3000);}}, []);
  // HTML 테이블 → 클립보드 (copy 이벤트 인터셉트 방식: clipboardData.setData 사용)
  const copyHtmlToClip=(html,plainText,msg)=>{
    // 방법1: copy 이벤트 리스너로 clipboardData에 직접 HTML 주입
    const onCopy=(e)=>{
      e.clipboardData.setData("text/html",html);
      e.clipboardData.setData("text/plain",plainText||"");
      e.preventDefault();
    };
    document.addEventListener("copy",onCopy);
    // execCommand("copy")를 위해 임시 선택 영역 필요
    const tmp=document.createElement("div");
    tmp.style.cssText="position:fixed;left:0;top:0;opacity:0.01;pointer-events:none;";
    tmp.textContent="\u00a0";
    document.body.appendChild(tmp);
    const range=document.createRange();
    range.selectNodeContents(tmp);
    const s=window.getSelection();
    s.removeAllRanges();
    s.addRange(range);
    let ok=false;
    try{ok=document.execCommand("copy");}catch(e){}
    document.removeEventListener("copy",onCopy);
    s.removeAllRanges();
    document.body.removeChild(tmp);
    if(ok){flash(msg,"success");}else{
      // execCommand 실패 시 Clipboard API fallback (DOCX에서는 동작)
      try{const b=new Blob([html],{type:"text/html"});const bt=new Blob([plainText||""],{type:"text/plain"});
        navigator.clipboard.write([new ClipboardItem({"text/html":b,"text/plain":bt})]).then(()=>flash(msg,"success")).catch(()=>navigator.clipboard.writeText(plainText||"").then(()=>flash("텍스트로 복사됨")));
      }catch(e2){navigator.clipboard.writeText(plainText||"").then(()=>flash("텍스트로 복사됨"));}
    }
  };
  const [dbBusy, setDbBusy]=useState(0);
  const [dbProg, setDbProg]=useState(null); // {done,total} when determinate
  useEffect(()=>{try{setSb(window.supabase.createClient(SB_URL,SB_KEY));}catch(e){flash("연결실패","error");}}, []);
  const [migrationSQL, setMigrationSQL]=useState(false);
  // DB 테이블 존재 여부 확인
  useEffect(()=>{
    if(!sb) return;
    (async()=>{
      try{
        const{error}=await sb.from("tournament_ops_data").select("id").limit(1);
        if(error&&(error.message.includes("does not exist")||error.code==="42P01")){
          setMigrationSQL(true);
        }
      }catch(e){}
    })();
  },[sb]);
  return (<div>
    {(dbBusy>0||dbProg)&&<div className="db-bar">{dbProg&&dbProg.total>0?<div className="db-bar-det" style={{width:Math.min(100,Math.round((dbProg.done/dbProg.total)*100))+"%"}}/>:<div className="db-bar-inner"/>}</div>}
    {error && <div style={S.toast("error")}>{error}</div>}
    {success && <div style={S.toast("success")}>{success}</div>}
    {migrationSQL&&<div style={{position:"fixed",top:0,left:0,right:0,zIndex:9999,background:"#7f1d1d",padding:"12px 20px",fontSize:12,color:"#fca5a5",textAlign:"center"}}>
      ⚠️ DB 마이그레이션 필요. Supabase SQL Editor에서 실행:
      <code style={{display:"block",margin:"6px auto",padding:6,background:"#1e1e1e",borderRadius:4,fontSize:11,maxWidth:900,textAlign:"left",color:"#f0f0f0",userSelect:"all",whiteSpace:"pre-wrap"}}>
{`ALTER TABLE competition_results ALTER COLUMN s1 TYPE VARCHAR(100), ALTER COLUMN s2 TYPE VARCHAR(100), ALTER COLUMN s3 TYPE VARCHAR(100), ALTER COLUMN s4 TYPE VARCHAR(100), ALTER COLUMN s5 TYPE VARCHAR(100), ALTER COLUMN s6 TYPE VARCHAR(100), ALTER COLUMN s7 TYPE VARCHAR(100), ALTER COLUMN s8 TYPE VARCHAR(100), ALTER COLUMN s9 TYPE VARCHAR(100), ALTER COLUMN s10 TYPE VARCHAR(100), ALTER COLUMN s11 TYPE VARCHAR(100), ALTER COLUMN s12 TYPE VARCHAR(100);

      // mm→px 비율: pageW = (210 - 12*2)mm = 186mm
      const pxPerMm=pageW/186;

      const sh=[...arr]; for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}

  const saveEditApp=async()=>{

      // 1. 기존 데이터 삭제 (cascade가 아니므로 순서대로)
      await sb.from("individual_entries").delete().eq("application_id",appId);

      // 2. 멤버 재삽입
      const memberIdMap={}; // tempIdx → newId
      for(let i=0;i<editMembers.length;i++){
        const m=editMembers[i];
        const dbGender=m.gender==="녀"?"여":m.gender;
        const ins={application_id:appId, name:m.name, gender:dbGender, dob:m.dob, role:m.role, sub_org:m.sub_org||null, class_type:m.role==="선수"?(m._events?.[0]||null):null, phone:m.phone||null};

      }

      // 3. 개인전 종목 재삽입
      const ieRows=[];
      Object.entries(editIndEntries).forEach(([mid,codes])=>{
        const newMid=memberIdMap[parseInt(mid)];
        if(newMid) codes.forEach(c=>ieRows.push({application_id:appId, member_id:newMid, event_code:c}));
      });
      if(ieRows.length>0){const{error}=await sb.from("individual_entries").insert(ieRows); if(error) throw new Error("종목 저장 실패: "+error.message);}

      // 4. 단체전/혼성팀 재삽입
      const teRows=[];
      Object.entries(editTeamComps).forEach(([k,comp])=>{
        let evCode,teamNum,teamType;
        if(k.startsWith("pair-")){
          // pair-EVCODE-NUM
          const parts=k.replace("pair-","").split("-");
          teamNum=parseInt(parts.pop());
          evCode=parts.join("-");
          teamType="mixed";
        } else if(k.startsWith("league-")){
          // league-EVCODE
          evCode=k.replace("league-","");
          teamNum=1;
          teamType="league";
        } else if(k.startsWith("team-")){
          // team-EVCODE_NUM
          const inner=k.replace("team-","");
          const idx=inner.lastIndexOf("_");
          evCode=inner.substring(0,idx);
          teamNum=parseInt(inner.substring(idx+1));
          teamType="team";
        } else {
          // legacy format: EVCODE_NUM
          const idx=k.lastIndexOf("_");
          evCode=k.substring(0,idx);
          teamNum=parseInt(k.substring(idx+1));
          teamType=comp.teamType||"team";
        }
        comp.memberIds.forEach((mid,slot)=>{
          const newMid=memberIdMap[mid];
          if(newMid) teRows.push({application_id:appId, event_code:evCode, team_type:teamType, team_number:teamNum||1, member_id:newMid, slot_order:slot, is_union:comp.isUnion||false, union_memo:comp.unionMemo||null});
        });
      });

  // 경기 결과 관리 함수
  const loadResults=async(evCode,type)=>{
    if(!sb||!selectedT) return;
    setResEvCode(evCode); setResType(type); setResDirty(false); setResFinalSL(null);
    setDbBusy(v=>v+1);
    try{
      const{data}=await sb.from("competition_results").select("*").eq("tournament_id",selectedT.id).eq("event_code",evCode).eq("result_type",type).order("id",{ascending:true});
      let rows=(data||[]).map(r=>({...r,_sub_org:r.sub_org||""}));
      // 혼성팀: team→sub 그룹 순서 보장 (team rank 기준 정렬, sub는 team 뒤에)
      const ev=events.find(e=>e.code===evCode);
      const cfg=getEventCfg(evCode,getEvFmt(evCode));
      if((cfg.mixed||(ev&&ev.type==="mixed"))&&(type==="prelim"||type==="bronze"||type==="gold")){
        const teams=[], subs=[], others=[];
        let curTeamId=null;
        const teamSubMap=new Map(); // teamId → [sub rows]
        // ID 순서대로 team→sub 그룹 식별
        rows.forEach(r=>{
          if(r.bib==="team"){curTeamId=r.id;teams.push(r);teamSubMap.set(r.id,[]);}
          else if(r.bib==="sub"&&curTeamId){teamSubMap.get(curTeamId).push(r);}
          else others.push(r);
        });
        teams.sort((a,b)=>(a.rank||999)-(b.rank||999));
        const sorted=[];
        teams.forEach(t=>{sorted.push(t);(teamSubMap.get(t.id)||[]).forEach(s=>sorted.push(s));});
        sorted.push(...others);
        rows=sorted;
      } else {
        // 개인전/결선: rank 값이 있으면 rank 오름차순 정렬
        const hasRank=rows.some(r=>r.rank&&r.rank>0);
        if(hasRank){
          rows.sort((a,b)=>(a.rank||9999)-(b.rank||9999));
        }
      }
      setResData(rows);
      const{data:br}=await sb.from("best_records").select("*").eq("event_code",evCode).eq("result_type",type);
      setResBestRecs(br||[]);
    }catch(e){flash(e.message,"error");}
    finally{setDbBusy(v=>v-1);}
  };

  // 신기록 대조
  const RES_REC_LABEL={korea:"한국신",national:"대회신",world:"비공식 세계신"};
  const getRecOrder=()=>{
    const order=["world","korea"];
    if((()=>{try{const m=JSON.parse(localStorage.getItem("ksfd_cnr")||"{}");return !!m[selectedT?.id];}catch(e){return false;}})()) order.splice(1,0,"national");
    return order;
  };
  const resCheckRecords=()=>{
    if(!resBestRecs.length&&resData.filter(r=>!r._deleted).length>0){
      flash("등록된 신기록이 없습니다. 신기록 관리에서 먼저 등록하세요.","error"); return;
    }
    const parseScore=(v)=>{
      if(!v) return 0;
      const s=String(v).replace(/[^\d.]/g,"");
      return parseFloat(s)||0;
    };
    const updated=resData.map(r=>{
      if(r._deleted) return r;
      const score=parseScore(r.total);
      if(!score) return r;
      const newMarks=[];
      for(const catKey of getRecOrder()){
        const rec=resBestRecs.find(b=>b.record_category===catKey);
        if(!rec||!rec.record_value) continue;
        const recScore=parseScore(rec.record_value);
        if(!recScore) continue;
        if(score>recScore){
          newMarks.push(RES_REC_LABEL[catKey]+"/종전 "+rec.record_value);
        } else if(score===recScore){
          newMarks.push(RES_REC_LABEL[catKey]+" 타이");
        }
      }
      if(newMarks.length===0) return r;
      // 기존 비고에서 신기록 관련 내용 제거 후 추가
      let oldRemarks=(r.remarks||"").replace(/(비공식 세계신|한국신|대회신)(\/종전\s*[\d.]+|\s*타이)/g,"").replace(/[A-Z]{2}(신\/종전\s*[\d.]+|타이)/g,"").replace(/\s*,\s*,/g,",").replace(/^[,\s]+|[,\s]+$/g,"");
      const markStr=newMarks.join(", ");
      const finalRemarks=oldRemarks?(markStr+", "+oldRemarks):markStr;
      return {...r,remarks:finalRemarks,_dirty:true};
    });
    setResData(updated);
    setResDirty(true);
    const cnt=updated.filter(r=>!r._deleted&&r.remarks&&/(한국신|대회신|세계신|타이)/.test(r.remarks)).length;
    flash(cnt>0?("🏅 "+cnt+"건 신기록 감지! 비고란을 확인하세요."):"신기록 해당자가 없습니다.");
  };
  const resAddRow=()=>{
    const nr=resData.filter(r=>!r._deleted).length+1;
    const cfg=getEventCfg(resEvCode,getEvFmt(resEvCode));
    const ev=events.find(e=>e.code===resEvCode);
    const isMixed=cfg.mixed||(ev&&ev.type==="mixed");
    if(isMixed&&(resType==="prelim"||resType==="bronze"||resType==="gold")){
      const ts=Date.now();
      const teamRow={_new:true,id:"new_t_"+ts,tournament_id:selectedT.id,event_code:resEvCode,result_type:resType,rank:nr,bib:"team",name:"",region:"",_sub_org:"",is_team:true,s1:"",s2:"",s3:"",s4:"",s5:"",s6:"",s7:"",s8:"",s9:"",s10:"",s11:"",s12:"",total:"",x_count:"",remarks:""};

    }
    setResDirty(true);
  };
  // ── Enter키 위아래 셀 이동 ──
  const resGridKeyDown=(e)=>{
    if(e.key!=="Enter") return;
    e.preventDefault();
    const el=e.target;
    const row=parseInt(el.getAttribute("data-gr"));
    const col=el.getAttribute("data-gc");
    if(isNaN(row)||!col) return;
    const nextRow=e.shiftKey?row-1:row+1;
    const tbl=el.closest("table");
    if(!tbl) return;
    const next=tbl.querySelector("[data-gr='"+nextRow+"'][data-gc='"+col+"']");
    if(next){next.focus();next.select&&next.select();}
  };
  const resUpdateRow=(idx,field,val)=>{
    const nr=[...resData]; const row={...nr[idx],[field]:val,_dirty:true};
    // 본선 시리즈(s1~s12) 변경 시 합계 자동 재계산
    if(/^s\d+$/.test(field)&&resType==="prelim"){
      const cfg=resEvCode?getEventCfg(resEvCode,getEvFmt(resEvCode)):null;
      if(cfg){
        let sum10=0,hasVal=false;
        for(let s=1;s<=cfg.series;s++){
          const v=parseFloat(row["s"+s]);
          if(!isNaN(v)&&v>0){sum10+=Math.round(v*(cfg.decimal?10:1));hasVal=true;}
        }
        if(hasVal) row.total=cfg.decimal?(sum10/10).toFixed(1):String(sum10);
      }
    }
    nr[idx]=row;
    setResData(nr); setResDirty(true);
  };
  const resRemoveRow=(idx)=>{
    const r=resData[idx];
    // 혼성팀: team 행 삭제 시 뒤따르는 sub 행도 함께 삭제
    if(r.bib==="team"){
      const toRemove=new Set([idx]);
      let j=idx+1;
      while(j<resData.length&&resData[j].bib==="sub"){toRemove.add(j);j++;}
      if(r._new) setResData(resData.filter((_,i)=>!toRemove.has(i)));
      else setResData(resData.map((rr,i)=>toRemove.has(i)?{...rr,_deleted:true}:rr));
      setResDirty(true);return;
    }
    if(r._new) setResData(resData.filter((_,i)=>i!==idx));
    else setResData(resData.map((rr,i)=>i===idx?{...rr,_deleted:true}:rr));
    setResDirty(true);
  };
  // ── 결과 확정: 합계 기준 순위 계산 + 재배치 ──
  const resConfirmResults=()=>{
    const cfg=getEventCfg(resEvCode,getEvFmt(resEvCode));
    const ev=events.find(e=>e.code===resEvCode);
    const isMixed=cfg.mixed||(ev&&ev.type==="mixed");
    const data=[...resData];
    const active=data.filter(r=>!r._deleted);
    if(active.length===0){flash("데이터가 없습니다.","error");return;}

    const parseTotal=(v)=>{if(!v||v==="")return-Infinity;return parseFloat(v)||0;};
    const parseXC=(v)=>{if(!v||v==="")return 0;return parseInt(v)||0;};

    if(isMixed&&(resType==="prelim"||resType==="bronze"||resType==="gold")){
      // 혼성팀: team그룹 추출 → team.total 기준 정렬
      const groups=[];
      let cur=null;
      active.forEach(r=>{
        if(r.bib==="team"){cur={team:r,subs:[]};groups.push(cur);}
        else if(r.bib==="sub"&&cur){cur.subs.push(r);}
      });
      groups.sort((a,b)=>{
        const d=parseTotal(b.team.total)-parseTotal(a.team.total);
        if(d!==0)return d;
        return parseXC(b.team.x_count)-parseXC(a.team.x_count);
      });
      const nr=[];
      const deleted=data.filter(r=>r._deleted);
      groups.forEach((g,i)=>{
        nr.push({...g.team,rank:i+1,_dirty:true});
        g.subs.forEach(s=>nr.push({...s,_dirty:true}));
      });
      nr.push(...deleted);
      setResData(nr);
    } else {
      // 개인전 / 결선
      const rows=active.filter(r=>r.bib!=="sub");
      rows.sort((a,b)=>{
        const d=parseTotal(b.total)-parseTotal(a.total);
        if(d!==0)return d;
        return parseXC(b.x_count)-parseXC(a.x_count);
      });
      const deleted=data.filter(r=>r._deleted);
      const nr=rows.map((r,i)=>({...r,rank:i+1,_dirty:true}));
      nr.push(...deleted);
      setResData(nr);
    }
    setResDirty(true);
    flash("✅ 순위 확정 완료 — 저장 버튼을 눌러 DB에 반영하세요");
  };

  const resSaveAll=async()=>{

    try{
      const ev=events.find(e=>e.code===resEvCode);

      const toD=resData.filter(r=>r._deleted&&!r._new);
      const toI=resData.filter(r=>r._new&&!r._deleted);
      const toU=resData.filter(r=>r._dirty&&!r._new&&!r._deleted);
      let saved=0,failed=0,failMsg="";
      if(isMixed){
        // 혼성팀 본선: 항상 전체 교체 (삭제→재삽입)
        await sb.from("competition_results").delete().eq("tournament_id",selectedT.id).eq("event_code",resEvCode).eq("result_type",resType);

          for(let s=1;s<=12;s++) clean["s"+s]=r["s"+s]||"";
          const{error}=await sb.from("competition_results").insert(clean);
          if(error){failed++;failMsg=error.message;} else saved++;
        }
      } else {

        for(const r of toU){
          const{_new,_dirty,_deleted,_sub_org,_teamNum,created_at,...row}=r; row.sub_org=_sub_org||"";

          if(error){failed++;failMsg=error.message;} else saved++;
        }
      }
      if(failed>0){
        flash(saved+"건 저장, "+failed+"건 실패: "+failMsg,"error");

      await loadResults(resEvCode,resType);

    finally{setDbBusy(v=>v-1);resSavingRef.current=false;}

        return {...r,total:String(score),x_count:cfg.xcount?String(Math.floor(Math.random()*(score/10+1))):"",_dirty:true};
      }
      // 개인전 결정전

      return {...r,total:String(score),x_count:cfg.xcount?String(Math.floor(Math.random()*(score/10+1))):"",_dirty:true};

  // ── 결정전 진출자 자동 생성 ──
  const populateMedalMatch=async(matchType)=>{

  const REGIONS=["서울","경기","인천","부산","대구","광주","대전","울산","세종","강원","충북","충남","전북","전남","경북","경남","제주"];
  const SURNAMES=["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","류","홍"];
  const GIVEN=["민수","지현","영호","수진","현우","미경","태영","은지","성민","하늘","동현","서연","준혁","예진","상훈","유리","재원","소영","우진","나연"];
  const rName=()=>SURNAMES[Math.floor(Math.random()*SURNAMES.length)]+GIVEN[Math.floor(Math.random()*GIVEN.length)];
  const [resTestMenu, setResTestMenu]=useState(false);
  // 공통: 랜덤 점수 생성
  const resGenScores=(row, cfg)=>{
    if(resType==="final"){
      // 결선 개별 행은 resGenFinalElim에서 일괄 처리하므로 여기서는 skip
      return;
    }
    let sum=0;
    const isThreePos=!!cfg.seriesLabels; // R7, R8
    const isDecimalRifle=cfg.decimal&&!isThreePos; // 소총(R7,R8 제외)
    const isMixed=!!cfg.mixed; // 혼성팀 (2인 합산)
    const xPerSeries=[];
    for(let s=1;s<=cfg.series;s++){
      let v;
      if(isDecimalRifle){
        if(isMixed){
          // 혼성팀 소총: 2인 합산 소수점 (161.0~218.0)
          const p1=(Math.random()*28.5+80.5);
          const p2=(Math.random()*28.5+80.5);
          v=(p1+p2).toFixed(1);
        } else {
          // 소총: 소수점 80.5~109.0
          v=(Math.random()*28.5+80.5).toFixed(1);
        }
      } else {
        if(isMixed){
          // 혼성팀 권총: 2인 합산 정수 (160~200)
          const p1=Math.floor(Math.random()*21+80);
          const p2=Math.floor(Math.random()*21+80);
          v=String(p1+p2);
        } else {
          // 권총+3자세: 정수 80~100
          v=String(Math.floor(Math.random()*21+80));
        }
      }
      row["s"+s]=v; sum+=parseFloat(v);
      if(cfg.xcount){
        const sx=isMixed?Math.floor(Math.random()*26):Math.floor(Math.random()*16); // 혼성팀: 0~25
        xPerSeries.push(sx);
      }
    }
    row.total=isDecimalRifle?sum.toFixed(1):String(sum);
    if(cfg.xcount){
      if(isThreePos){
        // 3자세: 시리즈별 x카운트 쉼표 구분 저장
        row.x_count=xPerSeries.join(",");
      } else {
        row.x_count=String(xPerSeries.reduce((a,b)=>a+b,0));
      }
    }
  };
  // ── 결선 탈락식 테스트 데이터 생성 ──
  const resGenFinalElim=(rows,is3Pos,isPistolF)=>{
    const n=rows.length;
    if(isPistolF){
      // 권총 결선: 10시리즈, 1발씩, 정수 (7~10점), 탈락식
      const firstElimSeries=Math.max(3, 12-n);
      const sims=rows.map(r=>({row:r, cumul:0, eliminated:false, elimAt:0, rank:0}));
      for(let s=1;s<=10;s++){
        const remaining=sims.filter(d=>!d.eliminated);
        if(remaining.length===0) break;
        remaining.forEach(d=>{
          const v=Math.floor(Math.random()*4+7); // 7~10
          d.cumul+=v;
          d.row["s"+s]=String(v);
        });
        if(s>=firstElimSeries&&s<=9&&remaining.length>2){
          remaining.sort((a,b)=>a.cumul-b.cumul);
          remaining[0].eliminated=true; remaining[0].elimAt=s;
          remaining[0].rank=remaining.length; remaining[0].row.total=String(remaining[0].cumul);
        }
        if(s===10){
          const last=sims.filter(d=>!d.eliminated);
          last.sort((a,b)=>b.cumul-a.cumul);
          if(last.length>=2){ last[0].rank=1; last[0].row.total=String(last[0].cumul); last[1].rank=2; last[1].row.total=String(last[1].cumul); }
          else if(last.length===1){ last[0].rank=1; last[0].row.total=String(last[0].cumul); }
        }
      }
      sims.forEach(d=>{d.row.rank=d.rank;});
      rows.sort((a,b)=>a.rank-b.rank);
      return;
    }
    if(is3Pos){
      // 3자세 결선: 8시리즈, S1=슬사(1발), S2=복사(1발), S3=입사(2발), S4~S8=입사(1발)
      // S3 후 7,8위 탈락(2명), 이후 1명씩 탈락, S8에서 1·2위 확정
      const sims=rows.map(r=>({row:r, cumul:0, eliminated:false, elimAt:0, rank:0}));
      for(let s=1;s<=8;s++){
        const remaining=sims.filter(d=>!d.eliminated);
        if(remaining.length===0) break;
        const nShots=s===3?2:1;
        remaining.forEach(d=>{
          const shots=[];
          for(let j=0;j<nShots;j++){
            const v=parseFloat((Math.random()*2+8.5).toFixed(1));
            shots.push(v); d.cumul+=v;
          }
          d.cumul=parseFloat(d.cumul.toFixed(1));
          d.row["s"+s]=shots.map(v=>v.toFixed(1)).join(",");
        });
        if(s===3&&remaining.length>6){
          // S3 후 7,8위 동시 탈락
          remaining.sort((a,b)=>a.cumul-b.cumul);
          for(let e=0;e<Math.min(2,remaining.length-6);e++){
            remaining[e].eliminated=true; remaining[e].elimAt=s;
            remaining[e].rank=remaining.length-e; remaining[e].row.total=remaining[e].cumul.toFixed(1);
          }
        } else if(s>=4&&s<=7&&remaining.length>2){
          remaining.sort((a,b)=>a.cumul-b.cumul);
          remaining[0].eliminated=true; remaining[0].elimAt=s;
          remaining[0].rank=remaining.length; remaining[0].row.total=remaining[0].cumul.toFixed(1);
        }
        if(s===8){
          const last=sims.filter(d=>!d.eliminated);
          last.sort((a,b)=>b.cumul-a.cumul);
          if(last.length>=2){ last[0].rank=1; last[0].row.total=last[0].cumul.toFixed(1); last[1].rank=2; last[1].row.total=last[1].cumul.toFixed(1); }
          else if(last.length===1){ last[0].rank=1; last[0].row.total=last[0].cumul.toFixed(1); }
        }
      }
      sims.forEach(d=>{d.row.rank=d.rank;});
      rows.sort((a,b)=>a.rank-b.rank);
    } else {
      // 기존 결선: 9시리즈
      const firstElimSeries=Math.max(3, 11-n);
      const sims=rows.map(r=>({row:r, cumul:0, eliminated:false, elimAt:0, rank:0}));
      for(let s=1;s<=9;s++){
        const remaining=sims.filter(d=>!d.eliminated);
        if(remaining.length===0) break;
        const nShots=s<=2?5:2;
        remaining.forEach(d=>{
          const shots=[];
          for(let j=0;j<nShots;j++){
            const v=parseFloat((Math.random()*2+8.5).toFixed(1));
            shots.push(v); d.cumul+=v;
          }
          d.cumul=parseFloat(d.cumul.toFixed(1));
          d.row["s"+s]=shots.map(v=>v.toFixed(1)).join(",");
        });
        if(s>=firstElimSeries&&s<=8&&remaining.length>2){
          remaining.sort((a,b)=>a.cumul-b.cumul);
          remaining[0].eliminated=true; remaining[0].elimAt=s;
          remaining[0].rank=remaining.length; remaining[0].row.total=remaining[0].cumul.toFixed(1);
        }
        if(s===9){
          const last=sims.filter(d=>!d.eliminated);
          last.sort((a,b)=>b.cumul-a.cumul);
          if(last.length>=2){ last[0].rank=1; last[0].row.total=last[0].cumul.toFixed(1); last[1].rank=2; last[1].row.total=last[1].cumul.toFixed(1); }
          else if(last.length===1){ last[0].rank=1; last[0].row.total=last[0].cumul.toFixed(1); }
        }
      }
      sims.forEach(d=>{d.row.rank=d.rank;});
      rows.sort((a,b)=>a.rank-b.rank);
    }
  };

  // ── 결선 명단 입력 (결선: 본선 상위 8인 명단, 점수 비움) ──

  // ── 결선 스타트리스트 생성 (소속 비연속 셔플) ──
  const generateFinalSL=async()=>{

    const arr=finalists.map(r=>{

    });
    const maxAttempts=500;

      const sh=[...arr];
      for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}

  // 단체전 자동 계산

      .order("rank",{ascending:true});

    const evOv=orgNumOverrides[ec]||{};

    const teamMembers={}; // {memberId: teamNumber}
    if(evPData&&evPData.allTeamEntries){

      });
      const teamList0=Object.values(teamByApp);
      teamList0.sort((a,b)=>{const ai=regionOrder0.indexOf(a.regionName),bi=regionOrder0.indexOf(b.regionName);return(ai===-1?99:ai)-(bi===-1?99:bi)||(a.teamNumber-b.teamNumber);});
      teamList0.forEach((t,i)=>{t.members.forEach(mid=>{teamMembers[mid]=i+1;});});
    }
    // 이름 → memberId 매핑: evPData(현재 ID)를 우선, 스타트리스트는 보조
    const nameToSL={};

      if(!slP) return null;
      const mid=String(slP.memberId);
      // override 우선 (null이면 명시적 해제)

      // team_entries 원본

    // 모든 본선 선수 (bib=team/sub 제외) → 단체번호로 그룹핑

    const needSubOrg=allPlayers.some(r=>!r.sub_org);

      try{
        const{data:mems}=await sb.from("members").select("name,sub_org");

    const groups={};

    // 3인 이상 팀만

      const allSubOrgs=[...new Set(members.map(m=>(m._sub_org||m.sub_org||"").trim()).filter(Boolean))];

      });
    }

  };

    const fmtTotal=(r)=>{
      if(cfg.xcount&&r.x_count){
        let xVal=r.x_count;
        if(xVal.includes(",")){
          // 3자세: 시리즈별 x카운트 합산
          xVal=String(xVal.split(",").reduce((a,v)=>a+(parseInt(v)||0),0));
        }
        return (r.total||"")+"-"+xVal+"x";
      }
      return r.total||"";
    };

    // 본선/결선 테이블
    const dotBdr="1px dashed #bbb";
    // 신기록 비고 포맷: "/종전 xxx" 부분만 작은 볼드
    const fmtRemarks=(txt)=>{
      if(!txt) return null;
      const parts=txt.split(/(\/종전\s*[\d.]+x?)/g);
      return parts.map((p,i)=>/^\/종전/.test(p)
        ?<span key={i} style={{fontSize:"6pt",fontWeight:700}}>{p}</span>
        :<span key={i}>{p}</span>);
    };
    const renderPrelimFinal=()=>{
      const data=resData.filter(r=>!r._deleted);
      const isPrelim=resType==="prelim";
      const isBronzeGold=resType==="bronze"||resType==="gold";
      const ev=events.find(e=>e.code===resEvCode);
      const isMixed=cfg.mixed||(ev&&ev.type==="mixed");

      // ── 결정전: 팀 합계 + 선수명/소속 ──
      if(isBronzeGold){
        const hdr=["순위",isMixed?"팀명":"이름","소속","합계","비고"];
        const colW=["28px",null,null,"70px",null];
        const allRows=[];
        let idx=0;
        while(idx<data.length){
          const r=data[idx];
          if(r.bib==="team"){
            const medalClr=r.rank===1?"#c9a84c":r.rank===2?"#888":"#333";
            allRows.push(<tr key={r.id||idx} style={{background:"#f0f0f0"}}>
              <td style={{...pTdB,fontWeight:800,fontSize:"10pt",borderLeft:"1px solid #333",borderTop:"2px solid #333",color:medalClr}}>{r.rank||""}</td>
              <td style={{...pTdB,fontWeight:700,fontSize:"9pt",textAlign:"left",paddingLeft:"6px",borderTop:"2px solid #333"}}>{r.name||""}</td>
              <td style={{...pTdB,borderTop:"2px solid #333"}}>{r.region||""}</td>
              <td style={{...pTdB,fontWeight:800,fontSize:"10pt",textAlign:"left",paddingLeft:"8px",borderTop:"2px solid #333"}}>{r.total||""}</td>
              <td style={{...pTdB,borderRight:"1px solid #333",fontSize:"7pt",textAlign:"left",padding:"2px 3px",borderTop:"2px solid #333"}}>{fmtRemarks(r.remarks)||""}</td>
            </tr>);
            idx++;
            while(idx<data.length&&data[idx].bib==="sub"){
              const m=data[idx];
              const isLast=idx+1>=data.length||data[idx+1].bib!=="sub";
              allRows.push(<tr key={m.id||idx}>
                <td style={{...pTdB,borderLeft:"1px solid #333",borderBottom:isLast?"1px solid #333":"1px dashed #aaa"}}></td>
                <td style={{fontSize:"8pt",padding:"1px 4px",paddingLeft:"10px",textAlign:"left",borderBottom:isLast?"1px solid #333":"1px dashed #aaa"}}>└ {m.name||""}</td>
                <td style={{fontSize:"8pt",padding:"1px 4px",textAlign:"center",color:"#555",borderBottom:isLast?"1px solid #333":"1px dashed #aaa"}}>{isNatGames()?m.region:(m._sub_org||m.sub_org||m.region)}</td>
                <td style={{borderBottom:isLast?"1px solid #333":"1px dashed #aaa"}}></td>
                <td style={{borderRight:"1px solid #333",borderBottom:isLast?"1px solid #333":"1px dashed #aaa"}}></td>
              </tr>);
              idx++;
            }
          } else {
            // 개인전
            allRows.push(<tr key={r.id||idx}>
              <td style={{...pTdB,fontWeight:800,fontSize:"10pt",borderLeft:"1px solid #333"}}>{r.rank||""}</td>
              <td style={{...pTdB,fontWeight:700,fontSize:"9pt",textAlign:"left",paddingLeft:"6px"}}>{r.name||""}</td>
              <td style={{...pTdB}}>{r.region||""}</td>
              <td style={{...pTdB,fontWeight:800,fontSize:"10pt",textAlign:"left",paddingLeft:"8px"}}>{r.total||""}</td>
              <td style={{...pTdBR,fontSize:"7pt",textAlign:"left",padding:"2px 3px"}}>{fmtRemarks(r.remarks)||""}</td>
            </tr>);
            idx++;
          }
        }
        return <table style={{tableLayout:"fixed"}}><colgroup>{colW.map((w,i)=>
          <col key={i} style={w?{width:w}:{}}/>
        )}</colgroup>
        <thead><tr>{hdr.map(h=><th key={h} style={{...pTh}}>{h}</th>)}</tr></thead>
        <tbody>{allRows.length===0
          ?<tr><td colSpan={5} style={{textAlign:"center",padding:"10mm",color:"#888",fontSize:"9pt"}}>데이터 없음</td></tr>
          :allRows
        }</tbody></table>;
      }

      // ── 본선/일반 렌더링 ──
        const seriesCount=cfg.series;
        const seriesLabels=cfg.seriesLabels;
        const sCols=Array.from({length:seriesCount},(_,i)=>i+1);
        const sHeaders=seriesLabels||sCols.map(i=>""+i);
        const nameLabel="이름";
        const hdr=["순위",nameLabel,"소속",...sHeaders,"합계","비고"];
        const colWidths=hdr.map(h=>{
          if(h==="소속") return null;
          if(h==="비고") return "48px";
          if(h==="순위") return "28px";
          if(h===nameLabel) return isMixed?"80px":"48px";
          if(h==="합계") return cfg.xcount?"68px":"54px";
          return "34px";
        });
        // 3자세 점선 위치: 슬사2(s2), 복사2(s4) 뒤에 점선
        const isDotAfterSeries=(sIdx)=>{
          if(seriesLabels){
            return sIdx===2||sIdx===4||sIdx===seriesCount;
          }
          return sIdx===seriesCount; // 일반: 마지막 시리즈 뒤
        };
        // 헤더 점선 위치 매핑
        const hdrDotSet=new Set();
        hdrDotSet.add("소속");
        if(seriesLabels){
          hdrDotSet.add(seriesLabels[1]); // 슬사2
          hdrDotSet.add(seriesLabels[3]); // 복사2
          hdrDotSet.add(seriesLabels[5]); // 입사2
        } else {
          hdrDotSet.add(""+seriesCount); // 마지막 시리즈
        }
        // 3자세: 2단 헤더 (슬사/복사/입사 → 하위에 1,2) + 소계 3열
        const render3PosHeader=()=>{
          return <thead><tr>
            <th style={{...pTh,borderRight:undefined}}>순위</th>
            <th style={pTh}>이름</th>
            <th style={{...pTh,borderRight:dotBdr}}>소속</th>
            <th style={pTh}>자세</th>
            <th style={pTh}>1</th>
            <th style={{...pTh,borderRight:dotBdr}}>2</th>
            <th style={pTh}>소계</th>
            <th style={pTh}>합계</th>
            <th style={pTh}>비고</th>
          </tr></thead>;
        };
        // 소계 계산 함수 (3자세: x카운트 포함)
        const calcSubTotal=(r,startS)=>{
          let sum=0;
          for(let si=startS;si<startS+2;si++){
            const v=parseFloat(r["s"+si])||0;
            sum+=v;
          }
          if(!sum) return "";
          return sum;
        };
        // 3자세 선수별 3행 렌더
        const render3PosRows=(r,i)=>{
          const poses=[{name:"슬사",s1:1,s2:2},{name:"복사",s1:3,s2:4},{name:"입사",s1:5,s2:6}];
          return poses.map((p,pi)=>{
            const isFirst=pi===0, isLast=pi===2;
            const bdrBot=isLast?"2px solid #333":"1px solid transparent";
            const vAlign=isFirst?"bottom":isLast?"top":"middle";
            const vPad=isLast?"3px 4px":"1px 4px";
            const tdS={padding:vPad,textAlign:"center",fontSize:"8.5pt",fontFamily:"'Arial Narrow','Malgun Gothic','맑은 고딕',sans-serif",borderBottom:bdrBot,verticalAlign:vAlign};
            return <tr key={(r.id||i)+"_"+pi}>
              <td style={{...tdS,borderLeft:"1px solid #333",fontWeight:isFirst?800:400,fontSize:isFirst?"10pt":"8.5pt"}}>{isFirst?(r.rank||""):""}</td>
              <td style={{...tdS,textAlign:"left",paddingLeft:"4px",fontWeight:isFirst?700:400,fontSize:isFirst?"9pt":"8.5pt",...(isFirst&&r.is_team?{textDecoration:"underline"}:{})}}>{isFirst?r.name:""}</td>
              <td style={{...tdS,borderRight:dotBdr,fontSize:isFirst?"6.5pt":"8.5pt"}}>{isFirst?(isNatGames()?r.region:(r._sub_org||r.sub_org||r.region)):""}</td>
              <td style={{...tdS,fontWeight:600,fontSize:"7.5pt",color:"#555"}}>{p.name}</td>
              <td style={tdS}>{r["s"+p.s1]||""}</td>
              <td style={{...tdS,borderRight:dotBdr}}>{r["s"+p.s2]||""}</td>
              <td style={{...tdS,fontWeight:600}}>{calcSubTotal(r,p.s1)}</td>
              <td style={{...tdS,fontWeight:isLast?700:400,textAlign:"left",paddingLeft:"8px"}}>{isLast?fmtTotal(r):""}</td>
              <td style={{...tdS,borderRight:"1px solid #333",fontSize:"7pt",textAlign:"left",padding:"2px 3px"}}>{isLast?(fmtRemarks(r.remarks)||""):""}</td>
            </tr>;
          });
        };
        // colWidths for 3자세: 3행 레이아웃
        const hdrForWidth=seriesLabels
          ?["순위","이름","소속","자세","1","2","소계","합계","비고"]
          :hdr;
        const colWidthsFinal=(seriesLabels?hdrForWidth:hdr).map(h=>{
          if(h==="소속") return null;
          if(h==="비고") return "48px";
          if(h==="순위") return "28px";
          if(h==="이름") return "48px";
          if(h==="합계") return cfg.xcount?"74px":"60px";
          if(h==="자세") return "32px";
          if(h==="소계") return "46px";
          return "34px";
        });
        return <table style={{tableLayout:"fixed"}}><colgroup>{colWidthsFinal.map((w,i)=>
          <col key={i} style={w?{width:w}:{}}/>
        )}</colgroup>
        {seriesLabels?render3PosHeader()
          :<thead><tr>{hdr.map(h=><th key={h} style={{...pTh,...(hdrDotSet.has(h)?{borderRight:dotBdr}:{})}}>{h}</th>)}</tr></thead>}
        <tbody>{(()=>{
          if(isMixed){
            // 혼성팀: team/sub 그룹 렌더링 (팀요약 + 개인 2행)
            const F="'Arial Narrow','Malgun Gothic','맑은 고딕',sans-serif";
            const sPad="1px 2px";
            const teamCell=(extra={})=>({padding:"2px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,
              borderTop:"2px solid #333",borderBottom:"1px dashed #888",borderLeft:"none",borderRight:"none",...extra});
            const memCell2=(extra={})=>({padding:"2px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,
              borderTop:"none",borderBottom:"1px dashed #aaa",borderLeft:"none",borderRight:"none",...extra});
            const memLastCell2=(extra={})=>({padding:"2px 4px",textAlign:"center",fontSize:"8.5pt",fontFamily:F,
              borderTop:"none",borderBottom:"1px solid #333",borderLeft:"none",borderRight:"none",...extra});
            const allRows=[];
            let idx=0;
            while(idx<data.length){
              const r=data[idx];
              if(r.bib==="team"){
                // 팀 합산 행
                const tc=[];
                tc.push(<td key="rank" style={teamCell({borderLeft:"1px solid #333",fontWeight:800,fontSize:"10pt"})}>{r.rank}</td>);
                tc.push(<td key="name" style={teamCell({fontWeight:700,fontSize:"9pt",textAlign:"left",paddingLeft:"4px"})}>{r.name}</td>);
                tc.push(<td key="region" style={teamCell({borderRight:dotBdr,whiteSpace:"nowrap"})}></td>);
                sCols.forEach(s=>tc.push(<td key={"s"+s} style={teamCell({fontWeight:700,whiteSpace:"nowrap",padding:sPad,...(isDotAfterSeries(s)?{borderRight:dotBdr}:{})})}>{r["s"+s]||""}</td>));
                tc.push(<td key="total" style={teamCell({fontWeight:800,fontSize:"10pt",textAlign:"left",paddingLeft:"8px",whiteSpace:"nowrap"})}>{fmtTotal(r)}</td>);
                tc.push(<td key="rem" style={teamCell({borderRight:"1px solid #333",fontSize:"7pt",textAlign:"left",padding:"2px 3px",lineHeight:1.2})}>{fmtRemarks(r.remarks)||""}</td>);
                allRows.push(<tr key={r.id||idx} style={{background:"#f0f0f0"}}>{tc}</tr>);
                idx++;
                // 개인 행 (bib==="sub")
                let mCount=0;
                while(idx<data.length&&data[idx].bib==="sub"){
                  const m=data[idx]; mCount++;
                  const isLast=idx+1>=data.length||data[idx+1].bib!=="sub";
                  const mk=isLast?memLastCell2:memCell2;
                  const mc=[];
                  mc.push(<td key="rank" style={mk({borderLeft:"1px solid #333"})}></td>);
                  mc.push(<td key="name" style={mk({paddingLeft:"10px",fontSize:"8pt",textAlign:"left"})}>{m.name}</td>);
                  mc.push(<td key="region" style={mk({borderRight:dotBdr,fontSize:"6.5pt"})}>{isNatGames()?m.region:(m._sub_org||m.sub_org||m.region)}</td>);
                  sCols.forEach(s=>mc.push(<td key={"s"+s} style={mk({whiteSpace:"nowrap",padding:sPad,...(isDotAfterSeries(s)?{borderRight:dotBdr}:{})})}>{m["s"+s]||""}</td>));
                  mc.push(<td key="total" style={mk({fontWeight:600,textAlign:"left",paddingLeft:"8px",whiteSpace:"nowrap"})}>{fmtTotal(m)}</td>);
                  mc.push(<td key="rem" style={mk({borderRight:"1px solid #333"})}></td>);
                  allRows.push(<tr key={m.id||idx}>{mc}</tr>);
                  idx++;
                }
              } else {
                // 일반 행 (팀 마커 없는 경우)
                const cells=[];
                cells.push(<td key="rank" style={pTdBL}>{r.rank}</td>);
                cells.push(<td key="name" style={pTdB}>{r.name}</td>);
                cells.push(<td key="region" style={{...pTdB,borderRight:dotBdr,fontSize:"6.5pt"}}>{isNatGames()?r.region:(r._sub_org||r.sub_org||r.region)}</td>);
                sCols.forEach(s=>cells.push(<td key={"s"+s} style={{...pTdB,...(isDotAfterSeries(s)?{borderRight:dotBdr}:{})}}>{r["s"+s]||""}</td>));
                cells.push(<td key="total" style={{...pTdB,fontWeight:700,textAlign:"left",paddingLeft:"8px"}}>{fmtTotal(r)}</td>);
                cells.push(<td key="rem" style={pTdBR}>{fmtRemarks(r.remarks)||""}</td>);
                allRows.push(<tr key={r.id||idx}>{cells}</tr>);
                idx++;
              }
            }
            return allRows;
          }
          return data.map((r,i)=>{
          if(seriesLabels) return render3PosRows(r,i);
          const cells=[];
          cells.push(<td key="rank" style={pTdBL}>{r.rank}</td>);
          cells.push(<td key="name" style={{...pTdB,...(isMixed?{fontSize:"7pt",lineHeight:1.3,textAlign:"left",paddingLeft:"2px"}:{})}}>{isMixed?r.name.replace(" / ","\n"):r.name}</td>);
          cells.push(<td key="region" style={{...pTdB,...(!isMixed&&r.is_team?{textDecoration:"underline"}:{}),borderRight:dotBdr,fontSize:"6.5pt"}}>{isNatGames()?r.region:(r._sub_org||r.sub_org||r.region)}</td>);
          sCols.forEach(s=>cells.push(<td key={"s"+s} style={{...pTdB,...(isDotAfterSeries(s)?{borderRight:dotBdr}:{})}}>{r["s"+s]||""}</td>));
          cells.push(<td key="total" style={{...pTdB,fontWeight:700,textAlign:"left",paddingLeft:"8px"}}>{fmtTotal(r)}</td>);
          cells.push(<td key="rem" style={pTdBR}>{fmtRemarks(r.remarks)||""}</td>);
          return <tr key={r.id||i}>{cells}</tr>;
        });})()}</tbody></table>;
    };

    // ═══ 결선 전용 테이블 (9시리즈, 격발별 상세, 누계) ═══
    const renderFinal=()=>{
      const data=resData.filter(r=>!r._deleted);
      if(data.length===0) return <p style={{textAlign:"center",color:"#999",padding:"20mm 0"}}>결선 데이터가 없습니다.</p>;
      const SERIES=9;
      const shotsIn=s=>s<=2?5:2;
      const MAX_ROWS=6; // row0=누계, row1-5=격발
      const F="'Arial Narrow','Malgun Gothic','맑은 고딕',sans-serif";
      const SZ="7.5pt"; // 통일 폰트 크기
      const parseShots=str=>{
        if(!str) return [];
        return String(str).split(",").map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v));
      };
      const calcCumul=r=>{
        const subs=[];let cum10=0; // ×10 정수 누적으로 부동소수점 오차 방지
        for(let s=1;s<=SERIES;s++){
          const shots=parseShots(r["s"+s]);
          if(shots.length===0) break; // 탈락 이후 데이터 없음
          shots.forEach(v=>{cum10+=Math.round(v*10);});
          subs.push(cum10/10);
        }
        return subs;
      };
      const bdr="1px solid #333";
      const bdrD="1px dashed #aaa";
      // 누계 행 (row0): 볼드, 통일 크기
      const subCell={padding:"1px 2px",textAlign:"center",fontSize:SZ,fontFamily:F,fontWeight:700,lineHeight:1.1,
        borderTop:bdr,borderBottom:"1px solid #555",borderLeft:"none",borderRight:"none"};
      // 격발 행: 통일 크기, 일반 굵기
      const shotCell={padding:"0.5px 1px",textAlign:"center",fontSize:SZ,fontFamily:F,fontWeight:400,lineHeight:1.1,
        borderTop:"none",borderBottom:bdrD,borderLeft:"none",borderRight:"none"};
      const shotLastCell={...shotCell,borderBottom:bdr};
      // 열 너비: 소속=경기도장애인체육회, 비고=비공식 세계신 기준 고정, 나머지 시리즈에 균등배분
      const colW=["22px","38px","62px",...Array(SERIES).fill(null),"38px","48px"];
      return <table style={{tableLayout:"fixed",width:"100%"}}><colgroup>
        {colW.map((w,i)=><col key={i} style={w?{width:w}:{}}/>)}
      </colgroup>
      <thead>
        <tr>
          {["순위","이름","소속"].map((h,i)=>
            <th key={h} style={{...pTh,padding:"2px 2px",fontSize:"7pt",...(i===2?{borderRight:dotBdr}:{})}}>{h}</th>
          )}
          {Array.from({length:SERIES},(_,i)=>
            <th key={"s"+i} style={{...pTh,fontSize:"7pt",padding:"2px 1px",...(i===1?{borderRight:dotBdr}:{})}}>S{i+1}</th>
          )}
          <th style={{...pTh,padding:"2px 2px",fontSize:"7pt"}}>합계</th>
          <th style={{...pTh,padding:"2px 2px",fontSize:"7pt"}}>비고</th>
        </tr>
      </thead>
      <tbody>{data.map((r,pi)=>{
        const subs=calcCumul(r);
        const playerLastS=subs.length; // 이 선수의 마지막 시리즈 번호 (1-based)
        const allShots=[];
        for(let s=1;s<=SERIES;s++) allShots.push(parseShots(r["s"+s]));
        const rows=[];
        for(let row=0;row<MAX_ROWS;row++){
          const cells=[];
          const isLast=row===MAX_ROWS-1;
          if(row===0){
            // 순위, 이름, 소속 — 상단 정렬
            cells.push(<td key="rank" rowSpan={MAX_ROWS} style={{...subCell,borderLeft:bdr,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{r.rank}</td>);
            cells.push(<td key="name" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",textAlign:"left",paddingLeft:"2px",paddingTop:"2px"}}>{r.name}</td>);
            cells.push(<td key="region" rowSpan={MAX_ROWS} style={{...subCell,fontSize:"6.5pt",verticalAlign:"top",borderRight:dotBdr,textAlign:"left",paddingLeft:"1px",paddingTop:"2px"}}>{isNatGames()?r.region:(r._sub_org||r.sub_org||r.region)}</td>);
          }
          // 시리즈 열 (S1~S9)
          for(let s=0;s<SERIES;s++){
            const shots=allShots[s];
            const maxS=shotsIn(s+1);
            const rightBdr=s===1?{borderRight:dotBdr}:{};
            if(row===0){
              // 마지막 시리즈 누계 = 합계와 동일 → 숨김, 탈락 이후도 숨김
              const val=(s+1)>=playerLastS?"":((subs[s]||0)>0?subs[s].toFixed(1):"");
              cells.push(<td key={"s"+s} style={{...subCell,...rightBdr}}>{val}</td>);
            } else {
              const shotIdx=row-1;
              const cStyle=isLast?{...shotLastCell,...rightBdr}:{...shotCell,...rightBdr};
              if(shotIdx<maxS&&shots[shotIdx]!==undefined){
                cells.push(<td key={"s"+s} style={cStyle}>{shots[shotIdx].toFixed(1)}</td>);
              } else {
                cells.push(<td key={"s"+s} style={cStyle}></td>);
              }
            }
          }
          if(row===0){
            const total=r.total||(subs.length>0?subs[subs.length-1].toFixed(1):"");
            cells.push(<td key="total" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{total}</td>);
            cells.push(<td key="rem" rowSpan={MAX_ROWS} style={{...subCell,borderRight:bdr,fontSize:"5.5pt",verticalAlign:"top",textAlign:"left",padding:"2px 1px",fontWeight:400,lineHeight:1.1}}>{fmtRemarks(r.remarks)}</td>);
          }
          rows.push(<tr key={pi+"_"+row}>{cells}</tr>);
        }
        return rows;
      }).flat()}</tbody></table>;
    };

    // ═══ 권총 결선 전용 테이블 (10시리즈, 1발/시리즈, 정수, 탈락식) ═══
    const renderFinalPistol=()=>{
      const data=resData.filter(r=>!r._deleted);

          {["순위","이름","소속"].map((h,i)=>

          {Array.from({length:SERIES},(_,i)=>

          <td style={{...cellBase,borderTop:bdr,borderBottom:bdr,borderRight:bdrNone,textAlign:"left",paddingLeft:"2px",fontWeight:600}}>{r.name}</td>

    // ═══ 3자세 결선 전용 테이블 (8시리즈: S1=슬사1발, S2=복사1발, S3=입사2발, S4~S8=입사1발) ═══
    const renderFinal3Pos=()=>{
      const data=resData.filter(r=>!r._deleted);
      if(data.length===0) return <p style={{textAlign:"center",color:"#999",padding:"20mm 0"}}>결선 데이터가 없습니다.</p>;
      const SERIES=8;
      const shotsIn=s=>s===3?2:1; // S1=슬사(1발), S2=복사(1발), S3=입사(2발), S4~S8=입사(1발)
      const MAX_ROWS=3; // row0=누계, row1~2=격발 (최대 2발=S3)
      const F="'Arial Narrow','Malgun Gothic','맑은 고딕',sans-serif";
      const SZ="7.5pt";
      const parseShots=str=>{
        if(!str) return [];
        return String(str).split(",").map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v));
      };
      const calcCumul=r=>{
        const subs=[];let cum10=0; // ×10 정수 누적으로 부동소수점 오차 방지
        for(let s=1;s<=SERIES;s++){
          const shots=parseShots(r["s"+s]);
          if(shots.length===0) break;
          shots.forEach(v=>{cum10+=Math.round(v*10);});
          subs.push(cum10/10);
        }
        return subs;
      };
      const bdr="1px solid #333";
      const bdrD="1px dashed #aaa";
      const subCell={padding:"1px 2px",textAlign:"center",fontSize:SZ,fontFamily:F,fontWeight:700,lineHeight:1.1,
        borderTop:bdr,borderBottom:"1px solid #555",borderLeft:"none",borderRight:"none"};
      const shotCell={padding:"0.5px 1px",textAlign:"center",fontSize:SZ,fontFamily:F,fontWeight:400,lineHeight:1.1,
        borderTop:"none",borderBottom:bdrD,borderLeft:"none",borderRight:"none"};
      const shotLastCell={...shotCell,borderBottom:bdr};
      const posLabels=["슬사","복사","입사","입사","입사","입사","입사","입사"];
      const colW=["22px","38px","62px",...Array(SERIES).fill(null),"38px","48px"];
      return <table style={{tableLayout:"fixed",width:"100%"}}><colgroup>
        {colW.map((w,i)=><col key={i} style={w?{width:w}:{}}/>)}
      </colgroup>
      <thead>
        <tr>
          {["순위","이름","소속"].map((h,i)=>
            <th key={h} style={{...pTh,padding:"2px 2px",fontSize:"7pt",...(i===2?{borderRight:dotBdr}:{})}}>{h}</th>
          )}
          {posLabels.map((lbl,i)=>
            <th key={"s"+i} style={{...pTh,fontSize:"7pt",padding:"2px 1px",...(i===1?{borderRight:dotBdr}:{})}}>{lbl}</th>
          )}
          <th style={{...pTh,padding:"2px 2px",fontSize:"7pt"}}>합계</th>
          <th style={{...pTh,padding:"2px 2px",fontSize:"7pt"}}>비고</th>
        </tr>
      </thead>
      <tbody>{data.map((r,pi)=>{
        const subs=calcCumul(r);
        const playerLastS=subs.length;
        const allShots=[];
        for(let s=1;s<=SERIES;s++) allShots.push(parseShots(r["s"+s]));
        const rows=[];
        for(let row=0;row<MAX_ROWS;row++){
          const cells=[];
          const isLast=row===MAX_ROWS-1;
          if(row===0){
            cells.push(<td key="rank" rowSpan={MAX_ROWS} style={{...subCell,borderLeft:bdr,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{r.rank}</td>);
            cells.push(<td key="name" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",textAlign:"left",paddingLeft:"2px",paddingTop:"2px"}}>{r.name}</td>);
            cells.push(<td key="region" rowSpan={MAX_ROWS} style={{...subCell,fontSize:"6.5pt",verticalAlign:"top",borderRight:dotBdr,textAlign:"left",paddingLeft:"1px",paddingTop:"2px"}}>{isNatGames()?r.region:(r._sub_org||r.sub_org||r.region)}</td>);
          }
          for(let s=0;s<SERIES;s++){
            const shots=allShots[s];
            const maxS=shotsIn(s+1);
            const rightBdr=s===1?{borderRight:dotBdr}:{};
            if(row===0){
              const val=(s+1)>=playerLastS?"":((subs[s]||0)>0?subs[s].toFixed(1):"");
              cells.push(<td key={"s"+s} style={{...subCell,...rightBdr}}>{val}</td>);
            } else {
              const shotIdx=row-1;
              const cStyle=isLast?{...shotLastCell,...rightBdr}:{...shotCell,...rightBdr};
              if(shotIdx<maxS&&shots[shotIdx]!==undefined){
                cells.push(<td key={"s"+s} style={cStyle}>{shots[shotIdx].toFixed(1)}</td>);
              } else {
                cells.push(<td key={"s"+s} style={cStyle}></td>);
              }
            }
          }
          if(row===0){
            const total=r.total||(subs.length>0?subs[subs.length-1].toFixed(1):"");
            cells.push(<td key="total" rowSpan={MAX_ROWS} style={{...subCell,fontSize:SZ,verticalAlign:"top",paddingTop:"2px"}}>{total}</td>);
            cells.push(<td key="rem" rowSpan={MAX_ROWS} style={{...subCell,borderRight:bdr,fontSize:"5.5pt",verticalAlign:"top",textAlign:"left",padding:"2px 1px",fontWeight:400,lineHeight:1.1}}>{fmtRemarks(r.remarks)}</td>);
          }
          rows.push(<tr key={pi+"_"+row}>{cells}</tr>);
        }
        return rows;
      }).flat()}</tbody></table>;
    };

        </tr></thead>
        <tbody>{teamData.map((t,ti)=>{

            rows.push(<tr key={(t.teamNum||t.region)+"_t"+pi} style={{background:"#f0f0f0"}}>
              <td style={{...tdS,borderLeft:"1px solid #333",fontWeight:isFirst?800:400,fontSize:isFirst?"10pt":"8.5pt"}}>{isFirst?t.rank:""}</td>
              <td style={{...tdS,textAlign:"left",paddingLeft:"4px",fontWeight:isFirst?700:400,fontSize:isFirst?"9pt":"8.5pt",borderRight:dotBdr,whiteSpace:"nowrap"}}>{isFirst?teamDisplayName(t):""}</td>

              <td style={{...tdS,fontWeight:700}}>{teamSubTotal(t,p.s1)}</td>
              <td style={{...tdS,fontWeight:isLast?800:400,fontSize:isLast?"10pt":"8.5pt",textAlign:"left",paddingLeft:"6px",whiteSpace:"nowrap"}}>{isLast?fmtTeamTotal(t):""}</td>
              <td style={{...tdS,borderRight:"1px solid #333",fontSize:"7pt",textAlign:"left",padding:"2px 3px"}}>{isLast?(fmtRemarks(t._remarks)||""):""}</td>
            </tr>);
          });
          // ── 개인 행 (top3 + extra) ──

        <span style={{color:"#94a3b8",fontSize:12,alignSelf:"center"}}>표 배율: {(printZoom*100).toFixed(0)}% ({printPages}p)</span>
      </div>
    </div>;

    try{
      for(const t of yearTs){const{error}=await sb.from("tournaments").delete().eq("id",t.id); if(error) throw new Error(error.message);}
      flash(year+"년 대회 "+yearTs.length+"건 삭제 완료"); loadT();

    // 빈 연도 묶음: 바로 새 대회 등록 모달 열기

                    {items.map((t,ti)=>(
                      <div key={t.id} style={{padding:"12px 20px",display:"flex",alignItems:"center",gap:16,borderBottom:ti<items.length-1?"1px solid "+C.border+"66":"none",background:ti%2===0?"transparent":C.card+"44"}}>
                        <div style={{flex:1}}>
                          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:3}}>
                            <span style={{fontSize:14,fontWeight:700,color:"#fff"}}>{t.name}</span>

                setMasterEvents(data);await saveMasterEvents(data);
                flash("백업 불러오기 완료: "+data.length+"개 종목");

        <button className="no-print" onClick={()=>setSchedPrint(false)} style={{position:"fixed",top:20,right:20,zIndex:10000,padding:"8px 20px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>✕ 닫기</button>
        <button className="no-print" onClick={()=>window.print()} style={{position:"fixed",top:20,right:100,zIndex:10000,padding:"8px 20px",background:"#d4a843",color:"#000",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>🖨 인쇄</button>

        {schedData.filter(d=>d.rows.length>0).map((day,dayIdx)=>{
          const {spans,sk}=calcSpans(day.rows);
          const totalRows=day.rows.length;
          return <div key={day.day} style={{marginBottom:"4mm"}}>
            <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}}>
              <colgroup>
                <col style={{width:"72px"}}/>
                <col style={{width:"56px"}}/>
                <col/>
                <col style={{width:"105px"}}/>
                <col style={{width:"44px"}}/>
                <col style={{width:"44px"}}/>
              </colgroup>
              <thead>
                <tr>
                  <th style={thSt}>날짜</th>
                  <th style={thSt}>구분</th>
                  <th style={{...thSt,whiteSpace:"normal"}}>내용</th>
                  <th style={thSt}>시간</th>
                  <th style={thSt}>인원</th>
                  <th style={thSt}>비고</th>
                </tr>
              </thead>
              <tbody>
                {day.rows.map((row,ri)=>{
                  const showCat=!sk.has(ri);
                  const isPET=row.type==="pet";
                  const evName=row.event_code?(events.find(e=>e.code===row.event_code)||{}).name||row.event_code:"";
                  const displayContent=isPET?(row.content||("공식 훈련 ("+row.event_code+")")):(row.event_code?(evName.startsWith(row.event_code)?evName:row.event_code+" "+evName):row.content);
                  const sKey=row.event_code+(row.relay?"_"+row.relay:"");
                  const sl=startLists[sKey];
                  const ev=events.find(e=>e.code===row.event_code);
                  const isMx=ev&&ev.type==="mixed";
                  let countVal;
                  const is25Print=row.event_code&&evToCategory(row.event_code)==="25M";
                  if(row.event_code&&is25Print){
                    // 25M: 전체 relay 합산
                    const relayKeys=Object.keys(startLists).filter(k=>k.startsWith(row.event_code+"_")&&/\d+$/.test(k)&&startLists[k]&&startLists[k].length>0);
                    if(relayKeys.length>0){
                      const totalActive=relayKeys.reduce((s,k)=>s+(startLists[k]||[]).filter(p=>!p.absent).length,0);
                      countVal=totalActive+"명";
                    } else {
                      countVal=evCountMap[row.event_code]?evCountMap[row.event_code]+"명":row.count;
                    }
                  } else if(row.event_code&&sl&&sl.length>0){
                    const active=sl.filter(p=>!p.absent);
                    if(isMx){const tns=new Set(active.map(p=>p._mixedTeamNum||p._orgNum||p._teamIdx).filter(Boolean));countVal=tns.size+"팀";}
                    else countVal=active.length+"명";
                  } else {
                    countVal=row.event_code&&evCountMap[row.event_code]?(evCountMap[row.event_code]+(isMx?"팀":"명")):row.count;
                  }
                  // 내용 텍스트에서 종목코드, N조, 완사/급사를 볼드 처리 (SH1/SH2 제외)
                  const boldifyContent=(text)=>{
                    if(!text) return text;
                    // split with capture group: 홀수 인덱스가 매칭된 부분
                    const parts=text.split(/((?:DB-)?(?:PT|P|R)\d{1,2}(?:\([A-Z]+\))?(?=[\s,)]|$)|\d+조|완사|급사)/);
                    return parts.map((part,i)=>i%2===1?<b key={i}>{part}</b>:<span key={i}>{part}</span>);
                  };
                  const renderPrintContent=(text)=>{
                    const idx=text.indexOf("(");
                    if(idx>0) return <span>{text.substring(0,idx)}<span style={{fontSize:"10pt"}}>{text.substring(idx)}</span></span>;
                    return text;
                  };
                  return <tr key={row.id} style={isPET?{background:"#e8e8e8"}:undefined}>
                    {ri===0&&<td rowSpan={totalRows} style={{...tdSt,textAlign:"center",fontWeight:800,verticalAlign:"middle",background:"#f5f5f5"}}>{dayLabel(day.day)}</td>}
                    {showCat&&<td rowSpan={spans[ri]} style={{...tdSt,textAlign:"center",fontWeight:700,verticalAlign:"middle"}}>{row.category}</td>}
                    <td style={{...tdSt,textAlign:"left",paddingLeft:"4px",whiteSpace:"normal"}}>{isPET?renderPrintContent(displayContent):<span>{boldifyContent(displayContent+((!isPET&&row.relay)?(" "+schedLabel(row.event_code,row.relay)):""))}</span>}</td>
                    <td style={{...tdSt,textAlign:"center"}}>{row.time}{row.category==="25M"&&row.time&&(()=>{
                      const rk=Object.keys(startLists).filter(k=>k.startsWith(row.event_code+"_")&&/\d+$/.test(k)&&startLists[k]&&startLists[k].length>0);
                      return rk.length>=2?<div style={{fontSize:"8pt"}}>(1조) / (2조)</div>:null;
                    })()}</td>
                    <td style={{...tdSt,textAlign:"center"}}>{isPET?"":countVal||""}</td>
                    <td style={{...tdSt,textAlign:"center"}}>{row.remark}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>;
        })}
      </div>
    </div>;
  };

  // ─── 스타트리스트 인쇄 ───
  const renderSlPrint=()=>{
    if(!slPrint) return null;
    const pSessionKey=slPrint;
    const skParts=pSessionKey.match(/^(.+?)_(\d+)$/);
    const pEvCode=skParts?skParts[1]:pSessionKey;
    const pRelay=skParts?Number(skParts[2]):1;
    const tName=selectedT?.name||"";
    const evObj=events.find(e=>e.code===pEvCode);
    const evName=evObj?.name||pEvCode;
    const list=startLists[pSessionKey];
    if(!list||!list.length) return null;
    let dayNum=null,time=null;
    schedData.forEach(d=>{d.rows.forEach(r=>{if(r.type==="prelim"&&r.event_code===pEvCode){dayNum=d.day;if(r.time)time=r.time;}});});
    const startDate=selectedT?.start_date;
    let dateStr="X월 X일";
    if(dayNum&&startDate){const dt=new Date(startDate);dt.setDate(dt.getDate()+dayNum-1);dateStr=(dt.getMonth()+1)+"월 "+dt.getDate()+"일";}
    const timeStr=time||(evToCategory(pEvCode)==="25M"?"00:00 / 00:00":"00:00-00:00");
    // ── team_entries 기반 단체번호 조회 ──
    const isMixedEv=evObj&&evObj.type==="mixed";
    const evMixedOv=mixedTeamOverrides[pEvCode]||{};
    const evOvPrint=orgNumOverrides[pEvCode]||{};
    const printTeamNum={};
    if(evPData&&evPData.allTeamEntries){
      const memberMap2={};(evPData.allMembers||[]).forEach(m=>{memberMap2[m.id]=m;});
      const memberAppMap2={};(evPData.allMembers||[]).forEach(m=>{memberAppMap2[m.id]=evPData.appMap[m.application_id];});
      const regionOrd=["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
      const evTE=evPData.allTeamEntries.filter(t=>t.event_code===pEvCode&&(isMixedEv?t.team_type==="mixed":t.team_type==="team")&&memberMap2[t.member_id]);
      const teamByApp={};
      evTE.forEach(te=>{
        const app=memberAppMap2[te.member_id];
        const k=(te.application_id||"?")+"_"+(te.team_number||1);
        if(!teamByApp[k]) teamByApp[k]={regionName:app?.region_name||"-",teamNumber:te.team_number||1,members:new Set()};
        teamByApp[k].members.add(te.member_id);
      });
      const tl=Object.values(teamByApp);
      tl.sort((a,b)=>{const ai=regionOrd.indexOf(a.regionName),bi=regionOrd.indexOf(b.regionName);return(ai===-1?99:ai)-(bi===-1?99:bi)||(a.teamNumber-b.teamNumber);});
      tl.forEach((t,i)=>{t.members.forEach(mid=>{printTeamNum[mid]=i+1;});});
    }
    const getPrintTeamNum=(p)=>{
      if(!p.memberId) return (isMixedEv?p._mixedTeamNum:p._orgNum)||null;
      const mid=String(p.memberId);
      // 혼성팀: mixedTeamOverrides 우선 → _mixedTeamNum 폴백
      if(isMixedEv){
        if(evMixedOv[mid]!==undefined) return evMixedOv[mid];
        return p._mixedTeamNum||printTeamNum[p.memberId]||printTeamNum[Number(p.memberId)]||printTeamNum[String(p.memberId)]||p._orgNum||null;
      }
      // 개인전/단체전: orgNumOverrides 우선
      if(evOvPrint[mid]!==undefined) return evOvPrint[mid];
      return printTeamNum[p.memberId]||printTeamNum[Number(p.memberId)]||printTeamNum[String(p.memberId)]||p._orgNum||null;
    };
    const thSt={border:"1px solid #333",padding:"5px 6px",background:"#e8e8e8",fontWeight:700,fontSize:"11pt",textAlign:"center"};
    const tdSt={borderLeft:"none",borderRight:"none",borderTop:"none",borderBottom:"none",padding:"4px 6px",fontSize:"13px"};
    const bdr="1px solid #333";
    let seqNum=0;
    return <div className="print-overlay" style={{position:"fixed",inset:0,zIndex:9999,background:"#fff",overflow:"auto",color:"#000"}}>
      <button className="no-print" onClick={()=>setSlPrint(null)} style={{position:"fixed",top:20,right:20,zIndex:10000,padding:"8px 20px",background:"#1a1a2e",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>✕ 닫기</button>
      <button className="no-print" onClick={()=>window.print()} style={{position:"fixed",top:20,right:100,zIndex:10000,padding:"8px 20px",background:"#d4a843",color:"#000",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700}}>🖨 인쇄</button>
      <div className="print-page" style={{maxWidth:800,margin:"0 auto",padding:"12mm 10mm 15mm",background:"#fff",color:"#000"}}>
        <div className="print-page-header"><span>대한장애인사격연맹</span><span>대회운영관리시스템</span></div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6mm"}}>
          <div>
            <div style={{fontSize:"16pt",fontWeight:800,color:"#000",marginBottom:"2mm"}}>{evName} {pRelay}조</div>
            <div style={{fontSize:"13pt",color:"#333"}}>{dateStr}　{timeStr}{evToCategory(pEvCode)==="25M"&&<span style={{fontSize:"9pt",color:"#888",marginLeft:4}}>(완사 / 급사)</span>}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:"11pt",color:"#555"}}>{tName}</div>
            <div style={{fontSize:"14pt",fontWeight:800,color:"#000",marginTop:"1mm"}}>스타트리스트</div>
          </div>
        </div>
        <table style={{width:"100%",borderCollapse:"collapse",color:"#000"}}>
          <thead><tr>
            <th style={{...thSt,width:"36px"}}>순</th>
            <th style={{...thSt,width:"48px"}}>사대</th>
            <th style={{...thSt,width:"72px"}}>이름</th>
            <th style={{...thSt}}>소속</th>
            <th style={{...thSt,width:"48px"}}>단체</th>
            <th style={{...thSt,width:"60px"}}>비고</th>
          </tr></thead>
          <tbody>
            {(()=>{const active=list.filter(p=>!p.absent);return active.map((p,i)=>{
              seqNum++;
              const tn=getPrintTeamNum(p);
              const isLast=i===active.length-1;
              const bb=isLast?bdr:"none";
              return <tr key={i} style={{background:"#fff"}}>
                <td style={{...tdSt,borderBottom:bb,textAlign:"center"}}>{seqNum}</td>
                <td style={{...tdSt,borderBottom:bb,textAlign:"center",fontWeight:700}}>{p.lane||"-"}</td>
                <td style={{...tdSt,borderBottom:bb,fontWeight:600}}>{p.name}</td>
                <td style={{...tdSt,borderBottom:bb}}>{p.subOrg||"-"}</td>
                <td style={{...tdSt,borderBottom:bb,textAlign:"center",fontWeight:700,fontSize:"12px"}}>{tn?"단체"+tn:""}</td>
                <td style={{...tdSt,borderBottom:bb}}>{p.remark||""}</td>
              </tr>;
            });})()}
          </tbody>
        </table>
      </div>
    </div>;
  };

  // ─── 전체 스타트리스트 인쇄 ───
  const getSlPrintSessions=()=>{
    const orderedSessions=[];
    const seen=new Set();
    const seenEvFor25=new Set();
    schedData.forEach(d=>{
      d.rows.forEach(r=>{
        if(r.event_code&&r.type==="prelim"){
          if(is25MEv(r.event_code)){
            // 25M: schedData relay="완사"/"급사" → startLists key=evCode+"_1","_2",...
            if(!seenEvFor25.has(r.event_code)){
              seenEvFor25.add(r.event_code);
              const numericKeys=Object.keys(startLists).filter(sk=>sk.startsWith(r.event_code+"_")&&/\d+$/.test(sk)).sort();
              if(numericKeys.length>0){
                numericKeys.forEach(sk=>{
                  if(!seen.has(sk)){
                    seen.add(sk);
                    const parts=sk.match(/^(.+?)_(\d+)$/);
                    orderedSessions.push({evCode:r.event_code,relay:parts?parts[2]:"1",dayNum:d.day});
                  }
                });
              } else {
                // startLists에 없으면 laneAssign에서 relay 번호 추출
                const relays=new Set();
                Object.keys(laneAssign).forEach(dk=>{const da=laneAssign[dk]||{};Object.keys(da).forEach(k=>{const p=evKeyParse(k);if(p.evCode===r.event_code)relays.add(String(da[k].relay));});});
                [...relays].sort().forEach(rl=>{const sk2=r.event_code+"_"+rl;if(!seen.has(sk2)){seen.add(sk2);orderedSessions.push({evCode:r.event_code,relay:rl,dayNum:d.day});}});
              }
            }
          } else {
            const sk=r.event_code+"_"+(r.relay||"1");
            if(!seen.has(sk)){seen.add(sk);orderedSessions.push({evCode:r.event_code,relay:r.relay||"1",dayNum:d.day});}
          }
        }
      });
    });
    Object.keys(startLists).forEach(sk=>{
      if(!seen.has(sk)){
        const parts=sk.match(/^(.+?)_(\d+)$/);
        const ec=parts?parts[1]:sk;const rl=parts?parts[2]:"1";
        seen.add(sk);orderedSessions.push({evCode:ec,relay:rl,dayNum:null});
      }
    });
    return orderedSessions;
  };
  const openSlPrintAll=()=>{
    const sessions=getSlPrintSessions();
    const available=sessions.filter(s=>{const sk=s.evCode+"_"+s.relay;const list=startLists[sk];return list&&list.length>0;});
    setSlPrintAllSel(new Set(available.map(s=>s.evCode+"_"+s.relay)));
    setSlPrintAllReady(false);
    setSlPrintAll(true);
  };
  const closeSlPrintAll=()=>{setSlPrintAll(false);setSlPrintAllReady(false);setSlPrintAllSel(new Set());};
  const buildTeamNumMap=(evCode)=>{
    const evObj2=events.find(e=>e.code===evCode);
    const isMixedEv2=evObj2&&evObj2.type==="mixed";
    const evMixedOv2=mixedTeamOverrides[evCode]||{};
    const evOvPrint=orgNumOverrides[evCode]||{};
    const printTeamNum={};
    if(evPData&&evPData.allTeamEntries){
      const memberMap2={};(evPData.allMembers||[]).forEach(m=>{memberMap2[m.id]=m;});
      const memberAppMap2={};(evPData.allMembers||[]).forEach(m=>{memberAppMap2[m.id]=evPData.appMap[m.application_id];});
      const regionOrd=["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
      const evTE=evPData.allTeamEntries.filter(t=>t.event_code===evCode&&(isMixedEv2?t.team_type==="mixed":t.team_type==="team")&&memberMap2[t.member_id]);
      const teamByApp={};
      evTE.forEach(te=>{
        const app=memberAppMap2[te.member_id];
        const k=(te.application_id||"?")+"_"+(te.team_number||1);
        if(!teamByApp[k]) teamByApp[k]={regionName:app?.region_name||"-",teamNumber:te.team_number||1,members:new Set()};
        teamByApp[k].members.add(te.member_id);
      });
      const tl=Object.values(teamByApp);
      tl.sort((a,b)=>{const ai=regionOrd.indexOf(a.regionName),bi=regionOrd.indexOf(b.regionName);return(ai===-1?99:ai)-(bi===-1?99:bi)||(a.teamNumber-b.teamNumber);});
      tl.forEach((t,i)=>{t.members.forEach(mid=>{printTeamNum[mid]=i+1;});});
    }
    return (p)=>{
      if(!p.memberId) return (isMixedEv2?p._mixedTeamNum:p._orgNum)||null;
      const mid=String(p.memberId);
      if(isMixedEv2){
        if(evMixedOv2[mid]!==undefined) return evMixedOv2[mid];
        return p._mixedTeamNum||printTeamNum[p.memberId]||printTeamNum[Number(p.memberId)]||printTeamNum[String(p.memberId)]||p._orgNum||null;
      }
      if(evOvPrint[mid]!==undefined) return evOvPrint[mid];
      return printTeamNum[p.memberId]||printTeamNum[Number(p.memberId)]||printTeamNum[String(p.memberId)]||p._orgNum||null;
    };
  };
  const renderSlPrintAll=()=>{
    if(!slPrintAll) return null;
    const allSessions=getSlPrintSessions();
    const tName=selectedT?.name||"";

    // ── 1단계: 종목 선택 모달 ──
    if(!slPrintAllReady){
      const availSessions=allSessions.filter(s=>{const sk=s.evCode+"_"+s.relay;return startLists[sk]&&startLists[sk].length>0;});
      const unavailSessions=allSessions.filter(s=>{const sk=s.evCode+"_"+s.relay;return !startLists[sk]||startLists[sk].length===0;});
      const toggleSel=(sk)=>setSlPrintAllSel(p=>{const n=new Set(p);if(n.has(sk))n.delete(sk);else n.add(sk);return n;});
      const selectAll=()=>setSlPrintAllSel(new Set(availSessions.map(s=>s.evCode+"_"+s.relay)));
      const selectNone=()=>setSlPrintAllSel(new Set());
      return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={closeSlPrintAll}>
        <div style={{background:"#1e293b",border:"1px solid #475569",borderRadius:12,padding:24,minWidth:420,maxWidth:560,maxHeight:"80vh",overflow:"auto",boxShadow:"0 8px 32px rgba(0,0,0,.5)"}} onClick={e=>e.stopPropagation()}>
          <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:16}}>📋 스타트리스트 인쇄 — 종목 선택</div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <button onClick={selectAll} style={{padding:"4px 12px",borderRadius:5,border:"1px solid #475569",background:"transparent",color:"#94a3b8",fontSize:11,cursor:"pointer"}}>전체 선택</button>
            <button onClick={selectNone} style={{padding:"4px 12px",borderRadius:5,border:"1px solid #475569",background:"transparent",color:"#94a3b8",fontSize:11,cursor:"pointer"}}>전체 해제</button>
            <span style={{flex:1}}/>
            <span style={{fontSize:12,color:"#94a3b8"}}>{slPrintAllSel.size}/{availSessions.length}개 선택</span>
          </div>
          {availSessions.length===0?<div style={{padding:20,textAlign:"center",color:"#666"}}>스타트리스트가 생성된 종목이 없습니다.</div>
          :<div style={{display:"flex",flexDirection:"column",gap:2}}>
            {allSessions.map(s=>{
              const sk=s.evCode+"_"+s.relay;
              const list=startLists[sk];
              const hasData=list&&list.length>0;
              const checked=slPrintAllSel.has(sk);
              const evObj=events.find(e=>e.code===s.evCode);
              const evName=evObj?.name||s.evCode;
              const cnt=hasData?list.filter(p=>!p.absent).length:0;
              return <label key={sk} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:6,cursor:hasData?"pointer":"default",
                background:checked?"#334155":"transparent",opacity:hasData?1:0.4,border:"1px solid "+(checked?"#6366f1":"transparent")}}>
                <input type="checkbox" checked={checked} disabled={!hasData} onChange={()=>toggleSel(sk)}
                  style={{accentColor:"#6366f1",width:15,height:15,cursor:hasData?"pointer":"default"}}/>
                <span style={{fontSize:12,fontWeight:600,color:hasData?"#e2e8f0":"#666",flex:1}}>{evName} {s.relay}조</span>
                {hasData?<span style={{fontSize:10,color:"#94a3b8"}}>{cnt}명</span>
                :<span style={{fontSize:10,color:"#ef4444"}}>데이터 없음</span>}
              </label>;
            })}
          </div>}
          {unavailSessions.length>0&&availSessions.length>0&&<div style={{marginTop:8,fontSize:10,color:"#666",fontStyle:"italic"}}>
            * 스타트리스트가 생성되지 않은 종목은 선택할 수 없습니다
          </div>}
          <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end"}}>
            <button onClick={closeSlPrintAll} style={{padding:"8px 20px",borderRadius:6,border:"1px solid #475569",background:"transparent",color:"#94a3b8",fontSize:12,cursor:"pointer"}}>취소</button>
            <button onClick={()=>{if(slPrintAllSel.size===0){flash("인쇄할 종목을 선택하세요","error");return;}setSlPrintAllReady(true);}}
              style={{padding:"8px 24px",borderRadius:6,border:"none",background:"#6366f1",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>인쇄 미리보기 ({slPrintAllSel.size}개)</button>
          </div>
        </div>
      </div>;
    }

    // ── 2단계: 인쇄 뷰 ──
    const thSt2={border:"1px solid #333",padding:"5px 6px",background:"#e8e8e8",fontWeight:700,fontSize:"11pt",textAlign:"center"};

    sessionList.forEach(sess=>{

      const list=startLists[sk];if(!list)return;
      const evObj=events.find(e=>e.code===sess.evCode);
      const evName=evObj?.name||sess.evCode;
      const getTeamNum=buildTeamNumMap(sess.evCode);
      let dayNum=sess.dayNum,time=null;
      schedData.forEach(d=>{d.rows.forEach(r=>{if(r.type==="prelim"&&r.event_code===sess.evCode){
        if(is25MEv(sess.evCode)){dayNum=d.day;if(r.time&&!time)time=r.time;}
        else if(String(r.relay||"1")===String(sess.relay)){dayNum=d.day;if(r.time)time=r.time;}

      const active=list.filter(p=>!p.absent);

      let seq=0;
      active.forEach(p=>{
        seq++;
        const tn=getTeamNum(p);
        rows.push([evName,sess.relay,seq,p.lane||"-",p.name,p.subOrg||"-",tn!=null?"단체"+tn:"",p.remark||""]);
      });
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    // 열 너비 설정
    ws["!cols"]=[{wch:30},{wch:5},{wch:5},{wch:6},{wch:12},{wch:16},{wch:8},{wch:12}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"스타트리스트");
    XLSX.writeFile(wb,tName+"_스타트리스트.xlsx");
    flash("엑셀 파일이 다운로드되었습니다");
  };

  // ─── 대회 상세 ───
  return (<>
    {renderPrintPreview()}
    {renderSchedPrint()}
    {renderSlPrint()}
    {renderSlPrintAll()}
    {/* 스프레드시트 뷰: 새 창으로 열림 (openSlSpreadWindow) */}
    {/* 불참 사유 입력 모달 */}
    {absentModal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setAbsentModal(null)}>
      <div style={{background:"#1e293b",border:"1px solid #475569",borderRadius:10,padding:24,minWidth:340,maxWidth:400,boxShadow:"0 8px 32px rgba(0,0,0,.5)"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:15,fontWeight:700,color:"#ef4444",marginBottom:16}}>🚫 불참 처리</div>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:4}}>선수</div>
        <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0",marginBottom:12}}>{absentModal.name} <span style={{fontSize:11,color:"#64748b"}}>({absentModal.evCode})</span></div>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:4}}>불참 사유 <span style={{color:"#ef4444"}}>*</span></div>
        <textarea value={absentReason} onChange={e=>setAbsentReason(e.target.value)} placeholder="사유를 입력하세요 (필수)"
          style={{width:"100%",padding:10,borderRadius:6,border:"1px solid #475569",background:"#0f172a",color:"#e2e8f0",fontSize:13,resize:"vertical",minHeight:60,boxSizing:"border-box"}}
          autoFocus onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();confirmAbsent();}}}/>
        <div style={{display:"flex",gap:8,marginTop:16,justifyContent:"flex-end"}}>
          <button onClick={()=>setAbsentModal(null)} style={{padding:"6px 16px",borderRadius:6,border:"1px solid #475569",background:"transparent",color:"#94a3b8",fontSize:12,cursor:"pointer"}}>취소</button>
