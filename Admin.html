                  </button>
                  {events.length>0&&<button onClick={saveEvPreset} style={{display:"block",width:"100%",textAlign:"left",padding:"9px 14px",background:"transparent",border:"none",color:"#e2e8f0",fontSize:11,cursor:"pointer",lineHeight:1.4}}
                    onMouseEnter={e=>e.target.style.background="#334155"} onMouseLeave={e=>e.target.style.background="transparent"}>
                    💾 현재 종목({events.length}개) 프리셋으로 저장
                  </button>}
                </div>
              </div></>}
            </div>
            <button style={S.btn(C.gold,C.bg)} onClick={()=>{setEditEv("new");setEditEvVal({code:"",name:"",category:"소총",type:"individual",gender:"혼",team_size:1,sort_order:events.length+1,result_format:"rifle"});}}>+ 종목 추가</button></>}
          {detailTab==="evp"&&<div style={{fontSize:12,color:C.dim}}>사대배정 기반 세션(종목×조)별 현황 · 스타트리스트</div>}
          {detailTab==="results"&&<div style={{fontSize:12,color:C.dim}}>종목별 본선 · 결선 · 단체전 경기 결과</div>}
          {detailTab==="lanes"&&<><div style={{fontSize:12,color:C.dim}}>세부종목별 사대 배정 · 조 자동 생성 → 시간표 연동</div>
            <div style={{flex:1}}/><button style={S.btn(C.gold,C.bg)} onClick={saveLanes}>💾 저장</button></>}
          {detailTab==="schedule"&&<><div style={{fontSize:12,color:C.dim}}>사대배정 기반 자동 시간표 · 조별 공식훈련(PET) 생성</div>
            <div style={{flex:1}}/><button style={S.btn(C.gold,C.bg)} onClick={saveSched}>💾 저장</button><button style={{...S.btn("#22c55e","#fff"),marginLeft:6}} onClick={publishSched}>📤 게시</button><button style={{...S.btn("#334155","#e8dcc8"),marginLeft:6}} onClick={()=>setSchedPrint(true)}>🖨 인쇄</button></>}
        </div>
        <div style={{flex:1,overflow:"auto",padding:24,animation:"fadeIn .2s"}}>
          {/* 참가신청 */}
          {detailTab==="apps"&&(()=>{
            return <div>
              <div style={{display:"flex",gap:6,marginBottom:12,alignItems:"center"}}>
                <button style={{...S.btn(C.gold,C.bg),fontSize:11,padding:"5px 12px"}} onClick={genTestApp}>🧪 테스트 참가신청 생성 (1개 단체)</button>
                <span style={{fontSize:11,color:C.dim}}>미사용 시도에서 랜덤 단체 생성 → DB 직접 저장</span>
              </div>
              {apps.length===0?<div style={{textAlign:"center",padding:60,color:C.dimmer}}><div style={{fontSize:40,marginBottom:12}}>📭</div>접수된 신청이 없습니다</div>:(
            <div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                {["ID","지역","단체명","상태","신청일","관리"].map(h=><th key={h} style={S.th}>{h}</th>)}
              </tr></thead><tbody>
                {apps.map((a,i)=><tr key={a.id} style={{background:i%2===0?"transparent":"#0d152044"}}>
                  <td style={S.td}>{a.id}</td><td style={S.td}>{a.region_name}</td><td style={S.td}>{a.org_name}</td>
                  <td style={S.td}><span style={S.badge(APP_STATUS_COLORS[a.status]||C.dim)}>{APP_STATUS_LABELS[a.status]||a.status}</span></td>
                  <td style={S.td}>{a.submitted_at?new Date(a.submitted_at).toLocaleDateString("ko"):"-"}</td>
                  <td style={{...S.td,whiteSpace:"nowrap"}}>
                    <button style={S.sm(C.blue)} onClick={()=>openAppDetail(a)}>상세</button>
                    {a.status==="pending"&&<button style={S.sm(C.green)} onClick={()=>changeStatus(a.id,"approved")}>승인</button>}
                    {a.status==="pending"&&<button style={S.sm(C.red)} onClick={()=>changeStatus(a.id,"rejected")}>반려</button>}
                    {a.status!=="pending"&&<button style={S.sm(C.gold)} onClick={()=>changeStatus(a.id,"pending")}>대기</button>}
                    <button style={S.sm(C.red)} onClick={()=>deleteApp(a.id)}>삭제</button>
                  </td>
                </tr>)}
              </tbody></table>
            </div>
          )}
            </div>;
          })()}
          {/* 종목 */}
          {detailTab==="events"&&<div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border}}>
            {events.length===0?<div style={{textAlign:"center",padding:"48px 24px",color:C.dimmer}}>
              <div style={{fontSize:36,marginBottom:12}}>🎯</div>
              <div style={{fontSize:14,marginBottom:8,color:C.dim}}>등록된 종목이 없습니다</div>
              <div style={{fontSize:12,color:C.dimmer}}>상단의 <b>📦 프리셋</b> 버튼으로 종목을 일괄 불러오거나, <b>+ 종목 추가</b>로 개별 등록하세요</div>
            </div>:<table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
              {["코드","종목명","카테고리","유형","성별","관리"].map(h=><th key={h} style={S.th}>{h}</th>)}
            </tr></thead><tbody>
              {events.map((ev,i)=><tr key={ev.id} style={{background:i%2===0?"transparent":"#0d152044"}}>
                <td style={{...S.td,fontWeight:600,color:C.gold}}>{ev.code}</td>
                <td style={S.td}>{ev.name}</td><td style={S.td}>{ev.category}</td>
                <td style={S.td}><span style={S.badge(ev.type==="individual"?C.blue:C.gold)}>{ev.type==="individual"?"개인전":"혼성팀"}</span></td>
                <td style={S.td}><span style={S.badge(ev.gender==="남"?"#3388cc":ev.gender==="여"?"#cc5577":C.gold)}>{ev.gender==="남"?"남성":ev.gender==="여"?"여성":"혼성"}</span></td>
                <td style={{...S.td,whiteSpace:"nowrap"}}>
                  <button style={S.sm(C.blue)} onClick={()=>{setEditEv(ev);setEditEvVal({...ev});}}>수정</button>
                  <button style={S.sm(C.red)} onClick={()=>deleteEvent(ev.id)}>삭제</button>
                </td>
              </tr>)}
            </tbody></table>}
          </div>}
          {/* 종목별 현황 */}
          {detailTab==="evp"&&(()=>{
            if(!evPData) setEvPData({allMembers:[],allEntries:[],allTeamEntries:[],appMap:{}});
            const ep=evPData||{allMembers:[],allEntries:[],allTeamEntries:[],appMap:{}};
            const{allMembers,allEntries,allTeamEntries,appMap}=ep;
            const memberMap={}; allMembers.forEach(m=>{memberMap[m.id]=m;});
            const memberAppMap={}; allMembers.forEach(m=>{memberAppMap[m.id]=appMap[m.application_id];});
            const evCountMap={}; allEntries.forEach(e=>{evCountMap[e.event_code]=(evCountMap[e.event_code]||0)+1;});

            // ── 세션 추출 (사대배정 기반) ──
            const sessions=[];
            Object.keys(laneAssign).forEach(dayKey=>{
              const da=laneAssign[dayKey]||{};
              Object.keys(da).forEach(k=>{
                const a=da[k],p=evKeyParse(k);
                if(a&&a.lanes&&a.lanes.length>0){
                  const sessionKey=p.evCode+"_"+a.relay;
                  if(!sessions.find(s=>s.key===sessionKey)){
                    const ev=events.find(e=>e.code===p.evCode);
                    sessions.push({key:sessionKey,evCode:p.evCode,relay:a.relay,laneDay:Number(dayKey),laneCount:a.lanes.length,evName:ev?.name||p.evCode,category:evToCategory(p.evCode)});
                  }
                }
              });
            });
            sessions.sort((a,b)=>a.evCode.localeCompare(b.evCode)||(a.relay-b.relay));

            // ── 현재 선택된 세션 ──
            const selSession=selectedEvCode?sessions.find(s=>s.key===selectedEvCode):null;
            const selEvCode=selSession?.evCode||null;
            const selRelay=selSession?.relay||1;

            // ── 해당 종목 참가자 ──
            const entries=selEvCode?allEntries.filter(e=>e.event_code===selEvCode):[];
            const participants=entries.map(e=>{
              const m=memberMap[e.member_id]; const app=memberAppMap[e.member_id];
              return m?{memberId:m.id,name:m.name,subOrg:m.sub_org,orgName:app?.org_name||"-",regionName:app?.region_name||"-"}:null;
            }).filter(Boolean);
            const regionOrder=["서울","부산","대구","인천","광주","대전","울산","세종","경기","강원","충북","충남","전북","전남","경북","경남","제주"];
            const sorted=[...participants].sort((a,b)=>{const ai=regionOrder.indexOf(a.regionName),bi=regionOrder.indexOf(b.regionName);return (ai===-1?99:ai)-(bi===-1?99:bi);});
            const orgOrder=[]; sorted.forEach(p=>{if(!orgOrder.includes(p.orgName))orgOrder.push(p.orgName);});
            const orgNumMap={}; orgOrder.forEach((org,i)=>{orgNumMap[org]=i+1;});

            // ── 같은 종목의 모든 세션 (릴레이 순) ──
            const sibSessions=selEvCode?sessions.filter(s=>s.evCode===selEvCode).sort((a,b)=>a.relay-b.relay):[];
            const curStartList=selectedEvCode?startLists[selectedEvCode]||null:null;

            // ── 사대 정보 조회 (선택된 세션의 릴레이) ──
            const getSessionLanes=(sKey)=>{
              const s=sessions.find(x=>x.key===sKey);if(!s) return [];
              const lanes=[];
              Object.keys(laneAssign).forEach(dayKey=>{
                const da=laneAssign[dayKey]||{};
                Object.keys(da).forEach(k=>{
                  const a=da[k],p=evKeyParse(k);
                  if(p.evCode===s.evCode&&a&&a.relay===s.relay&&a.lanes) a.lanes.forEach(ln=>lanes.push(ln));
                });
              });
              return lanes.sort((a,b)=>a-b);
            };

            // ── 종목 날짜/시간 조회 ──
            const getEvSchedInfo=(evCode)=>{
              let dayNum=null, time=null;
              schedData.forEach(d=>{d.rows.forEach(r=>{if(r.type==="prelim"&&r.event_code===evCode){dayNum=d.day;if(r.time)time=r.time;}});});
              const startDate=selectedT?.start_date;
              let dateStr="X월 X일";
              if(dayNum&&startDate){const dt=new Date(startDate);dt.setDate(dt.getDate()+dayNum-1);dateStr=(dt.getMonth()+1)+"월 "+dt.getDate()+"일";}
              return {dayNum, dateStr, time:time||"00:00-00:00"};
            };

            // ── 세션 단위 스타트리스트 생성 (전체 릴레이 한번에) ──
            const generateSessionStartLists=()=>{
              if(!selEvCode||sibSessions.length===0) return;
              const shuffled=buildStartList(sorted,orgNumMap);
              let offset=0;
              const newSL={...startLists};
              sibSessions.forEach(ss=>{
                const lanes=getSessionLanes(ss.key);
                const count=lanes.length;
                const chunk=shuffled.slice(offset,offset+count);
                newSL[ss.key]=chunk.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));
                offset+=count;
              });
              // 남은 인원 (사대보다 참가자가 많은 경우) → 마지막 세션에 추가
              if(offset<shuffled.length&&sibSessions.length>0){
                const lastKey=sibSessions[sibSessions.length-1].key;
                const remaining=shuffled.slice(offset).map(p=>({...p,lane:null,absent:false,remark:""}));
                newSL[lastKey]=[...newSL[lastKey],...remaining];
              }
              setStartLists(newSL);
              // 생성된 세션을 미저장 상태로 표시
              setSlSavedKeys(prev=>{const next=new Set(prev);sibSessions.forEach(ss=>next.delete(ss.key));return next;});
              flash(selEvCode+" 전체 세션 스타트리스트 생성 완료 ("+shuffled.length+"명 → "+sibSessions.length+"개 세션)");
            };

            // ── 불참 처리 ──
            const toggleAbsent=(idx)=>{
              const updated=[...curStartList];
              updated[idx]={...updated[idx],absent:!updated[idx].absent};
              setStartLists({...startLists,[selectedEvCode]:updated});
              setSlSavedKeys(prev=>{const next=new Set(prev);next.delete(selectedEvCode);return next;});
            };

            // ── 드래그 교환 ──
            const swapRows=(fromIdx,toIdx)=>{
              if(fromIdx===toIdx) return;
              const updated=[...curStartList];
              const fromData={name:updated[fromIdx].name,memberId:updated[fromIdx].memberId,subOrg:updated[fromIdx].subOrg,orgName:updated[fromIdx].orgName,regionName:updated[fromIdx].regionName,remark:updated[fromIdx].remark,absent:updated[fromIdx].absent};
              const toData={name:updated[toIdx].name,memberId:updated[toIdx].memberId,subOrg:updated[toIdx].subOrg,orgName:updated[toIdx].orgName,regionName:updated[toIdx].regionName,remark:updated[toIdx].remark,absent:updated[toIdx].absent};
              updated[fromIdx]={...updated[fromIdx],...toData};
              updated[toIdx]={...updated[toIdx],...fromData};
              setStartLists({...startLists,[selectedEvCode]:updated});
              setSlSavedKeys(prev=>{const next=new Set(prev);next.delete(selectedEvCode);return next;});
              setSlDrag(null);
            };

            // ── 복사/CSV ──
            const copyBtn=(list,label)=>(<button style={{...S.btn(C.blue,"#fff"),fontSize:11,padding:"5px 12px"}} onClick={()=>{
              const evName=selSession?.evName||selectedEvCode;
              const si=getEvSchedInfo(selEvCode);
              const header="#\t사대\t이름\t소속\t단체번호\t비고";
              const active=list.filter(p=>!p.absent);
              const rows=active.map((p,i)=>`${i+1}\t${p.lane||"-"}\t${p.name}\t${p.subOrg||"-"}\t단체${orgNumMap[p.orgName]}\t${p.remark||""}`);
              navigator.clipboard.writeText(evName+" "+selRelay+"조 "+label+" ("+si.dateStr+" "+si.time+")\n"+header+"\n"+rows.join("\n")).then(()=>flash("클립보드에 복사됨"));
            }}>📋 복사</button>);
            const csvBtn=(list,suffix)=>(<button style={{...S.btn(C.green,"#fff"),fontSize:11,padding:"5px 12px"}} onClick={()=>{
              let csv="\uFEFF#,사대,이름,소속,단체번호,비고\n";
              const active=list.filter(p=>!p.absent);
              active.forEach((p,i)=>{csv+=`${i+1},${p.lane||"-"},${p.name},${p.subOrg||"-"},단체${orgNumMap[p.orgName]},${p.remark||""}\n`;});
              const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
              const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${selectedEvCode}_${suffix}.csv`; a.click();
            }}>📥 CSV</button>);

            // ── 참가 리스트 테이블 ──
            const renderListTable=(list)=>(<div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                {["#","이름","소속","단체번호"].map(h=><th key={h} style={S.th}>{h}</th>)}
              </tr></thead><tbody>
                {list.map((p,i)=><tr key={p.memberId+"-"+i} style={{background:i%2===0?"transparent":"#0d152044"}}>
                  <td style={{...S.td,color:C.dim}}>{i+1}</td>
                  <td style={{...S.td,fontWeight:600}}>{p.name}</td>
                  <td style={S.td}>{p.subOrg||"-"}</td>
                  <td style={S.td}><span style={{...S.badge(C.gold),fontWeight:700}}>단체{orgNumMap[p.orgName]}</span></td>
                </tr>)}
              </tbody></table>
            </div>);

            // ── 스타트리스트 테이블 ──
            const renderStartTable=(list)=>{
              let seq=0;
              return <div style={{overflow:"auto",borderRadius:8,border:"1px solid "+C.border}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                  {["#","사대","이름","소속","단체번호","비고",""].map(h=><th key={h} style={S.th}>{h}</th>)}
                </tr></thead><tbody>
                  {list.map((p,i)=>{
                    const isAbsent=p.absent;
                    if(!isAbsent) seq++;
                    const isDragFrom=slDrag&&slDrag.evCode===selectedEvCode&&slDrag.fromIdx===i;
                    return <tr key={p.memberId+"-"+i}
                      draggable={!isAbsent}
                      onDragStart={()=>setSlDrag({evCode:selectedEvCode,fromIdx:i})}
                      onDragOver={e=>{if(slDrag&&slDrag.evCode===selectedEvCode&&!isAbsent)e.preventDefault();}}
                      onDrop={e=>{e.preventDefault();if(slDrag&&slDrag.evCode===selectedEvCode)swapRows(slDrag.fromIdx,i);}}
                      onDragEnd={()=>setSlDrag(null)}
                      style={{background:isAbsent?"#ef444411":isDragFrom?"#3b82f622":i%2===0?"transparent":"#0d152044",
                        opacity:isAbsent?0.5:1,cursor:isAbsent?"default":"grab",transition:"background .1s"}}>
                      <td style={{...S.td,color:isAbsent?"#ef4444":C.dim,textDecoration:isAbsent?"line-through":"none"}}>{isAbsent?"—":seq}</td>
                      <td style={{...S.td,fontWeight:700,color:p.lane?"#ddd":"#555",textAlign:"center"}}>{p.lane||"-"}</td>
                      <td style={{...S.td,fontWeight:600,textDecoration:isAbsent?"line-through":"none"}}>{p.name}</td>
                      <td style={S.td}>{p.subOrg||"-"}</td>
                      <td style={S.td}><span style={{...S.badge(C.gold),fontWeight:700}}>단체{orgNumMap[p.orgName]}</span></td>
                      <td style={S.td}>{p.remark||""}</td>
                      <td style={{...S.td,padding:"2px 4px"}} className="no-print">
                        <button onClick={()=>toggleAbsent(i)} title={isAbsent?"참가 복원":"불참 처리"}
                          style={{fontSize:9,padding:"2px 6px",borderRadius:4,cursor:"pointer",fontWeight:700,border:"1px solid",
                            background:isAbsent?"#10b98122":"#ef444422",color:isAbsent?"#10b981":"#ef4444",
                            borderColor:isAbsent?"#10b981":"#ef4444"}}>
                          {isAbsent?"복원":"불참"}
                        </button>
                      </td>
                    </tr>;
                  })}
                </tbody></table>
              </div>;
            };

            const catClr=(c)=>({"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"}[c]||C.dim);

            // ── 모든 세션 스타트리스트 일괄 생성 ──
            const generateAllStartLists=()=>{
              // 종목별로 그룹핑
              const evCodeSet=new Set(sessions.map(s=>s.evCode));
              const newSL={...startLists};
              let totalPlayers=0, totalSessions=0;
              evCodeSet.forEach(evCode=>{
                const evSessions=sessions.filter(s=>s.evCode===evCode).sort((a,b)=>a.relay-b.relay);
                // 해당 종목 참가자
                const evEntries=allEntries.filter(e=>e.event_code===evCode);
                const evParticipants=evEntries.map(e=>{
                  const m=memberMap[e.member_id]; const app=memberAppMap[e.member_id];
                  return m?{memberId:m.id,name:m.name,subOrg:m.sub_org,orgName:app?.org_name||"-",regionName:app?.region_name||"-"}:null;
                }).filter(Boolean);
                if(evParticipants.length===0) return;
                const evSorted=[...evParticipants].sort((a,b)=>{const ai=regionOrder.indexOf(a.regionName),bi=regionOrder.indexOf(b.regionName);return (ai===-1?99:ai)-(bi===-1?99:bi);});
                const evOrgOrder=[]; evSorted.forEach(p=>{if(!evOrgOrder.includes(p.orgName))evOrgOrder.push(p.orgName);});
                const evOrgNumMap={}; evOrgOrder.forEach((org,i)=>{evOrgNumMap[org]=i+1;});
                const shuffled=buildStartList(evSorted,evOrgNumMap);
                let offset=0;
                evSessions.forEach(ss=>{
                  const lanes=getSessionLanes(ss.key);
                  const count=lanes.length;
                  const chunk=shuffled.slice(offset,offset+count);
                  newSL[ss.key]=chunk.map((p,i)=>({...p,lane:lanes[i]?ss.relay+"-"+lanes[i]:null,absent:false,remark:""}));
                  offset+=count;
                  totalSessions++;
                });
                if(offset<shuffled.length&&evSessions.length>0){
                  const lastKey=evSessions[evSessions.length-1].key;
                  const remaining=shuffled.slice(offset).map(p=>({...p,lane:null,absent:false,remark:""}));
                  newSL[lastKey]=[...newSL[lastKey],...remaining];
                }
                totalPlayers+=shuffled.length;
              });
              setStartLists(newSL);
              setSlSavedKeys(prev=>{const next=new Set(prev);sessions.forEach(s=>next.delete(s.key));return next;});
              flash("전체 스타트리스트 생성 완료: "+totalPlayers+"명 → "+totalSessions+"개 세션");

            // 세션 상태: 0=미생성, 1=생성(미저장), 2=저장완료
            const getSessionStatus=(sKey)=>{

              if(!hasSL) return 0;

            return (<div>

                        evCodeSet.forEach(evCode=>{

                          if(evParts.length===0) return;

                          const oo=[];evS.forEach(p=>{if(!oo.includes(p.orgName))oo.push(p.orgName);});
                          const om={};oo.forEach((o,i)=>{om[o]=i+1;});
                          const sh=buildStartList(evS,om);let off=0;
                          evSessions.forEach(ss=>{const ln=getSessionLanes(ss.key);const c=ln.length;const ch=sh.slice(off,off+c);newSL[ss.key]=ch.map((p,i)=>({...p,lane:ln[i]?ss.relay+"-"+ln[i]:null,absent:false,remark:""}));off+=c;totalS++;});
                          if(off<sh.length&&evSessions.length>0){const lk=evSessions[evSessions.length-1].key;newSL[lk]=[...newSL[lk],...sh.slice(off).map(p=>({...p,lane:null,absent:false,remark:""}))];};totalP+=sh.length;
                        });
                        setStartLists(newSL);

                        const allKeys=new Set(Object.keys(newSL).filter(k=>newSL[k]&&newSL[k].length>0));
                        setSlSavedKeys(allKeys);
                        flash("전체 생성+저장 완료: "+totalP+"명 → "+totalS+"개 세션");

                        return <button key={s.key} onClick={()=>setSelectedEvCode(isSel?null:s.key)} style={{

                        const newMembers=[],newEntries=[];

                          </button>
                          {curStartList&&<>
                            <button style={{...S.btn("#8b5cf6",C.bg),fontSize:11,padding:"5px 12px"}} onClick={()=>setSlPrint(selectedEvCode)}>🖨 인쇄</button>
                            <span style={{fontSize:12,color:C.dim}}>{selSession.evName} {selSession.relay}조 · {curStartList.filter(p=>!p.absent).length}명</span>

                            <button style={{...S.btn(C.gold,C.bg),fontSize:11,padding:"5px 12px"}} onClick={saveStartLists}>💾 저장</button>

                        {sibSessions.length>1&&<div style={{display:"flex",gap:4,marginBottom:10}}>

            const catClr=(c)=>({"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"}[c]||C.dim);

            const isPrelim=resType==="prelim";

            return <div>
            {/* 종목 선택 - 일차별 구분 */}

            const updSched=(fn)=>{const nd=JSON.parse(JSON.stringify(schedData));fn(nd);setSchedData(nd);};

              prev.rows.push(newSchedRow({category:evToCategory(eventCode),content:"공식 훈련 ("+eventCode+" "+relay+"조)",event_code:eventCode,type:"pet",relay:String(relay)}));
            };
            const removePETAuto=(nd,dayIdx,eventCode,relay)=>{
              if(dayIdx<=0) return;
              nd[dayIdx-1].rows=nd[dayIdx-1].rows.filter(r=>!(r.event_code===eventCode&&r.type==="pet"&&r.relay==String(relay)));
            };
            const assignSlot=(dayIdx,rowIdx,slotKey)=>updSched(nd=>{
              const[evCode,relayStr]=slotKey.split("_");
              const relay=relayStr||"1";
              // 같은 종목의 다른 조가 다른 일차에 있는지 확인
              let otherDayIdx=null;
              nd.forEach((d,di)=>{if(di!==dayIdx) d.rows.forEach(r=>{if(r.event_code===evCode&&r.type==="prelim"){otherDayIdx=di;}});});

              const row=nd[dayIdx].rows[rowIdx];
              if(row.event_code&&row.type==="prelim") removePETAuto(nd,dayIdx,row.event_code,row.relay||"1");
              const ev=events.find(e=>e.code===evCode);
              row.event_code=evCode;row.type="prelim";row.relay=relay;
              row.category=evToCategory(evCode);row.content=(ev?ev.name:"")+" "+relay+"조";
              addPETAuto(nd,dayIdx,evCode,relay);
            });
            const clearEv=(dayIdx,rowIdx)=>updSched(nd=>{
              const row=nd[dayIdx].rows[rowIdx];
              if(row.event_code&&row.type==="prelim") removePETAuto(nd,dayIdx,row.event_code,row.relay||"1");
              row.event_code="";row.type="custom";row.content="";row.category="";row.relay="";
            });
            const catClr=(c)=>({"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981","산탄총":"#f59e0b"}[c]||C.dim);
            const evClr=(code)=>catClr(evToCategory(code));
            // 구분 rowSpan 계산
            const calcSpans=(rows)=>{
              const spans=new Array(rows.length).fill(1);const sk=new Set();

                let cnt=1;
                while(i+cnt<rows.length&&rows[i+cnt].category===rows[i].category){sk.add(i+cnt);cnt++;}
                spans[i]=cnt;

              return {spans,sk};

              const d=v.replace(/[^0-9]/g,"");
              if(d.length<=2) return d;
              if(d.length<=4) return d.slice(0,2)+":"+d.slice(2);
              if(d.length<=6) return d.slice(0,2)+":"+d.slice(2,4)+"-"+d.slice(4);
              return d.slice(0,2)+":"+d.slice(2,4)+"-"+d.slice(4,6)+":"+d.slice(6,8);
            };
            const cSt={padding:"10px 6px",borderBottom:"1px solid "+C.border,fontSize:12,verticalAlign:"middle"};
            const iSt={background:"transparent",border:"1px solid "+C.border,borderRadius:4,color:"#fff",fontSize:11,padding:"6px 5px",width:"100%",boxSizing:"border-box"};

            // 사대배정에서 종목+조 슬롯 자동 생성
            const laneSlots=[];

              const da=laneAssign[dayKey];

            const readySlots=laneSlots.filter(slot=>!!startLists[slot.key]&&startLists[slot.key].length>0);

            const assignedSlots=new Set();
            schedData.forEach(d=>d.rows.forEach(r=>{if(r.event_code&&r.type==="prelim"&&r.relay)assignedSlots.add(r.event_code+"_"+r.relay);}));
            // 같은 종목의 모든 조를 동일 일차에 배치해야 하는 제약 확인
            const evDayMap={}; // evCode → 배치된 dayIdx
            schedData.forEach((d,di)=>d.rows.forEach(r=>{if(r.event_code&&r.type==="prelim"){evDayMap[r.event_code]=di;}}));

                            </td>

                            <td style={cSt}>{!isPET&&(row.event_code?(
                              <span style={{fontSize:11,color:"#ddd",display:"block",textAlign:"center"}}>{evCountMap[row.event_code]?evCountMap[row.event_code]+"명":"-"}</span>
                            ):(
                              <input value={row.count} onChange={e=>updateRow(dayIdx,ri,"count",e.target.value)} placeholder="" style={{...iSt,width:44,textAlign:"center"}}/>

                                  style={{fontSize:11,background:"none",border:"none",color:"#555",cursor:"pointer",padding:"6px",lineHeight:1,touchAction:"manipulation"}}
                                  onMouseEnter={e=>e.currentTarget.style.color="#ef4444"} onMouseLeave={e=>e.currentTarget.style.color="#555"}>✕</button>
                                <span draggable onDragStart={e=>{setSchedRowDrag({dayIdx,rowIdx:ri});e.dataTransfer.effectAllowed="move";
                                    try{e.dataTransfer.setDragImage(e.currentTarget.closest("tr"),0,0);}catch(ex){}}}
                                  onDragEnd={()=>{setSchedRowDrag(null);setSchedRowOver(null);}}

                                  onMouseEnter={e=>e.currentTarget.style.color=C.gold} onMouseLeave={e=>e.currentTarget.style.color=C.dim}

                        {/* 팔레트 드래그 드롭 + 행 추가 */}
                        <tr style={{
                            boxShadow:schedRowDrag&&schedRowOver&&schedRowOver.dayIdx===dayIdx&&schedRowOver.rowIdx>=day.rows.length
                              ?"inset 0 3px 0 "+C.gold+", 0 -2px 6px "+C.gold+"44":"none"}}
                          onDragOver={e=>{
                            if(schedRowDrag){e.preventDefault();e.dataTransfer.dropEffect="move";
                              if(!schedRowOver||schedRowOver.dayIdx!==dayIdx||schedRowOver.rowIdx!==day.rows.length)

                            if(schedRowDrag){dropRow(schedRowDrag.dayIdx,schedRowDrag.rowIdx,dayIdx,day.rows.length);}
                            if(schedDrag){
                              const[evCode,relayStr]=schedDrag.split("_");const relay=relayStr||"1";
                              let conflict=false;
                              schedData.forEach((d,di)=>{if(di!==dayIdx) d.rows.forEach(r=>{if(r.event_code===evCode&&r.type==="prelim") conflict=true;});});
                              if(conflict){flash(evCode+" "+relay+"조: 같은 종목의 모든 조는 동일 일차에 배치해야 합니다","error");setSchedDrag(null);return;}
                              updSched(nd=>{const ev=events.find(x=>x.code===evCode);
                                nd[dayIdx].rows.push(newSchedRow({event_code:evCode,type:"prelim",relay:relay,category:evToCategory(evCode),content:(ev?ev.name:"")+" "+relay+"조"}));
                                addPETAuto(nd,dayIdx,evCode,relay);});setSchedDrag(null);
                          }}}>
                          <td colSpan={7} style={{padding:4,textAlign:"center"}}>
                            <button style={{fontSize:10,color:C.dim,background:"none",border:"1px dashed "+C.border,borderRadius:6,padding:"3px 12px",cursor:"pointer",width:"100%"}}
                              onClick={()=>addRow(dayIdx)}>+ 행 추가</button>

          })()}

          {/* 사대 배정 */}
          {detailTab==="lanes"&&(()=>{
            const RANGES=["10M","25M","50M"];
            const rangeEvents=events.filter(e=>{const c=evToCategory(e.code);return RANGES.includes(c);}).sort((a,b)=>a.sort_order-b.sort_order);
            const evCountMap={};
            if(evPData&&evPData.allEntries) evPData.allEntries.forEach(e=>{evCountMap[e.event_code]=(evCountMap[e.event_code]||0)+1;});
            const rangeClr={"10M":"#3b82f6","25M":"#8b5cf6","50M":"#10b981"};
            const evColors=["#3b82f6","#ef4444","#10b981","#f59e0b","#8b5cf6","#ec4899","#06b6d4","#84cc16","#f97316","#6366f1","#14b8a6","#e11d48","#a855f7","#0ea5e9","#d946ef","#eab308","#22d3ee","#4ade80","#fb923c","#818cf8"];
            const getEvColor=(code)=>{const idx=rangeEvents.findIndex(e=>e.code===code);return evColors[idx%evColors.length];};

            const dayAssign=laneAssign[laneDay]||{};
            const broken=new Set(laneBroken[laneRange]||[]);
            const curAssigned=Object.keys(dayAssign).filter(k=>{
              const a=dayAssign[k],p=evKeyParse(k);
              return a&&evToCategory(p.evCode)===laneRange&&a.relay===laneRelay;
            }).map(k=>{const p=evKeyParse(k);const ev=events.find(e=>e.code===p.evCode);return ev?{...ev,_key:k}:null;}).filter(Boolean);

            const laneOwner=(n)=>{
              if(broken.has(n)) return "__broken__";
              for(const k of Object.keys(dayAssign)){
                const a=dayAssign[k],p=evKeyParse(k);
                if(a&&evToCategory(p.evCode)===laneRange&&a.relay===laneRelay&&a.lanes.includes(n)) return p.evCode;
              }
              return null;
            };
            const removeLaneFrom=(da,n)=>{
              for(const k of Object.keys(da)){
                if(da[k]&&da[k].lanes&&da[k].lanes.includes(n)){
                  da[k]={...da[k],lanes:da[k].lanes.filter(x=>x!==n)};
                }
              }
            };
            const setDayAssign=(newDa)=>{setLaneAssign(p=>({...p,[laneDay]:newDa}));};

            // 종목별 전체 배정 사대 수 (모든 일차·모든 조)
            const getTotalAssigned=(evCode)=>{
              let total=0;
              Object.keys(laneAssign).forEach(dayKey=>{
                const da=laneAssign[dayKey]||{};
                Object.keys(da).forEach(k=>{
                  const p=evKeyParse(k),a=da[k];
                  if(p.evCode===evCode&&a&&a.lanes) total+=a.lanes.length;
                });
              });
              return total;
            };

            const toggleLane=(n)=>{
              if(laneMarkBroken){
                const owner=laneOwner(n);
                const nb={...laneBroken};const set=new Set(nb[laneRange]||[]);
                if(owner==="__broken__"){set.delete(n);}
                else{
                  if(owner){const da={...dayAssign};removeLaneFrom(da,n);setDayAssign(da);}
                  set.add(n);
                }
                nb[laneRange]=[...set].sort((a,b)=>a-b);setLaneBroken(nb);
                return;
              }
              if(!laneSelEv) return;
              const owner=laneOwner(n);
              if(owner===laneSelEv) return;
              // 인원 초과 체크
              const maxCnt=evCountMap[laneSelEv]||0;
              if(maxCnt>0&&getTotalAssigned(laneSelEv)>=maxCnt){flash(laneSelEv+" 참가 인원("+maxCnt+"명)만큼 이미 배정 완료","error");return;}
              const da={...dayAssign};
              const ek=evKeyMake(laneSelEv,laneRelay);
              if(!da[ek]) da[ek]={relay:laneRelay,lanes:[]};
              if(owner==="__broken__"){const nb={...laneBroken};nb[laneRange]=(nb[laneRange]||[]).filter(x=>x!==n);setLaneBroken(nb);}
              if(owner&&owner!=="__broken__") removeLaneFrom(da,n);
              da[ek]={relay:laneRelay,lanes:[...da[ek].lanes,n].sort((a,b)=>a-b)};
              setDayAssign(da);
            };
            const clearLane=(n)=>{
              const da={...dayAssign};removeLaneFrom(da,n);setDayAssign(da);
            };
            const commitClearDrag=()=>{
              if(!laneClearDrag||laneClearDrag.start===null||laneClearDrag.hover===null){setLaneClearDrag(null);return;}
              const lo=Math.min(laneClearDrag.start,laneClearDrag.hover),hi=Math.max(laneClearDrag.start,laneClearDrag.hover);
              const da={...dayAssign};
              for(let n=lo;n<=hi;n++){removeLaneFrom(da,n);}
              setDayAssign(da);setLaneClearDrag(null);
            };
            const commitDrag=()=>{
              if(laneDragStart===null||laneDragHover===null){setLaneDragStart(null);setLaneDragHover(null);return;}
              const lo=Math.min(laneDragStart,laneDragHover),hi=Math.max(laneDragStart,laneDragHover);
              if(laneMarkBroken){
                const nb={...laneBroken};const set=new Set(nb[laneRange]||[]);
                const da={...dayAssign};
                for(let n=lo;n<=hi;n++){const o=laneOwner(n);if(o&&o!=="__broken__")removeLaneFrom(da,n);set.add(n);}
                nb[laneRange]=[...set].sort((a,b)=>a-b);setLaneBroken(nb);setDayAssign(da);
                setLaneDragStart(null);setLaneDragHover(null);return;
              }
              if(!laneSelEv){setLaneDragStart(null);setLaneDragHover(null);return;}
              const da={...dayAssign};
              const ek=evKeyMake(laneSelEv,laneRelay);
              if(!da[ek]) da[ek]={relay:laneRelay,lanes:[]};
              const cur=new Set(da[ek].lanes||[]);
              const nb={...laneBroken};const bSet=new Set(nb[laneRange]||[]);
              // 인원 제한: 이 ek 제외한 다른 곳에 이미 배정된 수
              const maxCnt=evCountMap[laneSelEv]||0;
              let otherAssigned=0;
              if(maxCnt>0){
                Object.keys(laneAssign).forEach(dayKey=>{
                  const dd=Number(dayKey)===laneDay?da:(laneAssign[dayKey]||{});
                  Object.keys(dd).forEach(k=>{
                    const p=evKeyParse(k),a=dd[k];
                    if(p.evCode===laneSelEv&&k!==ek&&a&&a.lanes) otherAssigned+=a.lanes.length;
                  });
                });
              }
              const remaining=maxCnt>0?maxCnt-otherAssigned:Infinity;
              for(let n=lo;n<=hi;n++){
                if(maxCnt>0&&cur.size>=remaining) break; // 인원 초과 시 중단
                const o=laneOwner(n);
                if(o==="__broken__") bSet.delete(n);
                if(o&&o!=="__broken__"&&o!==laneSelEv) removeLaneFrom(da,n);
                if(o!==laneSelEv) cur.add(n);
              }
              da[ek]={relay:laneRelay,lanes:[...cur].sort((a,b)=>a-b)};
              nb[laneRange]=[...bSet].sort((a,b)=>a-b);
              setDayAssign(da);setLaneBroken(nb);setLaneDragStart(null);setLaneDragHover(null);
              if(maxCnt>0&&cur.size>=remaining) flash(laneSelEv+" "+maxCnt+"명 배정 완료 (인원 도달)");
            };
            const selectEv=(code)=>{
              if(laneSelEv===code){setLaneSelEv(null);setLaneMarkBroken(false);return;}
              setLaneSelEv(code);setLaneMarkBroken(false);
            };
            const autoAssign=(evCode)=>{
              const cnt=evCountMap[evCode]||0;if(!cnt) return;
              const maxLane=laneConfig[laneRange];
              const brokenSet=new Set(laneBroken[laneRange]||[]);
              // 이 종목 기존 배정 모두 제거
              const da={};
              Object.keys(dayAssign).forEach(k=>{
                const p=evKeyParse(k);
                if(p.evCode!==evCode) da[k]=dayAssign[k];
              });
              let remaining=cnt, relay=1;
              while(remaining>0&&relay<=10){
                const usedByOthers=new Set(brokenSet);
                Object.keys(da).forEach(k=>{
                  const a=da[k],p=evKeyParse(k);
                  if(a&&evToCategory(p.evCode)===laneRange&&a.relay===relay)(a.lanes||[]).forEach(n=>usedByOthers.add(n));
                });
                const avail=[];
                for(let i=1;i<=maxLane;i++){if(!usedByOthers.has(i))avail.push(i);}
                if(avail.length===0){relay++;continue;}
                const take=avail.slice(0,remaining);
                da[evKeyMake(evCode,relay)]={relay,lanes:take};
                remaining-=take.length;
                relay++;
              }
              setLaneAssign(p=>({...p,[laneDay]:da}));
              const nRelays=relay-1;
              if(nRelays>1) flash(evCode+" 자동 배정: "+cnt+"명 → "+nRelays+"개 조");
              else flash(evCode+" 자동 배정: "+cnt+"명");
              setLaneSelEv(evCode);
            };
            const clearRange=()=>{
              if(!confirm(laneDay+"일차 "+laneRange+" "+laneRelay+"조 초기화?")) return;
              const da={...dayAssign};
              curAssigned.forEach(ev=>{delete da[ev._key];});
              setDayAssign(da);
            };
            const isInDragRange=(n)=>{
              if(laneDragStart===null||laneDragHover===null) return false;
              return n>=Math.min(laneDragStart,laneDragHover)&&n<=Math.max(laneDragStart,laneDragHover);
            };
            const isInClearRange=(n)=>{
              if(!laneClearDrag||laneClearDrag.start===null||laneClearDrag.hover===null) return false;
              return n>=Math.min(laneClearDrag.start,laneClearDrag.hover)&&n<=Math.max(laneClearDrag.start,laneClearDrag.hover);
            };
            const fmtRanges=(lanes)=>{
              if(!lanes||!lanes.length) return "";
              const ranges=[];let rs=lanes[0],re=lanes[0];
              for(let i=1;i<lanes.length;i++){if(lanes[i]===re+1){re=lanes[i];}else{ranges.push(rs===re?""+rs:rs+"-"+re);rs=lanes[i];re=lanes[i];}}
              ranges.push(rs===re?""+rs:rs+"-"+re);return ranges.join(", ");
            };
            const usedRelays=new Set();
            Object.keys(dayAssign).forEach(k=>{const a=dayAssign[k];if(a&&a.relay)usedRelays.add(a.relay);});
            const maxRelay=Math.max(laneRelay,...usedRelays,1);
            // 종목별 전체 릴레이 배정 합산
            const evTotalAssigned={};
            Object.keys(dayAssign).forEach(k=>{
              const p=evKeyParse(k),a=dayAssign[k];
              if(a&&a.lanes){evTotalAssigned[p.evCode]=(evTotalAssigned[p.evCode]||0)+a.lanes.length;}
            });
            const curDayEvts=(()=>{
              return rangeEvents.filter(e=>evToCategory(e.code)===laneRange);
            })();

            return <div>
              {/* 상단 컨트롤 - 스크롤 시 고정 */}
              <div style={{position:"sticky",top:-24,zIndex:20,background:C.bg,marginLeft:-24,marginRight:-24,marginTop:-24,padding:"24px 24px 0",borderBottom:"1px solid "+C.border+"44"}}>
              {/* 사격장 설정 */}
              <div style={{display:"flex",gap:12,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:13,fontWeight:700,color:"#ddd"}}>사격장 사대 수:</span>
                {RANGES.map(r=>(
                  <div key={r} style={{display:"flex",alignItems:"center",gap:4}}>
                    <span style={{fontSize:12,fontWeight:700,color:rangeClr[r]}}>{r}</span>
                    <input type="number" min={1} max={100} value={laneConfig[r]}
                      onChange={e=>{const v=parseInt(e.target.value)||1;setLaneConfig(p=>({...p,[r]:Math.max(1,Math.min(100,v))}));}}
                      style={{width:48,background:C.card,border:"1px solid "+C.border,borderRadius:4,color:"#fff",fontSize:12,padding:"3px 6px",textAlign:"center"}}/>
                  </div>
                ))}
              </div>
              {/* 일차 + 사격장 + 조 */}
              <div style={{display:"flex",gap:4,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontSize:12,fontWeight:700,color:C.dim,marginRight:2}}>일차:</span>
                {schedData.map(d=>(
                  <button key={d.day} onClick={()=>{setLaneDay(d.day);setLaneSelEv(null);setLaneMarkBroken(false);}}
                    style={{padding:"4px 12px",borderRadius:5,fontSize:11,fontWeight:700,cursor:"pointer",
                      border:"2px solid "+(laneDay===d.day?C.gold:C.border),
                      background:laneDay===d.day?C.gold+"22":"transparent",color:laneDay===d.day?C.gold:C.dim}}>
                    {d.day}
                  </button>
                ))}
                <span style={{fontSize:12,fontWeight:700,color:C.dim,marginLeft:10,marginRight:2}}>거리:</span>
                {RANGES.map(r=>(
                  <button key={r} onClick={()=>{setLaneRange(r);setLaneSelEv(null);setLaneMarkBroken(false);}}
                    style={{padding:"4px 12px",borderRadius:5,fontSize:11,fontWeight:700,cursor:"pointer",
                      border:"2px solid "+(laneRange===r?rangeClr[r]:C.border),
                      background:laneRange===r?rangeClr[r]+"22":"transparent",color:laneRange===r?rangeClr[r]:C.dim}}>
                    {r}
                  </button>
                ))}
                <span style={{fontSize:12,fontWeight:700,color:C.dim,marginLeft:10,marginRight:2}}>조:</span>
                {Array.from({length:maxRelay+1},(_,i)=>i+1).map(r=>(
                  <button key={r} onClick={()=>{setLaneRelay(r);}}
                    style={{padding:"4px 10px",borderRadius:5,fontSize:11,fontWeight:700,cursor:"pointer",
                      border:"1px solid "+(laneRelay===r?C.gold:C.border),
                      background:laneRelay===r?C.gold+"22":"transparent",color:laneRelay===r?C.gold:C.dim}}>
                    {r}조
                  </button>
                ))}
              </div>
              {/* 도구 */}
              <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
                <button onClick={()=>{setLaneMarkBroken(!laneMarkBroken);setLaneSelEv(null);}}
                  style={{padding:"4px 10px",borderRadius:5,fontSize:10,fontWeight:700,cursor:"pointer",
                    border:"2px solid "+(laneMarkBroken?"#ef4444":C.border),
                    background:laneMarkBroken?"#ef444422":"transparent",color:laneMarkBroken?"#ef4444":C.dim}}>
                  🔧 고장 표시 {laneMarkBroken?"ON":"OFF"}
                </button>
                <div style={{flex:1}}/>
                <button onClick={clearRange} style={{...S.sm(C.red),fontSize:10}}>🗑 초기화</button>
              </div>
              </div>{/* sticky 끝 */}

              <div style={{display:"flex",gap:16,flexDirection:"row",flexWrap:"nowrap",marginTop:12}}>
                {/* 좌측: 종목 - 스크롤 시 고정 */}
                <div style={{width:230,flexShrink:0,maxHeight:"calc(100vh - 280px)",overflowY:"auto",position:"sticky",top:130,alignSelf:"flex-start"}}>
                  <div style={{fontSize:12,fontWeight:700,color:C.gold,marginBottom:8}}>{laneDay}일차 · {laneRange} · {laneRelay}조</div>
                  {curDayEvts.length===0?(
                    <div style={{padding:"12px 10px",fontSize:11,color:C.dimmer,fontStyle:"italic",border:"1px dashed "+C.border,borderRadius:6,textAlign:"center"}}>해당 거리에 종목이 없습니다</div>
                  ):(
                    <div style={{display:"flex",flexDirection:"column",gap:3}}>
                      {curDayEvts.map(ev=>{
                        const cnt=evCountMap[ev.code]||0;
                        const totalAssigned=evTotalAssigned[ev.code]||0;
                        // 현재 릴레이에서 이 종목 배정 확인
                        const ek=evKeyMake(ev.code,laneRelay);
                        const a=dayAssign[ek];
                        const assigned=a?a.lanes.length:0;
                        const isSel=laneSelEv===ev.code;
                        // 이 종목이 다른 릴레이에 배정되어 있는 경우 표시
                        const evRelays=Object.keys(dayAssign).filter(k=>{const p=evKeyParse(k);return p.evCode===ev.code&&dayAssign[k].lanes.length>0;}).map(k=>dayAssign[k].relay);
                        const nRelays=evRelays.length;
                        return <div key={ev.code}
                          onClick={()=>selectEv(ev.code)}
                          style={{padding:"7px 10px",borderRadius:8,cursor:"pointer",
                            border:"2px solid "+(isSel?getEvColor(ev.code):C.border),
                            background:isSel?getEvColor(ev.code)+"18":C.card,transition:"all .15s"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <span style={{width:8,height:8,borderRadius:4,background:getEvColor(ev.code),flexShrink:0}}/>
                            <span style={{fontSize:12,fontWeight:700,color:getEvColor(ev.code)}}>{ev.code}</span>
                            <span style={{fontSize:9,color:C.dim,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{ev.name.replace(ev.code+" ","")}</span>
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:3}}>
                            <span style={{fontSize:10,color:"#aaa"}}>{cnt}명</span>
                            <span style={{fontSize:10,color:totalAssigned>=cnt&&cnt>0?"#4ade80":totalAssigned>0?"#fbbf24":"#666"}}>{totalAssigned}/{cnt}</span>
                            {nRelays>0&&<span style={{fontSize:9,padding:"0 4px",borderRadius:3,background:C.border+"66",color:C.gold}}>{evRelays.sort((a,b)=>a-b).map(r=>r+"조").join("+")}</span>}
                            {cnt>0&&totalAssigned<cnt&&<button onClick={e=>{e.stopPropagation();if(!laneSelEv||laneSelEv!==ev.code)setLaneSelEv(ev.code);autoAssign(ev.code);}} title="자동 배정 (오버플로우 시 다음 조로 분할)"
                              style={{marginLeft:"auto",fontSize:9,background:getEvColor(ev.code)+"33",border:"none",color:getEvColor(ev.code),borderRadius:3,padding:"1px 6px",cursor:"pointer",fontWeight:700}}>AUTO</button>}
                          </div>
                        </div>;
                      })}
                    </div>
                  )}
                </div>

                {/* 우측: 사대 리스트 */}
                <div style={{flex:1,minWidth:0,maxWidth:420}}>
                  <div style={{marginBottom:8}}>
                    {laneMarkBroken&&<span style={{fontSize:11,color:"#ef4444",fontWeight:700}}>🔧 고장 표시 모드 — 사대 클릭으로 고장 지정/해제</span>}
                    {!laneMarkBroken&&laneSelEv&&<span style={{fontSize:11,color:getEvColor(laneSelEv),fontWeight:600}}>🎯 {laneSelEv} {laneRelay}조 배정 중 — 빈 사대 클릭/드래그 · 배정 사대는 ✕로 삭제</span>}
                    {!laneMarkBroken&&!laneSelEv&&<span style={{fontSize:11,color:C.dim}}>← 종목 선택 후 사대 클릭/드래그</span>}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:3,userSelect:"none"}}
                    onMouseLeave={()=>{if(laneDragStart!==null)commitDrag();if(laneClearDrag)commitClearDrag();}}>
                    {Array.from({length:laneConfig[laneRange]},(_,i)=>i+1).map(n=>{
                      const owner=laneOwner(n);
                      const isBroken=owner==="__broken__";
                      const hasEv=owner&&!isBroken;
                      const clr=hasEv?getEvColor(owner):null;
                      const inDrag=isInDragRange(n)&&(laneSelEv||laneMarkBroken);
                      const inClear=isInClearRange(n)&&hasEv;
                      const evObj=hasEv?events.find(e=>e.code===owner):null;
                      return <div key={n} style={{display:"flex",alignItems:"stretch",gap:0}}>
                        <div
                          onMouseDown={e=>{e.preventDefault();
                            if(laneMarkBroken){setLaneDragStart(n);setLaneDragHover(n);return;}
                            if(laneSelEv&&(!hasEv||owner!==laneSelEv)){setLaneDragStart(n);setLaneDragHover(n);}
                            else toggleLane(n);
                          }}
                          onMouseEnter={()=>{if(laneDragStart!==null)setLaneDragHover(n);}}
                          onMouseUp={()=>{if(laneDragStart!==null)commitDrag();}}
                          style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",flex:1,minHeight:36,
                            borderRadius:hasEv?"6px 0 0 6px":"6px",
                            cursor:(laneSelEv||laneMarkBroken)?"pointer":"default",transition:"all .08s",
                            border:"2px solid "+(inClear?"#ef4444":inDrag?(laneMarkBroken?"#ef4444":getEvColor(laneSelEv)):isBroken?"#ef444466":hasEv?clr+"44":C.border),
                            borderRight:hasEv?"none":undefined,
                            background:inClear?"#ef444422":inDrag?(laneMarkBroken?"#ef444422":getEvColor(laneSelEv)+"22"):isBroken?"#ef444411":hasEv?clr+"11":"transparent"}}>
                          <span style={{width:30,fontSize:12,fontWeight:700,color:isBroken?"#ef4444":hasEv?clr:"#555",textAlign:"center",flexShrink:0}}>{n}</span>
                          {isBroken&&<span style={{fontSize:11,color:"#ef4444",fontWeight:600}}>🔧 고장</span>}
                          {hasEv&&<>
                            <span style={{padding:"2px 7px",borderRadius:4,fontSize:10,fontWeight:700,background:clr+"22",color:clr}}>{owner}</span>
                            <span style={{fontSize:11,color:"#888",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{evObj?evObj.name.replace(owner+" ",""):""}</span>
                          </>}
                          {!owner&&!isBroken&&<span style={{fontSize:10,color:"#444"}}>—</span>}
                        </div>
                        {hasEv&&<div
                          onMouseDown={e=>{e.preventDefault();e.stopPropagation();setLaneClearDrag({start:n,hover:n});}}
                          onMouseEnter={()=>{if(laneClearDrag)setLaneClearDrag(p=>p?{...p,hover:n}:null);}}
                          onMouseUp={e=>{e.stopPropagation();if(laneClearDrag)commitClearDrag(); else clearLane(n);}}
                          style={{width:32,display:"flex",alignItems:"center",justifyContent:"center",
                            borderRadius:"0 6px 6px 0",cursor:"pointer",transition:"all .08s",flexShrink:0,
                            border:"2px solid "+(inClear?"#ef4444":clr+"44"),borderLeft:"none",
                            background:inClear?"#ef4444":"#ef444422",color:inClear?"#fff":"#ef4444"}}>
                          <span style={{fontSize:13,fontWeight:800,lineHeight:1}}>✕</span>
                        </div>}
                      </div>;
                    })}
                  </div>
                  {/* 배정 현황 */}
                  <div style={{marginTop:16,padding:12,background:C.card,borderRadius:8,border:"1px solid "+C.border}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.dim,marginBottom:8}}>배정 현황 ({laneDay}일차 · {laneRelay}조)</div>
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      {curAssigned.filter(ev=>(dayAssign[ev.code]?.lanes||[]).length>0).map(ev=>{
                        const lanes=dayAssign[ev.code].lanes;
                        return <div key={ev.code} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 8px",borderRadius:5,background:getEvColor(ev.code)+"12",border:"1px solid "+getEvColor(ev.code)+"33"}}>
                          <span style={{width:6,height:6,borderRadius:3,background:getEvColor(ev.code),flexShrink:0}}/>
                          <span style={{fontSize:10,fontWeight:700,color:getEvColor(ev.code),minWidth:28}}>{ev.code}</span>
                          <span style={{fontSize:10,color:"#aaa",flex:1}}>{fmtRanges(lanes)}</span>
                          <span style={{fontSize:10,color:"#888"}}>{lanes.length}사대</span>
                        </div>;
                      })}
                      {broken.size>0&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 8px",borderRadius:5,background:"#ef444412",border:"1px solid #ef444433"}}>
                        <span style={{fontSize:10,fontWeight:700,color:"#ef4444"}}>🔧 고장</span>
                        <span style={{fontSize:10,color:"#aaa",flex:1}}>{fmtRanges([...broken].sort((a,b)=>a-b))}</span>
                        <span style={{fontSize:10,color:"#888"}}>{broken.size}사대</span>
                      </div>}
                      {curAssigned.every(ev=>!(dayAssign[ev.code]?.lanes||[]).length)&&!broken.size&&
                        <span style={{fontSize:11,color:C.dimmer}}>배정 없음</span>}
                    </div>
                  </div>
                </div>
              </div>
            </div>;
          })()}
        </div>
      </div>
      {/* 종목 편집 모달 */}
      {editEv&&(<div style={S.modal} onClick={()=>setEditEv(null)}><div style={S.mbox} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:16,fontWeight:700,color:C.gold,marginBottom:16}}>{editEv==="new"?"🎯 종목 추가":"✏️ 종목 수정: "+editEv.code}</div>
        {[
          {k:"code",l:"종목 코드",ph:"R1"},
          {k:"name",l:"종목명",ph:"R1 공기소총 입사 남자 SH1"},
          {k:"category",l:"카테고리",t:"select",opts:[["소총","소총"],["소총(SH2)","소총(SH2)"],["권총","권총"],["산탄총","산탄총"],["청각","청각"]]},
          {k:"type",l:"유형",t:"select",opts:[["individual","개인전"],["mixed","혼성팀"]]},
          {k:"gender",l:"성별",t:"select",opts:[["남","남성"],["여","여성"],["혼","혼성"]]},
          {k:"result_format",l:"결과지 양식",t:"select",opts:RESULT_FORMAT_OPTS},
        ].map(f=>(
          <div key={f.k} style={{marginBottom:10}}>
            <label style={{fontSize:11,color:"#6b7d94",fontWeight:600,display:"block",marginBottom:3}}>{f.l}</label>
            {f.t==="select"?<select style={S.input} value={editEvVal[f.k]||""} onChange={e=>setEditEvVal({...editEvVal,[f.k]:e.target.value})}>{f.opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
            :<input style={S.input} type={f.t||"text"} placeholder={f.ph||""} value={editEvVal[f.k]??""} onChange={e=>setEditEvVal({...editEvVal,[f.k]:e.target.value})}/>}
          </div>
        ))}
        <div style={{display:"flex",gap:8,marginTop:16}}><button style={S.btn(C.gold,C.bg)} onClick={saveEvent}>저장</button><button style={S.btn(C.border,"#8899aa")} onClick={()=>setEditEv(null)}>취소</button></div>
      </div></div>)}
      {/* 신청 상세 모달 */}
      {detailApp&&(<div style={S.modal} onClick={()=>setDetailApp(null)}><div style={{...S.mbox,minWidth:600,maxWidth:800}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div><div style={{fontSize:16,fontWeight:700,color:C.gold}}>📋 신청 #{detailApp.id}</div><div style={{fontSize:12,color:C.dim,marginTop:2}}>{detailApp.region_name} · {detailApp.org_name}</div></div>
          <span style={S.badge(APP_STATUS_COLORS[detailApp.status])}>{APP_STATUS_LABELS[detailApp.status]}</span>
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:8}}>👤 선수단 ({appMembers.length}명)</div>
          {appMembers.length===0?<div style={{fontSize:12,color:C.dimmer}}>없음</div>:(
            <div style={{overflow:"auto",borderRadius:6,border:"1px solid "+C.border}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                {["ID","이름","성별","생년월일","역할","소속","종별"].map(h=><th key={h} style={{...S.th,fontSize:10,padding:"6px 8px"}}>{h}</th>)}
              </tr></thead><tbody>
                {appMembers.map(m=><tr key={m.id}>
                  <td style={{...S.td,fontSize:11}}>{m.id}</td><td style={{...S.td,fontSize:11,fontWeight:600}}>{m.name}</td>
                  <td style={{...S.td,fontSize:11}}>{m.gender}</td><td style={{...S.td,fontSize:11}}>{m.dob}</td>
                  <td style={{...S.td,fontSize:11}}>{m.role}</td><td style={{...S.td,fontSize:11}}>{m.sub_org}</td>
                  <td style={{...S.td,fontSize:11}}>{m.class_type||"-"}</td>

              </tbody></table>
            </div>

          )}
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:8}}>🔫 총기 ({appFirearms.length}정)</div>
          {appFirearms.length===0?<div style={{fontSize:12,color:C.dimmer}}>없음</div>:(
            <div style={{overflow:"auto",borderRadius:6,border:"1px solid "+C.border}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>
                {["종류","제조사","모델","일련번호","허가번호"].map(h=><th key={h} style={{...S.th,fontSize:10,padding:"6px 8px"}}>{h}</th>)}
              </tr></thead><tbody>
                {appFirearms.map(f=><tr key={f.id}><td style={{...S.td,fontSize:11}}>{f.gun_type}</td><td style={{...S.td,fontSize:11}}>{f.manufacturer}</td><td style={{...S.td,fontSize:11}}>{f.model}</td><td style={{...S.td,fontSize:11}}>{f.serial_number}</td><td style={{...S.td,fontSize:11}}>{f.permit_number}</td></tr>)}
              </tbody></table>
            </div>
          )}
        </div>
        <div style={{textAlign:"right"}}><button style={S.btn(C.border,"#8899aa")} onClick={()=>setDetailApp(null)}>닫기</button></div>
      </div></div>)}
    </div>
  </>);
}

// ═══ 기록 관리자 ═══
function RecordsPanel({ sb, flash, onBack, setDbBusy }) {
  const [menu, setMenu]=useState(null); // null=홈, "entry"=대회기록등록
  const [tournaments, setTournaments]=useState([]);
  const [selT, setSelT]=useState(null);
  const [events, setEvents]=useState([]);
  const [selEv, setSelEv]=useState(null);
  const [results, setResults]=useState([]);
  const [dirty, setDirty]=useState(false);

  // 신기록 관리 state
  const [brEvCode, setBrEvCode]=useState(null);
  const [brType, setBrType]=useState("prelim");
  const [brData, setBrData]=useState({}); // {korea:{...},national:{...},paralympic:{...},world:{...}}
  const [brDirty, setBrDirty]=useState(false);
  const [brViewAll, setBrViewAll]=useState(false);
  const [brAllData, setBrAllData]=useState([]);
  const [brPrint, setBrPrint]=useState(false);
  const BR_CATS=[
    {key:"korea",label:"🇰🇷 한국 신기록",color:"#dc2626"},
    {key:"national",label:"🏟 전국체전 대회 신기록",color:"#2563eb"},
    {key:"paralympic",label:"♿ 패럴림픽 신기록",color:"#7c3aed"},
    {key:"world",label:"🌍 세계 신기록",color:"#059669"},
  ];
  const BR_TYPE_LABEL={prelim:"본선",final:"결선",team:"단체"};
  const BR_CAT_SHORT={korea:"KR",national:"GR",paralympic:"PR",world:"WR"};
  const BR_EV_COLORS=["#e8f0fe","#fef3e2","#e6f4ea","#fce8e8","#f3e8fd","#e2f0f0","#fef9e7","#f0e8f8","#e8eff8","#fceee8","#eef8e8","#f8e8ee","#e8f8f4","#e8e8f8","#fef0e8","#f4f4e8","#e8f4f0","#f8f0e8"];

  const renderBrTable=(forPrint)=>{
    const sorted=[...brAllData].sort((a,b)=>{
      const ai=DEFAULT_EVENTS.findIndex(e=>e.code===a.event_code);
      const bi=DEFAULT_EVENTS.findIndex(e=>e.code===b.event_code);
      if(ai!==bi) return (ai===-1?999:ai)-(bi===-1?999:bi);
      const to={prelim:0,final:1,team:2};
      if(to[a.result_type]!==to[b.result_type]) return to[a.result_type]-to[b.result_type];
      const co={korea:0,national:1,paralympic:2,world:3};
      return co[a.record_category]-co[b.record_category];
    });
    // 종목별 색상 매핑
    const evColorMap={};
    let ci=0;
    sorted.forEach(r=>{if(!evColorMap[r.event_code]){evColorMap[r.event_code]=BR_EV_COLORS[ci%BR_EV_COLORS.length];ci++;}});
    const bdr="1px solid #333";
    const thS={padding:"6px 8px",fontSize:forPrint?8:10,fontWeight:700,color:"#000",background:"#d0d0d0",border:bdr,textAlign:"center",whiteSpace:"nowrap"};
    const tdS={padding:"5px 8px",fontSize:forPrint?8:11,color:"#000",border:bdr,whiteSpace:"nowrap"};
    return <div style={{overflow:"auto",borderRadius:forPrint?0:8}}>
      <table style={{width:"100%",borderCollapse:"collapse",border:bdr}}>
        <thead><tr>
          {["종목명","구분","라운드","분류","선수명","기록","수립 대회","수립일"].map(h=>
            <th key={h} style={thS}>{h}</th>
          )}
        </tr></thead>
        <tbody>
          {sorted.map((r,i)=>{
            const ev=DEFAULT_EVENTS.find(e=>e.code===r.event_code);
            const isTeam=r.result_type==="team";
            const bg=evColorMap[r.event_code]||"#fff";
            return <tr key={r.id||i} style={{background:bg}}>
              <td style={{...tdS,fontWeight:600}}>{ev?.name||r.event_code}</td>
              <td style={{...tdS,textAlign:"center"}}>{isTeam?"단체":"개인"}</td>
              <td style={{...tdS,textAlign:"center"}}>{BR_TYPE_LABEL[r.result_type]}</td>
              <td style={{...tdS,textAlign:"center",fontWeight:700}}>{BR_CAT_SHORT[r.record_category]||r.record_category}</td>
              <td style={tdS}>{r.holder_name||"—"}</td>
              <td style={{...tdS,fontWeight:700}}>{r.record_value||"—"}</td>
              <td style={{...tdS,fontSize:forPrint?7:10}}>{r.tournament_name||"—"}</td>
              <td style={{...tdS,fontSize:forPrint?7:10}}>{r.record_date||"—"}</td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>;
  };

  useEffect(()=>{
    if(!sb) return;
    sb.from("tournaments").select("*").in("status",[3,4]).order("start_date",{ascending:false}).then(({data})=>setTournaments(data||[]));
  },[sb]);

  const loadEvents=async(t)=>{
    setSelT(t); setSelEv(null); setResults([]); setDirty(false);
    setDbBusy(v=>v+1);
    try{
      const{data}=await sb.from("tournament_events").select("*").eq("tournament_id",t.id).order("sort_order");
      setEvents(data||[]);
    }finally{setDbBusy(v=>v-1);}
  };
  const loadResults=async(evCode)=>{
    setSelEv(evCode); setDirty(false);
    setDbBusy(v=>v+1);
    try{
      const{data}=await sb.from("competition_results").select("*").eq("tournament_id",selT.id).eq("event_code",evCode).eq("result_type","prelim").order("rank",{ascending:true,nullsFirst:false});
      setResults((data||[]).map(r=>({...r,_sub_org:r.sub_org||""})));
    }finally{setDbBusy(v=>v-1);}
  };

  const addRow=()=>{
    const newRank=results.filter(r=>!r._deleted).length+1;
    setResults([...results,{_new:true, id:"new_"+Date.now(), tournament_id:selT.id, event_code:selEv, result_type:"prelim", rank:newRank, bib:"", name:"", region:"", _sub_org:"", is_team:false, s1:"",s2:"",s3:"",s4:"",s5:"",s6:"",s7:"",s8:"",s9:"",s10:"",s11:"",s12:"", total:"", x_count:"", remarks:""}]);
    setDirty(true);
  };
  const updateRow=(idx,field,val)=>{
    const nr=[...results]; nr[idx]={...nr[idx],[field]:val,_dirty:true}; setResults(nr); setDirty(true);
  };
  const removeRow=(idx)=>{
    const r=results[idx];
    if(r._new){setResults(results.filter((_,i)=>i!==idx));}
    else{setResults(results.map((rr,i)=>i===idx?{...rr,_deleted:true}:rr));}
    setDirty(true);
  };

  const saveAll=async()=>{
    setDbBusy(v=>v+1);
    try{
      const toDelete=results.filter(r=>r._deleted&&!r._new);
      const toInsert=results.filter(r=>r._new&&!r._deleted);
      const toUpdate=results.filter(r=>r._dirty&&!r._new&&!r._deleted);
      for(const r of toDelete){await sb.from("competition_results").delete().eq("id",r.id);}
      for(const r of toInsert){
        const{_new,_dirty,_sub_org,id,...row}=r; row.sub_org=_sub_org||"";
        await sb.from("competition_results").insert(row);
      }
      for(const r of toUpdate){
        const{_new,_dirty,_deleted,_sub_org,created_at,...row}=r; row.sub_org=_sub_org||"";
        await sb.from("competition_results").update(row).eq("id",r.id);
      }
      flash("저장 완료 (" + (toInsert.length+toUpdate.length) + "건 저장, " + toDelete.length + "건 삭제)");
      loadResults(selEv);
    }catch(e){flash(e.message,"error");}
    finally{setDbBusy(v=>v-1);}
  };

  const exportCSV=()=>{
    const visible=results.filter(r=>!r._deleted);
    let csv="\uFEFF순위,배번,이름,시도,세부소속,S1,S2,S3,S4,S5,S6,합계,X카운트,비고\n";
    visible.forEach(r=>{csv+=`${r.rank||""},${r.bib||""},${r.name||""},${r.region||""},${r._sub_org||r.sub_org||""},${r.s1||""},${r.s2||""},${r.s3||""},${r.s4||""},${r.s5||""},${r.s6||""},${r.total||""},${r.x_count||""},${r.remarks||""}\n`;});
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`${selT.name}_${selEv}_기록.csv`; a.click();
  };

  const importExcel=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data); const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
    const colMap={"순위":"rank","배번":"bib","이름":"name","시도":"region","소속":"region","세부소속":"_sub_org","S1":"s1","S2":"s2","S3":"s3","S4":"s4","S5":"s5","S6":"s6","합계":"total","X카운트":"x_count","비고":"remarks"};
    const mapped=rows.map((r,i)=>{
      const row={_new:true, id:"imp_"+Date.now()+"_"+i, tournament_id:selT.id, event_code:selEv, result_type:"prelim"};
      Object.entries(r).forEach(([k,v])=>{const mk=colMap[k.trim()]; if(mk) row[mk]=String(v);});
      if(!row.rank) row.rank=i+1;
      if(!row.name) return null;
      return row;
    }).filter(Boolean);
    if(mapped.length===0){flash("유효한 데이터가 없습니다.","error"); return;}
    setResults([...results.filter(r=>!r._deleted), ...mapped]);
    setDirty(true);
    flash(mapped.length+"건 불러오기 완료");
    e.target.value="";
  };

  const FIELDS=[
    {k:"rank",l:"순위",w:50,t:"number"},
    {k:"bib",l:"배번",w:60},
    {k:"name",l:"이름",w:80},
    {k:"region",l:"시도",w:65},
    {k:"_sub_org",l:"세부소속",w:85},
    {k:"s1",l:"S1",w:60},{k:"s2",l:"S2",w:60},{k:"s3",l:"S3",w:60},
    {k:"s4",l:"S4",w:60},{k:"s5",l:"S5",w:60},{k:"s6",l:"S6",w:60},
    {k:"total",l:"합계",w:70},
    {k:"x_count",l:"X카운트",w:65},
    {k:"remarks",l:"비고",w:90},
  ];

  // 신기록 로드
  const loadBestRecords=async(evCode,type)=>{
    setBrViewAll(false); setBrPrint(false);
    setBrEvCode(evCode); setBrType(type||"prelim"); setBrDirty(false);
    const{data}=await sb.from("best_records").select("*").eq("event_code",evCode).eq("result_type",type||"prelim");
    const map={};
    BR_CATS.forEach(c=>{map[c.key]={event_code:evCode,result_type:type||"prelim",record_category:c.key,record_value:"",holder_name:"",holder_region:"",record_date:"",tournament_name:"",remarks:""};});
    (data||[]).forEach(r=>{map[r.record_category]={...r};});
    setBrData(map);
  };
  const brUpdate=(cat,field,val)=>{
    setBrData({...brData,[cat]:{...brData[cat],[field]:val,_dirty:true}});
    setBrDirty(true);
  };
  const brSave=async()=>{
    try{
      let saved=0;
      for(const cat of BR_CATS){
        const r=brData[cat.key];
        if(!r||!r._dirty) continue;
        const{_dirty,id,created_at,...row}=r;
        row.event_code=brEvCode; row.result_type=brType; row.record_category=cat.key;
        if(id){
          await sb.from("best_records").update(row).eq("id",id);
        } else if(row.record_value||row.holder_name){
          await sb.from("best_records").upsert(row,{onConflict:"event_code,result_type,record_category"});
        }
        saved++;
      }
      flash(saved+"건 저장 완료");
      loadBestRecords(brEvCode,brType);
    }catch(e){flash("저장 실패: "+e.message,"error");}
  };
  // 개별 카드 저장
  const brSaveOne=async(catKey)=>{
    try{
      const r=brData[catKey];
      if(!r) return;
      const{_dirty,_saved,id,created_at,...row}=r;
      row.event_code=brEvCode; row.result_type=brType; row.record_category=catKey;
      if(id){
        await sb.from("best_records").update(row).eq("id",id);
      } else if(row.record_value||row.holder_name){
        await sb.from("best_records").upsert(row,{onConflict:"event_code,result_type,record_category"});
      } else { flash("기록 또는 보유자를 입력하세요","error"); return; }
      setBrData(prev=>({...prev,[catKey]:{...prev[catKey],_dirty:false,_saved:true}}));
      setTimeout(()=>setBrData(prev=>({...prev,[catKey]:{...prev[catKey],_saved:false}})),2000);
      flash(BR_CATS.find(c=>c.key===catKey)?.label+" 저장 완료");
      // reload to get id
      const{data:fresh}=await sb.from("best_records").select("*").eq("event_code",brEvCode).eq("result_type",brType).eq("record_category",catKey).single();
      if(fresh) setBrData(prev=>({...prev,[catKey]:{...fresh,_saved:true}}));
    }catch(e){flash("저장 실패: "+e.message,"error");}
  };
  // 전체 신기록 로드
  const loadAllBestRecords=async()=>{
    setBrViewAll(true); setBrEvCode(null); setBrPrint(false);
    const{data}=await sb.from("best_records").select("*").order("event_code").order("result_type").order("record_category");
    setBrAllData(data||[]);
  };
  const inp={background:"#0d1520",border:"1px solid #2a3a5c",borderRadius:4,color:"#e8dcc8",padding:"4px 6px",fontSize:12,width:"100%",boxSizing:"border-box"};

  const MENUS=[
    {key:"entry",icon:"📝",label:"대회 기록 등록"},
    {key:"records_new",icon:"🏅",label:"신기록 관리"},
    {key:"records_db",icon:"🗃",label:"기록 DB 조회",disabled:true},
  ];

  const sideItem=(m)=>({
    padding:"11px 16px",cursor:m.disabled?"default":"pointer",
    borderBottom:"1px solid "+C.border+"44",
    background:menu===m.key?C.gold+"15":"transparent",
    borderLeft:menu===m.key?"3px solid "+C.gold:"3px solid transparent",
    opacity:m.disabled?0.4:1,
    display:"flex",alignItems:"center",gap:8,
  });

  return (
    <div style={{height:"100vh",display:"flex",background:C.bg,color:"#e8dcc8",fontFamily:"'Noto Sans KR',sans-serif"}}>
      {/* 좌측 사이드바 */}
      <div style={{width:220,minWidth:220,background:C.sidebar,borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:"14px 16px",borderBottom:"1px solid "+C.border}}>
          <button onClick={onBack} style={{background:"transparent",border:"none",color:C.dim,fontSize:12,cursor:"pointer",padding:0,marginBottom:8}}>← 메인</button>
          <div style={{fontSize:15,fontWeight:800,color:C.gold}}>📊 기록 관리자</div>
        </div>
        {/* 메뉴 */}
        <div style={{flex:1,overflow:"auto"}}>
          {MENUS.map(m=>(
            <div key={m.key} style={sideItem(m)} onClick={()=>{if(!m.disabled){setMenu(m.key);setSelT(null);setSelEv(null);setResults([]);setBrEvCode(null);setBrData({});setBrDirty(false);setBrViewAll(false);setBrPrint(false);}}}>
              <span style={{fontSize:16}}>{m.icon}</span>
              <span style={{fontSize:13,fontWeight:menu===m.key?700:400,color:menu===m.key?C.gold:"#c8d4e4"}}>{m.label}</span>
              {m.disabled&&<span style={{fontSize:9,color:C.dimmer,marginLeft:"auto"}}>준비중</span>}
            </div>
          ))}
        </div>
      </div>

      {/* 메인 영역 */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>
        {/* 홈 */}
        {!menu&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:C.dimmer}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:56,marginBottom:16}}>📊</div>
            <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>기록 관리자</div>
            <div style={{fontSize:13,lineHeight:1.8}}>좌측 메뉴에서 작업을 선택하세요.</div>
          </div>
        </div>}

        {/* 대회 기록 등록 */}
        {menu==="entry"&&<>
          {/* 대회 선택 서브사이드바 */}
          <div style={{width:220,minWidth:220,background:"#0b1018",borderRight:"1px solid "+C.border,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid "+C.border}}>
              <div style={{fontSize:13,fontWeight:700,color:"#e8dcc8"}}>📝 대회 기록 등록</div>
              <div style={{fontSize:10,color:C.dim,marginTop:3}}>종료/진행 대회 ({tournaments.length})</div>
            </div>
            <div style={{flex:1,overflow:"auto"}}>
              {tournaments.map(t=>(
                <div key={t.id} onClick={()=>loadEvents(t)} style={{
                  padding:"10px 14px",cursor:"pointer",borderBottom:"1px solid "+C.border+"33",
                  background:selT?.id===t.id?C.gold+"15":"transparent",
                  borderLeft:selT?.id===t.id?"3px solid "+C.gold:"3px solid transparent",
                }}>
                  <div style={{fontSize:12,fontWeight:selT?.id===t.id?700:400,color:selT?.id===t.id?C.gold:"#c8d4e4",lineHeight:1.4}}>{t.name}</div>
                  <div style={{fontSize:10,color:C.dim,marginTop:2}}>📅 {t.start_date} · {t.status===3?"진행중":"종료"}</div>
                </div>
              ))}
              {tournaments.length===0&&<div style={{padding:20,textAlign:"center",color:C.dimmer,fontSize:11}}>조회 가능한 대회가 없습니다</div>}
            </div>
          </div>

          {/* 종목 선택 + 기록 편집 */}
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {!selT&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:C.dimmer}}>
              <div style={{textAlign:"center"}}><div style={{fontSize:40,marginBottom:10}}>🏆</div><div style={{fontSize:14}}>대회를 선택하세요</div></div>
            </div>}
            {selT&&<>
              {/* 종목 탭 */}
              <div style={{padding:"10px 20px",borderBottom:"1px solid "+C.border,background:C.sidebar,display:"flex",flexWrap:"wrap",gap:4,alignItems:"center"}}>
                <span style={{fontSize:13,fontWeight:700,color:C.gold,marginRight:8}}>{selT.name}</span>
                {events.filter(e=>e.type==="individual").map(ev=>(
                  <button key={ev.code} onClick={()=>loadResults(ev.code)} style={{
                    padding:"5px 10px",borderRadius:5,fontSize:11,fontWeight:selEv===ev.code?700:400,cursor:"pointer",
                    border:"1px solid "+(selEv===ev.code?C.gold:C.border),
                    background:selEv===ev.code?C.gold+"22":"transparent",
                    color:selEv===ev.code?C.gold:C.dim,
                  }}>{ev.code}</button>
                ))}
              </div>
              {/* 컨텐츠 */}
              <div style={{flex:1,overflow:"auto",padding:20}}>
                {!selEv&&<div style={{textAlign:"center",padding:60,color:C.dimmer}}><div style={{fontSize:36,marginBottom:8}}>🎯</div>종목을 선택하세요</div>}
                {selEv&&<div>
                  {/* 툴바 */}
                  <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
                    <span style={{fontSize:14,fontWeight:700,color:"#fff"}}>{events.find(e=>e.code===selEv)?.name}</span>
                    <span style={{fontSize:12,color:C.dim}}>({results.filter(r=>!r._deleted).length}명)</span>
                    <div style={{flex:1}}/>
                    <button onClick={addRow} style={{...S.btn(C.gold,C.bg),fontSize:11,padding:"5px 12px"}}>+ 행 추가</button>
                    <label style={{...S.btn(C.blue,"#fff"),fontSize:11,padding:"5px 12px",cursor:"pointer"}}>
                      📥 엑셀 불러오기<input type="file" accept=".xlsx,.xls,.csv" onChange={importExcel} style={{display:"none"}}/>
                    </label>
                    <button onClick={exportCSV} style={{...S.btn(C.green,"#fff"),fontSize:11,padding:"5px 12px"}}>📤 CSV 내보내기</button>
                    <button onClick={saveAll} style={{...S.btn(dirty?"#ff6b35":C.gold,dirty?"#fff":C.bg),fontSize:12,padding:"6px 16px",fontWeight:700}}>💾 저장{dirty?" *":""}</button>
                  </div>
                  {/* 테이블 */}
