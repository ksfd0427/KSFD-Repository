        const union = teamUnion[k];
        slots.forEach((sid, idx) => {
          if (sid !== null && memberIdMap[sid]) {
            teamRows.push({
              application_id: appId, event_code: eventCode, team_type: teamType,
              team_number: teamNumber, member_id: memberIdMap[sid], slot_order: idx,
              is_union: union?.checked || false, union_memo: union?.memo || null
            });
          }
        });
      });
      if (teamRows.length > 0) {
        const { error: teamErr } = await supabase.from("team_entries").insert(teamRows);
        if (teamErr) throw new Error("팀 등록 실패: " + teamErr.message);
      }

      // 4-1. 리그전 등록
      if (isLeague) {
        const leagueRows = [];
        Object.entries(leagueComps).forEach(([k, slots]) => {
          if (!k.startsWith("league-") || !slots || slots.filter(s => s !== null).length < 2) return;
          const eventCode = k.replace("league-", "");
          const union = leagueUnion[k];
          slots.forEach((sid, idx) => {
            if (sid !== null && memberIdMap[sid]) {
              leagueRows.push({
                application_id: appId, event_code: eventCode, team_type: "league",
                team_number: 1, member_id: memberIdMap[sid], slot_order: idx,
                is_union: union?.checked || false, union_memo: union?.memo || null
              });
            }
          });
        });
        if (leagueRows.length > 0) {
          const { error: lgErr } = await supabase.from("team_entries").insert(leagueRows);
          if (lgErr) throw new Error("리그전 등록 실패: " + lgErr.message);
        }
      }

      // 5. 총기 등록
      const firearmRows = [];
      Object.entries(firearms).forEach(([mid, guns]) => {
        const dbMid = memberIdMap[parseInt(mid)];
        if (!dbMid) return;
        guns.forEach(f => {
          firearmRows.push({
            member_id: dbMid, gun_type: f.type, manufacturer: f.maker,
            model: f.model, serial_number: f.serial, permit_number: f.permit
          });
        });
      });
      if (firearmRows.length > 0) {
        const { error: fErr } = await supabase.from("firearms").insert(firearmRows);
        if (fErr) throw new Error("총기 등록 실패: " + fErr.message);
      }

      // 6. 이력 기록
      await supabase.from("application_logs").insert({ application_id: appId, action: "submit", detail: "참가신청 제출" });

      setApplicationId(appId);
      setShowComplete(true);
    } catch (e) {
      setSubmitError(e.message);
      console.error("제출 오류:", e);
    } finally {
      setSubmitting(false);
    }
  };

  // ===== 테스트 데이터 공통 =====
  const _testUtil = () => {
    const lastNames = ["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","류","홍"];
    const firstNamesM = ["민수","영호","진우","성민","현우","지훈","동현","승현","재민","태우","준영","상혁","도윤","시우","하준"];
    const firstNamesF = ["수진","영희","미영","은지","지연","서연","하은","민지","유진","소연","다은","예린","지우","서윤","하린"];
    const rn = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const rNum = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    return { lastNames, firstNamesM, firstNamesF, rn, rNum };
  };

  // Step 2: 선수단 정보만 생성
  const generateTestMembers = () => {
    const { lastNames, firstNamesM, firstNamesF, rn, rNum } = _testUtil();
    const roles = ["지도자","로더","기타"];
    const evByCat = {};
    activeIndividualEvents.forEach(ev => {
      if (!evByCat[ev.cat]) evByCat[ev.cat] = [];
      evByCat[ev.cat].push(ev);
    });
    const catKeys = Object.keys(evByCat);
    const playerCount = rNum(4, 8);
    const staffCount = rNum(1, 3);
    const newMembers = [];
    for (let i = 0; i < playerCount + staffCount; i++) {
      const isPlayer = i < playerCount;
      const isMale = Math.random() > 0.4;
      const gender = isMale ? "남" : "여";
      const name = rn(lastNames) + rn(isMale ? firstNamesM : firstNamesF);
      const year = isPlayer ? rNum(1975, 2005) : rNum(1965, 1990);
      const month = String(rNum(1,12)).padStart(2,"0");
      const day = String(rNum(1,28)).padStart(2,"0");
      const subMode = Math.random() > 0.5 ? "org" : "auto";
      const subOrg = subMode === "org" ? orgName : (REGIONS[selectedRegion]?.name || "") + "일반";
      const memberCats = [];
      if (isPlayer && catKeys.length > 0) {
        const validCats = catKeys.filter(cat => evByCat[cat].some(ev => ev.gender === "혼" || ev.gender === gender));
        if (validCats.length > 0) {
          const shuffled = [...validCats].sort(() => Math.random() - 0.5);
          // 규칙: 소총↔소총(SH2) 불가, (권총/소총/소총SH2)↔청각 불가
          const shootGroup = ["권총","소총","소총(SH2)"];
          const canAdd = (cat, existing) => {
            if (cat === "소총" && existing.includes("소총(SH2)")) return false;
            if (cat === "소총(SH2)" && existing.includes("소총")) return false;
            if (cat === "청각" && existing.some(e => shootGroup.includes(e))) return false;
            if (shootGroup.includes(cat) && existing.includes("청각")) return false;
            return true;
          };
          const cnt = rNum(1, Math.min(2, shuffled.length));
          for (let c = 0; c < cnt; c++) {
            if (canAdd(shuffled[c], memberCats)) memberCats.push(shuffled[c]);
          }
          // 최소 1개 보장
          if (memberCats.length === 0 && shuffled.length > 0) memberCats.push(shuffled[0]);
        }
      }
      newMembers.push({
        id: i + 1, name, gender,
        dob: `${year}-${month}-${day}`,
        role: isPlayer ? "선수" : rn(roles),
        subOrg, subOrgMode: subMode,
        events: memberCats
      });
    }
    setMembers(newMembers);
    setExpandedMember(1);
    setIndividualEvents({});
    setTeamComps({});
    setTeamUnion({});
    setLeagueComps({});
    setLeagueUnion({});
    setFirearms({});
  };

  // Step 3: 종목별 등록 (현재 members 기반)
  const generateTestEvents = () => {
    const { rNum } = _testUtil();
    const players = members.filter(m => m.role === "선수");
    if (players.length === 0) return;
    const newIE = {};
    const newTC = {};
    players.forEach(p => {
      const eligible = activeIndividualEvents.filter(ev =>
        p.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === p.gender)
      );
      if (eligible.length > 0) {
        const cnt = rNum(1, Math.min(3, eligible.length));
        const shuffled = [...eligible].sort(() => Math.random() - 0.5);
        shuffled.slice(0, cnt).forEach(ev => {
          if (!newIE[ev.code]) newIE[ev.code] = [];
          newIE[ev.code].push(p.id);
        });
      }
    });
    activePairEvents.forEach(pe => {
      const males = players.filter(p => p.events.includes(pe.cat) && p.gender === "남");
      const females = players.filter(p => p.events.includes(pe.cat) && p.gender === "여");
      if (males.length > 0 && females.length > 0) {
        const m = males[Math.floor(Math.random() * males.length)];
        const f = females[Math.floor(Math.random() * females.length)];
        newTC["pair-" + pe.code] = [m.id, f.id];
      }
    });
    setIndividualEvents(newIE);
    setTeamComps(newTC);
    setTeamUnion({});
    setLeagueComps({});
    setLeagueUnion({});
    setFirearms({});
  };

  // Step 4: 총기 등록 (현재 members 기반)
  const generateTestFirearms = () => {
    const { rn, rNum } = _testUtil();
    const gunMakers = ["Feinwerkbau","Walther","Anschütz","Steyr","Pardini","Morini","Hämmerli"];
    const rifleModels = ["P800","LG400","8002","LP400","SP RF","CM 84E","AP20"];
    const pistolModels = ["LP500","LP400","SP20","HP01","SP RF","CM 22","AP20"];
    const players = members.filter(m => m.role === "선수");
    const newFirearms = {};
    players.forEach(p => {
      const hasRifle = p.events.some(c => c.startsWith("소총"));
      const hasPistol = p.events.includes("권총");
      const hasShotgun = p.events.includes("산탄총");
      const gunCount = rNum(1, 2);
      const guns = [];
      for (let g = 0; g < gunCount; g++) {
        let gunType, model;
        if (g === 0 && hasRifle) { gunType = "공기소총"; model = rn(rifleModels); }
        else if (hasPistol) { gunType = "공기권총"; model = rn(pistolModels); }
        else if (hasShotgun) { gunType = "산탄총"; model = "Beretta DT11"; }
        else { gunType = "공기소총"; model = rn(rifleModels); }
        guns.push({
          id: g + 1, type: gunType, maker: rn(gunMakers), model,
          serial: `${String.fromCharCode(65+rNum(0,25))}${String.fromCharCode(65+rNum(0,25))}-${rNum(10000,99999)}`,
          permit: `2025-${rn(["서울","부산","경기","대전","광주"])}-${String(rNum(1,9999)).padStart(5,"0")}`
        });
      }
      newFirearms[p.id] = guns;
    });
    setFirearms(newFirearms);
  };


  const flashField = (fieldId, memberId) => {

  };

  const getStep2Error = () => {
    if (!orgName.trim()) return { field: "orgName", memberId: null };
    for (let i = 0; i < members.length; i++) {
      const m = members[i];
      if (!m.name.trim()) return { field: `member-${m.id}-name`, memberId: m.id };
      if (!m.dob) return { field: `member-${m.id}-dob`, memberId: m.id };
      if (!m.role) return { field: `member-${m.id}-role`, memberId: m.id };
      if (!m.gender) return { field: `member-${m.id}-gender`, memberId: m.id };
      if (!m.subOrg.trim()) return { field: `member-${m.id}-subOrg`, memberId: m.id };
      if (m.role === "선수") {
        if (m.events.length === 0) return { field: `member-${m.id}-events`, memberId: m.id };
      }
    }
    return null;
  };

  const step2HasError = step === 2 ? !!getStep2Error() : false;

  useEffect(() => {
    if (!document.getElementById("hl-pulse-style")) {
      const s = document.createElement("style");

      document.head.appendChild(s);
    }
  }, []);
  const handleRegionHover = useCallback((id) => {
    setHoveredRegion(id);
  }, []);

  const regionOrder = ["KR11","KR26","KR27","KR28","KR29","KR30","KR31","KR50","KR41","KR42","KR43","KR44","KR45","KR46","KR47","KR48","KR49"];

  if (page === "landing") {
    return (
      <div style={styles.landingContainer}>
        <img src={LOGO_IMG} alt="" style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", width: 600, maxWidth: "90%", opacity: 0.12, pointerEvents: "none" }} />
        <div style={styles.landingInner}>
          <h1 style={styles.landingTitle}>대한장애인사격연맹<br/>대회참가시스템</h1>
          <p style={styles.landingSubtitle}>KSFD COMPETITION ENTRY</p>
          <div style={styles.landingButtons}>
            <button className="landing-btn" style={styles.primaryBtn} onClick={() => setPage("register")}>
              <span style={styles.btnIcon}>📋</span>
              <span>
                <div style={styles.btnMain}>대회 참가신청</div>
                <div style={styles.btnSub}>Entry Registration</div>
              </span>
            </button>
            <button className="landing-btn" style={styles.primaryBtn} onClick={() => { setPage("schedule"); setSchedulePage("list"); }}>
              <span style={styles.btnIcon}>🔍</span>
              <span>
                <div style={styles.btnMain}>기록지 &<br/>스타트리스트</div>

              </span>
            </button>
          </div>
        </div>
        <div style={{ position: "absolute", bottom: 18, left: "50%", transform: "translateX(-50%)", opacity: adminMode ? 0.85 : 0.25, cursor: "pointer", transition: "opacity .2s" }}
          onClick={() => { if (adminMode) { setAdminMode(false); } else { setShowAdminModal(true); setAdminPw(""); } }}
          onMouseEnter={e => e.currentTarget.style.opacity = "0.7"}
          onMouseLeave={e => e.currentTarget.style.opacity = adminMode ? "0.85" : "0.25"}
          title={adminMode ? "관리자모드 해제 (클릭)" : "관리자모드"}
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={adminMode ? "#c9a84c" : "#6b7d94"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          {adminMode && <div style={{ fontSize: 9, color: "#c9a84c", marginTop: 2, textAlign: "center", whiteSpace: "nowrap" }}>ON</div>}
        </div>
        {/* 관리자모드 비밀번호 모달 */}
        {showAdminModal && (
          <div style={{ position: "fixed", top: 0, left: 0, width: "100vw", height: "100vh", background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 9999 }} onClick={() => setShowAdminModal(false)}>
            <div style={{ background: "#1a2744", border: "1px solid #2a3a5c", borderRadius: 14, padding: "32px 36px 28px", minWidth: 300, maxWidth: 360, position: "relative", boxShadow: "0 12px 40px rgba(0,0,0,0.5)" }} onClick={e => e.stopPropagation()}>
              <div style={{ position: "absolute", top: 12, right: 14, cursor: "pointer", color: "#6b7d94", fontSize: 20, fontWeight: 700, lineHeight: 1 }} onClick={() => setShowAdminModal(false)}>✕</div>
              <div style={{ textAlign: "center", marginBottom: 20 }}>
                <div style={{ fontSize: 18, fontWeight: 800, color: "#c9a84c", letterSpacing: 2 }}>관리자모드</div>
                <div style={{ fontSize: 12, color: "#6b7d94", marginTop: 4 }}>암호를 입력하세요</div>
              </div>
              <input type="password" value={adminPw} onChange={e => setAdminPw(e.target.value)} onKeyDown={e => {
                if (e.key === "Enter") {
                  if (adminPw === "142857") { setAdminMode(true); setShowAdminModal(false); setAdminPw(""); }
                  else { setAdminPw(""); e.target.style.borderColor = "#ff4444"; setTimeout(() => { if (e.target) e.target.style.borderColor = "#2a3a5c"; }, 800); }
                }
              }} autoFocus placeholder="비밀번호" style={{ width: "100%", padding: "10px 14px", background: "#0d1520", border: "1px solid #2a3a5c", borderRadius: 8, color: "#e8dcc8", fontSize: 14, outline: "none", textAlign: "center", letterSpacing: 4, transition: "border-color .3s" }} />
              <button onClick={() => {
                if (adminPw === "142857") { setAdminMode(true); setShowAdminModal(false); setAdminPw(""); }

            </div>
          </div>
        )}
      </div>
    );
  }

  // ═══ 시간표/기록지 페이지 ═══
  if (page === "schedule") {
    const ongoingTournaments = adminMode ? activeTournaments : activeTournaments.filter(t => t.status === 3);

    const loadSchedule = async (tid) => {
      setScheduleTournament(tid);
      setSchedulePage("detail");
      setScheduleDay(1);
      setScheduleLoading(true);
      setScheduleData([]);
      try {
        if (supabase) {
          const { data, error } = await supabase
            .from("tournament_schedules")
            .select("*")
            .eq("tournament_id", tid)
            .order("day_number")
            .order("sort_order");
          if (!error && data && data.length > 0) {
            // DB rows → grouped by day
            const dayMap = {};
            data.forEach(r => {
              if (!dayMap[r.day_number]) dayMap[r.day_number] = [];
              dayMap[r.day_number].push(r);
            });
            setScheduleData(Object.entries(dayMap).map(([d, rows]) => ({ day: Number(d), rows })));
          }
          // 세션 상태 로드
          const { data: opsData } = await supabase
            .from("tournament_ops_data")
            .select("json_data")
            .eq("tournament_id", tid)
            .eq("data_type", "session_status")
            .maybeSingle();
          if (opsData && opsData.json_data) setSessionStatuses(opsData.json_data);
          else setSessionStatuses({});

          // 결선 없음 종목 목록 로드
          const { data: nfData } = await supabase
            .from("tournament_ops_data")
            .select("json_data")
            .eq("tournament_id", tid)
            .eq("data_type", "no_final_events")
            .maybeSingle();
          if (nfData && Array.isArray(nfData.json_data)) setNoFinalEvents(nfData.json_data);
          else setNoFinalEvents([]);

          // 결정전 종목 목록 로드
          const { data: mmData } = await supabase
            .from("tournament_ops_data")
            .select("json_data")
            .eq("tournament_id", tid)
            .eq("data_type", "medal_match_events")
            .maybeSingle();
          if (mmData && Array.isArray(mmData.json_data)) setMedalMatchEvents(mmData.json_data);
          else setMedalMatchEvents([]);

          // 종목 정보 로드 (final_format 등)
          const { data: evData } = await supabase.from("tournament_events")
            .select("*").eq("tournament_id", tid).order("sort_order");
          if (evData) setDbEvents(evData);

          // 스타트리스트 session_key 목록 로드 (25M 조별 드랍다운용)
          const { data: slKeyData } = await supabase
            .from("tournament_startlists")
            .select("session_key")
            .eq("tournament_id", tid);
          if (slKeyData) {
            setSlSessionKeys([...new Set(slKeyData.map(r => r.session_key))]);
          } else {
            setSlSessionKeys([]);
          }
        }
      } catch (e) { console.log("시간표 로드 실패:", e); }
      setScheduleLoading(false);
    };

    const catColor = (c) => ({ "10M": "#3b82f6", "25M": "#8b5cf6", "50M": "#10b981", "산탄총": "#f59e0b" }[c] || "#8899aa");
    const loadStartlist = async (sessionKey) => {
      if (slSession === sessionKey) { setSlSession(null); return; } // 토글
      setSlSession(sessionKey);
      setSlData([]);
      setSlLoading(true);
      try {
        if (supabase) {
          const { data, error } = await supabase
            .from("tournament_startlists")
            .select("*")
            .eq("tournament_id", scheduleTournament)
            .eq("session_key", sessionKey)
            .order("sort_order");
          if (!error && data) setSlData(data);
        }
      } catch (e) { console.log("스타트리스트 로드 실패:", e); }
      setSlLoading(false);
    };

    // 경기 결과 로드
    const loadResults = async (eventCode, resultType) => {
      setResultData([]);
      setResultLoading(true);
      try {
        if (supabase) {
          const { data, error } = await supabase
            .from("competition_results")
            .select("*")
            .eq("tournament_id", scheduleTournament)
            .eq("event_code", eventCode)
            .eq("result_type", resultType)
            .order("id", { ascending: true });
          if (!error && data) {
            // 혼성팀: team→sub 그룹 순서 보장
            const hasMixed = data.some(r => r.bib === "team" || r.bib === "sub");
            if (hasMixed) {
              const teams = [], teamSubMap = new Map();
              let curTeamId = null;
              data.forEach(r => {
                if (r.bib === "team") { curTeamId = r.id; teams.push(r); teamSubMap.set(r.id, []); }
                else if (r.bib === "sub" && curTeamId) { teamSubMap.get(curTeamId).push(r); }
              });
              teams.sort((a, b) => (a.rank || 999) - (b.rank || 999));
              const sorted = [];
              teams.forEach(t => { sorted.push(t); (teamSubMap.get(t.id) || []).forEach(s => sorted.push(s)); });
              setResultData(sorted);
            } else {
              data.sort((a, b) => (a.rank || 999) - (b.rank || 999));
              setResultData(data);
            }
          }
        }
      } catch (e) { console.log("결과 로드 실패:", e); }
      setResultLoading(false);
    };

    // 세션 뷰 열기 (통합)
    const openSessionView = async (sessionKey, type, eventCode, category) => {
      // 같은 세션+타입이면 닫기
      if (slSession === sessionKey && viewType === type) {
        setSlSession(null); setViewType(null); setDropdownKey(null);
        return;
      }
      setSlSession(sessionKey);
      setViewType(type);
      setDropdownKey(null);
      if (type === "startlist") {
        await loadStartlist(sessionKey);
      } else if (type.startsWith("startlist:")) {
        // 25M 조별 스타트리스트: startlist:1 → eventCode + "_1"
        // loadStartlist를 호출하면 slSession이 덮어씌워지므로 직접 로드
        const relayNum = type.split(":")[1];
        const relayKey = eventCode + "_" + relayNum;
        setSlData([]); setSlLoading(true);
        try {
          if (supabase) {
            const { data } = await supabase
              .from("tournament_startlists")
              .select("*")
              .eq("tournament_id", scheduleTournament)
              .eq("session_key", relayKey)
              .order("sort_order");
            if (data) setSlData(data);
          }
        } catch (e) { console.log("조별 스타트리스트 로드 실패:", e); }
        setSlLoading(false);
      } else if (type === "final_sl") {
        // 결선 스타트리스트: session_key = eventCode + "_final"
        setSlData([]); setSlLoading(true);
        try {
          const { data } = await supabase
            .from("tournament_startlists")
            .select("*")
            .eq("tournament_id", scheduleTournament)
            .eq("session_key", eventCode + "_final")
            .order("sort_order");
          if (data) setSlData(data);
        } catch (e) {}
        setSlLoading(false);
      } else if (type === "bronze_sl" || type === "gold_sl") {
        // 결정전 스타트리스트: session_key = eventCode + "_bronze" or "_gold"
        const matchType = type === "bronze_sl" ? "bronze" : "gold";
        setSlData([]); setSlLoading(true);
        try {
          const { data } = await supabase
            .from("tournament_startlists")
            .select("*")
            .eq("tournament_id", scheduleTournament)
            .eq("session_key", eventCode + "_" + matchType)
            .order("sort_order");
          if (data) setSlData(data);
        } catch (e) {}
        setSlLoading(false);
      } else if (type === "prelim" || type === "final" || type === "team" || type === "bronze" || type === "gold") {
        await loadResults(eventCode, type);
      }
    };
    const calcSpans = (rows) => {
      const spans = new Array(rows.length).fill(1); const sk = new Set();
      for (let i = 0; i < rows.length; i++) {
        if (sk.has(i) || !rows[i].category) continue;
        let cnt = 1;
        while (i + cnt < rows.length && rows[i + cnt].category === rows[i].category) { sk.add(i + cnt); cnt++; }
        spans[i] = cnt;
      }
      return { spans, sk };
    };

    // ── 세션 상태별 버튼 렌더링 ──
    const SESSION_STATUS_CONFIG = {
      scheduled: { label: "📋 명단", color: "#6688aa", items: (evCode, sKey) => [
        { key: "startlist", label: "📋 본선 스타트리스트", sKey }
      ]},
      prelim_done: { label: "📊 결과", color: "#f59e0b", items: (evCode, sKey) => [
        { key: "prelim", label: "📊 본선 경기결과", evCode },
        { key: "final_sl", label: "📋 결선 스타트리스트", evCode },
        { key: "bronze_sl", label: "🥉 3/4위 결정전 명단", evCode },
        { key: "gold_sl", label: "🥇 1/2위 결정전 명단", evCode },
        { key: "team", label: "👥 단체전 경기결과", evCode },
      ]},
      completed: { label: "📊 결과", color: "#10b981", items: (evCode, sKey) => [
        { key: "prelim", label: "📊 본선 경기결과", evCode },
        { key: "final", label: "🏅 결선 경기결과", evCode },
        { key: "bronze", label: "🥉 3/4위 결정전 결과", evCode },
        { key: "gold", label: "🥇 1/2위 결정전 결과", evCode },
        { key: "team", label: "👥 단체전 경기결과", evCode },
      ]},
    };

    // 25M 종목의 조 번호 목록 구하기 (DB startlist session_key에서)
    const getEventRelays = (eventCode) => {
      const prefix = eventCode + "_";
      const relays = [];
      slSessionKeys.forEach(sk => {
        if (sk.startsWith(prefix)) {
          const suffix = sk.slice(prefix.length);
          if (/^\d+$/.test(suffix)) relays.push(suffix);
        }
      });
      return relays.sort((a, b) => Number(a) - Number(b));
    };

    const renderSessionBtn = (sessionKey, eventCode, category) => {
      const status = sessionStatuses[sessionKey] || "scheduled";
      const cfg = SESSION_STATUS_CONFIG[status];
      const isOpen = slSession === sessionKey;
      const ddOpen = dropdownKey === sessionKey;
      const evInfo = dbEvents?.find(e => e.code === eventCode);
      const isNoFinal = noFinalEvents.includes(eventCode) || evInfo?.final_format === "none";
      const isMedalMatch = medalMatchEvents.includes(eventCode) || evInfo?.final_format === "medal_match";
      const isMixedType = evInfo?.type === "mixed";

      // 25M 조 목록
      const is25M = category === "25M";
      const relays25M = is25M ? getEventRelays(eventCode) : [];
      const hasMultiRelay = relays25M.length > 1;

      if (status === "scheduled") {
        // 25M 다조: 드랍다운으로 조 선택
        if (hasMultiRelay) {
          const items = relays25M.map(r => ({ key: "startlist:" + r, label: "📋 " + r + "조 스타트리스트" }));
          return <div style={{ position: "relative", display: "inline-block" }}>
            <button onClick={(e) => { e.stopPropagation(); setDropdownKey(ddOpen ? null : sessionKey); }}
              style={{
                padding: "4px 8px", borderRadius: 5, border: "1px solid " + (isOpen ? "#c9a84c" : "#334466"),
                background: isOpen ? "#c9a84c22" : "transparent", color: isOpen ? "#c9a84c" : "#6688aa",
                fontSize: 10, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap"
              }}>{isOpen ? "▲ 닫기" : "📋 명단 ▼"}</button>
            {ddOpen && <div style={{
              position: "absolute", left: 0, top: "100%", marginTop: 4, zIndex: 999,
              background: "#1a2744", border: "1px solid #334466", borderRadius: 8,
              padding: 4, minWidth: 170, boxShadow: "0 8px 24px rgba(0,0,0,.6)"
            }} onClick={e => e.stopPropagation()}>
              {items.map(item => (
                <div key={item.key} onClick={() => openSessionView(sessionKey, item.key, eventCode, category)}
                  style={{ padding: "8px 12px", fontSize: 12, cursor: "pointer", borderRadius: 4, color: "#dde6f0",
                    background: viewType === item.key && slSession === sessionKey ? "#334466" : "transparent" }}
                  onMouseEnter={e => e.currentTarget.style.background = "#334466"}
                  onMouseLeave={e => e.currentTarget.style.background = viewType === item.key && slSession === sessionKey ? "#334466" : "transparent"}>
                  {item.label}
                </div>
              ))}
            </div>}
          </div>;
        }
        // 기본: 단순 명단 버튼
        return <button onClick={() => openSessionView(sessionKey, "startlist", eventCode, category)} style={{
          padding: "4px 8px", borderRadius: 5, border: "1px solid " + (isOpen ? "#c9a84c" : "#334466"),
          background: isOpen ? "#c9a84c22" : "transparent", color: isOpen ? "#c9a84c" : "#6688aa",
          fontSize: 10, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap"
        }}>{isOpen ? "▲ 닫기" : "📋 명단"}</button>;
      }

      // 종목 유형에 따라 항목 필터링
      let items = cfg.items(eventCode, sessionKey).filter(item => {
        // 결선 없음: 본선+단체만
        if (isNoFinal) return ["prelim","startlist","team"].includes(item.key);
        // 결정전 종목: 본선 + bronze/gold 관련만
        if (isMedalMatch) return ["prelim","startlist","bronze_sl","gold_sl","bronze","gold"].includes(item.key);
        // 일반 결선 종목: 본선 + 결선 + 단체
        if (["bronze_sl","gold_sl","bronze","gold"].includes(item.key)) return false;
        // 혼성팀: 단체전 제거
        if (isMixedType && item.key === "team") return false;
        return true;
      });

      // 25M 다조: "startlist" 항목을 조별 항목으로 교체
      if (hasMultiRelay) {
        const newItems = [];
        items.forEach(item => {
          if (item.key === "startlist") {
            relays25M.forEach(r => {
              newItems.push({ key: "startlist:" + r, label: "📋 " + r + "조 스타트리스트" });
            });
          } else {
            newItems.push(item);
          }
        });
        items = newItems;
      }

      // 항목이 1개뿐이면 단순 버튼
      if (items.length === 1) {
        const item = items[0];
        return <button onClick={() => openSessionView(sessionKey, item.key, eventCode, category)} style={{
          padding: "4px 8px", borderRadius: 5, border: "1px solid " + cfg.color + "88",
          background: isOpen && viewType === item.key ? cfg.color + "22" : "transparent", color: cfg.color,
          fontSize: 10, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap"
        }}>{isOpen && viewType === item.key ? "▲ 닫기" : cfg.label}</button>;
      }

      // 드롭다운 버튼
      return <div style={{ position: "relative", display: "inline-block" }}>
        <button onClick={(e) => { e.stopPropagation(); setDropdownKey(ddOpen ? null : sessionKey); }}
          style={{
            padding: "4px 8px", borderRadius: 5, border: "1px solid " + cfg.color + "88",
            background: isOpen ? cfg.color + "22" : "transparent", color: cfg.color,
            fontSize: 10, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap"
          }}>{isOpen ? "▲ 닫기" : cfg.label + " ▼"}</button>
        {ddOpen && <div style={{
          position: "absolute", left: 0, top: "100%", marginTop: 4, zIndex: 999,
          background: "#1a2744", border: "1px solid #334466", borderRadius: 8,
          padding: 4, minWidth: 170, boxShadow: "0 8px 24px rgba(0,0,0,.6)"
        }} onClick={e => e.stopPropagation()}>
          {items.map(item => (
            <div key={item.key} onClick={() => openSessionView(sessionKey, item.key, eventCode, category)}
              style={{ padding: "8px 12px", fontSize: 12, cursor: "pointer", borderRadius: 4, color: "#dde6f0",
                background: viewType === item.key && slSession === sessionKey ? "#334466" : "transparent" }}
              onMouseEnter={e => e.currentTarget.style.background = "#334466"}
              onMouseLeave={e => e.currentTarget.style.background = viewType === item.key && slSession === sessionKey ? "#334466" : "transparent"}>
              {item.label}
            </div>
          ))}
        </div>}
      </div>;
    };

    // ── 스타트리스트 테이블 렌더 ──
    const renderStartlistContent = (label) => {
      const isMedalSL = slData.some(p => p.lane === "team" || p.lane === "sub");
      const borderColor = label.includes("3/4위") ? "#cd7f3244" : label.includes("1/2위") ? "#ffd70044" : "#c9a84c44";
      const titleColor = label.includes("3/4위") ? "#cd7f32" : label.includes("1/2위") ? "#ffd700" : "#c9a84c";
      return (
      <div style={{ background: "#0a1628", padding: "12px 16px", borderTop: "2px solid " + borderColor }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: titleColor, marginBottom: 8 }}>
          {label}
        </div>
        {slLoading ? (
          <div style={{ textAlign: "center", padding: 16, color: "#667788" }}>⏳ 불러오는 중...</div>
        ) : slData.length === 0 ? (
          <div style={{ textAlign: "center", padding: 16, color: "#667788" }}>등록된 스타트리스트가 없습니다.</div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead><tr style={{ background: "#131d2e" }}>
                {(isMedalSL ? ["#", "팀/선수", "소속", "시도"] : ["#", "사대", "이름", "소속", "시도"]).map(h => (
                  <th key={h} style={{ padding: "6px 8px", borderBottom: "1px solid #1e3050", color: "#8899aa", fontSize: 11, fontWeight: 700, textAlign: "center" }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {(() => { let seq = 0; return slData.filter(p => !p.absent).map((p, i) => {
                  const isTeam = p.lane === "team";
                  const isSub = p.lane === "sub";
                  if (isTeam) seq++;
                  else if (!isMedalSL) seq++;
                  return (
                    <tr key={p.id || i} style={{ background: isTeam ? "#1a2a3a" : i % 2 === 0 ? "transparent" : "#0d152033" }}>
                      <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", textAlign: "center", color: "#8899aa", fontSize: 12 }}>{isTeam ? seq : isSub ? "" : seq}</td>
                      {!isMedalSL && <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", textAlign: "center", fontWeight: 700, color: "#b0c4de", fontSize: 12, fontFamily: "monospace" }}>{p.lane || "-"}</td>}
                      <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", fontWeight: isTeam ? 700 : 600, color: isTeam ? "#7dd3fc" : "#e8dcc8", fontSize: isTeam ? 13 : 12, paddingLeft: isSub ? 24 : 8 }}>{isSub ? "└ " : ""}{p.name}</td>
                      <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", color: "#8899aa", fontSize: 12 }}>{isTeam ? "" : (p.sub_org || "-")}</td>
                      <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", color: "#667788", fontSize: 12, textAlign: "center" }}>{isTeam ? p.region_name : ""}</td>
                    </tr>
                  );
                }); })()}
              </tbody>
            </table>
          </div>
        )}
      </div>
    );};

    // ── 경기 결과 테이블 렌더 ──
    const renderResultContent = (label, type, evCode) => {
      const isBronzeGold = type === "bronze" || type === "gold";
      const evInfo = dbEvents?.find(e => e.code === evCode);
      const is3Pos = evInfo?.result_format === "threePos" && (type === "prelim" || type === "team");
      // 시리즈 컬럼 자동 감지
      const seriesCols = [];
      if (!isBronzeGold && !is3Pos) {
        for (let i = 1; i <= 12; i++) {
          const k = "s" + i;
          if (resultData.some(r => r[k] && r[k] !== "")) seriesCols.push({ key: k, idx: i, label: type === "team" ? (i <= 3 ? "선수" + i : "S" + i) : "S" + i });
        }
      }
      const isFinal = type === "final";
      const headerStyle = { padding: "6px 8px", borderBottom: "1px solid #1e3050", color: "#8899aa", fontSize: 11, fontWeight: 700, textAlign: "center", whiteSpace: "nowrap" };
      const cellStyle = { padding: "5px 8px", borderBottom: "1px solid #1e305066", fontSize: 12, textAlign: "center" };

      // 결선: 격발 점수(쉼표 구분) → 시리즈별 누계 계산
      const getLastSeriesIdx = (r) => {
        for (let i = 12; i >= 1; i--) { if (r["s" + i] && r["s" + i] !== "") return i; }
        return 0;
      };
      const parseSeriesSum = (val) => {
        if (!val || val === "") return 0;
        if (val.includes(",")) return val.split(",").reduce((s, v) => s + (parseFloat(v) || 0), 0);
        return parseFloat(val) || 0;
      };
      const calcCumulative = (r) => {
        const cumArr = [];
        let running = 0;
        for (let i = 1; i <= 12; i++) {
          const val = r["s" + i];
          if (!val || val === "") break;
          running += parseSeriesSum(val);
          cumArr.push(parseFloat(running.toFixed(1)));
        }
        return cumArr;
      };
      let finalMaxVisible = 0;
      if (isFinal) {
        const maxSeries = Math.max(...resultData.map(r => getLastSeriesIdx(r)), 0);
        finalMaxVisible = maxSeries - 1;
      }

      const hasRemarks = resultData.some(r => r.remarks);

      return (
        <div style={{ background: "#0a1628", padding: "12px 16px", borderTop: "2px solid " + (isFinal ? "#a855f744" : type === "team" ? "#3b82f644" : type === "bronze" ? "#cd7f3244" : type === "gold" ? "#ffd70044" : "#c9a84c44") }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: isFinal ? "#a855f7" : type === "team" ? "#3b82f6" : type === "bronze" ? "#cd7f32" : type === "gold" ? "#ffd700" : "#c9a84c", marginBottom: 8 }}>
            {label}
          </div>
          {resultLoading ? (
            <div style={{ textAlign: "center", padding: 16, color: "#667788" }}>⏳ 불러오는 중...</div>
          ) : resultData.length === 0 ? (
            <div style={{ textAlign: "center", padding: 16, color: "#667788" }}>등록된 경기결과가 없습니다.</div>
          ) : (
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse" }}>
                <thead><tr style={{ background: "#131d2e" }}>
                  {is3Pos ? (
                    <>
                      <th style={headerStyle}>순위</th>
                      <th style={{ ...headerStyle, textAlign: "left" }}>이름</th>
                      <th style={headerStyle}>소속</th>
                      <th style={headerStyle}>자세</th>
                      <th style={headerStyle}>1</th>
                      <th style={headerStyle}>2</th>
                      <th style={headerStyle}>소계</th>
                      <th style={{ ...headerStyle, color: "#e8dcc8" }}>합계</th>
                      {hasRemarks && <th style={headerStyle}>비고</th>}
                    </>
                  ) : (
                    <>
                  <th style={headerStyle}>순위</th>
                  <th style={{ ...headerStyle, textAlign: "left" }}>이름</th>
                  <th style={headerStyle}>소속</th>
                  {isBronzeGold ? (
                    <th style={{ ...headerStyle, color: "#e8dcc8" }}>합계</th>
                  ) : isFinal ? (
                    <>
                      <th style={{ ...headerStyle, color: "#e8dcc8" }}>합계</th>
                      {Array.from({ length: finalMaxVisible }, (_, si) => (
                        <th key={si} style={headerStyle}>{(si + 1) + "S"}</th>
                      ))}
                    </>
                  ) : (
                    <>
                      {seriesCols.map(c => <th key={c.key} style={headerStyle}>{c.label}</th>)}
                      <th style={headerStyle}>합계</th>
                    </>
                  )}
                  
                  {hasRemarks && <th style={headerStyle}>비고</th>}
                    </>
                  )}
                </tr></thead>
                <tbody>
                  {is3Pos ? (
                    // ── 3자세 3행 렌더링 ──
                    resultData.map((r, i) => {
                      const isTeamRow = r.bib === "team";
                      const isSubRow = r.bib === "sub";
                      const isTop3 = r.rank && r.rank <= 3;
                      const medalColor = r.rank === 1 ? "#ffd700" : r.rank === 2 ? "#c0c0c0" : r.rank === 3 ? "#cd7f32" : null;
                      const poses = [{ name: "슬사", s1: "s1", s2: "s2", si: 1, color: "#6ee7b7" }, { name: "복사", s1: "s3", s2: "s4", si: 3, color: "#7dd3fc" }, { name: "입사", s1: "s5", s2: "s6", si: 5, color: "#c4b5fd" }];
                      const calcSub = (startS) => {
                        const v1 = parseFloat(r["s" + startS]) || 0, v2 = parseFloat(r["s" + (startS + 1)]) || 0;
                        return v1 + v2 || "";
                      };
                      const fmtTotalX = () => {
                        if (!r.total) return "-";
                        if (r.x_count) {
                          const xVal = typeof r.x_count === "string" && r.x_count.includes(",")
                            ? r.x_count.split(",").reduce((s, v) => s + (parseInt(v) || 0), 0)
                            : r.x_count;
                          return r.total + " -" + xVal + "x";
                        }
                        return r.total;
                      };
                      return poses.map((p, pi) => {
                        const isFirst = pi === 0, isLast = pi === 2;
                        const borderBot = isLast ? "2px solid #1e3050" : "1px solid transparent";
                        const bgColor = isTeamRow ? "#1a2a3a" : i % 2 === 0 ? "transparent" : "#0d152033";
                        return (
                          <tr key={(r.id || i) + "_" + pi} style={{ background: bgColor }}>
                            <td style={{ ...cellStyle, borderBottom: borderBot, fontWeight: isFirst && (isTop3 || isTeamRow) ? 800 : 400, color: isTeamRow ? "#7dd3fc" : isFirst ? (medalColor || "#8899aa") : "transparent", verticalAlign: isFirst ? "bottom" : isLast ? "top" : "middle", padding: isLast ? "5px 8px" : "2px 8px" }}>
                              {isFirst ? (isSubRow ? "" : (r.rank || "-")) : ""}
                            </td>
                            <td style={{ ...cellStyle, borderBottom: borderBot, textAlign: "left", fontWeight: isFirst && (isTeamRow ? 700 : 600) || 400, color: isFirst ? (isTeamRow ? "#7dd3fc" : isTop3 ? medalColor : "#e8dcc8") : "transparent", paddingLeft: isSubRow ? 24 : 8, verticalAlign: isFirst ? "bottom" : isLast ? "top" : "middle", padding: isLast ? "5px 8px" : "2px 8px" }}>
                              {isFirst ? ((isSubRow ? "└ " : "") + (r.name || "")) : ""}
                            </td>
                            <td style={{ ...cellStyle, borderBottom: borderBot, color: isFirst ? "#8899aa" : "transparent", fontSize: 11, verticalAlign: isFirst ? "bottom" : isLast ? "top" : "middle", padding: isLast ? "5px 8px" : "2px 8px" }}>
                              {isFirst ? (isTeamRow ? (r.region || "") : (r.sub_org || "-")) : ""}
                            </td>
                            <td style={{ ...cellStyle, borderBottom: borderBot, fontWeight: 600, fontSize: 10, color: p.color, padding: isLast ? "5px 8px" : "2px 8px" }}>{p.name}</td>
                            <td style={{ ...cellStyle, borderBottom: borderBot, fontFamily: "monospace", color: isTeamRow ? "#7dd3fc" : isSubRow ? "#7899aa" : "#b0c4de", fontSize: 12, padding: isLast ? "5px 8px" : "2px 8px" }}>{r[p.s1] || "-"}</td>
                            <td style={{ ...cellStyle, borderBottom: borderBot, fontFamily: "monospace", color: isTeamRow ? "#7dd3fc" : isSubRow ? "#7899aa" : "#b0c4de", fontSize: 12, padding: isLast ? "5px 8px" : "2px 8px" }}>{r[p.s2] || "-"}</td>
                            <td style={{ ...cellStyle, borderBottom: borderBot, fontFamily: "monospace", fontWeight: 600, color: isTeamRow ? "#7dd3fc" : isSubRow ? "#7899aa" : "#b0c4de", fontSize: 12, padding: isLast ? "5px 8px" : "2px 8px" }}>{calcSub(p.si) || "-"}</td>
                            <td style={{ ...cellStyle, borderBottom: borderBot, fontWeight: isLast ? (isTeamRow ? 800 : 700) : 400, color: isLast ? (isTeamRow ? "#7dd3fc" : "#e8dcc8") : "transparent", fontFamily: "monospace", fontSize: 13, verticalAlign: isFirst ? "bottom" : isLast ? "top" : "middle", padding: isLast ? "5px 8px" : "2px 8px" }}>
                              {isLast ? fmtTotalX() : ""}
                            </td>
                            {hasRemarks && <td style={{ ...cellStyle, borderBottom: borderBot, color: "#667788", fontSize: 10, verticalAlign: isFirst ? "bottom" : isLast ? "top" : "middle" }}>{isLast ? (r.remarks || "") : ""}</td>}
                          </tr>
                        );
                      });
                    })
                  ) : (
                  resultData.map((r, i) => {
                    const isTeamRow = r.bib === "team";
                    const isSubRow = r.bib === "sub";
                    const isTop3 = r.rank && r.rank <= 3;
                    const medalColor = r.rank === 1 ? "#ffd700" : r.rank === 2 ? "#c0c0c0" : r.rank === 3 ? "#cd7f32" : null;
                    const cumVals = isFinal ? calcCumulative(r) : [];
                    const lastSIdx = isFinal ? getLastSeriesIdx(r) : 0;

                    // 결정전 sub행: 이름+소속만
                    if (isBronzeGold && isSubRow) {
                      
                      return (
                        <tr key={r.id || i}>
                          <td style={cellStyle}></td>
                          <td style={{ ...cellStyle, textAlign: "left", paddingLeft: 24, color: "#94a3b8", fontSize: 11 }}>└ {r.name}</td>
                          <td style={{ ...cellStyle, color: "#64748b", fontSize: 11 }}>{r.sub_org || "-"}</td>
                          <td style={cellStyle}></td>
                          
                          {hasRemarks && <td style={cellStyle}></td>}
                        </tr>
                      );
                    }

                    return (
                      <tr key={r.id || i} style={{ background: isTeamRow ? "#1a2a3a" : i % 2 === 0 ? "transparent" : "#0d152033" }}>
                        <td style={{ ...cellStyle, fontWeight: isTop3||isTeamRow ? 800 : 400, color: isTeamRow ? "#7dd3fc" : (medalColor || "#8899aa") }}>
                          {isSubRow ? "" : (r.rank || "-")}
                        </td>
                        <td style={{ ...cellStyle, textAlign: "left", fontWeight: isTeamRow ? 700 : 600, color: isTeamRow ? "#7dd3fc" : isTop3 ? medalColor : "#e8dcc8", paddingLeft: isSubRow ? 24 : 8 }}>{isSubRow ? "└ " : ""}{r.name}</td>
                        <td style={{ ...cellStyle, color: "#8899aa", fontSize: 11 }}>{isTeamRow ? (r.region || "") : (r.sub_org || "-")}</td>
                        {isBronzeGold ? (
                          <td style={{ ...cellStyle, fontWeight: 800, color: "#e8dcc8", fontFamily: "monospace", fontSize: 13 }}>{r.total || "-"}</td>
                        ) : isFinal ? (
                          <>
                            <td style={{ ...cellStyle, fontWeight: 800, color: "#e8dcc8", fontFamily: "monospace", fontSize: 13 }}>{r.total || "-"}</td>
                            {Array.from({ length: finalMaxVisible }, (_, si) => {
                              const sNum = si + 1;
                              const isHidden = sNum >= lastSIdx;
                              const cumVal = cumVals[si];
                              return (
                                <td key={si} style={{ ...cellStyle, fontFamily: "monospace", color: "#b0c4de" }}>
                                  {isHidden || cumVal === undefined ? "" : cumVal.toFixed(1)}
                                </td>
                              );
                            })}
                          </>
                        ) : (
                          <>
                            {seriesCols.map(c => <td key={c.key} style={{ ...cellStyle, fontFamily: "monospace", color: isSubRow ? "#7899aa" : "#b0c4de", fontSize: isSubRow ? 11 : 12 }}>{r[c.key] || "-"}</td>)}
                            <td style={{ ...cellStyle, fontWeight: isSubRow ? 600 : 700, color: isSubRow ? "#7899aa" : "#e8dcc8", fontFamily: "monospace", fontSize: isSubRow ? 11 : 12 }}>{r.total || "-"}</td>
                          </>
                        )}
                        
                        {hasRemarks && <td style={{ ...cellStyle, color: "#667788", fontSize: 10 }}>{r.remarks || ""}</td>}
                      </tr>
                    );
                  })
                  )}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    };

    // ── 열린 세션의 확장 콘텐츠 렌더 ──
    const renderExpanded = (sessionKey, row) => {
      if (slSession !== sessionKey) return null;
      const evCode = row.event_code;
      const evName = row.content || evCode;
      if (viewType === "startlist") return renderStartlistContent("📋 " + evName + " 스타트리스트");
      if (viewType && viewType.startsWith("startlist:")) {
        const relayNum = viewType.split(":")[1];
        const evInfo = dbEvents?.find(e => e.code === evCode);
        return renderStartlistContent("📋 " + (evInfo?.name || evCode) + " " + relayNum + "조 스타트리스트");
      }
      if (viewType === "final_sl") return renderStartlistContent("📋 " + evCode + " 결선 스타트리스트");
      if (viewType === "bronze_sl") return renderStartlistContent("🥉 " + evCode + " 3/4위 결정전 명단");
      if (viewType === "gold_sl") return renderStartlistContent("🥇 " + evCode + " 1/2위 결정전 명단");
      if (viewType === "prelim") return renderResultContent("📊 " + evCode + " 본선 경기결과", "prelim", evCode);
      if (viewType === "final") return renderResultContent("🏅 " + evCode + " 결선 경기결과", "final", evCode);
      if (viewType === "bronze") return renderResultContent("🥉 " + evCode + " 3/4위 결정전 결과", "bronze", evCode);
      if (viewType === "gold") return renderResultContent("🥇 " + evCode + " 1/2위 결정전 결과", "gold", evCode);
      if (viewType === "team") return renderResultContent("👥 " + evCode + " 단체전 경기결과", "team", evCode);
      return null;
    };

    const selT = activeTournaments.find(t => t.id === scheduleTournament);
    const dayLabel = (dayNum) => {
      if (!selT) return dayNum + "일차";
      const dateStr = selT.date || "";
      const m = dateStr.match(/(\d{4})년\s*(\d{2})월\s*(\d{2})일/);
      if (m) { const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])); d.setDate(d.getDate() + dayNum - 1); return (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
      return dayNum + "일차";
    };

    const bgGrad = "linear-gradient(160deg, #0d1520 0%, #1a2744 40%, #0d1520 100%)";
    const cardBg = "#131d2e";
    const borderC = "#1e3050";
    const goldC = "#c9a84c";

    // 대회 목록 (진행중)
    if (schedulePage === "list") {
      return (
        <div style={{ minHeight: "100vh", background: bgGrad, fontFamily: "'Noto Sans KR', sans-serif", padding: "40px 16px" }}>
          <div style={{ maxWidth: 700, margin: "0 auto" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 32 }}>
              <button onClick={() => setPage("landing")} style={{ background: "none", border: "1px solid #334466", borderRadius: 8, color: "#8899aa", padding: "8px 16px", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>← 돌아가기</button>
              <h2 style={{ fontSize: 22, fontWeight: 800, color: "#e8dcc8", margin: 0 }}>기록지 및 스타트리스트</h2>
              {adminMode && <span style={{ fontSize: 11, fontWeight: 700, color: "#c9a84c", background: "#c9a84c22", border: "1px solid #c9a84c44", borderRadius: 6, padding: "3px 10px", whiteSpace: "nowrap" }}>🔓 관리자: 전체 대회</span>}
            </div>
            {ongoingTournaments.length === 0 ? (
              <div style={{ textAlign: "center", padding: "60px 20px", color: "#667788" }}>
                <div style={{ fontSize: 48, marginBottom: 16 }}>📋</div>
                <div style={{ fontSize: 16, fontWeight: 600 }}>{adminMode ? "등록된 대회가 없습니다" : "현재 진행 중인 대회가 없습니다"}</div>
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {ongoingTournaments.map(t => {
                  const st = STATUS_MAP[t.status] || STATUS_MAP[3];
                  return (
                  <button key={t.id} onClick={() => loadSchedule(t.id)} style={{
                    display: "flex", alignItems: "center", gap: 16, padding: 0, background: cardBg, border: "1px solid " + borderC,
                    borderRadius: 12, cursor: "pointer", overflow: "hidden", textAlign: "left", width: "100%",
                  }}>
                    <div style={{ width: 70, minHeight: 70, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, background: st.bg, borderRight: `1px solid ${st.color}33` }}>
                      <div style={{ width: 10, height: 10, borderRadius: 3, background: st.color, boxShadow: t.status <= 2 ? `0 0 8px ${st.color}88` : "none" }} />
                      <span style={{ fontSize: 11, fontWeight: 700, color: st.color }}>{st.label}</span>
                    </div>
                    <div style={{ flex: 1, padding: "12px 16px 12px 0" }}>
                      <div style={{ fontSize: 16, fontWeight: 700, color: "#e8dcc8" }}>{t.name}</div>
                      <div style={{ fontSize: 12, color: "#8899aa", marginTop: 4 }}>📅 {t.date}</div>
                      <div style={{ fontSize: 12, color: "#8899aa" }}>📍 {t.venue}</div>
                    </div>
                    <div style={{ padding: "0 16px", color: st.color, fontSize: 18 }}>→</div>
                  </button>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 시간표 상세 (일자별 시트)
    const currentDayData = scheduleData.find(d => d.day === scheduleDay);
    const availableDays = scheduleData.map(d => d.day).sort((a, b) => a - b);
    if (availableDays.length > 0 && !availableDays.includes(scheduleDay)) setScheduleDay(availableDays[0]);

    return (
      <div style={{ minHeight: "100vh", background: bgGrad, fontFamily: "'Noto Sans KR', sans-serif", padding: "24px 12px" }}>
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          {/* 헤더 */}
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
            <button onClick={() => { setSchedulePage("list"); setScheduleTournament(null); }}
              style={{ background: "none", border: "1px solid #334466", borderRadius: 8, color: "#8899aa", padding: "8px 16px", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>← 목록</button>
            <div>
              <h2 style={{ fontSize: 18, fontWeight: 800, color: "#e8dcc8", margin: 0 }}>{selT?.name || ""}</h2>
              <div style={{ fontSize: 12, color: "#8899aa" }}>대회 일정표</div>
            </div>
          </div>

          {/* 일자 탭 (시트 스타일) */}
          {scheduleLoading ? (
            <div style={{ textAlign: "center", padding: 60, color: "#667788", fontSize: 15 }}>⏳ 시간표 불러오는 중...</div>
          ) : scheduleData.length === 0 ? (
            <div style={{ textAlign: "center", padding: "60px 20px", color: "#667788" }}>
              <div style={{ fontSize: 48, marginBottom: 16 }}>📋</div>
              <div style={{ fontSize: 16, fontWeight: 600 }}>등록된 시간표가 없습니다</div>
              <div style={{ fontSize: 13, marginTop: 8 }}>아직 대회 시간표가 게시되지 않았습니다.</div>
            </div>
          ) : (
            <>
              {/* 시트 탭 바 */}
              <div style={{ display: "flex", gap: 0, marginBottom: 0, borderBottom: "2px solid " + borderC }}>
                {availableDays.map(d => {
                  const active = d === scheduleDay;
                  return (
                    <button key={d} onClick={() => { setScheduleDay(d); setSlSession(null); }} style={{
                      padding: "10px 20px", border: "1px solid " + (active ? goldC : borderC), borderBottom: active ? "2px solid " + cardBg : "1px solid " + borderC,
                      borderRadius: "8px 8px 0 0", marginBottom: active ? -2 : 0,
                      background: active ? cardBg : "transparent", color: active ? goldC : "#667788",
                      fontWeight: active ? 800 : 600, fontSize: 14, cursor: "pointer",
                    }}>{dayLabel(d)} <span style={{ fontSize: 11, opacity: 0.7 }}>({d}일차)</span></button>
                  );
                })}
              </div>

              {/* 시간표 테이블 */}
              {currentDayData && currentDayData.rows.length > 0 && (() => {
                const { spans: rawSpans, sk } = calcSpans(currentDayData.rows);
                // 열린 스타트리스트에 의한 추가 행을 rowSpan에 반영
                const spans = [...rawSpans];
                currentDayData.rows.forEach((row, ri) => {
                  const sKey = (row.event_code && row.relay && row.type === "prelim") ? row.event_code + "_" + row.relay : null;
                  if (sKey && slSession === sKey) {
                    // 이 행이 속한 카테고리 그룹의 시작 인덱스 찾기
                    let groupStart = ri;
                    while (groupStart > 0 && sk.has(groupStart)) groupStart--;
                    spans[groupStart]++;
                  }
                });
                const thSt = { padding: "10px 8px", borderBottom: "2px solid " + borderC, color: "#8899aa", fontWeight: 700, fontSize: 12, textAlign: "center" };
                const tdSt = { padding: "10px 8px", borderBottom: "1px solid " + borderC, fontSize: 13, verticalAlign: "middle" };
                return (
                  <div style={{ background: cardBg, border: "1px solid " + borderC, borderTop: "none", borderRadius: "0 0 10px 10px" }}>
                    {isMobile ? (
                      /* ── 모바일: 카드형 2행 레이아웃 ── */
                      <div onClick={() => setDropdownKey(null)}>
                        {currentDayData.rows.map((row, ri) => {
                          const showCat = !sk.has(ri);
                          const isPET = row.type === "pet";
                          const cc = catColor(row.category);
                          const sessionKey = (row.event_code && row.relay && row.type === "prelim") ? row.event_code + "_" + row.relay : null;
                          const isSlOpen = sessionKey && slSession === sessionKey;
                          const bgColor = isSlOpen ? "#1e3050" : ri % 2 === 0 ? "transparent" : "#0d152033";
                          return (
                            <div key={row.id || ri} style={{ borderBottom: "1px solid " + borderC }}>
                              {showCat && (
                                <div style={{ padding: "6px 12px", background: cc + "15", borderBottom: "1px solid " + cc + "33", borderLeft: "3px solid " + cc }}>
                                  <span style={{ fontSize: 12, fontWeight: 700, color: cc }}>{row.category}</span>
                                </div>
                              )}
                              <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", background: bgColor }}>
                                {sessionKey && renderSessionBtn(sessionKey, row.event_code, row.category)}
                                <div style={{ flex: 1, color: isPET ? "#8899aa" : "#e8dcc8", fontStyle: isPET ? "italic" : "normal", fontWeight: isPET ? 400 : 600, fontSize: 14 }}>
                                  {isPET ? "🏋️ " : ""}{row.content || row.event_code}
                                </div>
                              </div>
                              <div style={{ display: "flex", gap: 16, padding: "4px 12px 10px", background: bgColor }}>
                                <span style={{ color: "#b0c4de", fontFamily: "monospace", fontWeight: 600, fontSize: 13 }}>{row.time_slot || row.time || ""}</span>
                                {(row.participant_count || row.count) ? <span style={{ color: "#8899aa", fontSize: 12 }}>{String(row.participant_count || row.count).replace(/명$/, "")}명</span> : null}
                                {row.remark ? <span style={{ color: "#667788", fontSize: 12 }}>{row.remark}</span> : null}
                              </div>
                              {isSlOpen && renderExpanded(sessionKey, row)}
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      /* ── 데스크톱: 기존 테이블 레이아웃 ── */
                    <table style={{ width: "100%", borderCollapse: "collapse" }} onClick={() => setDropdownKey(null)}>
                      <thead>
                        <tr style={{ background: "#0d1520" }}>
                          <th style={{ ...thSt, width: 60 }}>구분</th>
                          <th style={{ ...thSt, textAlign: "left" }}>내용</th>
                          <th style={{ ...thSt, width: 100 }}>시간</th>
                          <th style={{ ...thSt, width: 55 }}>인원</th>
                          <th style={{ ...thSt, width: 80 }}>비고</th>
                        </tr>
                      </thead>
                      <tbody>
                        {currentDayData.rows.map((row, ri) => {
                          const showCat = !sk.has(ri);
                          const isPET = row.type === "pet";
                          const cc = catColor(row.category);
                          const sessionKey = (row.event_code && row.relay && row.type === "prelim") ? row.event_code + "_" + row.relay : null;
                          const isSlOpen = sessionKey && slSession === sessionKey;
                          return (
                            <React.Fragment key={row.id || ri}>
                              <tr style={{ background: isSlOpen ? "#1e3050" : ri % 2 === 0 ? "transparent" : "#0d152033" }}>
                                {showCat && <td rowSpan={spans[ri]} style={{ ...tdSt, textAlign: "center", fontWeight: 700, fontSize: 12, color: cc, borderRight: "3px solid " + cc + "44" }}>{row.category}</td>}
                                <td style={{ ...tdSt, textAlign: "left", paddingLeft: 12, color: isPET ? "#8899aa" : "#e8dcc8", fontStyle: isPET ? "italic" : "normal", fontWeight: isPET ? 400 : 600 }}>
                                  <div style={{ display: "flex", alignItems: "center", gap: 8 }} onClick={e => e.stopPropagation()}>
                                    {sessionKey && renderSessionBtn(sessionKey, row.event_code, row.category)}
                                    <span>{isPET ? "🏋️ " : ""}{row.content || row.event_code}</span>
                                  </div>
                                </td>
                                <td style={{ ...tdSt, textAlign: "center", color: "#b0c4de", fontFamily: "monospace", fontWeight: 600 }}>{row.time_slot || row.time || ""}</td>
                                <td style={{ ...tdSt, textAlign: "center", color: "#8899aa" }}>{(row.participant_count || row.count) ? String(row.participant_count || row.count).replace(/명$/, "") + "명" : ""}</td>
                                <td style={{ ...tdSt, textAlign: "center", color: "#667788", fontSize: 12 }}>{row.remark || ""}</td>
                              </tr>
                              {isSlOpen && (
                                <tr><td colSpan={5} style={{ padding: 0, borderBottom: "1px solid " + borderC }}>
                                  {renderExpanded(sessionKey, row)}
                                </td></tr>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                    )}
                  </div>
                );
              })()}
            </>
          )}
        </div>
      </div>
    );
  }

  if (showComplete && !showCertificate) {
    const tournament = activeTournaments.find(t => t.id === selectedTournament);
    return (
      <div style={{ minHeight: "100vh", background: "linear-gradient(160deg, #0d1520 0%, #1a2744 40%, #0d1520 100%)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Noto Sans KR', sans-serif", position: "relative", overflow: "hidden" }}>
        <img src={LOGO_IMG} alt="" style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", width: 600, maxWidth: "90%", opacity: 0.05, pointerEvents: "none" }} />
        <div style={{ textAlign: "center", padding: "40px 30px", maxWidth: 560, width: "100%", position: "relative", zIndex: 1 }}>
          <div style={{ fontSize: 56, marginBottom: 24 }}>✅</div>
          <h1 style={{ fontSize: 28, fontWeight: 800, color: "#c9a84c", marginBottom: 16, letterSpacing: 2 }}>참가신청 완료</h1>
          <p style={{ fontSize: 17, color: "#c8d4e4", lineHeight: 1.8, marginBottom: 40 }}>
            <strong style={{ color: "#c9a84c", fontSize: 19 }}>"{tournament?.name}"</strong>
            <br />참가신청이 정상적으로 완료되었습니다.
            {applicationId && <><br /><span style={{ fontSize: 13, color: "#8899aa" }}>신청번호: {applicationId}</span></>}
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 12, maxWidth: 340, margin: "0 auto" }}>
            <button
              onClick={() => setShowCertificate(true)}
              style={{
                width: "100%", padding: "16px 24px", borderRadius: 10,
                background: "linear-gradient(135deg, #c9a84c, #a8872e)",
                border: "none", color: "#1a2744", fontSize: 16, fontWeight: 800,
                cursor: "pointer", transition: "all 0.2s",
                boxShadow: "0 4px 20px #c9a84c33",
              }}
              onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 28px #c9a84c55"; }}
              onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 20px #c9a84c33"; }}
            >참가신청 확인서 발급</button>
            <button
              onClick={() => {
                setShowComplete(false);
                setApplicationId(null);
                setSubmitError(null);
                setPage("landing");
                setStep(0);
                setSelectedTournament(null);
                setSelectedRegion(null);
                setOrgName("");
                setMembers([{ id: 1, name: "", dob: "", role: "", subOrg: "", subOrgMode: "", gender: "", events: [] }]);
                setIndividualEvents({});
                setTeamComps({});
                setTeamUnion({});
                setLeagueComps({});
                setLeagueUnion({});
                setFirearms({});
              }}
              style={{
                width: "100%", padding: "14px 24px", borderRadius: 10,
                background: "transparent", border: "1px solid #3d5278",
                color: "#8899aa", fontSize: 15, fontWeight: 600,
                cursor: "pointer", transition: "all 0.2s",
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = "#c9a84c"; e.currentTarget.style.color = "#c9a84c"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "#3d5278"; e.currentTarget.style.color = "#8899aa"; }}
            >종료</button>
          </div>
        </div>
      </div>
    );
  }

  if (showCertificate) {
    const tournament = activeTournaments.find(t => t.id === selectedTournament);
    const region = REGIONS[selectedRegion];
    const players = members.filter(m => m.role === "선수");
    const staffs = members.filter(m => m.role !== "선수");
    const allIndividual = activeIndividualEvents.filter(ev =>
      (individualEvents[ev.code] || []).length > 0 && players.some(p => p.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === p.gender))

    const today = new Date();

          <button onClick={() => setCertZoom(1.0)} style={{ background: "#555", border: "none", borderRadius: 4, color: "#ddd", padding: "4px 10px", fontSize: 12, cursor: "pointer" }}>100%</button>

          {/* 워터마크 */}
          <img src={LOGO_IMG} alt="" style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", width: 500, opacity: 0.07, pointerEvents: "none", zIndex: 0 }} />

          {/* 본문 영역 (flex-grow) */}
          <div style={{ flex: 1, position: "relative", zIndex: 1 }}>

          {/* 제목 */}

          <div style={{ marginBottom: 28 }}>
            <div style={{ ...ds, fontSize: 15, fontWeight: 700, marginBottom: 8, borderBottom: "2px solid #111", paddingBottom: 4 }}>1. 대회 정보</div>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <tbody>
                <tr><td style={th}>대회명</td><td style={{ ...tdL, fontWeight: 700 }} colSpan={3}>{tournament?.name}</td></tr>
                <tr><td style={th}>소속 시/도</td><td style={tdL}>{region?.name}</td><td style={th}>신청 단체명</td><td style={{ ...tdL, fontWeight: 700 }}>{orgName}</td></tr>
              </tbody>
            </table>
          </div>

          {/* 2. 선수단 명단 */}
          <div style={{ marginBottom: 28 }}>
            <div style={{ ...ds, fontSize: 15, fontWeight: 700, marginBottom: 8, borderBottom: "2px solid #111", paddingBottom: 4 }}>2. 선수단 명단 ({members.length}명)</div>
            {players.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <div style={{ ...ds, fontSize: 13, fontWeight: 700, marginBottom: 4 }}>가. 선수 ({players.length}명)</div>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead><tr>{["번호","성명","성별","생년월일","세부소속","참가종별"].map(h => <th key={h} style={th}>{h}</th>)}</tr></thead>
                  <tbody>
                    {players.map((p, i) => (
                      <tr key={p.id}>
                        <td style={td}>{i+1}</td>
                        <td style={{ ...td, fontWeight: 600 }}>{p.name}</td>
                        <td style={td}>{p.gender}</td>
                        <td style={td}>{p.dob}</td>
                        <td style={td}>{p.subOrg}</td>
                        <td style={tdL}>{p.events.join(", ")}</td>

                  </tbody>
                </table>
              </div>

            {staffs.length > 0 && (
              <div>
                <div style={{ ...ds, fontSize: 13, fontWeight: 700, marginBottom: 4 }}>나. 임원 ({staffs.length}명)</div>

                  <thead><tr>{["번호","성명","성별","직책","세부소속"].map(h => <th key={h} style={th}>{h}</th>)}</tr></thead>
                  <tbody>
                    {staffs.map((m, i) => (
                      <tr key={m.id}>

                        <td style={{ ...td, fontWeight: 600 }}>{m.name}</td>
                        <td style={td}>{m.gender}</td>
                        <td style={td}>{m.role}</td>
                        <td style={td}>{m.subOrg}</td>
                      </tr>

                  </tbody>
                </table>
              </div>

          {/* 3. 종목별 참가 현황 */}

            {allIndividual.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <div style={{ ...ds, fontSize: 13, fontWeight: 700, marginBottom: 4 }}>가. 개인전</div>

                  <thead><tr>{["종목코드","종목명","참가선수","인원"].map(h => <th key={h} style={th}>{h}</th>)}</tr></thead>
                  <tbody>
                    {allIndividual.map(ev => {

                        <tr key={ev.code}>
                          <td style={{ ...td, fontWeight: 700 }}>{ev.code}</td>
                          <td style={tdL}>{ev.name.replace(ev.code + " ", "")}</td>

                          <td style={td}>{names.length}</td>

                  </tbody>
                </table>

                      const filledSlots = slots.filter(s => s !== null);
                      const names = filledSlots.map(id => members.find(mm => mm.id === id)?.name).filter(Boolean);
                      const isPair = key.startsWith("pair-");
                      const isTeam = key.startsWith("team-");
                      let label = key;
                      if (isTeam) label = key.replace("team-", "") + " 단체전";
                      if (isPair) { const pts = key.replace("pair-", "").split("-"); label = pts[0] + " 혼성팀 " + pts[1] + "팀"; }

                          <td style={td}>{names.length}</td>

              <div style={{ marginBottom: 28 }}>
                <div style={{ ...ds, fontSize: 15, fontWeight: 700, marginBottom: 8, borderBottom: "2px solid #111", paddingBottom: 4 }}>🏆 리그전 등록 ({allLg.length}종목)</div>

                      const evCode = key.replace("league-", "");

                      const union = leagueUnion[key];
                      return (
                        <tr key={key}>
                          <td style={{ ...td, fontWeight: 700 }}>{evCode}</td>
                          <td style={td}>{names[0] || "-"}</td>
                          <td style={td}>{names[1] || "-"}</td>
                          <td style={tdL}>{union?.checked ? "연합: " + (union.memo || "-") : "-"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            );
          })()}

          {/* 4. 총기 등록 현황 */}
          {(() => {
            const allGuns = players.flatMap(p => (firearms[p.id] || []).map(g => ({ ...g, playerName: p.name })));
            if (allGuns.length === 0) return null;
            return (
              <div style={{ marginBottom: 28 }}>
                <div style={{ ...ds, fontSize: 15, fontWeight: 700, marginBottom: 8, borderBottom: "2px solid #111", paddingBottom: 4 }}>4. 총기 등록 현황 ({allGuns.length}정)</div>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead><tr>{["번호","선수명","총종","제조사","모델명","총기번호","허가증번호"].map(h => <th key={h} style={th}>{h}</th>)}</tr></thead>
                  <tbody>
                    {allGuns.map((g, i) => (
                      <tr key={i}>
                        <td style={td}>{i+1}</td>
                        <td style={{ ...td, fontWeight: 600 }}>{g.playerName}</td>
                        <td style={td}>{g.type || "-"}</td>
                        <td style={td}>{g.maker || "-"}</td>
                        <td style={td}>{g.model || "-"}</td>
                        <td style={td}>{g.serial || "-"}</td>
                        <td style={td}>{g.permit || "-"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          })()}
          </div>

          {/* 하단 확인란 (항상 페이지 하단) */}
          <div style={{ position: "relative", zIndex: 1 }}>
          {/* 확인 문구 */}
          <div style={{ ...ds, fontSize: 15, textAlign: "center", marginTop: 44, marginBottom: 40, lineHeight: 2.4 }}>
            <p>본 연맹에서는 상기 단체에서 위와 같이</p>
            <p><strong style={{ fontSize: 17, borderBottom: "1px solid #111", paddingBottom: 2 }}>"{tournament?.name}"</strong> 에</p>
            <p>참가신청 하였음을 확인합니다.</p>
          </div>

          {/* 발급일자 */}
          <div style={{ ...ds, fontSize: 16, textAlign: "center", marginBottom: 40 }}>
            {dateStr}
          </div>

          {/* 발급기관 + 직인 */}
          <div style={{ textAlign: "center", position: "relative", marginBottom: 20 }}>
            <div style={{ ...ds, fontSize: 24, fontWeight: 800, letterSpacing: 8 }}>대한장애인사격연맹</div>
          </div>
          </div>

        </div>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.container}>
      {/* Header */}
      <div style={{ ...styles.header, flexWrap: "wrap", gap: isMobile ? 8 : 16, padding: isMobile ? "12px 14px" : "16px 24px" }}>
        <button style={{ ...styles.backBtn, padding: isMobile ? "6px 10px" : "8px 16px", fontSize: isMobile ? 12 : 14 }} onClick={() => {
          if (showEntryChoice) { setShowEntryChoice(false); }
          else if (step > 0) { setStep(step - 1); }
          else { setPage("landing"); setSelectedRegion(null); setSelectedTournament(null); setStep(0); }

          <div style={{ marginLeft: "auto", position: "relative" }}>
            <button onClick={() => setShowSaveMenu(v => !v)} style={{ background: "none", border: "1px solid #3d5278", color: "#8899aa", padding: "6px 12px", borderRadius: 6, cursor: "pointer", fontSize: 12, whiteSpace: "nowrap", display: "flex", alignItems: "center", gap: 4 }}>

            </button>

              <>
                <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, zIndex: 998 }} onClick={() => setShowSaveMenu(false)} />

      <div style={{ overflow: "hidden", padding: isMobile ? "12px 14px" : "16px 24px" }}>

        </div>

                    <div style={{ fontSize: 12, color: "#8899aa" }}>📍 {t.venue}</div>
                  </div>
                  {isSel && t.status !== 4 && <div style={{ display: "flex", alignItems: "center", padding: "0 16px", color: "#c9a84c", fontSize: 20 }}>✓</div>}
                  {t.status === 4 && (
                    <div style={{ display: "flex", alignItems: "center", padding: "0 12px", flexShrink: 0 }}>
                      <div
                        onClick={(e) => { e.stopPropagation(); }}
                        style={{
                          padding: "8px 14px", borderRadius: 6,
                          background: "transparent", border: "1px solid #5a7aaa",
                          color: "#8899aa", fontSize: 12, fontWeight: 600,
                          cursor: "pointer", whiteSpace: "nowrap",
                        }}
                      >결과 확인</div>
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      )}
      {step === 0 && showEntryChoice && (() => {
        const t = activeTournaments.find(t => t.id === selectedTournament);
        return (
          <div style={{ flex: 1, overflow: "auto", padding: isMobile ? "12px 16px" : "16px 24px" }}>
            <div style={{ maxWidth: 520, margin: "0 auto" }}>
              {/* Selected tournament summary */}
              <div style={{ background: "#1e3050", border: "1px solid #c9a84c44", borderRadius: 10, padding: isMobile ? "12px 14px" : "16px 20px", marginBottom: isMobile ? 20 : 28 }}>
                <div style={{ fontSize: 11, color: "#8899aa", fontWeight: 600, marginBottom: 4 }}>선택된 대회</div>
                <div style={{ fontSize: isMobile ? 15 : 18, fontWeight: 700, color: "#c9a84c" }}>{t?.name}</div>
                <div style={{ fontSize: 12, color: "#8899aa", marginTop: 4 }}>📅 {t?.date} &nbsp; 📍 {t?.venue}</div>
              </div>

              <h2 style={{ ...styles.sectionTitle, textAlign: "center", marginBottom: 8, fontSize: isMobile ? 15 : undefined }}>참가신청 방법을 선택하세요</h2>
              <p style={{ ...styles.sectionSub, textAlign: "center", marginBottom: isMobile ? 20 : 28 }}>새로 작성하거나, 저장한 파일로 이어서 작성할 수 있습니다.</p>

              <div style={{ display: "flex", flexDirection: "column", gap: isMobile ? 10 : 14 }}>
                <button
                  onClick={() => { setShowEntryChoice(false); setStep(1); }}
                  style={{
                    display: "flex", alignItems: "center", gap: isMobile ? 12 : 16, padding: isMobile ? "16px 18px" : "22px 24px",
                    background: "linear-gradient(135deg, #c9a84c, #a08030)", border: "none",
                    borderRadius: 12, cursor: "pointer", textAlign: "left", color: "#1a2744",
                    transition: "transform 0.15s",
                  }}
                >
                  <span style={{ fontSize: isMobile ? 22 : 28 }}>📋</span>
                  <span>
                    <div style={{ fontSize: isMobile ? 15 : 18, fontWeight: 700 }}>신규 참가신청</div>
                    <div style={{ fontSize: 12, opacity: 0.7, marginTop: 2 }}>처음부터 새로 작성합니다</div>
                  </span>
                </button>
                <button
                  onClick={() => { importFromExcel(); }}
                  style={{
