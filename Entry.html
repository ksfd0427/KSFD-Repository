  { code: "R11", name: "R11 공기소총 복사 혼성팀 SH2", cat: "소총(SH2)", size: 2 },
  { code: "P6", name: "P6 공기권총 혼성팀 SH1", cat: "권총", size: 2 },
];

// ===== Supabase 연결 =====
const SUPABASE_URL = "https://iwasaoroejigbngekjnp.supabase.co";
const SUPABASE_KEY = "sb_publishable_3Dc08ofqVs-XFGPpSC_Cug_WArWTPX1";
const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

function TournamentRegistration() {
  const [step, setStep] = useState(0);
  const [page, setPage] = useState("landing");
  const [selectedTournament, setSelectedTournament] = useState(null);
  const [hoveredRegion, setHoveredRegion] = useState(null);
  const [selectedRegion, setSelectedRegion] = useState(null);
  const [orgName, setOrgName] = useState("");
  const [members, setMembers] = useState([
    { id: 1, name: "", dob: "", role: "", subOrg: "", subOrgMode: "", gender: "", events: [] }
  ]);
  const [expandedMember, setExpandedMember] = useState(1);
  const [individualEvents, setIndividualEvents] = useState({});
  const [teamComps, setTeamComps] = useState({});
  const [teamUnion, setTeamUnion] = useState({});
  const [dropdownSlot, setDropdownSlot] = useState(null);
  const [dropdownPos, setDropdownPos] = useState(null);
  const openDropdown = (key, e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const spaceBelow = window.innerHeight - rect.bottom;
    const openUp = spaceBelow < 160;
    setDropdownPos({ top: openUp ? null : rect.bottom + 2, bottom: openUp ? (window.innerHeight - rect.top + 2) : null, left: rect.left, width: Math.max(rect.width, 110) });
    setDropdownSlot(key);
  };
  const [dragMember, setDragMember] = useState(null);
  const [firearms, setFirearms] = useState({});
  const [showCertificate, setShowCertificate] = useState(false);
  const [showComplete, setShowComplete] = useState(false);
  const [highlightId, setHighlightId] = useState(null);
  const [dbTournaments, setDbTournaments] = useState(null);
  const [dbEvents, setDbEvents] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState(null);
  const [applicationId, setApplicationId] = useState(null);
  const [schedulePage, setSchedulePage] = useState("list"); // "list" or "detail"
  const [scheduleTournament, setScheduleTournament] = useState(null);
  const [scheduleDay, setScheduleDay] = useState(1);
  const [scheduleData, setScheduleData] = useState([]);
  const [scheduleLoading, setScheduleLoading] = useState(false);
  const [slSession, setSlSession] = useState(null); // 선택된 세션 키
  const [slData, setSlData] = useState([]);
  const [slLoading, setSlLoading] = useState(false);

  // Supabase에서 대회 목록 로드
  useEffect(() => {
    if (!supabase) return;
    (async () => {
      try {
        const { data, error } = await supabase.from("tournaments").select("*").order("id");
        if (!error && data) {
          setDbTournaments(data.map(t => ({
            id: t.id, name: t.name,
            date: t.start_date && t.end_date ? `${t.start_date} ~ ${t.end_date}` : "",
            venue: t.venue || "", status: t.status,
            regPeriod: t.reg_period ? t.reg_period.replace(/\d{4}[\.\-\/]/g, "").trim() : ""
          })));
        }
      } catch (e) { console.log("DB 연결 실패, 로컬 데이터 사용"); }
    })();
  }, []);

  // 대회 선택 시 종목 로드
  useEffect(() => {
    if (!supabase || !selectedTournament) return;
    (async () => {
      try {
        const { data, error } = await supabase.from("tournament_events")
          .select("*").eq("tournament_id", selectedTournament).order("sort_order");
        if (!error && data) setDbEvents(data);
      } catch (e) { console.log("종목 로드 실패"); }
    })();
  }, [selectedTournament]);

  // 실제 사용할 대회/종목 (DB 우선, 없으면 하드코딩 폴백)
  const activeTournaments = dbTournaments || TOURNAMENTS;
  const activeIndividualEvents = dbEvents
    ? dbEvents.filter(e => e.type === "individual").map(e => {
        const hardcoded = INDIVIDUAL_EVENTS.find(h => h.code === e.code);
        const sub = hardcoded?.sub || (e.name.includes("50m") || e.name.includes("3자세") || e.name.includes("25m") ? "화약총" : e.category === "산탄총" ? "산탄총" : "공기총");
        return { code: e.code, name: e.name, cat: e.category, gender: e.gender || hardcoded?.gender || "혼", sub };
      })
    : INDIVIDUAL_EVENTS;
  const activePairEvents = dbEvents
    ? dbEvents.filter(e => e.type === "mixed").map(e => {
        const hardcoded = PAIR_EVENTS.find(h => h.code === e.code);
        return { code: e.code, name: e.name, cat: e.category, size: e.team_size || hardcoded?.size || 2 };
      })
    : PAIR_EVENTS;

  // 참가신청 제출 함수
  const submitApplication = async () => {
    if (submitting) return;
    setSubmitting(true);
    setSubmitError(null);
    try {
      if (!supabase) throw new Error("DB 연결 안됨");
      const region = REGIONS[selectedRegion];

      // 1. 참가신청 생성
      const { data: appData, error: appErr } = await supabase
        .from("applications")
        .insert({ tournament_id: selectedTournament, region_code: selectedRegion, region_name: region?.name || "", org_name: orgName })
        .select("id").single();
      if (appErr) throw new Error("신청 생성 실패: " + appErr.message);
      const appId = appData.id;

      // 2. 선수단 인원 등록
      const memberRows = members.map(m => ({
        application_id: appId, name: m.name, gender: m.gender, dob: m.dob,
        role: m.role, sub_org: m.subOrg, class_type: m.role === "선수" ? (m.events?.[0] || null) : null
      }));
      const { data: memberData, error: memErr } = await supabase
        .from("members").insert(memberRows).select("id");
      if (memErr) throw new Error("인원 등록 실패: " + memErr.message);
      const memberIdMap = {}; // frontId → dbId
      members.forEach((m, i) => { memberIdMap[m.id] = memberData[i].id; });

      // 3. 개인전 종목 등록 (유효한 종목만 필터)
      const players = members.filter(m => m.role === "선수");
      const validEvCodes = new Set(activeIndividualEvents.filter(ev =>
        players.some(p => p.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === p.gender))
      ).map(ev => ev.code));
      const entryRows = [];
      Object.entries(individualEvents).forEach(([evCode, mIds]) => {
        if (!validEvCodes.has(evCode)) return; // 유효하지 않은 종목 스킵
        mIds.forEach(mid => {
          if (memberIdMap[mid]) entryRows.push({ application_id: appId, member_id: memberIdMap[mid], event_code: evCode });
        });
      });
      if (entryRows.length > 0) {
        const { error: entryErr } = await supabase.from("individual_entries").insert(entryRows);
        if (entryErr) throw new Error("종목 등록 실패: " + entryErr.message);
      }

      // 4. 단체전/혼성팀 등록
      const teamRows = [];
      Object.entries(teamComps).forEach(([k, slots]) => {
        if (!slots.some(s => s !== null)) return;
        let eventCode, teamType, teamNumber;
        if (k.startsWith("team-")) {
          eventCode = k.replace("team-", ""); teamType = "team"; teamNumber = 1;
        } else if (k.startsWith("pair-")) {
          const parts = k.replace("pair-", "").split("-");
          eventCode = parts[0]; teamType = "mixed"; teamNumber = parseInt(parts[1]);
        } else return;
        const union = teamUnion[k];
        slots.forEach((sid, idx) => {
          if (sid !== null && memberIdMap[sid]) {
            teamRows.push({
              application_id: appId, event_code: eventCode, team_type: teamType,
              team_number: teamNumber, member_id: memberIdMap[sid], slot_order: idx,
              is_union: union?.checked || false, union_memo: union?.memo || null
            });
          }
        });
      });
      if (teamRows.length > 0) {
        const { error: teamErr } = await supabase.from("team_entries").insert(teamRows);
        if (teamErr) throw new Error("팀 등록 실패: " + teamErr.message);
      }

      // 5. 총기 등록
      const firearmRows = [];
      Object.entries(firearms).forEach(([mid, guns]) => {
        const dbMid = memberIdMap[parseInt(mid)];
        if (!dbMid) return;
        guns.forEach(f => {
          firearmRows.push({
            member_id: dbMid, gun_type: f.type, manufacturer: f.maker,
            model: f.model, serial_number: f.serial, permit_number: f.permit
          });
        });
      });
      if (firearmRows.length > 0) {
        const { error: fErr } = await supabase.from("firearms").insert(firearmRows);
        if (fErr) throw new Error("총기 등록 실패: " + fErr.message);
      }

      // 6. 이력 기록
      await supabase.from("application_logs").insert({ application_id: appId, action: "submit", detail: "참가신청 제출" });

      setApplicationId(appId);
      setShowComplete(true);
    } catch (e) {
      setSubmitError(e.message);
      console.error("제출 오류:", e);
    } finally {
      setSubmitting(false);
    }
  };

  // ===== 테스트 데이터 공통 =====
  const _testUtil = () => {
    const lastNames = ["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","류","홍"];
    const firstNamesM = ["민수","영호","진우","성민","현우","지훈","동현","승현","재민","태우","준영","상혁","도윤","시우","하준"];
    const firstNamesF = ["수진","영희","미영","은지","지연","서연","하은","민지","유진","소연","다은","예린","지우","서윤","하린"];
    const rn = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const rNum = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    return { lastNames, firstNamesM, firstNamesF, rn, rNum };
  };

  // Step 2: 선수단 정보만 생성
  const generateTestMembers = () => {
    const { lastNames, firstNamesM, firstNamesF, rn, rNum } = _testUtil();
    const roles = ["지도자","로더","기타"];
    const evByCat = {};
    activeIndividualEvents.forEach(ev => {
      if (!evByCat[ev.cat]) evByCat[ev.cat] = [];
      evByCat[ev.cat].push(ev);
    });
    const catKeys = Object.keys(evByCat);
    const playerCount = rNum(4, 8);
    const staffCount = rNum(1, 3);
    const newMembers = [];
    for (let i = 0; i < playerCount + staffCount; i++) {
      const isPlayer = i < playerCount;
      const isMale = Math.random() > 0.4;
      const gender = isMale ? "남" : "여";
      const name = rn(lastNames) + rn(isMale ? firstNamesM : firstNamesF);
      const year = isPlayer ? rNum(1975, 2005) : rNum(1965, 1990);
      const month = String(rNum(1,12)).padStart(2,"0");
      const day = String(rNum(1,28)).padStart(2,"0");
      const subMode = Math.random() > 0.5 ? "org" : "auto";
      const subOrg = subMode === "org" ? orgName : (REGIONS[selectedRegion]?.name || "") + "일반";
      const memberCats = [];
      if (isPlayer && catKeys.length > 0) {
        const validCats = catKeys.filter(cat => evByCat[cat].some(ev => ev.gender === "혼" || ev.gender === gender));
        if (validCats.length > 0) {
          const shuffled = [...validCats].sort(() => Math.random() - 0.5);
          // 규칙: 소총↔소총(SH2) 불가, (권총/소총/소총SH2)↔청각 불가
          const shootGroup = ["권총","소총","소총(SH2)"];
          const canAdd = (cat, existing) => {
            if (cat === "소총" && existing.includes("소총(SH2)")) return false;
            if (cat === "소총(SH2)" && existing.includes("소총")) return false;
            if (cat === "청각" && existing.some(e => shootGroup.includes(e))) return false;
            if (shootGroup.includes(cat) && existing.includes("청각")) return false;
            return true;
          };
          const cnt = rNum(1, Math.min(2, shuffled.length));
          for (let c = 0; c < cnt; c++) {
            if (canAdd(shuffled[c], memberCats)) memberCats.push(shuffled[c]);
          }
          // 최소 1개 보장
          if (memberCats.length === 0 && shuffled.length > 0) memberCats.push(shuffled[0]);
        }
      }
      newMembers.push({
        id: i + 1, name, gender,
        dob: `${year}-${month}-${day}`,
        role: isPlayer ? "선수" : rn(roles),
        subOrg, subOrgMode: subMode,
        events: memberCats
      });
    }
    setMembers(newMembers);
    setExpandedMember(1);
    setIndividualEvents({});
    setTeamComps({});
    setTeamUnion({});
    setFirearms({});
  };

  // Step 3: 종목별 등록 (현재 members 기반)
  const generateTestEvents = () => {
    const { rNum } = _testUtil();
    const players = members.filter(m => m.role === "선수");
    if (players.length === 0) return;
    const newIE = {};
    const newTC = {};
    players.forEach(p => {
      const eligible = activeIndividualEvents.filter(ev =>
        p.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === p.gender)
      );
      if (eligible.length > 0) {
        const cnt = rNum(1, Math.min(3, eligible.length));
        const shuffled = [...eligible].sort(() => Math.random() - 0.5);
        shuffled.slice(0, cnt).forEach(ev => {
          if (!newIE[ev.code]) newIE[ev.code] = [];
          newIE[ev.code].push(p.id);
        });
      }
    });
    activePairEvents.forEach(pe => {
      const males = players.filter(p => p.events.includes(pe.cat) && p.gender === "남");
      const females = players.filter(p => p.events.includes(pe.cat) && p.gender === "여");
      if (males.length > 0 && females.length > 0) {
        const m = males[Math.floor(Math.random() * males.length)];
        const f = females[Math.floor(Math.random() * females.length)];
        newTC["pair-" + pe.code] = [m.id, f.id];
      }
    });
    setIndividualEvents(newIE);
    setTeamComps(newTC);
    setTeamUnion({});
    setFirearms({});
  };

  // Step 4: 총기 등록 (현재 members 기반)
  const generateTestFirearms = () => {
    const { rn, rNum } = _testUtil();
    const gunMakers = ["Feinwerkbau","Walther","Anschütz","Steyr","Pardini","Morini","Hämmerli"];
    const rifleModels = ["P800","LG400","8002","LP400","SP RF","CM 84E","AP20"];
    const pistolModels = ["LP500","LP400","SP20","HP01","SP RF","CM 22","AP20"];
    const players = members.filter(m => m.role === "선수");
    const newFirearms = {};
    players.forEach(p => {
      const hasRifle = p.events.some(c => c.startsWith("소총"));
      const hasPistol = p.events.includes("권총");
      const hasShotgun = p.events.includes("산탄총");
      const gunCount = rNum(1, 2);
      const guns = [];
      for (let g = 0; g < gunCount; g++) {
        let gunType, model;
        if (g === 0 && hasRifle) { gunType = "공기소총"; model = rn(rifleModels); }
        else if (hasPistol) { gunType = "공기권총"; model = rn(pistolModels); }
        else if (hasShotgun) { gunType = "산탄총"; model = "Beretta DT11"; }
        else { gunType = "공기소총"; model = rn(rifleModels); }
        guns.push({
          id: g + 1, type: gunType, maker: rn(gunMakers), model,
          serial: `${String.fromCharCode(65+rNum(0,25))}${String.fromCharCode(65+rNum(0,25))}-${rNum(10000,99999)}`,
          permit: `2025-${rn(["서울","부산","경기","대전","광주"])}-${String(rNum(1,9999)).padStart(5,"0")}`
        });
      }
      newFirearms[p.id] = guns;
    });
    setFirearms(newFirearms);
  };


  const flashField = (fieldId, memberId) => {
    if (memberId) setExpandedMember(memberId);
    setTimeout(() => {
      const el = document.getElementById(fieldId);
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        setHighlightId(fieldId);
        setTimeout(() => setHighlightId(null), 1500);
      }
    }, 100);
  };

  const getStep2Error = () => {
    if (!orgName.trim()) return { field: "orgName", memberId: null };
    for (let i = 0; i < members.length; i++) {
      const m = members[i];
      if (!m.name.trim()) return { field: `member-${m.id}-name`, memberId: m.id };
      if (!m.dob) return { field: `member-${m.id}-dob`, memberId: m.id };
      if (!m.role) return { field: `member-${m.id}-role`, memberId: m.id };
      if (!m.gender) return { field: `member-${m.id}-gender`, memberId: m.id };
      if (!m.subOrg.trim()) return { field: `member-${m.id}-subOrg`, memberId: m.id };
      if (m.role === "선수") {
        if (m.events.length === 0) return { field: `member-${m.id}-events`, memberId: m.id };
      }
    }
    return null;
  };

  const step2HasError = step === 2 ? !!getStep2Error() : false;

  useEffect(() => {
    if (!document.getElementById("hl-pulse-style")) {
      const s = document.createElement("style");
      s.id = "hl-pulse-style";
      s.textContent = `@keyframes hlPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }`;
      document.head.appendChild(s);
    }
  }, []);
  const handleRegionHover = useCallback((id) => {
    setHoveredRegion(id);
  }, []);

  const regionOrder = ["KR11","KR26","KR27","KR28","KR29","KR30","KR31","KR50","KR41","KR42","KR43","KR44","KR45","KR46","KR47","KR48","KR49"];

  if (page === "landing") {
    return (
      <div style={styles.landingContainer}>
        <img src={LOGO_IMG} alt="" style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", width: 600, maxWidth: "90%", opacity: 0.07, pointerEvents: "none" }} />
        <div style={styles.landingInner}>
          <div style={styles.logoMark}>⚔</div>
          <h1 style={styles.landingTitle}>대회 등록 시스템</h1>
          <p style={styles.landingSubtitle}>Competition Entry System</p>
          <div style={styles.landingButtons}>
            <button style={styles.primaryBtn} onClick={() => setPage("register")}>
              <span style={styles.btnIcon}>📋</span>
              <span>
                <div style={styles.btnMain}>대회 참가신청</div>
                <div style={styles.btnSub}>Competition Entry</div>
              </span>
            </button>
            <button style={styles.secondaryBtn} onClick={() => { setPage("schedule"); setSchedulePage("list"); }}>
              <span style={styles.btnIcon}>🔍</span>
              <span>
                <div style={styles.btnMain}>기록지 및 스타트리스트 확인</div>
                <div style={styles.btnSub}>Records & Start List</div>
              </span>
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ═══ 시간표/기록지 페이지 ═══
  if (page === "schedule") {
    const ongoingTournaments = activeTournaments.filter(t => t.status === 3);

    const loadSchedule = async (tid) => {
      setScheduleTournament(tid);
      setSchedulePage("detail");
      setScheduleDay(1);
      setScheduleLoading(true);
      setScheduleData([]);
      try {
        if (supabase) {
          const { data, error } = await supabase
            .from("tournament_schedules")
            .select("*")
            .eq("tournament_id", tid)
            .order("day_number")
            .order("sort_order");
          if (!error && data && data.length > 0) {
            // DB rows → grouped by day
            const dayMap = {};
            data.forEach(r => {
              if (!dayMap[r.day_number]) dayMap[r.day_number] = [];
              dayMap[r.day_number].push(r);
            });
            setScheduleData(Object.entries(dayMap).map(([d, rows]) => ({ day: Number(d), rows })));
          }
        }
      } catch (e) { console.log("시간표 로드 실패:", e); }
      setScheduleLoading(false);
    };

    const catColor = (c) => ({ "10M": "#3b82f6", "25M": "#8b5cf6", "50M": "#10b981", "산탄총": "#f59e0b" }[c] || "#8899aa");
    const loadStartlist = async (sessionKey) => {
      if (slSession === sessionKey) { setSlSession(null); return; } // 토글
      setSlSession(sessionKey);
      setSlData([]);
      setSlLoading(true);
      try {
        if (supabase) {
          const { data, error } = await supabase
            .from("tournament_startlists")
            .select("*")
            .eq("tournament_id", scheduleTournament)
            .eq("session_key", sessionKey)
            .order("sort_order");
          if (!error && data) setSlData(data);
        }
      } catch (e) { console.log("스타트리스트 로드 실패:", e); }
      setSlLoading(false);
    };
    const calcSpans = (rows) => {
      const spans = new Array(rows.length).fill(1); const sk = new Set();
      for (let i = 0; i < rows.length; i++) {
        if (sk.has(i) || !rows[i].category) continue;
        let cnt = 1;
        while (i + cnt < rows.length && rows[i + cnt].category === rows[i].category) { sk.add(i + cnt); cnt++; }
        spans[i] = cnt;
      }
      return { spans, sk };
    };
    const selT = activeTournaments.find(t => t.id === scheduleTournament);
    const dayLabel = (dayNum) => {
      if (!selT) return dayNum + "일차";
      const dateStr = selT.date || "";
      const m = dateStr.match(/(\d{4})년\s*(\d{2})월\s*(\d{2})일/);
      if (m) { const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])); d.setDate(d.getDate() + dayNum - 1); return (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
      return dayNum + "일차";
    };

    const bgGrad = "linear-gradient(160deg, #0d1520 0%, #1a2744 40%, #0d1520 100%)";
    const cardBg = "#131d2e";
    const borderC = "#1e3050";
    const goldC = "#c9a84c";

    // 대회 목록 (진행중)
    if (schedulePage === "list") {
      return (
        <div style={{ minHeight: "100vh", background: bgGrad, fontFamily: "'Noto Sans KR', sans-serif", padding: "40px 16px" }}>
          <div style={{ maxWidth: 700, margin: "0 auto" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 32 }}>
              <button onClick={() => setPage("landing")} style={{ background: "none", border: "1px solid #334466", borderRadius: 8, color: "#8899aa", padding: "8px 16px", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>← 돌아가기</button>
              <h2 style={{ fontSize: 22, fontWeight: 800, color: "#e8dcc8", margin: 0 }}>기록지 및 스타트리스트</h2>
            </div>
            {ongoingTournaments.length === 0 ? (
              <div style={{ textAlign: "center", padding: "60px 20px", color: "#667788" }}>
                <div style={{ fontSize: 48, marginBottom: 16 }}>📋</div>
                <div style={{ fontSize: 16, fontWeight: 600 }}>현재 진행 중인 대회가 없습니다</div>
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {ongoingTournaments.map(t => (
                  <button key={t.id} onClick={() => loadSchedule(t.id)} style={{
                    display: "flex", alignItems: "center", gap: 16, padding: 0, background: cardBg, border: "1px solid " + borderC,
                    borderRadius: 12, cursor: "pointer", overflow: "hidden", textAlign: "left", width: "100%",
                  }}>
                    <div style={{ width: 70, minHeight: 70, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, background: "#4a90d922", borderRight: "1px solid #4a90d933" }}>
                      <div style={{ width: 10, height: 10, borderRadius: 3, background: "#4a90d9", boxShadow: "0 0 8px #4a90d988" }} />
                      <span style={{ fontSize: 11, fontWeight: 700, color: "#4a90d9" }}>진행중</span>
                    </div>
                    <div style={{ flex: 1, padding: "12px 16px 12px 0" }}>
                      <div style={{ fontSize: 16, fontWeight: 700, color: "#e8dcc8" }}>{t.name}</div>
                      <div style={{ fontSize: 12, color: "#8899aa", marginTop: 4 }}>📅 {t.date}</div>
                      <div style={{ fontSize: 12, color: "#8899aa" }}>📍 {t.venue}</div>
                    </div>
                    <div style={{ padding: "0 16px", color: "#4a90d9", fontSize: 18 }}>→</div>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 시간표 상세 (일자별 시트)
    const currentDayData = scheduleData.find(d => d.day === scheduleDay);
    const availableDays = scheduleData.map(d => d.day).sort((a, b) => a - b);
    if (availableDays.length > 0 && !availableDays.includes(scheduleDay)) setScheduleDay(availableDays[0]);

    return (
      <div style={{ minHeight: "100vh", background: bgGrad, fontFamily: "'Noto Sans KR', sans-serif", padding: "24px 12px" }}>
        <div style={{ maxWidth: 900, margin: "0 auto" }}>
          {/* 헤더 */}
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
            <button onClick={() => { setSchedulePage("list"); setScheduleTournament(null); }}
              style={{ background: "none", border: "1px solid #334466", borderRadius: 8, color: "#8899aa", padding: "8px 16px", cursor: "pointer", fontSize: 13, fontWeight: 600 }}>← 목록</button>
            <div>
              <h2 style={{ fontSize: 18, fontWeight: 800, color: "#e8dcc8", margin: 0 }}>{selT?.name || ""}</h2>
              <div style={{ fontSize: 12, color: "#8899aa" }}>대회 일정표</div>
            </div>
          </div>

          {/* 일자 탭 (시트 스타일) */}
          {scheduleLoading ? (
            <div style={{ textAlign: "center", padding: 60, color: "#667788", fontSize: 15 }}>⏳ 시간표 불러오는 중...</div>
          ) : scheduleData.length === 0 ? (
            <div style={{ textAlign: "center", padding: "60px 20px", color: "#667788" }}>
              <div style={{ fontSize: 48, marginBottom: 16 }}>📋</div>
              <div style={{ fontSize: 16, fontWeight: 600 }}>등록된 시간표가 없습니다</div>
              <div style={{ fontSize: 13, marginTop: 8 }}>아직 대회 시간표가 게시되지 않았습니다.</div>
            </div>
          ) : (
            <>
              {/* 시트 탭 바 */}
              <div style={{ display: "flex", gap: 0, marginBottom: 0, borderBottom: "2px solid " + borderC }}>
                {availableDays.map(d => {
                  const active = d === scheduleDay;
                  return (
                    <button key={d} onClick={() => { setScheduleDay(d); setSlSession(null); }} style={{
                      padding: "10px 20px", border: "1px solid " + (active ? goldC : borderC), borderBottom: active ? "2px solid " + cardBg : "1px solid " + borderC,
                      borderRadius: "8px 8px 0 0", marginBottom: active ? -2 : 0,
                      background: active ? cardBg : "transparent", color: active ? goldC : "#667788",
                      fontWeight: active ? 800 : 600, fontSize: 14, cursor: "pointer",
                    }}>{dayLabel(d)} <span style={{ fontSize: 11, opacity: 0.7 }}>({d}일차)</span></button>
                  );
                })}
              </div>

              {/* 시간표 테이블 */}
              {currentDayData && currentDayData.rows.length > 0 && (() => {
                const { spans: rawSpans, sk } = calcSpans(currentDayData.rows);
                // 열린 스타트리스트에 의한 추가 행을 rowSpan에 반영
                const spans = [...rawSpans];
                currentDayData.rows.forEach((row, ri) => {
                  const sKey = (row.event_code && row.relay && row.type === "prelim") ? row.event_code + "_" + row.relay : null;
                  if (sKey && slSession === sKey) {
                    // 이 행이 속한 카테고리 그룹의 시작 인덱스 찾기
                    let groupStart = ri;
                    while (groupStart > 0 && sk.has(groupStart)) groupStart--;
                    spans[groupStart]++;
                  }
                });
                const thSt = { padding: "10px 8px", borderBottom: "2px solid " + borderC, color: "#8899aa", fontWeight: 700, fontSize: 12, textAlign: "center" };
                const tdSt = { padding: "10px 8px", borderBottom: "1px solid " + borderC, fontSize: 13, verticalAlign: "middle" };
                return (
                  <div style={{ background: cardBg, border: "1px solid " + borderC, borderTop: "none", borderRadius: "0 0 10px 10px", overflow: "hidden" }}>
                    <table style={{ width: "100%", borderCollapse: "collapse" }}>
                      <thead>
                        <tr style={{ background: "#0d1520" }}>
                          <th style={{ ...thSt, width: 60 }}>구분</th>
                          <th style={{ ...thSt, textAlign: "left" }}>내용</th>
                          <th style={{ ...thSt, width: 100 }}>시간</th>
                          <th style={{ ...thSt, width: 55 }}>인원</th>
                          <th style={{ ...thSt, width: 80 }}>비고</th>
                          <th style={{ ...thSt, width: 70 }}></th>
                        </tr>
                      </thead>
                      <tbody>
                        {currentDayData.rows.map((row, ri) => {
                          const showCat = !sk.has(ri);
                          const isPET = row.type === "pet";
                          const cc = catColor(row.category);
                          const sessionKey = (row.event_code && row.relay && row.type === "prelim") ? row.event_code + "_" + row.relay : null;
                          const isSlOpen = sessionKey && slSession === sessionKey;
                          return (
                            <React.Fragment key={row.id || ri}>
                              <tr style={{ background: isSlOpen ? "#1e3050" : ri % 2 === 0 ? "transparent" : "#0d152033" }}>
                                {showCat && <td rowSpan={spans[ri]} style={{ ...tdSt, textAlign: "center", fontWeight: 700, fontSize: 12, color: cc, borderRight: "3px solid " + cc + "44" }}>{row.category}</td>}
                                <td style={{ ...tdSt, textAlign: "left", paddingLeft: 12, color: isPET ? "#8899aa" : "#e8dcc8", fontStyle: isPET ? "italic" : "normal", fontWeight: isPET ? 400 : 600 }}>
                                  {isPET ? "🏋️ " : ""}{row.content || row.event_code}
                                </td>
                                <td style={{ ...tdSt, textAlign: "center", color: "#b0c4de", fontFamily: "monospace", fontWeight: 600 }}>{row.time_slot || row.time || ""}</td>
                                <td style={{ ...tdSt, textAlign: "center", color: "#8899aa" }}>{row.participant_count || row.count || ""}{(row.participant_count || row.count) ? "명" : ""}</td>
                                <td style={{ ...tdSt, textAlign: "center", color: "#667788", fontSize: 12 }}>{row.remark || ""}</td>
                                <td style={{ ...tdSt, textAlign: "center", padding: "4px" }}>
                                  {sessionKey && <button onClick={() => loadStartlist(sessionKey)} style={{
                                    padding: "4px 8px", borderRadius: 5, border: "1px solid " + (isSlOpen ? "#c9a84c" : "#334466"),
                                    background: isSlOpen ? "#c9a84c22" : "transparent", color: isSlOpen ? "#c9a84c" : "#6688aa",
                                    fontSize: 10, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap"
                                  }}>{isSlOpen ? "▲ 닫기" : "📋 명단"}</button>}
                                </td>
                              </tr>
                              {isSlOpen && (
                                <tr><td colSpan={5} style={{ padding: 0, borderBottom: "1px solid " + borderC }}>
                                  <div style={{ background: "#0a1628", padding: "12px 16px", borderTop: "2px solid #c9a84c44" }}>
                                    <div style={{ fontSize: 13, fontWeight: 700, color: "#c9a84c", marginBottom: 8 }}>
                                      📋 {row.content || row.event_code} 스타트리스트
                                    </div>
                                    {slLoading ? (
                                      <div style={{ textAlign: "center", padding: 16, color: "#667788" }}>⏳ 불러오는 중...</div>
                                    ) : slData.length === 0 ? (
                                      <div style={{ textAlign: "center", padding: 16, color: "#667788" }}>등록된 스타트리스트가 없습니다.</div>
                                    ) : (
                                      <div style={{ overflowX: "auto" }}>
                                        <table style={{ width: "100%", borderCollapse: "collapse" }}>
                                          <thead><tr style={{ background: "#131d2e" }}>
                                            {["#", "사대", "이름", "소속", "시도"].map(h => (
                                              <th key={h} style={{ padding: "6px 8px", borderBottom: "1px solid #1e3050", color: "#8899aa", fontSize: 11, fontWeight: 700, textAlign: "center" }}>{h}</th>
                                            ))}
                                          </tr></thead>
                                          <tbody>
                                            {(() => { let seq = 0; return slData.map((p, i) => {
                                              if (!p.absent) seq++;
                                              return (
                                                <tr key={p.id || i} style={{ background: p.absent ? "#ef444411" : i % 2 === 0 ? "transparent" : "#0d152033", opacity: p.absent ? 0.4 : 1 }}>
                                                  <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", textAlign: "center", color: p.absent ? "#ef4444" : "#8899aa", fontSize: 12 }}>{p.absent ? "—" : seq}</td>
                                                  <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", textAlign: "center", fontWeight: 700, color: "#b0c4de", fontSize: 12, fontFamily: "monospace" }}>{p.lane || "-"}</td>
                                                  <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", fontWeight: 600, color: p.absent ? "#666" : "#e8dcc8", fontSize: 13, textDecoration: p.absent ? "line-through" : "none" }}>{p.name}</td>
                                                  <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", color: "#8899aa", fontSize: 12 }}>{p.sub_org || "-"}</td>
                                                  <td style={{ padding: "5px 8px", borderBottom: "1px solid #1e305066", color: "#667788", fontSize: 12, textAlign: "center" }}>{p.region_name || "-"}</td>
                                                </tr>
                                              );
                                            }); })()}
                                          </tbody>
                                        </table>
                                      </div>
                                    )}
                                  </div>
                                </td></tr>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                );
              })()}
            </>
          )}
        </div>
      </div>
    );
  }

  if (showComplete && !showCertificate) {
    const tournament = activeTournaments.find(t => t.id === selectedTournament);
    return (
      <div style={{ minHeight: "100vh", background: "linear-gradient(160deg, #0d1520 0%, #1a2744 40%, #0d1520 100%)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Noto Sans KR', sans-serif", position: "relative", overflow: "hidden" }}>
        <img src={LOGO_IMG} alt="" style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", width: 600, maxWidth: "90%", opacity: 0.05, pointerEvents: "none" }} />
        <div style={{ textAlign: "center", padding: "40px 30px", maxWidth: 560, width: "100%", position: "relative", zIndex: 1 }}>
          <div style={{ fontSize: 56, marginBottom: 24 }}>✅</div>
          <h1 style={{ fontSize: 28, fontWeight: 800, color: "#c9a84c", marginBottom: 16, letterSpacing: 2 }}>참가신청 완료</h1>
          <p style={{ fontSize: 17, color: "#c8d4e4", lineHeight: 1.8, marginBottom: 40 }}>
            <strong style={{ color: "#c9a84c", fontSize: 19 }}>"{tournament?.name}"</strong>
            <br />참가신청이 정상적으로 완료되었습니다.
            {applicationId && <><br /><span style={{ fontSize: 13, color: "#8899aa" }}>신청번호: {applicationId}</span></>}
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 12, maxWidth: 340, margin: "0 auto" }}>
            <button
              onClick={() => setShowCertificate(true)}
              style={{
                width: "100%", padding: "16px 24px", borderRadius: 10,
                background: "linear-gradient(135deg, #c9a84c, #a8872e)",
                border: "none", color: "#1a2744", fontSize: 16, fontWeight: 800,
                cursor: "pointer", transition: "all 0.2s",
                boxShadow: "0 4px 20px #c9a84c33",
              }}
              onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 28px #c9a84c55"; }}
              onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 20px #c9a84c33"; }}
            >참가신청 확인서 발급</button>
            <button
              onClick={() => {
                setShowComplete(false);
                setApplicationId(null);
                setSubmitError(null);
                setPage("landing");
                setStep(0);
                setSelectedTournament(null);
                setSelectedRegion(null);
                setOrgName("");
                setMembers([{ id: 1, name: "", dob: "", role: "", subOrg: "", subOrgMode: "", gender: "", events: [] }]);
                setIndividualEvents({});
                setTeamComps({});
                setTeamUnion({});
                setFirearms({});
              }}
              style={{
                width: "100%", padding: "14px 24px", borderRadius: 10,
                background: "transparent", border: "1px solid #3d5278",
                color: "#8899aa", fontSize: 15, fontWeight: 600,
                cursor: "pointer", transition: "all 0.2s",
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = "#c9a84c"; e.currentTarget.style.color = "#c9a84c"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "#3d5278"; e.currentTarget.style.color = "#8899aa"; }}
            >종료</button>
          </div>
        </div>
      </div>
    );
  }

  if (showCertificate) {
    const tournament = activeTournaments.find(t => t.id === selectedTournament);
    const region = REGIONS[selectedRegion];
    const players = members.filter(m => m.role === "선수");
    const staffs = members.filter(m => m.role !== "선수");
    const allIndividual = activeIndividualEvents.filter(ev =>
      (individualEvents[ev.code] || []).length > 0 && players.some(p => p.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === p.gender))
    );
    const allTeams = Object.entries(teamComps).filter(([, slots]) => slots.some(s => s !== null));
    const today = new Date();
    const dateStr = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;
    const ds = { fontFamily: "'Noto Sans KR', 'Batang', serif", color: "#111", lineHeight: 1.8 };
    const th = { padding: "6px 10px", border: "1px solid #333", fontSize: 12, fontWeight: 700, background: "#f0f0f0", textAlign: "center", whiteSpace: "nowrap" };
    const td = { padding: "6px 10px", border: "1px solid #555", fontSize: 12, textAlign: "center" };
    const tdL = { ...td, textAlign: "left" };

    return (
      <div style={{ minHeight: "100vh", background: "#e8e8e8", display: "flex", justifyContent: "center", padding: "20px 10px", fontFamily: "'Noto Sans KR', serif" }}>
        <div style={{ background: "#fff", width: "210mm", maxWidth: "100%", minHeight: "297mm", padding: "50px 50px 30px", boxShadow: "0 2px 20px #00000022", position: "relative", overflow: "hidden", display: "flex", flexDirection: "column" }}>
          {/* 워터마크 */}
          <img src={LOGO_IMG} alt="" style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", width: 500, opacity: 0.07, pointerEvents: "none", zIndex: 0 }} />
          {/* 닫기 버튼 (인쇄시 숨김) */}
          <button onClick={() => setShowCertificate(false)} className="no-print"
            style={{ position: "absolute", top: 16, right: 20, background: "none", border: "1px solid #ccc", borderRadius: 6, padding: "6px 14px", fontSize: 13, color: "#666", cursor: "pointer", zIndex: 2 }}
          >← 돌아가기</button>

          {/* 본문 영역 (flex-grow) */}
          <div style={{ flex: 1, position: "relative", zIndex: 1 }}>
          {/* 문서 번호 */}
          <div style={{ ...ds, fontSize: 12, color: "#888", marginBottom: 30 }}>제 {today.getFullYear()}-{String(today.getMonth()+1).padStart(2,"0")}{String(today.getDate()).padStart(2,"0")}-{String(Math.floor(Math.random()*900)+100)} 호</div>

          {/* 제목 */}
          <h1 style={{ ...ds, fontSize: 26, fontWeight: 800, textAlign: "center", letterSpacing: 8, marginBottom: 40 }}>참가신청 확인서</h1>

          {/* 1. 대회 정보 */}
          <div style={{ marginBottom: 28 }}>
            <div style={{ ...ds, fontSize: 15, fontWeight: 700, marginBottom: 8, borderBottom: "2px solid #111", paddingBottom: 4 }}>1. 대회 정보</div>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <tbody>
                <tr><td style={th}>대회명</td><td style={{ ...tdL, fontWeight: 700 }} colSpan={3}>{tournament?.name}</td></tr>
                <tr><td style={th}>소속 시/도</td><td style={tdL}>{region?.name}</td><td style={th}>신청 단체명</td><td style={{ ...tdL, fontWeight: 700 }}>{orgName}</td></tr>
              </tbody>
            </table>
          </div>

          {/* 2. 선수단 명단 */}
          <div style={{ marginBottom: 28 }}>
            <div style={{ ...ds, fontSize: 15, fontWeight: 700, marginBottom: 8, borderBottom: "2px solid #111", paddingBottom: 4 }}>2. 선수단 명단 ({members.length}명)</div>
            {players.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <div style={{ ...ds, fontSize: 13, fontWeight: 700, marginBottom: 4 }}>가. 선수 ({players.length}명)</div>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead><tr>{["번호","성명","성별","생년월일","세부소속","참가종별"].map(h => <th key={h} style={th}>{h}</th>)}</tr></thead>
                  <tbody>
                    {players.map((p, i) => (
                      <tr key={p.id}>
                        <td style={td}>{i+1}</td>
                        <td style={{ ...td, fontWeight: 600 }}>{p.name}</td>
                        <td style={td}>{p.gender}</td>
                        <td style={td}>{p.dob}</td>
                        <td style={td}>{p.subOrg}</td>
                        <td style={tdL}>{p.events.join(", ")}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            {staffs.length > 0 && (
              <div>
                <div style={{ ...ds, fontSize: 13, fontWeight: 700, marginBottom: 4 }}>나. 임원 ({staffs.length}명)</div>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead><tr>{["번호","성명","성별","직책","세부소속"].map(h => <th key={h} style={th}>{h}</th>)}</tr></thead>
                  <tbody>
                    {staffs.map((m, i) => (
                      <tr key={m.id}>
                        <td style={td}>{i+1}</td>
                        <td style={{ ...td, fontWeight: 600 }}>{m.name}</td>
                        <td style={td}>{m.gender}</td>
                        <td style={td}>{m.role}</td>
                        <td style={td}>{m.subOrg}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* 3. 종목별 참가 현황 */}
          <div style={{ marginBottom: 28 }}>
            <div style={{ ...ds, fontSize: 15, fontWeight: 700, marginBottom: 8, borderBottom: "2px solid #111", paddingBottom: 4 }}>3. 종목별 참가 현황</div>
            {allIndividual.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <div style={{ ...ds, fontSize: 13, fontWeight: 700, marginBottom: 4 }}>가. 개인전</div>
                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                  <thead><tr>{["종목코드","종목명","참가선수","인원"].map(h => <th key={h} style={th}>{h}</th>)}</tr></thead>
                  <tbody>
                    {allIndividual.map(ev => {
                      const pIds = individualEvents[ev.code];
                      const names = pIds.map(id => members.find(mm => mm.id === id)?.name).filter(Boolean);
                      return (
                        <tr key={ev.code}>
                          <td style={{ ...td, fontWeight: 700 }}>{ev.code}</td>
