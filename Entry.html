                                  background: m.subOrgMode === "org" ? "#c9a84c" : "#1a2744",
                                  color: m.subOrgMode === "org" ? "#1a2744" : "#8899aa",
                                  borderColor: m.subOrgMode === "org" ? "#c9a84c" : "#2a3a5c",
                                }}
                              >신청단체명과 동일</button>
                              <button
                                onClick={() => setMembers(members.map(mm => mm.id === m.id ? { ...mm, subOrg: (REGIONS[selectedRegion]?.name || "") + "일반", subOrgMode: "auto" } : mm))}
                                style={{
                                  ...styles.chipBtn,
                                  background: m.subOrgMode === "auto" ? "#c9a84c" : "#1a2744",
                                  color: m.subOrgMode === "auto" ? "#1a2744" : "#8899aa",
                                  borderColor: m.subOrgMode === "auto" ? "#c9a84c" : "#2a3a5c",
                                }}
                              >시도연맹</button>
                              <button
                                onClick={() => setMembers(members.map(mm => mm.id === m.id ? { ...mm, subOrg: m.subOrgMode === "auto" || m.subOrgMode === "org" ? "" : m.subOrg, subOrgMode: "manual" } : mm))}
                                style={{
                                  ...styles.chipBtn,
                                  background: m.subOrgMode === "manual" ? "#c9a84c" : "#1a2744",
                                  color: m.subOrgMode === "manual" ? "#1a2744" : "#8899aa",
                                  borderColor: m.subOrgMode === "manual" ? "#c9a84c" : "#2a3a5c",
                                }}
                              >직접입력</button>
                            </div>
                            {m.subOrgMode === "manual" && (
                              <input
                                type="text" placeholder="세부 소속을 입력하세요" value={m.subOrg}
                                onChange={e => setMembers(members.map(mm => mm.id === m.id ? { ...mm, subOrg: e.target.value } : mm))}
                                style={{ ...styles.formInput, width: "100%" }}
                              />
                            )}
                            {(m.subOrgMode === "auto" || m.subOrgMode === "org") && (
                              <span style={{ fontSize: 14, color: "#c9a84c", fontWeight: 600 }}>{m.subOrg}</span>
                            )}
                          </div>
                        </div>

                        {m.role && (
                          <div id={`member-${m.id}-gender`} style={{...styles.detailRow, ...(highlightId === `member-${m.id}-gender` ? styles.highlightRow : {})}}>
                            <span style={styles.detailLabel}>성별 <span style={{color:"#cc4444"}}>*</span></span>
                            <div style={{ display: "flex", gap: 6 }}>
                              {["남", "여"].map(g => (
                                <button
                                  key={g}
                                  onClick={() => setMembers(members.map(mm => mm.id === m.id ? { ...mm, gender: g } : mm))}
                                  style={{
                                    ...styles.chipBtn,
                                    background: m.gender === g ? "#c9a84c" : "#1a2744",
                                    color: m.gender === g ? "#1a2744" : "#8899aa",
                                    borderColor: m.gender === g ? "#c9a84c" : "#2a3a5c",
                                  }}
                                >{g}</button>
                              ))}
                            </div>
                          </div>
                        )}
                        {m.role === "선수" && (
                          <>
                            <div id={`member-${m.id}-events`} style={{...styles.detailRow, ...(highlightId === `member-${m.id}-events` ? styles.highlightRow : {})}}>
                              <span style={styles.detailLabel}>종목 <span style={{color:"#cc4444"}}>*</span></span>
                              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                                {["권총", "소총", "소총(SH2)", "산탄총", "청각"].map(ev => {
                                  const selected = m.events.includes(ev);
                                  // 비활성 조건: 소총↔소총(SH2) 상호배제, (권총/소총/소총SH2)↔청각 상호배제
                                  const shootGroup = ["권총","소총","소총(SH2)"];
                                  const disabled = !selected && (
                                    (ev === "소총" && m.events.includes("소총(SH2)")) ||
                                    (ev === "소총(SH2)" && m.events.includes("소총")) ||
                                    (ev === "청각" && m.events.some(e => shootGroup.includes(e))) ||
                                    (shootGroup.includes(ev) && m.events.includes("청각"))
                                  );
                                  return (
                                    <button
                                      key={ev}
                                      disabled={disabled}
                                      onClick={() => {
                                        if (disabled) return;
                                        const newEvents = selected ? m.events.filter(e => e !== ev) : [...m.events, ev];
                                        setMembers(members.map(mm => mm.id === m.id ? { ...mm, events: newEvents } : mm));
                                      }}
                                      style={{
                                        ...styles.chipBtn,
                                        background: selected ? "#c9a84c" : disabled ? "#111a2a" : "#1a2744",
                                        color: selected ? "#1a2744" : disabled ? "#3a4a5c" : "#8899aa",
                                        borderColor: selected ? "#c9a84c" : disabled ? "#1a2a3c" : "#2a3a5c",
                                        cursor: disabled ? "not-allowed" : "pointer",
                                        opacity: disabled ? 0.5 : 1,
                                      }}
                                    >{ev}</button>
                                  );
                                })}
                              </div>
                            </div>
                          </>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              <button
                onClick={() => {
                  const newId = Math.max(...members.map(m => m.id)) + 1;
                  setMembers([...members, { id: newId, name: "", dob: "", role: "", subOrg: "", subOrgMode: "", gender: "", events: [] }]);
                  setExpandedMember(newId);
                }}
                style={{ ...styles.addBtn, width: "100%", marginTop: 8, padding: "10px 14px" }}
              >+ 인원 추가</button>
            </div>
          </div>
        </div>
      )}

      {/* Step 3: Event Registration */}
      {step === 3 && (() => {
        const players = members.filter(m => m.role === "선수");
        const togglePlayerForEvent = (code, memberId) => {
          setIndividualEvents(prev => {
            const curr = prev[code] || [];
            return { ...prev, [code]: curr.includes(memberId) ? curr.filter(id => id !== memberId) : [...curr, memberId] };
          });
        };
        const availableEvents = activeIndividualEvents.filter(ev =>
          players.some(p => p.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === p.gender))
        );
        const setTeamSlot = (key, slotIdx, memberId) => {
          setTeamComps(prev => {
            const size = key.startsWith("pair-") ? 2 : 4;
            const curr = [...(prev[key] || Array(size).fill(null))];
            curr[slotIdx] = memberId;
            return { ...prev, [key]: curr };
          });
          setDropdownSlot(null);
        };
        const removeTeamSlot = (key, slotIdx) => {
          setTeamComps(prev => {
            const size = key.startsWith("pair-") ? 2 : 4;
            const curr = [...(prev[key] || Array(size).fill(null))];
            curr[slotIdx] = null;
            return { ...prev, [key]: curr };
          });
        };
        const handleDrop = (key, slotIdx, e) => {
          e.preventDefault();
          const mid = parseInt(e.dataTransfer.getData("memberId"));
          if (!mid) return;
          const size = key.startsWith("pair-") ? 2 : 4;
          const slots = teamComps[key] || Array(size).fill(null);
          if (slots.includes(mid)) return;
          setTeamSlot(key, slotIdx, mid);
        };
        const availablePairs = activePairEvents.filter(pe =>
          players.filter(p => p.events.includes(pe.cat)).length >= 1
        );

        const TeamSlotRow = ({ teamKey, slots, eligible, count, minCount, label }) => {
          const filled = slots.filter(s => s !== null).length;
          const union = teamUnion[teamKey] || { checked: false, memo: "" };
          return (
            <div style={{ marginTop: 2 }}>
              {label && <div style={{ fontSize: 11, color: "#556677", fontWeight: 600, marginBottom: 4 }}>{label}</div>}
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4, alignItems: "flex-start" }}>
                {Array.from({ length: count }).map((_, idx) => {
                  const mid = slots[idx] || null;
                  const player = mid ? members.find(mm => mm.id === mid) : null;
                  const isOpen = dropdownSlot === `${teamKey}-${idx}`;
                  const usedIds = slots.filter(s => s !== null);
                  const avail = eligible.filter(p => !usedIds.includes(p.id));
                  return (
                    <div key={idx} style={{ position: "relative", minWidth: 56, flexBasis: "calc(25% - 3px)", flexGrow: 1 }}>
                      <div
                        onClick={e => { e.stopPropagation(); if (!player) { if (isOpen) setDropdownSlot(null); else openDropdown(`${teamKey}-${idx}`, e); } }}
                        onDragOver={e => e.preventDefault()}
                        onDrop={e => handleDrop(teamKey, idx, e)}
                        style={{
                          borderRadius: 6, padding: "3px 9px",
                          border: dragMember && !player ? "2px dashed #c9a84c" : player ? "1px solid #c9a84c" : "1px dashed #2a3a5c",
                          background: player ? "#c9a84c" : "#0d1520",
                          display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
                          cursor: player ? "default" : "pointer", transition: "all 0.15s",
                          fontSize: 12, fontWeight: 600, lineHeight: "20px",
                        }}
                      >
                        {player ? (
                          <>
                            <span style={{ color: "#1a2744", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{player.name}</span>
                            <button onClick={e => { e.stopPropagation(); removeTeamSlot(teamKey, idx); }}
                              style={{ background: "none", border: "none", color: "#1a274488", fontSize: 12, cursor: "pointer", padding: 0, flexShrink: 0 }}>✕</button>
                          </>
                        ) : (
                          <span style={{ color: "#445566" }}>선수{idx + 1}</span>
                        )}
                      </div>
                      {isOpen && dropdownPos && (
                        <div style={{
                          position: "fixed", top: dropdownPos.top, bottom: dropdownPos.bottom, left: dropdownPos.left, width: dropdownPos.width, minWidth: 110, zIndex: 9999,
                          background: "#1a2744", border: "1px solid #3d5278", borderRadius: 6,
                          boxShadow: "0 4px 16px #00000066", maxHeight: 140, overflowY: "auto",
                        }}>
                          {avail.length > 0 ? avail.map(p => (
                            <div key={p.id}
                              onClick={e => { e.stopPropagation(); setTeamSlot(teamKey, idx, p.id); }}
                              style={{ padding: "7px 10px", fontSize: 12, color: "#c8d4e4", cursor: "pointer", borderBottom: "1px solid #2a3a5c22" }}
                              onMouseEnter={e => e.currentTarget.style.background = "#2e4468"}
                              onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                            >{p.name}</div>
                          )) : (
                            <div style={{ padding: "8px", fontSize: 11, color: "#556677", textAlign: "center" }}>선수 없음</div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <div style={{ fontSize: 10, color: filled >= minCount ? "#4aba6a" : "#556677", marginTop: 3 }}>
                {filled}/{count}명 {filled >= minCount ? "✓" : `(최소 ${minCount}명)`}
              </div>
              {count === 4 && (
                <>
                  <label style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 6, cursor: "pointer" }}
                    onClick={e => e.stopPropagation()}>
                    <input type="checkbox" checked={union.checked}
                      onChange={e => setTeamUnion(prev => ({ ...prev, [teamKey]: { ...union, checked: e.target.checked } }))}
                      style={{ accentColor: "#c9a84c", width: 14, height: 14 }} />
                    <span style={{ fontSize: 11, color: "#8899aa" }}>타 단체 연합구성</span>
                  </label>
                  {union.checked && (
                    <textarea placeholder="연합 구성 세부 내용" value={union.memo}
                      onClick={e => e.stopPropagation()}
                      onChange={e => setTeamUnion(prev => ({ ...prev, [teamKey]: { ...union, memo: e.target.value } }))}
                      style={{
                        width: "100%", marginTop: 4, padding: 6, minHeight: 44,
                        background: "#0d1520", border: "1px solid #2a3a5c", borderRadius: 5,
                        color: "#e8dcc8", fontSize: 11, fontFamily: "'Noto Sans KR', sans-serif", resize: "vertical", outline: "none",
                      }} />
                  )}
                </>
              )}
            </div>
          );
        };

        return (
          <div style={{ flex: 1, overflow: "auto", padding: "16px 24px" }} onClick={() => setDropdownSlot(null)}>
            <h2 style={styles.sectionTitle}>종목별 등록</h2>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <p style={styles.sectionSub}>종목별로 참가 선수를 선택하고, 단체전 구성을 완성하세요.</p>
              <button onClick={generateTestEvents} style={{
                padding: "6px 14px", borderRadius: 6, fontSize: 12, fontWeight: 700,
                background: "#ff6b3522", border: "1px dashed #ff6b35", color: "#ff6b35",
                cursor: "pointer", whiteSpace: "nowrap"
              }}>🎲 테스트 종목 등록</button>
            </div>

            <div style={{ maxWidth: 900, margin: "16px auto 0", display: "flex", flexDirection: "column", gap: 24 }}>
              {EVENT_CATEGORIES.map(cat => {
                const catEvents = availableEvents.filter(ev => ev.cat === cat.key);
                if (catEvents.length === 0) return null;
                return (
                  <div key={cat.key} style={styles.formGroup}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, paddingBottom: 10, borderBottom: "1px solid #1e2f4a" }}>
                      <span style={{ fontSize: 22 }}>{cat.icon}</span>
                      <span style={{ fontSize: 18, fontWeight: 700, color: "#c9a84c" }}>{cat.label}</span>
                    </div>

                    {/* Table header */}
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 8, padding: "0 4px" }}>
                      <div style={{ flex: "1 1 200px", fontSize: 12, fontWeight: 700, color: "#556677" }}>개인전 종목 / 선수 선택</div>
                    </div>

                    {cat.subs.map(sub => {
                      const subEvents = catEvents.filter(ev => ev.sub === sub);
                      if (subEvents.length === 0) return null;
                      return (
                        <div key={sub} style={{ marginBottom: 10 }}>
                          <div style={{ fontSize: 12, color: "#445566", fontWeight: 600, marginBottom: 6, paddingLeft: 4 }}>{sub}</div>
                          {subEvents.map(ev => {
                            const eligible = players.filter(p =>
                              p.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === p.gender)
                            );
                            const selected = individualEvents[ev.code] || [];
                            const teamKey = `team-${ev.code}`;
                            const teamSlots = teamComps[teamKey] || [null, null, null, null];
                            return (
                              <div key={ev.code} style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 6, padding: "6px 4px", borderBottom: "1px solid #1e2f4a22" }}>
                                {/* Left: individual */}
                                <div style={{ flex: "1 1 200px", minWidth: 0 }}>
                                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                                    <span style={{ fontSize: 12, fontWeight: 700, color: "#e8dcc8" }}>{ev.code}</span>
                                    <span style={{ fontSize: 12, color: "#8899aa" }}>{ev.name.replace(ev.code + " ", "")}</span>
                                    {selected.length > 0 && <span style={{ fontSize: 11, color: "#4aba6a", marginLeft: "auto" }}>{selected.length}명</span>}
                                  </div>
                                  <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                                    {eligible.map(p => {
                                      const sel = selected.includes(p.id);
                                      return (
                                        <button key={p.id} draggable
                                          onDragStart={e => { e.dataTransfer.setData("memberId", p.id.toString()); setDragMember(p.id); }}
                                          onDragEnd={() => setDragMember(null)}
                                          onClick={() => togglePlayerForEvent(ev.code, p.id)}
                                          style={{
                                            ...styles.chipBtn, fontSize: 12, padding: "3px 9px",
                                            background: sel ? "#c9a84c" : "#0d1520",
                                            color: sel ? "#1a2744" : "#8899aa",
                                            borderColor: sel ? "#c9a84c" : "#2a3a5c", cursor: "grab",
                                          }}
                                        >{p.name}</button>
                                      );
                                    })}
                                  </div>
                                </div>
                                {/* Right: team 4 slots - wraps below on narrow */}
                                <div style={{ flex: "0 0 auto", minWidth: 240, maxWidth: 320 }}>
                                  <div style={{ fontSize: 11, fontWeight: 700, color: "#556677", marginBottom: 2 }}>단체전</div>
                                  <TeamSlotRow teamKey={teamKey} slots={teamSlots} eligible={eligible} count={4} minCount={3} />
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                );
              })}

              {/* Mixed Team Events (R10, R11, P6) */}
              {availablePairs.length > 0 && (
                <div style={styles.formGroup}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, paddingBottom: 10, borderBottom: "1px solid #1e2f4a" }}>
                    <span style={{ fontSize: 22 }}>👫</span>
                    <span style={{ fontSize: 18, fontWeight: 700, color: "#c9a84c" }}>혼성팀 종목</span>
                    <span style={{ fontSize: 12, color: "#6b7d94" }}>남1 + 여1 구성 · 최대 2팀</span>
                  </div>
                  {availablePairs.map(pe => {
                    const malePlayers = players.filter(p => p.events.includes(pe.cat) && p.gender === "남");
                    const femalePlayers = players.filter(p => p.events.includes(pe.cat) && p.gender === "여");
                    if (malePlayers.length === 0 && femalePlayers.length === 0) return null;
                    return (
                      <div key={pe.code} style={{ marginBottom: 16, padding: "8px 4px", borderBottom: "1px solid #1e2f4a22" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                          <span style={{ fontSize: 13, fontWeight: 700, color: "#e8dcc8" }}>{pe.code}</span>
                          <span style={{ fontSize: 13, color: "#8899aa" }}>{pe.name.replace(pe.code + " ", "")}</span>
                        </div>
                        {[1, 2].map(teamNum => {
                          const pairKey = `pair-${pe.code}-${teamNum}`;
                          const pairSlots = teamComps[pairKey] || [null, null];
                          const union = teamUnion[pairKey] || { checked: false, memo: "" };
                          const otherKey = `pair-${pe.code}-${teamNum === 1 ? 2 : 1}`;
                          const otherSlots = teamComps[otherKey] || [null, null];
                          const filled = pairSlots.filter(s => s !== null).length;
                          const genderLabels = ["남", "여"];
                          const genderPools = [malePlayers, femalePlayers];
                          return (
                            <div key={teamNum} style={{ marginBottom: 10, marginLeft: 8 }}>
                              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 5 }}>
                                <span style={{ fontSize: 12, fontWeight: 700, color: "#c9a84c" }}>팀 {teamNum}</span>
                                <span style={{ fontSize: 11, color: filled >= 2 ? "#4aba6a" : "#556677" }}>
                                  {filled}/2명 {filled >= 2 ? "✓" : ""}
                                </span>
                              </div>
                              <div style={{ display: "flex", gap: 6, maxWidth: 360 }}>
                                {[0, 1].map(idx => {
                                  const mid = pairSlots[idx] || null;
                                  const player = mid ? members.find(mm => mm.id === mid) : null;
                                  const isOpen = dropdownSlot === `${pairKey}-${idx}`;
                                  const usedInThisTeam = pairSlots.filter(s => s !== null);
                                  const usedInOther = otherSlots.filter(s => s !== null);
                                  const avail = genderPools[idx].filter(p => !usedInThisTeam.includes(p.id) && !usedInOther.includes(p.id));
                                  return (
                                    <div key={idx} style={{ position: "relative", flex: 1 }}>
                                      <div style={{ fontSize: 10, color: "#556677", marginBottom: 2, textAlign: "center" }}>{genderLabels[idx]}</div>
                                      <div
                                        onClick={e => { e.stopPropagation(); if (!player) { if (isOpen) setDropdownSlot(null); else openDropdown(`${pairKey}-${idx}`, e); } }}
                                        onDragOver={e => e.preventDefault()}
                                        onDrop={e => {
                                          e.preventDefault();
                                          const mid = parseInt(e.dataTransfer.getData("memberId"));
                                          if (!mid) return;
                                          const p = members.find(mm => mm.id === mid);
                                          if (!p || p.gender !== genderLabels[idx]) return;
                                          if (pairSlots.includes(mid) || otherSlots.includes(mid)) return;
                                          setTeamSlot(pairKey, idx, mid);
                                        }}
                                        style={{
                                          height: 36, borderRadius: 5,
                                          border: player ? "1px solid #c9a84c44" : "1px dashed #2a3a5c",
                                          background: player ? "#c9a84c15" : "#0d1520",
                                          display: "flex", alignItems: "center", justifyContent: "center", gap: 4, padding: "0 8px",
                                          cursor: player ? "default" : "pointer",
                                        }}
                                      >
                                        {player ? (
                                          <>
                                            <span style={{ fontSize: 13, color: "#e8dcc8", fontWeight: 600 }}>{player.name}</span>
                                            <button onClick={e => { e.stopPropagation(); removeTeamSlot(pairKey, idx); }}
                                              style={{ background: "none", border: "none", color: "#aa4444", fontSize: 12, cursor: "pointer", padding: 0 }}>✕</button>
                                          </>
                                        ) : (
                                          <span style={{ fontSize: 12, color: "#556677" }}>{genderLabels[idx]} 선수</span>
                                        )}
                                      </div>
                                      {isOpen && dropdownPos && (
                                        <div style={{
                                          position: "fixed", top: dropdownPos.top, bottom: dropdownPos.bottom, left: dropdownPos.left, width: dropdownPos.width, minWidth: 110, zIndex: 9999,
                                          background: "#1a2744", border: "1px solid #3d5278", borderRadius: 6,
                                          boxShadow: "0 4px 16px #00000066", maxHeight: 140, overflowY: "auto",
                                        }}>
                                          {avail.length > 0 ? avail.map(p => (
                                            <div key={p.id}
                                              onClick={e => { e.stopPropagation(); setTeamSlot(pairKey, idx, p.id); }}
                                              style={{ padding: "7px 10px", fontSize: 12, color: "#c8d4e4", cursor: "pointer", borderBottom: "1px solid #2a3a5c22" }}
                                              onMouseEnter={e => e.currentTarget.style.background = "#2e4468"}
                                              onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                                            >{p.name}</div>
                                          )) : (
                                            <div style={{ padding: "8px", fontSize: 11, color: "#556677", textAlign: "center" }}>{genderLabels[idx]} 선수 없음</div>
                                          )}
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                              <label style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 6, cursor: "pointer" }}
                                onClick={e => e.stopPropagation()}>
                                <input type="checkbox" checked={union.checked}
                                  onChange={e => setTeamUnion(prev => ({ ...prev, [pairKey]: { ...union, checked: e.target.checked } }))}
                                  style={{ accentColor: "#c9a84c", width: 14, height: 14 }} />
                                <span style={{ fontSize: 11, color: "#8899aa" }}>타 단체 연합구성</span>
                              </label>
                              {union.checked && (
                                <textarea placeholder="연합 구성 세부 내용" value={union.memo}
                                  onClick={e => e.stopPropagation()}
                                  onChange={e => setTeamUnion(prev => ({ ...prev, [pairKey]: { ...union, memo: e.target.value } }))}
                                  style={{
                                    width: "100%", maxWidth: 360, marginTop: 4, padding: 6, minHeight: 44,
                                    background: "#0d1520", border: "1px solid #2a3a5c", borderRadius: 5,
                                    color: "#e8dcc8", fontSize: 11, fontFamily: "'Noto Sans KR', sans-serif", resize: "vertical", outline: "none",
                                  }} />
                              )}
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              )}

              {players.length === 0 && (
                <div style={{ ...styles.formGroup, textAlign: "center", padding: 32, color: "#556677" }}>
                  등록된 선수가 없습니다. 이전 단계에서 선수를 추가해주세요.
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {/* Step 4: Firearm Registration */}
      {step === 4 && (() => {
        const players = members.filter(m => m.role === "선수");
        const GUN_TYPES = ["공기소총", "공기권총"];
        const addFirearm = (memberId) => {
          setFirearms(prev => {
            const curr = prev[memberId] || [];
            const newId = curr.length > 0 ? Math.max(...curr.map(f => f.id)) + 1 : 1;
            return { ...prev, [memberId]: [...curr, { id: newId, type: "", maker: "", model: "", serial: "", permit: "" }] };
          });
        };
        const updateFirearm = (memberId, firearmId, field, value) => {
          setFirearms(prev => ({
            ...prev,
            [memberId]: (prev[memberId] || []).map(f => f.id === firearmId ? { ...f, [field]: value } : f)
          }));
        };
        const removeFirearm = (memberId, firearmId) => {
          setFirearms(prev => ({
            ...prev,
            [memberId]: (prev[memberId] || []).filter(f => f.id !== firearmId)
          }));
        };

        return (
          <div style={{ flex: 1, overflow: "auto", padding: "16px 24px" }}>
            <h2 style={styles.sectionTitle}>총기 등록</h2>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <p style={styles.sectionSub}>선수별로 사용 총기 정보를 등록하세요.</p>
              <button onClick={generateTestFirearms} style={{
                padding: "6px 14px", borderRadius: 6, fontSize: 12, fontWeight: 700,
                background: "#ff6b3522", border: "1px dashed #ff6b35", color: "#ff6b35",
                cursor: "pointer", whiteSpace: "nowrap"
              }}>🎲 테스트 총기 등록</button>
            </div>

            <div style={{ maxWidth: 750, width: "100%", margin: "16px auto 0", display: "flex", flexDirection: "column", gap: 16 }}>
              {players.map(p => {
                const guns = firearms[p.id] || [];
                return (
                  <div key={p.id} style={styles.formGroup}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, paddingBottom: 8, borderBottom: "1px solid #1e2f4a" }}>
                      <span style={{ fontSize: 16, fontWeight: 700, color: "#e8dcc8" }}>{p.name}</span>
                      <span style={{ fontSize: 12, color: "#6b7d94", padding: "1px 6px", background: "#1a274466", borderRadius: 4 }}>{p.gender}</span>
                      <span style={{ fontSize: 12, color: "#8899aa" }}>{p.events.join(", ")}</span>
                      <span style={{ fontSize: 12, color: "#c9a84c", marginLeft: "auto" }}>{guns.length}정</span>
                    </div>

                    {guns.map((gun, gIdx) => (
                      <div key={gun.id} style={{ position: "relative", marginBottom: 10, padding: "10px 12px", background: "#0d152088", borderRadius: 8, border: "1px solid #1e2f4a" }}>
                        <div style={{ display: "flex", alignItems: "center", marginBottom: 8 }}>
                          <span style={{ fontSize: 13, fontWeight: 700, color: "#c9a84c" }}>총기 {gIdx + 1}</span>
                          <button onClick={() => removeFirearm(p.id, gun.id)}
                            style={{ marginLeft: "auto", background: "none", border: "none", color: "#aa4444", fontSize: 13, cursor: "pointer" }}>삭제</button>
                        </div>

                        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                            <span style={{ fontSize: 13, fontWeight: 600, color: "#6b7d94", width: 80, flexShrink: 0 }}>총종 <span style={{color:"#cc4444"}}>*</span></span>
                            <div style={{ display: "flex", gap: 5, flex: 1, flexWrap: "wrap" }}>
                              {GUN_TYPES.map(gt => (
                                <button key={gt} onClick={() => updateFirearm(p.id, gun.id, "type", gt)}
                                  style={{
                                    ...styles.chipBtn, fontSize: 12, padding: "3px 10px",
                                    background: gun.type === gt ? "#c9a84c" : "#0d1520",
                                    color: gun.type === gt ? "#1a2744" : "#8899aa",
                                    borderColor: gun.type === gt ? "#c9a84c" : "#2a3a5c",
                                  }}>{gt}</button>
                              ))}
                            </div>
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                            <span style={{ fontSize: 13, fontWeight: 600, color: "#6b7d94", width: 80, flexShrink: 0 }}>제조사 <span style={{color:"#cc4444"}}>*</span></span>
                            <input type="text" placeholder="제조사" value={gun.maker}
                              onChange={e => updateFirearm(p.id, gun.id, "maker", e.target.value)}
                              style={{ ...styles.formInput, flex: 1, fontSize: 13, padding: "6px 10px" }} />
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                            <span style={{ fontSize: 13, fontWeight: 600, color: "#6b7d94", width: 80, flexShrink: 0 }}>모델명 <span style={{color:"#cc4444"}}>*</span></span>
                            <input type="text" placeholder="모델명" value={gun.model}
                              onChange={e => updateFirearm(p.id, gun.id, "model", e.target.value)}
                              style={{ ...styles.formInput, flex: 1, fontSize: 13, padding: "6px 10px" }} />
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                            <span style={{ fontSize: 13, fontWeight: 600, color: "#6b7d94", width: 80, flexShrink: 0 }}>총기번호 <span style={{color:"#cc4444"}}>*</span></span>
                            <input type="text" placeholder="총기번호" value={gun.serial}
                              onChange={e => updateFirearm(p.id, gun.id, "serial", e.target.value)}
                              style={{ ...styles.formInput, flex: 1, fontSize: 13, padding: "6px 10px" }} />
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                            <span style={{ fontSize: 13, fontWeight: 600, color: "#6b7d94", width: 80, flexShrink: 0 }}>허가증번호 <span style={{color:"#cc4444"}}>*</span></span>
                            <input type="text" placeholder="허가증번호" value={gun.permit}
                              onChange={e => updateFirearm(p.id, gun.id, "permit", e.target.value)}
                              style={{ ...styles.formInput, flex: 1, fontSize: 13, padding: "6px 10px" }} />
                          </div>
                        </div>
                      </div>
                    ))}

                    <button onClick={() => addFirearm(p.id)}
                      style={{ ...styles.addBtn, width: "100%", marginTop: 4, padding: "8px 14px", fontSize: 12 }}
                    >+ 총기 추가</button>
                  </div>
                );
              })}
              {players.length === 0 && (
                <div style={{ ...styles.formGroup, textAlign: "center", padding: 32, color: "#556677" }}>
                  등록된 선수가 없습니다.
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {/* Step 5: Confirmation */}
      {step === 5 && (() => {
        const players = members.filter(m => m.role === "선수");
        const staffs = members.filter(m => m.role !== "선수");
        const tournament = activeTournaments.find(t => t.id === selectedTournament);
        const region = REGIONS[selectedRegion];
        const allIndividual = activeIndividualEvents.filter(ev =>
          (individualEvents[ev.code] || []).length > 0 && players.some(p => p.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === p.gender))
        );
        const allTeams = Object.entries(teamComps).filter(([, slots]) => slots.some(s => s !== null));
        const totalGuns = Object.values(firearms).reduce((sum, arr) => sum + (arr || []).length, 0);

        const SectionTitle = ({ children }) => (
          <div style={{ fontSize: 15, fontWeight: 700, color: "#c9a84c", marginBottom: 10, paddingBottom: 6, borderBottom: "1px solid #c9a84c33" }}>{children}</div>
        );
        const InfoRow = ({ label, value, sub }) => (
          <div style={{ display: "flex", gap: 10, padding: "5px 0", fontSize: 13 }}>
            <span style={{ color: "#6b7d94", width: 90, flexShrink: 0, fontWeight: 600 }}>{label}</span>
            <span style={{ color: "#e8dcc8", flex: 1, minWidth: 0 }}>{value}{sub && <span style={{ color: "#6b7d94", fontSize: 11, marginLeft: 6 }}>{sub}</span>}</span>
          </div>
        );

        return (
          <div style={{ flex: 1, overflow: "auto", padding: "16px 24px" }}>
            <h2 style={styles.sectionTitle}>참가신청 확인</h2>
            <p style={styles.sectionSub}>입력하신 정보를 확인하세요.</p>

            <div style={{ maxWidth: 750, width: "100%", margin: "16px auto 0", display: "flex", flexDirection: "column", gap: 16 }}>

              {/* 1. 대회 / 소속 정보 */}
              <div style={styles.formGroup}>
                <SectionTitle>대회 · 소속 정보</SectionTitle>
                <InfoRow label="참가 대회" value={tournament?.name} />
                <InfoRow label="소속 시/도" value={region?.name} />
                <InfoRow label="신청 단체명" value={orgName} />
              </div>

              {/* 2. 선수단 정보 */}
              <div style={styles.formGroup}>
                <SectionTitle>선수단 구성 ({members.length}명)</SectionTitle>
                {players.length > 0 && (
                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#8899aa", marginBottom: 6 }}>선수 ({players.length}명)</div>
                    {players.map((p, i) => (
                      <div key={p.id} style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", padding: "5px 0", borderBottom: "1px solid #1e2f4a22", fontSize: 13 }}>
                        <span style={{ color: "#6b7d94", width: 22, fontWeight: 700, flexShrink: 0 }}>{i + 1}</span>
                        <span style={{ color: "#e8dcc8", fontWeight: 600, minWidth: 60 }}>{p.name}</span>
                        <span style={{ color: "#6b7d94", fontSize: 12 }}>{p.gender}</span>
                        <span style={{ color: "#6b7d94", fontSize: 12 }}>{p.dob}</span>
                        <span style={{ color: "#556677", fontSize: 11 }}>{p.subOrg}</span>
                        <span style={{ color: "#8899aa", fontSize: 11, marginLeft: "auto" }}>{p.events.join(", ")}</span>
                      </div>
                    ))}
                  </div>
                )}
                {staffs.length > 0 && (
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#8899aa", marginBottom: 6 }}>임원 ({staffs.length}명)</div>
                    {staffs.map((m, i) => (
                      <div key={m.id} style={{ display: "flex", gap: 6, alignItems: "center", padding: "5px 0", borderBottom: "1px solid #1e2f4a22", fontSize: 13 }}>
                        <span style={{ color: "#6b7d94", width: 22, fontWeight: 700, flexShrink: 0 }}>{i + 1}</span>
                        <span style={{ color: "#e8dcc8", fontWeight: 600 }}>{m.name}</span>
                        <span style={{ color: "#6b7d94", fontSize: 12 }}>{m.gender}</span>
                        <span style={{ color: "#6b7d94", fontSize: 12 }}>{m.role}</span>
                        <span style={{ color: "#556677", fontSize: 11 }}>{m.subOrg}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* 3. 종목별 등록 현황 */}
              <div style={styles.formGroup}>
                <SectionTitle>종목별 등록 현황</SectionTitle>
                {allIndividual.length > 0 && (
                  <div style={{ marginBottom: 10 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#8899aa", marginBottom: 6 }}>개인전</div>
                    {allIndividual.map(ev => {
                      const pIds = individualEvents[ev.code];
                      return (
                        <div key={ev.code} style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", padding: "4px 0", borderBottom: "1px solid #1e2f4a22", fontSize: 13 }}>
                          <span style={{ color: "#c9a84c", fontWeight: 700, minWidth: 32 }}>{ev.code}</span>
                          <span style={{ color: "#8899aa", minWidth: 120 }}>{ev.name.replace(ev.code + " ", "")}</span>
                          <span style={{ color: "#e8dcc8", fontSize: 12 }}>
                            {pIds.map(id => members.find(mm => mm.id === id)?.name).filter(Boolean).join(", ")}
                          </span>
                          <span style={{ color: "#4aba6a", fontSize: 11, marginLeft: "auto" }}>{pIds.length}명</span>
                        </div>
                      );
                    })}
                  </div>
                )}
                {allTeams.length > 0 && (
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#8899aa", marginBottom: 6 }}>단체전 · 혼성팀</div>
                    {allTeams.map(([key, slots]) => {
                      const filledSlots = slots.filter(s => s !== null);
                      const isPair = key.startsWith("pair-");
                      const isTeam = key.startsWith("team-");
                      let label = key;
                      if (isTeam) label = key.replace("team-", "") + " 단체전";
                      if (isPair) {
                        const parts = key.replace("pair-", "").split("-");
                        label = parts[0] + " 혼성팀 " + parts[1] + "팀";
                      }
                      const union = teamUnion[key];
                      return (
                        <div key={key} style={{ padding: "4px 0", borderBottom: "1px solid #1e2f4a22", fontSize: 13 }}>
                          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                            <span style={{ color: "#c9a84c", fontWeight: 700 }}>{label}</span>
                            <span style={{ color: "#e8dcc8", fontSize: 12 }}>
                              {filledSlots.map(id => members.find(mm => mm.id === id)?.name).filter(Boolean).join(", ")}
                            </span>
                            <span style={{ color: "#4aba6a", fontSize: 11, marginLeft: "auto" }}>{filledSlots.length}명</span>
                          </div>
                          {union?.checked && (
                            <div style={{ fontSize: 11, color: "#cc8844", marginTop: 2, paddingLeft: 8 }}>연합구성: {union.memo || "(메모 없음)"}</div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
                {allIndividual.length === 0 && allTeams.length === 0 && (
                  <div style={{ fontSize: 13, color: "#556677", padding: "8px 0" }}>등록된 종목이 없습니다.</div>
                )}
              </div>

              {/* 4. 총기 등록 현황 */}
              <div style={styles.formGroup}>
                <SectionTitle>총기 등록 현황 ({totalGuns}정)</SectionTitle>
                {players.map(p => {
                  const guns = firearms[p.id] || [];
                  if (guns.length === 0) return null;
                  return (
                    <div key={p.id} style={{ marginBottom: 10 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: "#e8dcc8", marginBottom: 4 }}>{p.name} ({guns.length}정)</div>
                      {guns.map((g, gIdx) => (
                        <div key={g.id} style={{ display: "flex", flexWrap: "wrap", gap: 8, padding: "4px 0 4px 12px", borderBottom: "1px solid #1e2f4a22", fontSize: 12 }}>
                          <span style={{ color: "#6b7d94", fontWeight: 700, width: 18 }}>{gIdx + 1}</span>
                          <span style={{ color: "#c9a84c", minWidth: 56 }}>{g.type || "-"}</span>
                          <span style={{ color: "#8899aa" }}>{g.maker || "-"}</span>
                          <span style={{ color: "#e8dcc8" }}>{g.model || "-"}</span>
                          <span style={{ color: "#6b7d94" }}>No.{g.serial || "-"}</span>
                          <span style={{ color: "#6b7d94" }}>허가 {g.permit || "-"}</span>
                        </div>
                      ))}
                    </div>
                  );
                })}
                {totalGuns === 0 && (
                  <div style={{ fontSize: 13, color: "#556677", padding: "8px 0" }}>등록된 총기가 없습니다.</div>
                )}
              </div>

              {/* 참가신청 완료 버튼 */}
              {submitError && (
                <div style={{ padding: "10px 14px", marginBottom: 12, borderRadius: 8, background: "#cc444422", border: "1px solid #cc4444", color: "#ff8888", fontSize: 13 }}>
                  ⚠ 제출 오류: {submitError}
                </div>
              )}
              <button
                onClick={submitApplication}
                disabled={submitting}
                style={{
                  width: "100%", padding: "16px 24px", borderRadius: 10,
                  background: submitting ? "#555" : "linear-gradient(135deg, #c9a84c, #a8872e)",
                  border: "none", color: submitting ? "#999" : "#1a2744", fontSize: 17, fontWeight: 800,
                  cursor: submitting ? "wait" : "pointer", transition: "all 0.2s",
                  boxShadow: "0 4px 20px #c9a84c33",
                  marginBottom: 20,
                }}
                onMouseEnter={e => { if (!submitting) { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 28px #c9a84c55"; }}}
                onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 20px #c9a84c33"; }}
              >{submitting ? "제출 중..." : "참가신청 완료"}</button>
            </div>
          </div>
        );
      })()}

      {/* Bottom Bar */}
      <div style={styles.bottomBar}>
        {step === 0 && selectedTournament && (() => {
          const t = activeTournaments.find(t => t.id === selectedTournament);
          const canApply = t?.status === 1;
          let msg = "";
          if (t.status === 2) msg = `${t.regPeriod} 기간에 참가신청이 가능합니다.`;
          else if (t.status === 3) msg = "이미 진행중인 대회입니다.";
          else if (t.status === 4) msg = "이미 종료된 대회입니다.";
          return (
            <div style={styles.selectedDisplay}>
              {canApply
                ? <>선택된 대회: <strong style={{ color: "#c9a84c" }}>{t.name}</strong></>
                : <span style={{ color: "#cc6644" }}>⚠ {msg}</span>
              }
            </div>
          );
        })()}
        {step === 1 && selectedRegion && (
          <div style={styles.selectedDisplay}>
            선택된 지역: <strong style={{ color: "#c9a84c" }}>{REGIONS[selectedRegion]?.name}</strong>
          </div>
        )}
        {step === 2 && (
          <div style={styles.selectedDisplay}>
            등록 인원: <strong style={{ color: "#c9a84c" }}>{members.length}명</strong>
          </div>
        )}
        {step === 3 && (
          <div style={styles.selectedDisplay}>
            종목별 등록
          </div>
        )}
        {step === 4 && (
          <div style={styles.selectedDisplay}>
            총기 등록
          </div>
        )}
        {step === 5 && (
          <div style={styles.selectedDisplay}>
            <strong style={{ color: "#c9a84c" }}>참가신청 확인</strong>
          </div>
        )}
        {step === 0 && !selectedTournament && <div />}
        {step === 1 && !selectedRegion && <div />}
        {step < 5 && (
        <button
          style={{
            ...styles.nextBtn,
            ...(step === 2 && step2HasError ? { background: "linear-gradient(135deg, #cc4444, #992222)" } : {}),
            opacity: (step === 0 && selectedTournament && activeTournaments.find(t => t.id === selectedTournament)?.status === 1) || (step === 1 && selectedRegion) || step >= 2 ? 1 : 0.4,
            cursor: (step === 0 && selectedTournament && activeTournaments.find(t => t.id === selectedTournament)?.status === 1) || (step === 1 && selectedRegion) || step >= 2 ? "pointer" : "not-allowed",
          }}
          disabled={step === 0 ? (!selectedTournament || activeTournaments.find(t => t.id === selectedTournament)?.status !== 1) : step === 1 ? !selectedRegion : false}
          onClick={() => {
            if (step === 0 && selectedTournament) {
              const t = activeTournaments.find(t => t.id === selectedTournament);
              if (t.status !== 1) {
                if (t.status === 2) alert(`${t.regPeriod} 기간에 참가신청이 가능합니다.`);
                else if (t.status === 3) alert("이미 진행중인 대회입니다.");
                else if (t.status === 4) alert("이미 종료된 대회입니다.");
                return;
              }
              setStep(1);
            }
            else if (step === 1 && selectedRegion) setStep(2);
            else if (step === 2) {
              const err = getStep2Error();
              if (err) {
                flashField(err.field, err.memberId);
                return;
              }
              // Step 3 진입 시: 현재 선수 카테고리/성별에 맞지 않는 종목 등록 정리
              const curPlayers = members.filter(m => m.role === "선수");
              const validCodes = new Set(activeIndividualEvents.filter(ev =>
                curPlayers.some(p => p.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === p.gender))
              ).map(ev => ev.code));
              setIndividualEvents(prev => {
                const cleaned = {};
                Object.entries(prev).forEach(([code, mIds]) => {
                  if (validCodes.has(code)) {
                    const validMids = mIds.filter(mid => {
                      const m = curPlayers.find(p => p.id === mid);
                      if (!m) return false;
                      const ev = activeIndividualEvents.find(e => e.code === code);
                      return ev && m.events.includes(ev.cat) && (ev.gender === "혼" || ev.gender === m.gender);
                    });
                    if (validMids.length > 0) cleaned[code] = validMids;
                  }
                });
                return cleaned;
              });
              setStep(3);
            }
            else if (step === 3) setStep(4);
            else if (step === 4) setStep(5);
          }}
        >
          다음 단계 →
        </button>
        )}
      </div>
    </div>
  );
}

const styles = {
  /* Landing */
  landingContainer: { minHeight: "100vh", background: "linear-gradient(160deg, #0d1520 0%, #1a2744 40%, #0d1520 100%)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Noto Sans KR', sans-serif", position: "relative", overflow: "hidden" },
  landingInner: { textAlign: "center", padding: 40 },
  logoMark: { fontSize: 56, marginBottom: 16, filter: "drop-shadow(0 0 20px rgba(201,168,76,0.4))" },

  secondaryBtn: { display: "flex", alignItems: "center", gap: 16, padding: "20px 28px", background: "transparent", border: "2px solid #3d5278", borderRadius: 12, cursor: "pointer", textAlign: "left", color: "#b8c8e0" },
  btnIcon: { fontSize: 28 },
  btnMain: { fontSize: 20, fontWeight: 700 },
  btnSub: { fontSize: 12, opacity: 0.7, marginTop: 2 },

  container: { minHeight: "100vh", background: "linear-gradient(160deg, #0d1520 0%, #1a2744 40%, #0d1520 100%)", fontFamily: "'Noto Sans KR', sans-serif", color: "#e8dcc8", display: "flex", flexDirection: "column" },
  header: { display: "flex", alignItems: "center", gap: 16, padding: "16px 24px", borderBottom: "1px solid #1e2f4a" },
  backBtn: { background: "none", border: "1px solid #3d5278", color: "#8899aa", padding: "8px 16px", borderRadius: 8, cursor: "pointer", fontSize: 14 },

  stepBar: { display: "flex", alignItems: "center", justifyContent: "flex-start", padding: "16px 24px", gap: 0 },

  stepCircle: { width: 32, height: 32, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 700, flexShrink: 0 },
  stepLabel: { fontSize: 13, fontWeight: 600, whiteSpace: "nowrap" },
  stepLine: { width: 40, height: 2, borderRadius: 1, margin: "0 8px", flexShrink: 0 },

  groupLabel: { fontSize: 11, color: "#556677", fontWeight: 600, textTransform: "uppercase", letterSpacing: 1, padding: "4px 12px", marginBottom: 4 },

  selectedDisplay: { fontSize: 16, color: "#8899aa" },
  nextBtn: { padding: "12px 32px", background: "linear-gradient(135deg, #c9a84c, #a08030)", border: "none", borderRadius: 10, color: "#1a2744", fontSize: 17, fontWeight: 700, cursor: "pointer", transition: "opacity 0.2s" },

  detailRow: { display: "flex", alignItems: "center", gap: 12, minWidth: 0 },
  detailLabel: { fontSize: 13, fontWeight: 600, color: "#6b7d94", width: 70, flexShrink: 0 },
  chipBtn: { padding: "6px 14px", borderRadius: 6, border: "1px solid #2a3a5c", fontSize: 13, fontWeight: 600, cursor: "pointer", transition: "all 0.15s" },
  highlightField: { borderColor: "#cc4444", boxShadow: "0 0 0 2px #cc444466, 0 0 12px #cc444444", animation: "hlPulse 0.6s ease 2" },
  highlightRow: { background: "#cc444418", borderRadius: 6, padding: "10px 12px", margin: "-2px -4px", boxShadow: "0 0 12px #cc444433", animation: "hlPulse 0.6s ease 2" },
