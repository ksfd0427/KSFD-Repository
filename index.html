<style>

.mcpl .si-inp{width:26px;padding:1px;background:var(--sf3);border:1px solid var(--bdl);border-radius:2px;color:var(--wh);font-size:8px;font-weight:700;text-align:center;outline:none;font-family:inherit}.mcpl .si-inp:focus{border-color:var(--ac)}.mcpl .xi-inp{width:24px;padding:1px;background:rgba(245,158,11,.1);border:1px solid var(--gdbd);border-radius:2px;color:var(--gd);font-size:8px;font-weight:700;text-align:center;outline:none;font-family:inherit}
.mcvs{text-align:center;padding:1px 0;font-size:8px;font-weight:800;color:var(--mt);letter-spacing:2px;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.mcact{display:flex;border-top:1px solid var(--bd)}.mcact button{flex:1;padding:5px;font-size:9px;font-weight:700;border:none;background:transparent;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:3px}.mcact button+button{border-left:1px solid var(--bd)}.mcact .ag{color:var(--gn)}.mcact .ag:hover{background:var(--gnbg)}.mcact .ad{color:var(--rd)}.mcact .ad:hover{background:var(--rdbg)}.mcact button:disabled{color:var(--mt);opacity:.3;cursor:not-allowed}
.cpulse{animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(14,165,233,.4)}50%{box-shadow:0 0 0 8px rgba(14,165,233,0)}}

<body>
<div class="hdr"><div class="logo"><div class="logo-ic">🎯</div><div><h1>대한장애인사격연맹 리그전 운영시스템</h1><div class="sub">Korea Shooting Federation for Disabled · League Operation System</div></div></div><div class="snav" id="sNav"></div></div>
<div class="pg on" id="pg0"></div><div class="pg" id="pg1"></div><div class="pg" id="pg2"></div>
<datalist id="sdL"><option value="서울"><option value="부산"><option value="대구"><option value="인천"><option value="광주"><option value="대전"><option value="울산"><option value="세종"><option value="경기"><option value="강원"><option value="충북"><option value="충남"><option value="전북"><option value="전남"><option value="경북"><option value="경남"><option value="제주"></datalist>
<script>
let TC=4,teams=[],matches=[],step=0,editOn=false,wType='rifle',rType=1,regMode='first';
let tInfo={name:'',date:'',venue:'',event:''};
let RD={1:null,2:null,3:null}; // round data store
const STEPS=['팀 등록','경기 진행','결과 확인'],RL={1:'1차전',2:'2차전',3:'3차전'},IP=()=>wType==='pistol';
buildNav();renderReg();

function fS(v){if(v==null)return'–';return IP()?String(Math.round(v)):v.toFixed(1)}
function fT(t,x){if(t==null)return'–';let s=IP()?String(Math.round(t)):t.toFixed(1);if(IP()&&x!=null)s+='-x'+x;return s}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function cl(v,a,b){return Math.max(a,Math.min(b,v))}
function mkPD(){return{series:[null,null,null,null,null,null],xten:null,total:null}}
function mkM(a,b){return{a,b,pA:[mkPD(),mkPD()],pB:[mkPD(),mkPD()],totA:null,totB:null,xtenA:null,xtenB:null}}
function isDone(m){return m.totA!==null}
function calcM(m){for(const p of[...m.pA,...m.pB]){if(p.series.some(s=>s===null))return false;p.total=p.series.reduce((a,b)=>a+b,0);p.total=IP()?Math.round(p.total):Math.round(p.total*10)/10}m.totA=IP()?m.pA[0].total+m.pA[1].total:Math.round((m.pA[0].total+m.pA[1].total)*10)/10;m.totB=IP()?m.pB[0].total+m.pB[1].total:Math.round((m.pB[0].total+m.pB[1].total)*10)/10;if(IP()){m.xtenA=(m.pA[0].xten||0)+(m.pA[1].xten||0);m.xtenB=(m.pB[0].xten||0)+(m.pB[1].xten||0)}return true}
function mWin(m){if(!isDone(m))return 0;if(m.totA!==m.totB)return m.totA>m.totB?1:2;if(IP()&&m.xtenA!==m.xtenB)return m.xtenA>m.xtenB?1:2;return 0}
function mWP(m,s){const w=mWin(m);if(w===0)return 2;return s==='A'?(w===1?3:1):(w===2?3:1)}
function rS(){return IP()?Math.floor(Math.random()*21)+80:Math.round((80.5+Math.random()*28.5)*10)/10}
function rX(){return Math.floor(Math.random()*31)+10}
function rPD(){const p=mkPD();for(let i=0;i<6;i++)p.series[i]=rS();p.total=p.series.reduce((a,b)=>a+b,0);p.total=IP()?Math.round(p.total):Math.round(p.total*10)/10;if(IP())p.xten=rX();return p}
function cumWP(ti){let w=0;for(let r=1;r<=3;r++){if(!RD[r])continue;const d=RD[r].find(x=>x.ti===ti);if(d)w+=d.wp}return w}
function cumTot(ti){let t=0;for(let r=1;r<=3;r++){if(!RD[r])continue;const d=RD[r].find(x=>x.ti===ti);if(d)t+=d.tot}return t}
function genMatches(){matches=[];const s=teams.map((_,i)=>({i,wp:cumWP(i),tot:cumTot(i)})).sort((a,b)=>(b.wp-a.wp)||(b.tot-a.tot)||(a.i-b.i));const ids=s.map(x=>x.i),n=ids.length;if(rType===1){for(let i=0;i+1<n;i+=2)matches.push(mkM(ids[i],ids[i+1]))}else if(rType===2){const h=n/2;for(let i=0;i<h;i++)matches.push(mkM(ids[i],ids[n-1-i]))}else{const h=n/2;for(let i=0;i<h;i++)matches.push(mkM(ids[i],ids[h+i]))}}
function storeRound(){const res=[];matches.forEach(m=>{if(!isDone(m))return;const tA=teams[m.a],tB=teams[m.b];const msA=tA?tA.members.map(x=>({n:x.name,s:x.sido,c:x.club})):[];const msB=tB?tB.members.map(x=>({n:x.name,s:x.sido,c:x.club})):[];res.push({ti:m.a,tn:tA?tA.disp:'',opp:tB?tB.disp:'',ms:msA,ps:JSON.parse(JSON.stringify(m.pA)),tot:m.totA,xt:m.xtenA,wp:mWP(m,'A')});res.push({ti:m.b,tn:tB?tB.disp:'',opp:tA?tA.disp:'',ms:msB,ps:JSON.parse(JSON.stringify(m.pB)),tot:m.totB,xt:m.xtenB,wp:mWP(m,'B')})});res.sort((a,b)=>(b.wp-a.wp)||(b.tot-a.tot));RD[rType]=res}

/* Nav */
function buildNav(){const n=document.getElementById('sNav');n.innerHTML='';STEPS.forEach((s,i)=>{if(i>0)n.insertAdjacentHTML('beforeend','<span class="ssep">›</span>');n.insertAdjacentHTML('beforeend',`<div class="si ${i===0?'active':'locked'}" onclick="goStep(${i})"><span class="sn">${i+1}</span>${s}</div>`)})}

}

function setMode(m){regMode=m;renderReg()}
function setW(w){wType=w;renderReg()}
function setR(r){rType=r;renderReg()}
function updRTD(){const d=document.getElementById('rtD');if(!d)return;const ds={1:'<b>1차전:</b> 등록 순서대로 순차 대진',2:'<b>2차전:</b> 승점 기준 상위↔하위 접기',3:'<b>3차전:</b> 승점 기준 상위↔하위 순차'};d.innerHTML=ds[rType]}
function buildTT(){const tb=document.getElementById('ttb');if(!tb)return;tb.innerHTML='';for(let t=0;t<TC;t++){for(let p=0;p<2;p++){const tr=document.createElement('tr');if(p===1)tr.classList.add('tdiv');const g=t*2+p;let h='';if(!p)h+=`<td class="nc" rowspan="2">${t+1}</td>`;h+=`<td class="lc">${p?'B':'A'}</td><td><input class="ci" data-r="${g}" data-c="0" placeholder="선수 이름" onkeydown="cnav(event,${g},0)"></td><td><input class="ci" data-r="${g}" data-c="1" list="sdL" placeholder="시도" onkeydown="cnav(event,${g},1)" oninput="synS(${t})"></td><td><input class="ci" data-r="${g}" data-c="2" placeholder="소속" onkeydown="cnav(event,${g},2)"></td>`;if(!p)h+=`<td rowspan="2" style="text-align:center;vertical-align:middle">${TC>2?`<button class="rmb" onclick="rmT(${t})">✕</button>`:''}</td>`;tr.innerHTML=h;tb.appendChild(tr)}};document.getElementById('tcL').textContent=`(${TC}팀)`}
function gv(r,c){const e=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);return e?e.value:''}
function sv(r,c,v){const e=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);if(e)e.value=v}
function synS(t){const s=gv(t*2,1);if(s&&!gv(t*2+1,1))sv(t*2+1,1,s)}
function cnav(e,r,c){const mx=TC*2-1,mc=2;if(e.key==='Tab'){e.preventDefault();let nr=r,nc=c;if(e.shiftKey){nc--;if(nc<0){nc=mc;nr--}}else{nc++;if(nc>mc){nc=0;nr++}}fc(cl(nr,0,mx),cl(nc,0,mc))}if(e.key==='Enter'){e.preventDefault();fc(cl(e.shiftKey?r-1:r+1,0,mx),c)}if(e.key==='ArrowUp'){e.preventDefault();fc(cl(r-1,0,mx),c)}if(e.key==='ArrowDown'){e.preventDefault();fc(cl(r+1,0,mx),c)}if(e.key==='ArrowLeft'&&e.target.selectionStart===0){e.preventDefault();fc(r,cl(c-1,0,mc))}if(e.key==='ArrowRight'&&e.target.selectionStart===e.target.value.length){e.preventDefault();fc(r,cl(c+1,0,mc))}}
function fc(r,c){const e=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);if(e){e.focus();e.select()}}
function wpN(e,t){if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();const d=(e.key==='ArrowUp'||(e.key==='Enter'&&e.shiftKey))?-1:1;const el=document.querySelector(`[data-t="${cl(t+d,0,TC-1)}"][data-f="wp"]`);if(el){el.focus();el.select()}}}
function addTeam(){const v=savV(),pw=savPW();TC+=2;buildTT();rstV(v);rstPW(pw)}
function rmT(t){if(TC<=2)return;const v=savV(),pw=savPW();v.splice(t*2,2);pw.splice(t,1);TC--;if(TC%2===1){v.splice(v.length-2,2);pw.splice(pw.length-1,1);TC--}buildTT();rstV(v);rstPW(pw)}
function savV(){const a=[];for(let i=0;i<TC*2;i++)a.push([gv(i,0),gv(i,1),gv(i,2)]);return a}
function rstV(a){a.forEach((v,i)=>{sv(i,0,v[0]);sv(i,1,v[1]);sv(i,2,v[2])})}
function savPW(){const a=[];for(let t=0;t<TC;t++){const el=document.querySelector(`[data-t="${t}"][data-f="wp"]`);a.push(el?parseFloat(el.value)||0:0)}return a}
function rstPW(a){a.forEach((v,t)=>{const el=document.querySelector(`[data-t="${t}"][data-f="wp"]`);if(el)el.value=v})}
function mkDisp(ms){const s0=(ms[0].sido||'').trim(),s1=(ms[1].sido||'').trim();if(s0&&s1)return s0===s1?s0:`${s0}/${s1}`;return s0||s1||''}
function confirmTeams(){
  tInfo={name:document.getElementById('tN').value.trim(),date:document.getElementById('tD').value,venue:document.getElementById('tV').value.trim(),event:document.getElementById('tE').value.trim()};
  if(regMode==='prev'){
    const tSet=new Set();[1,2,3].forEach(r=>{if(RD[r])RD[r].forEach(x=>tSet.add(x.ti))});
    const tis=[...tSet].sort((a,b)=>a-b);TC=tis.length;if(TC<2){alert('최소 2팀 이상의 기록이 필요합니다.');return}
    if(TC%2!==0){alert('짝수 팀이어야 합니다.');return}
    teams=[];tis.forEach((ti,idx)=>{
      let ms=null,tn='';for(let r=1;r<=3;r++){if(!RD[r])continue;const d=RD[r].find(x=>x.ti===ti);if(d){if(!ms&&d.ms)ms=d.ms;if(!tn&&d.tn)tn=d.tn}}
      const m0=ms?{name:ms[0].n,sido:ms[0].s,club:ms[0].c}:{name:'',sido:'',club:''};
      const m1=ms?{name:ms[1].n,sido:ms[1].s,club:ms[1].c}:{name:'',sido:'',club:''};
      teams.push({idx:ti,members:[m0,m1],disp:tn||mkDisp([m0,m1])||`${ti+1}팀`})})
  } else {
    if(TC%2!==0){alert('짝수 팀으로 맞춰주세요.');return}
    teams=[];for(let t=0;t<TC;t++){const ms=[];for(let p=0;p<2;p++){const g=t*2+p;ms.push({name:gv(g,0).trim(),sido:gv(g,1).trim(),club:gv(g,2).trim()})}teams.push({idx:t,members:ms,disp:mkDisp(ms)||`${t+1}팀`})}
  }
  editOn=false;genMatches();goStep(1)
}
function resetAll(){if(!confirm('초기화?'))return;TC=4;teams=[];matches=[];step=0;editOn=false;wType='rifle';rType=1;regMode='first';tInfo={name:'',date:'',venue:'',event:''};RD={1:null,2:null,3:null};renderReg();buildNav();updNav()}

/* 초회차: simple name/sido/club import */
function impFirst(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=function(ev){try{const wb=XLSX.read(ev.target.result,{type:'array'});const sn=wb.SheetNames[0];const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1});let sr=0;if(rows.length&&rows[0].some(c=>String(c||'').match(/이름|선수|팀|시도|소속/i)))sr=1;const data=rows.slice(sr).filter(r=>r.length>0&&String(r[0]||'').trim());const parsed=[];for(let i=0;i+1<data.length;i+=2){const r1=data[i],r2=data[i+1]||[];if(r1.length>=4)parsed.push({ms:[{n:String(r1[1]||''),s:String(r1[2]||''),c:String(r1[3]||'')},{n:String(r2[1]||''),s:String(r2[2]||''),c:String(r2[3]||'')}]});else parsed.push({ms:[{n:String(r1[0]||''),s:String(r1[1]||''),c:String(r1[2]||'')},{n:String(r2[0]||''),s:String(r2[1]||''),c:String(r2[2]||'')}]})}TC=Math.max(parsed.length,2);if(TC%2!==0)TC++;RD={1:null,2:null,3:null};buildTT();parsed.forEach((p,t)=>{sv(t*2,0,p.ms[0].n);sv(t*2,1,p.ms[0].s);sv(t*2,2,p.ms[0].c);sv(t*2+1,0,p.ms[1].n);sv(t*2+1,1,p.ms[1].s);sv(t*2+1,2,p.ms[1].c)});document.getElementById('tcL').textContent=`(${TC}팀)`}catch(err){alert('오류: '+err.message)}e.target.value=''};rd.readAsArrayBuffer(f)}

/* 이전 결과: per-round Excel import — stores ms (member names) in RD entries */
/* Excel cols: 순위(0) 팀명(1) 선수명(2) 시도(3) 소속(4) S1-S6(5-10) 개인총점(11) [x10(12)] 팀총점(R:12,P:13) 승점(R:13,P:14) */
function impRoundFile(r,e){const f=e.target.files[0];if(!f)return;const rd2=new FileReader();rd2.onload=function(ev){try{
  const wb=XLSX.read(ev.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  const rr=XLSX.utils.sheet_to_json(ws,{header:1});
  let rsr=0;if(rr.length&&rr[0].some(c=>String(c||'').match(/순위|팀명|S1/i)))rsr=1;
  const data=rr.slice(rsr).filter(x=>x.length>1);const pis=IP();
  const parsed=[];
  for(let i=0;i<data.length;i+=2){
    const r1=data[i],r2=data[i+1];if(!r1||!r2)break;
    const tn=String(r1[1]||'').trim();
    const ms=[{n:String(r1[2]||''),s:String(r1[3]||''),c:String(r1[4]||'')},{n:String(r2[2]||''),s:String(r2[3]||''),c:String(r2[4]||'')}];

function rndM(oi){const m=matches[oi];if(isDone(m))return;m.pA=[rPD(),rPD()];m.pB=[rPD(),rPD()];calcM(m);renderRound()}

function togE(){const ad=matches.every(isDone);if(!editOn&&ad){if(!confirm('결과 수정?'))return;matches.forEach(m=>{m.pA=[mkPD(),mkPD()];m.pB=[mkPD(),mkPD()];m.totA=null;m.totB=null})}editOn=!editOn;renderRound()}
function cfmE(){let ok=true;matches.forEach((m,oi)=>{const rP=(sd,pi)=>{const pd=mkPD();let f=0;for(let si=0;si<6;si++){const el=document.querySelector(`[data-mi="${oi}"][data-sd="${sd}"][data-pi="${pi}"][data-si="${si}"]`);if(el&&el.value!==''){pd.series[si]=parseFloat(el.value);f++}else pd.series[si]=null}if(IP()){const xel=document.querySelector(`[data-mi="${oi}"][data-sd="${sd}"][data-pi="${pi}"][data-si="x"]`);pd.xten=xel&&xel.value!==''?parseInt(xel.value):null}pd._f=f;return pd};const pds=[rP('A',0),rP('A',1),rP('B',0),rP('B',1)];if(pds.some(p=>p._f>0)&&!pds.every(p=>p._f===6)){alert('모든 시리즈 점수 입력 필요');ok=false;return}if(!pds.some(p=>p._f>0))return;if(IP()&&pds.some(p=>p.xten===null)){alert('엑스텐 입력 필요');ok=false;return}m.pA=[pds[0],pds[1]];m.pB=[pds[2],pds[3]];calcM(m)});if(!ok)return;editOn=false;renderRound()}

/* ══ MATCH EXCEL EXPORT ══ */
function expMatchXls(){
  const wb=XLSX.utils.book_new();const pis=IP();
  const hd=['매치','팀명','선수명','시도','소속','S1','S2','S3','S4','S5','S6','개인총점'];if(pis)hd.push('x10');hd.push('팀총점');
  const rows=[hd];
  matches.forEach((m,mi)=>{const tA=teams[m.a],tB=teams[m.b];
    [['A',tA,m.pA],['B',tB,m.pB]].forEach(([sd,t,pds])=>{
      t.members.forEach((mem,p)=>{const pd=pds[p];const has=isDone(m);
        const row=[!p?`매치${mi+1}`:'',!p?t.disp:'',mem.name||'',mem.sido||'',mem.club||''];
        for(let si=0;si<6;si++)row.push(has&&pd.series[si]!=null?(pis?Math.round(pd.series[si]):pd.series[si]):'');
        row.push(has&&pd.total!=null?(pis?Math.round(pd.total):pd.total):'');
        if(pis)row.push(has&&pd.xten!=null?pd.xten:'');
        row.push(!p&&has?(pis?Math.round(sd==='A'?m.totA:m.totB):(sd==='A'?m.totA:m.totB)):'');
        rows.push(row)});
      if(sd==='A')rows.push(Array(hd.length).fill(''))  // blank separator row between teams
    })
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:8},{wch:12},{wch:10},{wch:8},{wch:14},...Array(6).fill({wch:6}),{wch:8}];
  if(pis)ws['!cols'].push({wch:5});ws['!cols'].push({wch:8});
  XLSX.utils.book_append_sheet(wb,ws,RL[rType]);
  XLSX.writeFile(wb,`${tInfo.name||'리그전'}_${RL[rType]}_대진표.xlsx`)
}

/* ══ MATCH EXCEL IMPORT ══ */
function impMatchXls(e){
  const f=e.target.files[0];if(!f)return;
  const rd2=new FileReader();rd2.onload=function(ev){try{
    const wb=XLSX.read(ev.target.result,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rr=XLSX.utils.sheet_to_json(ws,{header:1});
    let rsr=0;if(rr.length&&rr[0].some(c=>String(c||'').match(/매치|팀명|S1/i)))rsr=1;
    const data=rr.slice(rsr).filter(x=>x.length>1);
    const pis=IP();
    // Group rows by match: every 5 rows = 2(teamA) + 1(blank) + 2(teamB)
    // Or detect by "매치N" in first column
    let curMi=-1,curSide='A',curPi=0;
    data.forEach(row=>{
      const m0=String(row[0]||'').trim();
      if(m0.match(/매치(\d+)/)){
        const n=parseInt(m0.match(/매치(\d+)/)[1])-1;
        if(n!==curMi){curMi=n;curSide='A';curPi=0}
      }
      if(curMi<0||curMi>=matches.length)return;
      // Skip blank rows (all empty after col 0)
      const hasData=row.slice(5).some(v=>v!=null&&v!=='');
      if(!hasData&&!m0)return;
      if(!hasData&&m0&&!m0.match(/매치/))return;
      const m=matches[curMi];
      const pds=curSide==='A'?m.pA:m.pB;
      const pd=pds[curPi];
      // Read series from col 5-10
      const off=5;let filled=0;
      for(let si=0;si<6;si++){const v=parseFloat(row[off+si]);if(!isNaN(v)){pd.series[si]=v;filled++}else pd.series[si]=null}
      if(pis){const xCol=off+7;const xv=parseInt(row[xCol]);pd.xten=isNaN(xv)?null:xv}
      curPi++;
      if(curPi>=2){
        if(curSide==='A'){curSide='B';curPi=0}
        else{curSide='A';curPi=0;curMi++}  // Move to next match after blank
      }
    });
    // Recalc all matches
    let imported=0;
    matches.forEach(m=>{
      const allFilled=[...m.pA,...m.pB].every(pd=>pd.series.every(s=>s!==null));
      if(allFilled){if(pis&&[...m.pA,...m.pB].some(pd=>pd.xten===null)){return}calcM(m);imported++}
    });
    editOn=false;renderRound();
    alert(`${imported}개 매치 결과 반영 완료`)
  }catch(err){alert('오류: '+err.message)}e.target.value=''};
  rd2.readAsArrayBuffer(f)
}

  const pageLast=`<div class="fp fp-land">${hdr}<div class="fsec">📊 차전별 비교</div><div class="f3col">${cols}</div></div>`;
  let xlsBtns='';for(let r=1;r<=3;r++){const has=!!RD[r];xlsBtns+=`<button class="fbtn xls" onclick="exportRound(${r})" ${has?'':'disabled'} style="${has?'':'opacity:.4;cursor:not-allowed'}">⬇ ${RL[r]}</button><input type="file" id="xIR${r}" accept=".xlsx" style="display:none" onchange="importRound(${r},event)"><button class="fbtn" style="background:#f59e0b;color:#fff;${RD[r]?'opacity:.6':''}" onclick="document.getElementById('xIR${r}').click()">⬆ ${RL[r]}</button>`}
  document.getElementById('pg2').innerHTML=`<div class="fpg">${page1}${rPages}${pageLast}<div class="factions"><button class="fbtn back" onclick="goStep(0)">← 팀 등록</button><span style="font-size:9px;color:#94a3b8;font-weight:700">엑셀:</span>${xlsBtns}<button class="fbtn print" onclick="window.print()">🖨️ 인쇄</button></div></div>`
}

/* ══ EXPORT per round ══ */
function exportRound(r){if(!RD[r])return;const wb=XLSX.utils.book_new();
  const hd=['순위','팀명','선수명','시도','소속','S1','S2','S3','S4','S5','S6','개인총점'];if(IP())hd.push('x10');hd.push('팀총점','승점','상대');const rows=[hd];
  RD[r].forEach((x,i)=>{const t=teams[x.ti];const dn=x.tn||(t?t.disp:`${x.ti+1}팀`);const mems=t?t.members:(x.ms?[{name:x.ms[0].n,sido:x.ms[0].s,club:x.ms[0].c},{name:x.ms[1].n,sido:x.ms[1].s,club:x.ms[1].c}]:[{name:'',sido:'',club:''},{name:'',sido:'',club:''}]);mems.forEach((m,p)=>{const pd=x.ps[p]||mkPD();const row=[!p?i+1:'',!p?dn:'',m.name||'',m.sido||'',m.club||''];for(let si=0;si<6;si++)row.push(pd.series[si]!=null?(IP()?Math.round(pd.series[si]):pd.series[si]):'');row.push(pd.total!=null?(IP()?Math.round(pd.total):pd.total):'');if(IP())row.push(pd.xten!=null?pd.xten:'');row.push(!p?(IP()?Math.round(x.tot):x.tot):'');row.push(!p?x.wp:'');row.push(!p?(x.opp||''):'');rows.push(row)})});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),RL[r]);
  XLSX.writeFile(wb,`${tInfo.name||'리그전'}_${RL[r]}.xlsx`)}
/* ══ IMPORT per round ══ */
function importRound(r,e){const f=e.target.files[0];if(!f)return;const rd2=new FileReader();rd2.onload=function(ev){try{const wb=XLSX.read(ev.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rr=XLSX.utils.sheet_to_json(ws,{header:1});let rsr=0;if(rr.length&&rr[0].some(c=>String(c||'').match(/순위|팀명/i)))rsr=1;const rd3=rr.slice(rsr).filter(x=>x.length>0);
  const nm={};teams.forEach((t,i)=>{nm[t.disp]=i});const pis=IP();const res=[];
  for(let i=0;i+1<rd3.length;i+=2){const r1=rd3[i],r2=rd3[i+1]||[];const tn=String(r1[1]||'');const ti=nm[tn]!=null?nm[tn]:Math.floor(i/2);
    const ms=[{n:String(r1[2]||''),s:String(r1[3]||''),c:String(r1[4]||'')},{n:String(r2[2]||''),s:String(r2[3]||''),c:String(r2[4]||'')}];
    const parsePD=(row)=>{const pd=mkPD();const off=5;for(let s=0;s<6;s++){const v=parseFloat(row[off+s]);pd.series[s]=isNaN(v)?null:v}const totV=parseFloat(row[off+6]);pd.total=isNaN(totV)?null:totV;if(pis){const xv=parseInt(row[off+7]);pd.xten=isNaN(xv)?null:xv}return pd};
    const pd0=parsePD(r1),pd1=parsePD(r2);const totCol=pis?13:12;const wpCol=pis?14:13;const oppCol=wpCol+1;
    res.push({ti,tn,opp:String(r1[oppCol]||'').trim(),ms,ps:[pd0,pd1],tot:parseFloat(r1[totCol])||0,xt:pis?((pd0.xten||0)+(pd1.xten||0)):null,wp:parseFloat(r1[wpCol])||0})}
  if(res.length){RD[r]=res;renderFinal();alert(`${RL[r]} 기록 불러오기 완료 (${res.length}팀)`)}
}catch(err){alert('오류: '+err.message)}e.target.value=''};rd2.readAsArrayBuffer(f)}
</script>
